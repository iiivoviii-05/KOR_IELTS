<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Climb</title>
<meta name="theme-color" content="#151d47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Climb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap"></noscript>
<style>
/* Climbing the Rock: lộ trình như một tuyến leo núi. Mỗi bài là một mốc, XP là mét leo, các trại là cột mốc tiến độ. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#f7f9fb; --line:#e2e7ee; --line-2:#ccd5e0;
  --ink:#121c2b; --ink-2:#556274; --ink-3:#8f9bab;
  --night:#1b2554; --night-2:#27347a; --night-ink:#eef1ff; --night-dim:#aab3e6; --link:#27347a; --badge-line:transparent;
  --sun:#ffaf1f; --sun-soft:#fff2d6; --sun-ink:#5a3a00;
  --ok:#139f68; --ok-soft:#dcf5ea; --bad:#e2454b; --bad-soft:#fde8e8;
  --t1:#ffe1b3; --t2:#cdeedd; --t3:#d9e3ff; --t4:#ffd8d3; --t5:#e7dcff; --t6:#cfeef3;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav-h:66px;
  --shadow:0 1px 2px rgba(18,28,43,.04),0 8px 24px -12px rgba(18,28,43,.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1320; --surface:#161d2d; --sunk:#131a28; --line:#253047; --line-2:#334060;
  --ink:#e9eef7; --ink-2:#a5b1c4; --ink-3:#71809a;
  --night:#212c63; --night-2:#2d3a82; --night-ink:#eef1ff; --night-dim:#aab3e6; --link:#a9b8ff; --badge-line:#3d4a78;
  --sun:#ffb93a; --sun-soft:#3a2c10; --sun-ink:#ffe2a8;
  --ok:#3ccf8e; --ok-soft:#14352a; --bad:#ff7a7f; --bad-soft:#3b1d22;
  --t1:#4a3a1c; --t2:#1d3d31; --t3:#232f55; --t4:#4a2523; --t5:#33285a; --t6:#173e45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1320; --surface:#161d2d; --sunk:#131a28; --line:#253047; --line-2:#334060;
  --ink:#e9eef7; --ink-2:#a5b1c4; --ink-3:#71809a;
  --night:#212c63; --night-2:#2d3a82; --night-ink:#eef1ff; --night-dim:#aab3e6; --link:#a9b8ff; --badge-line:#3d4a78;
  --sun:#ffb93a; --sun-soft:#3a2c10; --sun-ink:#ffe2a8;
  --ok:#3ccf8e; --ok-soft:#14352a; --bad:#ff7a7f; --bad-soft:#3b1d22;
  --t1:#4a3a1c; --t2:#1d3d31; --t3:#232f55; --t4:#4a2523; --t5:#33285a; --t6:#173e45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;min-height:100vh;min-height:100dvh;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--sun);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ===== Khung ===== */
.top{position:sticky;top:0;z-index:8;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1120px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em;font-size:17px;white-space:nowrap}
.brand svg{width:28px;height:28px}
.brand small{display:block;font-size:10.5px;font-weight:600;color:var(--ink-3);letter-spacing:.02em;margin-top:-3px}
.navtop{display:none;gap:4px;margin-left:auto}
.navtop button{border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--ink-2);font-size:14.5px}
.navtop button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.alt{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.alt b{color:var(--ink);font-size:14px}
.alt .dot{width:24px;height:24px;border-radius:50%;background:var(--night);display:grid;place-items:center}
.alt .dot svg{width:14px;height:14px}
@media (min-width:900px){.navtop{display:flex}.alt{margin-left:12px}}
main{max-width:1120px;margin:0 auto;padding:20px 16px calc(var(--nav-h) + 36px + env(safe-area-inset-bottom))}
@media (min-width:900px){main{padding-bottom:64px}}
.view{display:flex;flex-direction:column;gap:22px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto}
nav.bottom button{border:0;background:none;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
nav.bottom svg{width:23px;height:23px}
nav.bottom button[aria-current="page"]{color:var(--ink)}
nav.bottom button[aria-current="page"] svg{color:var(--link)}
@media (min-width:900px){nav.bottom{display:none}}

/* ===== Chữ ===== */
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sun)}
.h1{font-size:clamp(30px,6vw,48px);line-height:1.05;font-weight:800;letter-spacing:-.035em;margin:6px 0 0;text-wrap:balance}
.h2{font-size:22px;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin:0}
.h3{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em}
.lead{color:var(--ink-2);margin:6px 0 0;max-width:62ch}
.muted{color:var(--ink-2)} .small{font-size:13px} .tiny{font-size:12px}
.hint{font-size:13px;color:var(--ink-2);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 200px;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

/* ===== Khối ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);min-width:0}
.card.pad0{padding:0;overflow:hidden}
.soft{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}

/* ===== Nút ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);font-weight:700;font-size:15px;color:var(--ink);text-decoration:none;white-space:nowrap;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--night);border-color:var(--night);color:var(--night-ink)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#2b1c00}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:13.5px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.42;cursor:default;transform:none}
.btn svg{width:18px;height:18px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;padding:8px 16px;border-radius:10px;font-weight:700;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--night);color:var(--night-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chip.sun{background:var(--sun-soft);border-color:transparent;color:var(--sun-ink)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .5s}
.bar.sun>i{background:var(--sun)}

/* ===== Form ===== */
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2);font-weight:600}
.fld input,.fld select,.fld textarea,.inp{font-size:16px;font-weight:400;color:var(--ink);background:var(--sunk);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;width:100%}
.fld textarea{resize:vertical;line-height:1.65}
.fld :focus,.inp:focus{outline:none;border-color:var(--link)}

/* ===== Trang chủ ===== */
.hero{position:relative;overflow:hidden;border-radius:26px;background:var(--night);color:var(--night-ink);padding:26px 24px 0;min-height:320px;display:grid;grid-template-columns:1fr;box-shadow:var(--shadow)}
.hero .txt{position:relative;z-index:2;display:flex;flex-direction:column;gap:10px;max-width:560px;min-width:0}
.hero .next .btn{white-space:normal;text-align:left;height:auto;min-height:48px;padding:10px 16px;max-width:100%}
.hero .lbl{font-size:13px;font-weight:600;color:var(--night-dim)}
.hero .alt-big{font-size:clamp(46px,10vw,76px);font-weight:800;letter-spacing:-.045em;line-height:.95}
.hero .alt-big span{font-size:.38em;letter-spacing:-.01em;color:var(--night-dim);margin-left:6px}
.hero .camp{font-weight:700;font-size:16px}
.hero .bar{background:rgba(255,255,255,.14);height:10px;width:100%;max-width:420px}
.hero .bar>i{background:var(--sun)}
.hero .next{margin-top:8px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hero svg.mtn{position:relative;z-index:1;width:100%;height:auto;display:block;margin-top:6px}
@media (min-width:900px){.hero{grid-template-columns:1fr 1.05fr;padding:36px 36px 0;min-height:360px}.hero svg.mtn{position:absolute;right:0;bottom:0;width:62%;margin:0}}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.cont{display:flex;flex-direction:column;gap:12px;position:relative}
.cont .kicker{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.cont .ttl{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.cont .meta{display:flex;gap:8px;flex-wrap:wrap}
.badge{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--ink);flex:none}
.todo{display:flex;flex-direction:column}
.task{display:flex;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);position:relative}
.task:first-child{border-top:0}
.task input{position:absolute;opacity:0;pointer-events:none}
label.task{cursor:pointer}
.tick{flex:none;width:28px;height:28px;border:2px solid var(--line-2);border-radius:9px;display:grid;place-items:center;color:transparent;background:var(--surface);transition:background .15s}
.tick svg{width:18px;height:18px}
.task.on .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.task.on .t-title{color:var(--ink-2)}
.task:has(input:focus-visible){outline:2.5px solid var(--sun);outline-offset:-4px}
.task .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.t-time{font-size:12px;color:var(--ink-3);font-weight:600}
.t-title{font-weight:700}
.t-how{font-size:13px;color:var(--ink-2)}
.note{width:100%;font-size:15px;padding:13px 18px;border:0;border-top:1px dashed var(--line);background:transparent;color:var(--ink)}
.note:focus{outline:none;background:var(--sunk)}

/* ===== Lộ trình ===== */
.path-layout{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
@media (min-width:900px){.path-layout{grid-template-columns:300px 1fr}}
.side{border-radius:var(--r-lg);overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
@media (min-width:900px){.side{position:sticky;top:84px;max-height:calc(100vh - 110px);max-height:calc(100dvh - 110px);display:flex;flex-direction:column}}
.side-hd{background:var(--night);color:var(--night-ink);padding:18px 18px 16px}
.side-hd .tiny{color:var(--night-dim);font-weight:600}
.side-hd .h2{color:var(--night-ink);font-size:20px}
.side-list{display:flex;gap:8px;padding:10px;overflow:auto}
@media (max-width:899px){.side-list{flex-direction:row;scroll-snap-type:x mandatory}.side-list .topic{flex:0 0 76%;scroll-snap-align:start}}
@media (min-width:900px){.side-list{flex-direction:column}}
.topic{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;padding:10px;border-radius:14px;border:1.5px solid transparent;background:none;width:100%}
.topic:hover{background:var(--sunk)}
.topic[aria-current="true"]{border-color:var(--link);background:var(--sunk)}
.topic .n{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:var(--ink)}
.topic .nm{font-weight:700;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topic .pg{font-size:12px;color:var(--ink-2);margin:2px 0 5px}
.topic .bar{height:5px}
.route-hd{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow)}
.route-hd .badge{width:60px;height:60px;font-size:13px;text-align:center;line-height:1.1}
.route-hd .grow{flex:1;min-width:200px}
.route{position:relative;display:flex;flex-direction:column;gap:30px;padding:26px 0 8px}
.route svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.stop{position:relative;display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:center}
@media (min-width:640px){.stop{grid-template-columns:110px minmax(0,560px);}.stop.r{grid-template-columns:minmax(0,560px) 110px;justify-content:end}.stop.r .node{order:2}}
.node{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;text-align:center;background:var(--surface);border:3px solid var(--line-2);position:relative;z-index:1;justify-self:center}
.node b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}
.node small{display:block;font-size:10.5px;font-weight:700;color:var(--ink-3);margin-top:3px}
.node.done{background:var(--ok);border-color:var(--ok);color:#fff}
.node.done small{color:rgba(255,255,255,.85)}
.node.cur{border-color:var(--night);box-shadow:0 0 0 7px color-mix(in srgb,var(--sun) 35%,transparent)}
.node.cur small{color:var(--bad)}
.node.lock{color:var(--ink-3);background:var(--sunk)}
.node.camp{border-radius:22px;width:88px;height:88px;background:var(--night);border-color:var(--night);color:var(--night-ink)}
.node.camp small{color:var(--night-dim)}
.stop .box{min-width:0;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;box-shadow:var(--shadow);text-align:left;width:100%;display:flex;flex-direction:column;gap:4px;border-left:4px solid transparent}
.stop button.box{cursor:pointer}
.stop .box:hover{border-color:var(--line-2)}
.stop.cur .box{border-left-color:var(--sun)}
.stop.lock .box{background:var(--sunk);box-shadow:none}
.stop.lock .box .ttl{color:var(--ink-2)}
.stop .kick{font-size:11.5px;font-weight:700;color:var(--bad);letter-spacing:.01em}
.stop.done .kick{color:var(--ok)}
.stop.lock .kick{color:var(--ink-3)}
.stop .ttl{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.stop .desc{font-size:13.5px;color:var(--ink-2)}
.stop .more{font-size:13px;font-weight:700;margin-top:4px}
.weeks{display:flex;flex-direction:column;gap:12px}
.week>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px}
.week>summary::-webkit-details-marker{display:none}
.week .wn{width:50px;height:50px;border-radius:14px;background:var(--sunk);display:grid;place-items:center;font-weight:800;line-height:1;text-align:center;font-size:17px}
.week .wn small{display:block;font-size:10px;font-weight:600;color:var(--ink-3)}
.week.cur .wn{background:var(--sun);color:#2b1c00}
.week.cur .wn small{color:#5a3a00}
.week.full .wn{background:var(--ok);color:#fff}
.week.full .wn small{color:rgba(255,255,255,.85)}
.day{display:grid;grid-template-columns:62px minmax(0,1fr) minmax(0,1fr);gap:12px;padding:11px 16px;border-top:1px dashed var(--line);align-items:start;font-size:13.5px}
.day.is-today{background:var(--sun-soft)}
.day.missed{box-shadow:inset 3px 0 0 var(--bad)}
.dl{display:flex;flex-direction:column;font-weight:700}
.dl small{font-weight:500;color:var(--ink-2)}
.mini{display:flex;gap:9px;align-items:flex-start;cursor:pointer;min-width:0}
.mini input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--ok);flex:none}
.mini.done span{color:var(--ink-2);text-decoration:line-through}
.mini input:disabled+span{opacity:.55}
.dnote{grid-column:2/4;font-size:12.5px;color:var(--ink-2);font-style:italic}
@media (max-width:560px){.day{grid-template-columns:1fr}.dnote{grid-column:auto}}

/* ===== Hộp thoại ===== */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,15,30,.45);display:grid;place-items:center;padding:16px;animation:fade .15s ease-out}
.dlg{background:var(--surface);border-radius:24px;width:100%;max-width:620px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;padding:24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:18px;animation:rise .2s ease-out}
.dlg-hd{display:flex;gap:16px;align-items:center}
.dlg-hd .badge{background:var(--night);color:var(--night-ink)}
.dlg-hd .grow{flex:1;min-width:0}
.x{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.stages{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.stage{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;background:var(--sunk)}
.stage.on{border-color:var(--night);background:var(--surface)}
.stage .sn{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--line-2);display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--surface);flex:none}
.stage.done .sn{background:var(--ok);border-color:var(--ok);color:#fff}
.stage small{display:block;color:var(--ink-3);font-weight:600;font-size:11.5px}
.stage b{display:block;font-size:14.5px}
.stage span{font-size:12px;color:var(--ink-2)}
.arrow{color:var(--ink-3)}
@media (max-width:520px){.stages{grid-template-columns:1fr}.arrow{display:none}}
.dlg-ft{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(12px);opacity:0}}

/* ===== Màn học ===== */
.study{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;overflow:auto}
.study-top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.study-top .in{max-width:900px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 16px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.quit{border:1px solid var(--line);background:var(--surface);border-radius:12px;height:44px;padding:0 12px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;color:var(--ink-2)}
.stepper{display:flex;align-items:center;justify-content:center;gap:0;max-width:420px;margin:0 auto;width:100%}
.stepper .st{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ink-3);flex:none}
.stepper .st i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;background:var(--sunk);border:1.5px solid var(--line-2)}
.stepper .st.on{color:var(--ink)}
.stepper .st.on i{background:var(--night);color:var(--night-ink);border-color:var(--night)}
.stepper .st.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.stepper .ln{flex:1;height:2px;background:var(--line-2);margin:0 8px 18px}
.stepper .ln.on{background:var(--night-2)}
.study-body{max-width:900px;width:100%;margin:0 auto;padding:22px 16px 40px;display:flex;flex-direction:column;gap:16px;flex:1}
.timerbar{display:grid;grid-template-columns:auto auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.timerbar .lbl{font-size:12px;font-weight:700;color:var(--ink-2)}
.timerbar .t{font-size:20px;font-weight:800;letter-spacing:-.02em}
.timerbar .cnt{font-size:13px;color:var(--ink-2)}
.timerbar .cnt b{color:var(--ink)}
.timerbar .bar{height:6px}
.topic-lbl{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.flip{perspective:1600px;cursor:pointer;outline:none}
.flip .inner{position:relative;display:grid;min-height:380px;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.flip.flipped .inner{transform:rotateY(180deg)}
/* iPhone/Safari: mặt sau đôi khi "xuyên" qua mặt trước (chữ bị lật ngược). Ẩn hẳn mặt không nhìn thấy, đổi đúng lúc thẻ quay ngang. */
.flip .face.front{transform:rotateY(0deg) translateZ(1px);-webkit-transform:rotateY(0deg) translateZ(1px);transition:visibility 0s .22s}
.flip .face.back{visibility:hidden;transition:visibility 0s .22s}
.flip.flipped .face.back{visibility:visible}
.flip.flipped .face.front{visibility:hidden;transition:visibility 0s .22s}
.face{position:relative;grid-area:1/1;min-height:380px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:24px;display:flex;flex-direction:column;overflow:hidden}
.face.front{background:var(--night);color:var(--night-ink);align-items:center;justify-content:center;text-align:center;gap:16px}
.face.back{background:var(--surface);border:1px solid var(--line);transform:rotateY(180deg);gap:14px;justify-content:center}
.face .corner{position:absolute;top:20px;left:24px;font-size:12px;font-weight:700;color:var(--night-dim)}
.face.back .corner{color:var(--bad);position:static}
@media (max-width:560px){.face{padding:20px 18px}.face.front{padding-top:48px}}
.face .ridge{position:absolute;right:-1px;bottom:-1px;width:40%;height:auto;opacity:.9;pointer-events:none}
.word{font-size:clamp(34px,7.5vw,64px);font-weight:800;letter-spacing:-.04em;line-height:1.02;text-wrap:balance;position:relative;z-index:1}
.pos{border:1.5px solid rgba(255,255,255,.28);border-radius:999px;padding:4px 14px;font-size:12.5px;font-weight:700;color:var(--night-dim);position:relative;z-index:1}
.ipa{display:flex;gap:10px;align-items:center;font-size:17px;position:relative;z-index:1}
.say{border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:var(--night-ink);border-radius:12px;padding:7px 12px;font-weight:700;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.say svg{width:16px;height:16px}
.face.back .say{border-color:var(--line-2);background:var(--surface);color:var(--ink)}
.fliphint{font-size:12px;color:var(--night-dim);display:flex;gap:6px;align-items:center;position:relative;z-index:1}
.mean{font-size:clamp(28px,6vw,46px);font-weight:800;letter-spacing:-.035em;line-height:1.08;text-align:center;color:var(--ink)}
.usage{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:600;font-size:14.5px}
.usage .tag{flex:none;background:var(--night);color:var(--night-ink);font-size:10.5px;font-weight:800;border-radius:7px;padding:3px 7px;margin-top:2px}
.exs{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.exs{grid-template-columns:1fr 1fr}}
.ex{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:11px 12px;font-size:14.5px;background:var(--surface)}
.ex i{flex:none;width:24px;height:24px;border-radius:7px;background:var(--sunk);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:var(--ink-2)}
.ex mark{background:linear-gradient(transparent 58%,var(--sun-soft) 58%);color:inherit;font-weight:700}
.back-ft{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.judge .btn{min-height:54px;font-size:16px}
.keys{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.keys kbd{font-family:inherit;font-weight:700;border:1px solid var(--line-2);border-bottom-width:2.5px;border-radius:7px;padding:1px 7px;background:var(--surface);color:var(--ink);margin-right:4px}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:26px;display:flex;flex-direction:column;gap:14px;min-height:340px;box-shadow:var(--shadow)}
.slide .k{font-size:12.5px;font-weight:700;color:var(--bad)}
.slide h3{font-size:clamp(24px,4.5vw,34px);font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.12}
.slide p{margin:0;font-size:16px;line-height:1.65}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.dots i.on{background:var(--night);width:22px;border-radius:99px}
.mist{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:14px;background:var(--sunk);border:1px solid var(--line)}
.mist del{color:var(--bad);text-decoration-thickness:1.5px}
.mist ins{text-decoration:none;font-weight:700;color:var(--ok)}
.mist small{color:var(--ink-2)}
.intro-card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:26px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;box-shadow:var(--shadow)}
.intro-card .big-ok{width:64px;height:64px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff}
.intro-card .big-ok svg{width:30px;height:30px}
.intro-stats{display:flex;gap:28px;flex-wrap:wrap}
.intro-stats b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.intro-stats span{font-size:12.5px;color:var(--ink-2)}
.rule{background:var(--ok-soft);border-radius:12px;padding:9px 12px;font-size:13.5px;color:var(--ink)}
@media (max-width:560px){.intro-card{grid-template-columns:1fr}}
.qhd{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.qhd .tiny{font-weight:700;color:var(--ink-2)}
.qtime{text-align:center;min-width:110px}
.qtime b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.qtime.low b{color:var(--bad)}
.qtime .bar{height:6px;margin-top:6px}
.qtime.low .bar>i{background:var(--bad)}
.qtext{font-size:clamp(24px,4.6vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:4px 0 6px;text-wrap:balance}
.qtext.sent{font-size:clamp(20px,3.6vw,28px);font-weight:700;letter-spacing:-.02em}
.qtext .gap{display:inline-block;min-width:110px;border-bottom:3px solid var(--ink);margin:0 4px}
.opts{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;font-size:17px;font-weight:700;min-height:68px}
.opt .k{flex:none;width:36px;height:36px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--ink-2)}
.opt:hover:not(:disabled){border-color:var(--line-2)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fill{display:flex;gap:10px}
.fill .inp{font-size:19px;font-weight:600}
.fbk{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;border-radius:18px;padding:14px 16px;animation:rise .18s ease-out}
.fbk.good{background:var(--ok-soft);border:1.5px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.fbk.bad{background:var(--bad-soft);border:1.5px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.fbk .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff}
.fbk.good .ic{background:var(--ok)} .fbk.bad .ic{background:var(--bad)}
.fbk .ic svg{width:20px;height:20px}
.fbk b{display:block;font-size:15.5px}
.fbk span{font-size:13.5px;color:var(--ink-2)}
@media (max-width:560px){.fbk{grid-template-columns:auto 1fr}.fbk .btn{grid-column:1/3}}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:12px 0}
.score-ring{width:170px;height:170px;position:relative}
.score-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.score-ring .v{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:800;letter-spacing:-.04em}
.result .h1{font-size:clamp(28px,5vw,40px)}
.wrongs{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.wrongs div{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}

/* ===== Ôn tập / sổ từ ===== */
.wlist{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .w{font-weight:700;overflow-wrap:anywhere}
.wrow .m{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.lv{display:flex;gap:3px}
.lv i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.lv i.on{background:var(--ok)}
.del{background:none;border:0;color:var(--ink-3);width:32px;height:32px;border-radius:9px;font-size:18px}
.del:hover{background:var(--bad-soft);color:var(--bad)}
.mastery{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line)}
.mastery i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
details.fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-size:22px;color:var(--ink-3);font-weight:400}
details.fold[open]>summary::after{content:"–"}
details.fold[open]>summary{margin-bottom:12px}
.wsum{min-width:0;flex:1;overflow-wrap:anywhere;line-height:1.5}.wsum .tchip{white-space:normal;margin-right:6px}

/* ===== Viết ===== */
#w-ans{min-height:280px;line-height:1.75}
.target{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink-2)}
.target .bar{flex:1}
.target b{font-size:18px;color:var(--ink)}
.timer{font-weight:800;font-size:18px}
.timer.late{color:var(--bad)}
.checks{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.checks li{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.checks li:first-child{border-top:0}
.checks .ic{font-weight:800;text-align:center}
.checks .ok .ic{color:var(--ok)} .checks .warn .ic{color:#d08700} .checks .bad .ic{color:var(--bad)}
.checks small{display:block;color:var(--ink-2);font-size:12.5px}
.fix{padding:11px 13px;border-left:3px solid var(--bad);background:var(--sunk);border-radius:0 12px 12px 0;font-size:14px;display:flex;flex-direction:column;gap:3px}
.fix del,.fix ins{align-self:flex-start}
.fix del{color:var(--bad);text-decoration-thickness:1.5px}
.fix ins{text-decoration:none;background:linear-gradient(transparent 55%,var(--ok-soft) 55%);font-weight:600}
.fix small{color:var(--ink-2)}
.rub{display:flex;flex-direction:column;gap:12px}
.rub table{width:100%;border-collapse:collapse;font-size:13.5px}
.rub td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
.rub td:first-child{font-weight:800;width:40px;text-align:center;color:var(--link)}
.subm{border-top:1px solid var(--line)}
.subm:first-child{border-top:0}
.subm>summary{list-style:none;cursor:pointer;padding:13px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:center}
.subm>summary::-webkit-details-marker{display:none}
.subm .ttl{font-weight:700;overflow-wrap:anywhere}
.subm .meta{font-size:12.5px;color:var(--ink-2);grid-column:1}
.bandpill{grid-row:1/3;grid-column:2;font-weight:800;font-size:18px;background:var(--night);color:var(--night-ink);border-radius:12px;padding:4px 11px}
.pend{grid-row:1/3;grid-column:2}
.s-body{padding:4px 16px 18px;display:flex;flex-direction:column;gap:14px}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font-size:14.5px}
.lbl{font-size:12.5px;color:var(--ink-2);font-weight:700;margin-bottom:4px}
.score{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
.mark{width:96px;height:96px;border-radius:24px;background:var(--night);color:var(--night-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.mark b{font-size:40px;font-weight:800;letter-spacing:-.04em}
.mark small{font-size:11px;color:var(--night-dim);margin-top:4px;font-weight:600}
.crit{display:flex;flex-direction:column;gap:10px}
.crit .c{display:grid;grid-template-columns:44px 1fr 36px;gap:8px;align-items:center;font-size:13px}
.crit .c b{font-weight:700}
.crit .c .n{font-weight:800;text-align:right}
.crit .cm{grid-column:1/4;color:var(--ink-2);font-size:13px;margin-top:-4px}
.upg{display:flex;flex-wrap:wrap;gap:6px}
.upg span{border:1px solid var(--line);border-radius:9px;padding:3px 9px;font-size:13.5px}
@media (max-width:520px){.score{grid-template-columns:1fr}}

/* ===== Tiến độ ===== */
.kpis{display:grid;grid-template-columns:repeat(4,1fr)}
.kpi{padding:16px 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi:first-child{border-left:0}
.kpi b{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.kpi span{font-size:12.5px;color:var(--ink-2)}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}
.camps{display:flex;flex-direction:column-reverse;gap:0}
.campr{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:9px 0;position:relative}
.campr .pin{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--line-2);background:var(--surface);z-index:1}
.campr.reached .pin{background:var(--ok);border-color:var(--ok)}
.campr.next .pin{border-color:var(--sun);box-shadow:0 0 0 5px var(--sun-soft)}
.campr::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:2px;background:var(--line)}
.campr b{font-weight:700}
.campr span{font-size:13px;color:var(--ink-2)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-family:var(--f);font-size:11px;fill:var(--ink-2)}
svg.chart .val{font-size:12px;font-weight:700;fill:var(--ink)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(5,auto);grid-template-columns:22px;grid-auto-columns:minmax(0,28px);gap:5px}
.heat span{font-size:11px;color:var(--ink-2);align-self:center}
.heat i{width:100%;aspect-ratio:1;border-radius:6px;background:var(--line);display:block}
.heat i.h1{background:var(--sun)} .heat i.h2{background:var(--ok)} .heat i.miss{background:var(--bad-soft);box-shadow:inset 0 0 0 1.5px var(--bad)}
.heat i.hol{background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px)}
.heat i.today{box-shadow:inset 0 0 0 2.5px var(--link)}

/* ===== PIN, toast ===== */
.pinbox{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:40;padding:16px}
.pinbox form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.pinbox input{font-size:26px;text-align:center;letter-spacing:.4em;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--sunk)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:45;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.err{background:var(--bad);color:#fff}
@media (min-width:900px){.toast{bottom:28px}}
/* ===== Màn hẹp (iPhone SE, mini) ===== */
.brand{min-width:0}
.brand>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:430px){
  .top .in{gap:10px}
  .brand{font-size:15.5px}
  .brand small{display:none}
  .alt{padding:4px 10px 4px 5px;flex:none}
  .alt .campn{display:none}
}
@media (max-width:380px){
  main{padding-left:12px;padding-right:12px}
  .stop{grid-template-columns:70px minmax(0,1fr);gap:12px}
  .node{width:66px;height:66px;border-width:2.5px}
  .node.camp{width:66px;height:66px}
  .node b{font-size:20px}
  .stop .box{padding:13px 14px}
  .stop .ttl{font-size:17.5px}
  .card{padding:16px}
  .hero{padding:22px 18px 0}
  .opt{font-size:15.5px;padding:12px;min-height:60px}
  .qtime{min-width:84px}
  .timerbar{grid-template-columns:auto 1fr auto;gap:10px}
  .timerbar .lbl{display:none}
  .judge .btn{min-height:50px;font-size:15px}
  .keys{display:none}
  .quit{font-size:0;gap:0;padding:0;width:44px;justify-content:center}
  .quit svg{width:16px;height:16px}
  .study-top .in{gap:8px;grid-template-columns:44px 1fr 44px}
  .study-top .in>span{width:44px!important}
  .stepper .ln{margin:0 4px 18px}
  nav.bottom button{font-size:10.5px;white-space:nowrap}
}
/* ===== v7: Reading · Speaking ===== */
.grid3{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:860px){.grid3{grid-template-columns:repeat(3,1fr)}}
.rfilters{display:flex;gap:6px;overflow-x:auto;max-width:100%;min-width:0;scrollbar-width:none;padding:2px 0 4px;-webkit-overflow-scrolling:touch}
.rfilters::-webkit-scrollbar{display:none}
.rfilters .chip{white-space:nowrap}
@media (min-width:760px){.rfilters{flex-wrap:wrap;overflow:visible;margin:0;padding:0}}

.st-new{background:var(--bad-soft);color:var(--bad)}.st-fixed{background:var(--sun-soft);color:var(--sun-ink)}.st-again{background:var(--t3);color:var(--ink)}.st-mastered{background:var(--ok-soft);color:var(--ok)}

.rw{display:flex;flex-direction:column;gap:10px}

.fix.hidefix ins{display:none}
.focus .row>*{flex:0 0 auto}
.mark small{text-align:center;padding:0 6px;line-height:1.25}
mark.uhl{background:color-mix(in srgb,var(--link) 18%,transparent);color:inherit;font-weight:800;border-bottom:2px solid var(--link);border-radius:3px;padding:0 1px;cursor:pointer}

/* ===== Hạng Sắt → Thách đấu, luyện dùng từ ===== */
.rkpill{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--rc);vertical-align:middle}
.rke{flex:none;display:block}
.rk-frame{position:relative;border-radius:var(--r-lg);padding:18px;margin-bottom:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--rc) 14%,var(--surface)),var(--surface));border:1.5px solid color-mix(in srgb,var(--rc) 55%,var(--line))}
.rk-frame::before,.rk-frame::after{content:"";position:absolute;width:22px;height:22px;border:2px solid var(--rc);opacity:.8;pointer-events:none}
.rk-frame::before{top:7px;left:7px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.rk-frame::after{bottom:7px;right:7px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.rk-top{display:flex;gap:14px;align-items:center}
.rk-name{font-size:24px;font-weight:800;color:color-mix(in srgb,var(--rc) 65%,var(--ink));line-height:1.15}
.rk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin-top:14px}
.rk-cell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;background:var(--sunk);border:1px solid var(--line);font-size:11px;font-weight:600;color:var(--ink-2)}
.rk-cell.on{border-color:var(--rc)}
.lvl-pick{display:flex;flex-direction:column;gap:6px}
.lvl-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvl{padding:10px 6px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:flex;flex-direction:column;gap:2px;align-items:center}
.lvl.on{border-color:var(--link);background:var(--sunk)}
.lvl:disabled{opacity:.5}
.lvl small{font-size:11px;color:var(--ink-3)}
#rankfx{position:fixed;inset:0;pointer-events:none;z-index:9990}
#rankfx::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--rank,#999),transparent);opacity:0;transition:opacity .6s}
#rankfx i{position:absolute;width:30px;height:30px;border:2px solid var(--rank,#999);opacity:0;transition:opacity .6s}
#rankfx i:nth-child(1){top:6px;left:6px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
#rankfx i:nth-child(2){top:6px;right:6px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
#rankfx i:nth-child(3){bottom:6px;left:6px;border-right:0;border-top:0;border-radius:0 0 0 10px}
#rankfx i:nth-child(4){bottom:6px;right:6px;border-left:0;border-top:0;border-radius:0 0 10px 0}
body:not([data-rank="0"]):not([data-rank=""]) #rankfx::before{opacity:.9}
body:is([data-rank="2"],[data-rank="3"],[data-rank="4"],[data-rank="5"],[data-rank="6"],[data-rank="7"]) #rankfx i:nth-child(-n+2){opacity:.75}
body:is([data-rank="4"],[data-rank="5"],[data-rank="6"],[data-rank="7"]) #rankfx i:nth-child(n+3){opacity:.75}
body:is([data-rank="5"],[data-rank="6"],[data-rank="7"]) #rankfx::before{animation:rkshim 3.2s ease-in-out infinite alternate}
body:is([data-rank="6"],[data-rank="7"]) #rankfx i{filter:drop-shadow(0 0 6px var(--rank))}
@keyframes rkshim{from{opacity:.45}to{opacity:1}}
@media (max-width:899px){#rankfx i:nth-child(n+3){display:none}}
body:not([data-rank="0"]):not([data-rank=""]) #altchip{box-shadow:0 0 0 1.5px var(--rank),0 0 14px -4px var(--rank)}
.rkchip{display:inline-flex;margin-right:2px}
.rankup{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(8,12,24,.8);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:rkfade .25s}
.rankup .box{text-align:center;color:#fff;padding:28px;animation:rkpop .6s cubic-bezier(.2,1.4,.4,1)}
.rankup .em{display:inline-block;animation:rkglow 1.6s ease-in-out infinite alternate}
.rankup .t1{letter-spacing:.3em;font-size:12px;font-weight:800;opacity:.8;margin-top:8px}
.rankup .t2{font-size:36px;font-weight:800;color:var(--rc);margin:4px 0}
.rankup .t3{opacity:.85;font-size:14px}
.rankup .sp{position:absolute;left:50%;top:44%;width:7px;height:7px;border-radius:50%;background:var(--rc);animation:rkspark 1.3s ease-out forwards}
@keyframes rkpop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes rkfade{from{opacity:0}}
@keyframes rkglow{from{filter:drop-shadow(0 0 8px var(--rc))}to{filter:drop-shadow(0 0 30px var(--rc))}}
@keyframes rkspark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

/* hộp quà trên núi */
.gfm{cursor:pointer}
.gfm rect{stroke:none}
.gfm path{fill:none;stroke-width:1.4;stroke-linecap:round}
.gfm .halo{fill:var(--sun);opacity:0}
.gfm.locked rect{fill:rgba(255,255,255,.26)}.gfm.locked path{stroke:rgba(255,255,255,.42)}
.gfm.unlocked rect{fill:var(--sun)}.gfm.unlocked path{stroke:#5a3a00}.gfm.unlocked .halo{opacity:.3}
.gfm.opened rect{fill:#eef1ff}.gfm.opened path{stroke:var(--sun);stroke-width:1.8}
@media (prefers-reduced-motion:no-preference){.gfm.unlocked .halo{animation:gfp 1.9s ease-in-out infinite}}
@keyframes gfp{0%,100%{opacity:.12}50%{opacity:.5}}

.gf-qdone{margin:0 0 10px;font-weight:700;color:var(--ink-2);font-size:14px}
.gf-quiz{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.gf-orig{margin:0;padding-left:12px;border-left:3px solid var(--sun);font-style:italic;color:var(--ink-2);font-size:14px;line-height:1.5}
.gf-speak{background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.gf-speak .kicker{font-size:12.5px;font-weight:800;color:var(--ink-2);margin-bottom:2px}
.gf-sp{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.gf-speak .kicker+.gf-sp{border-top:0}

.gf-sp span{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}

.gf-lang{margin-right:auto}

.gf-dlg .dlg-ft{align-items:center}
.gf-dlg [data-gfstar][aria-pressed="true"]{background:var(--sun-soft);border-color:var(--sun);color:var(--sun-ink)}
/* sổ sưu tầm */

.gf-cats .chip[aria-pressed="true"]{background:var(--night);color:var(--night-ink);border-color:transparent}
.gf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.gf-tile{display:flex;flex-direction:column;gap:6px;min-height:92px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--sunk);text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.gf-tile .gf-ti{font-size:22px;line-height:1}

.gf-tile.off{align-items:center;justify-content:center;font-size:26px;color:var(--ink-3);opacity:.5;border-style:dashed;cursor:default}
.gf-dlg>*{flex:none}
.gf-dlg .bar{height:8px}
.ex-wrap{grid-column:1/-1;margin-top:6px}

.vrow .ex-card{background:var(--sunk)}

.ex-fig{max-width:340px;color:var(--ink-2)}

.ex-o:hover:not(:disabled){border-color:var(--ink-3)}
.ex-o.ok{background:var(--ok-soft);border-color:var(--ok)}.ex-o.bad{background:var(--bad-soft);border-color:var(--bad)}
.ex-why{background:var(--sunk);border-radius:9px;padding:7px 10px;font-size:13.5px!important}
.ex-act,.ex-nav{display:flex;flex-wrap:wrap;gap:8px}
.ex-nav{justify-content:space-between;margin-top:10px}
.btn.warn{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.ex-hd{margin:10px 0 6px}.ex-t{margin:2px 0;font-size:24px;display:flex;align-items:center;gap:8px}.ex-vi{color:var(--ink-2);font-size:15px}
.ex-dots{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0}
.ex-dot{width:10px;height:10px;border-radius:50%;border:0;background:var(--line-2);padding:0;cursor:pointer}
.ex-dot.ok{background:var(--ok)}.ex-dot.bad{background:var(--bad)}.ex-dot.cur{outline:2px solid var(--ink);outline-offset:1px}
.ex-fold{margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);padding:2px 10px;text-align:left}
.ex-fold>summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-2);padding:8px 0;list-style:revert}
.ex-fold .ex-card{border:0;background:transparent;padding:4px 0 8px;margin-top:0}
.ex-fold .ex-p p,.ex-fold .ex-conf p{font-size:13.5px;line-height:1.55}
mark.eh{background:color-mix(in srgb,var(--bad) 18%,transparent);color:inherit;border-radius:3px;padding:0 1px;box-decoration-break:clone}
.study{display:flex;flex-direction:column;gap:8px}
details.study{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--sunk)}
details.study>summary{cursor:pointer;font-weight:700}
.study .cor p{margin:8px 0;line-height:1.6}
.gstep{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-left:3px solid var(--ok);background:var(--sunk);border-radius:0 12px 12px 0;font-size:14px;line-height:1.55}
</style>

const TOPICS=[{"id":"v01","en":"Education & Learning","vi":"교육과 학습","desc":"학교, 교수·학습 방법, 교육 기회와 관련된 어휘예요.","words":[{"w":"curriculum","pos":"명사","ipa":"/kəˈrɪkjələm/","vi":"교육과정","use":"가산명사 (복수: curricula); design / reform + the curriculum","ex":["Many schools now include coding in their curriculum.","Critics argue that the national curriculum leaves little room for creativity."],"syn":"syllabus"},{"w":"tuition fees","pos":"명사구","ipa":"/tjuˈɪʃn fiːz/","vi":"등록금","use":"복수형으로 쓰는 명사; pay / raise / abolish + tuition fees","ex":["Many students take part-time jobs to pay their tuition fees.","Some argue that governments should abolish tuition fees for all universities."],"syn":"school fees"},{"w":"academic performance","pos":"명사구","ipa":"/ˌækəˈdemɪk pəˈfɔːməns/","vi":"학업 성취도","use":"불가산명사; improve / affect + academic performance","ex":["Lack of sleep can seriously affect a child's academic performance.","Regular reading at home tends to improve academic performance."],"syn":"school results"},{"w":"compulsory","pos":"형용사","ipa":"/kəmˈpʌlsəri/","vi":"의무적인","use":"형용사; compulsory + subject/education; be compulsory for + N","ex":["In many countries, education is compulsory until the age of sixteen.","Physical education should remain a compulsory subject in secondary schools."],"syn":"mandatory"},{"w":"higher education","pos":"명사구","ipa":"/ˌhaɪər ˌedʒuˈkeɪʃn/","vi":"고등교육","use":"불가산명사; go into / have access to + higher education","ex":["More young people than ever before now go into higher education.","Governments should make higher education affordable for students from poor families."],"syn":"university education"},{"w":"acquire knowledge","pos":"동사구","ipa":"/əˌkwaɪə ˈnɒlɪdʒ/","vi":"지식을 습득하다","use":"타동사; acquire knowledge of/about + N (knowledge는 불가산명사: knowledges ✗)","ex":["Children acquire knowledge more quickly when lessons are interactive.","The internet allows learners to acquire knowledge outside the classroom."],"syn":"gain knowledge"},{"w":"drop out of","pos":"동사구","ipa":"/ˌdrɒp ˈaʊt əv/","vi":"중퇴하다","use":"drop out of + school/university; 명사: a dropout (※ out of를 빠뜨리기 쉬워요: drop out school ✗)","ex":["Financial problems force many students to drop out of university.","Teenagers who drop out of school often struggle to find stable jobs."],"syn":"leave school early"},{"w":"qualification","pos":"명사","ipa":"/ˌkwɒlɪfɪˈkeɪʃn/","vi":"자격, 학위·자격증","use":"가산명사; gain / obtain + a qualification in + N","ex":["Employers increasingly expect applicants to hold a university qualification.","She gained a teaching qualification before moving abroad to work."],"syn":"certificate"},{"w":"early childhood education","pos":"명사구","ipa":"/ˌɜːli ˈtʃaɪldhʊd ˌedʒuˈkeɪʃn/","vi":"유아교육","use":"불가산명사; invest in / expand + early childhood education","ex":["Investing in early childhood education brings long-term benefits for society.","Children who receive early childhood education usually adapt to school more easily."],"syn":"preschool education"},{"w":"vocational training","pos":"명사구","ipa":"/vəʊˈkeɪʃənl ˈtreɪnɪŋ/","vi":"직업 훈련","use":"불가산명사; provide / receive + vocational training","ex":["Vocational training prepares young people for practical jobs such as plumbing.","Not every student needs a degree; some benefit more from vocational training."],"syn":"job training"},{"w":"literacy","pos":"명사","ipa":"/ˈlɪtərəsi/","vi":"문해력 (읽고 쓰는 능력)","use":"불가산명사; the literacy rate; improve + literacy","ex":["The literacy rate in rural areas has risen sharply in recent decades.","Reading to children every night helps to improve their literacy."],"syn":"reading and writing skills"},{"w":"lifelong learning","pos":"명사구","ipa":"/ˌlaɪflɒŋ ˈlɜːnɪŋ/","vi":"평생 학습","use":"불가산명사; promote / encourage + lifelong learning","ex":["In a fast-changing job market, lifelong learning has become essential.","Universities should offer evening courses to promote lifelong learning among adults."],"syn":"continuing education"},{"w":"distance learning","pos":"명사구","ipa":"/ˌdɪstəns ˈlɜːnɪŋ/","vi":"원격 학습","use":"불가산명사; a distance learning course/programme","ex":["Distance learning allows working adults to study without leaving their jobs.","She completed her master's degree through a distance learning programme."],"syn":"remote study"},{"w":"critical thinking","pos":"명사구","ipa":"/ˌkrɪtɪkl ˈθɪŋkɪŋ/","vi":"비판적 사고","use":"불가산명사; develop / encourage + critical thinking (skills)","ex":["Group debates are an effective way to develop critical thinking.","Employers value graduates with strong critical thinking skills."],"syn":"analytical thinking"},{"w":"enrol in","pos":"동사구","ipa":"/ɪnˈrəʊl ɪn/","vi":"등록하다, 입학하다","use":"영국 영어: enrol/enrolled; enrol in + a course/programme (미국 영어: enroll)","ex":["More adults are choosing to enrol in part-time university courses.","Last year, over two thousand students enrolled in the engineering programme."],"syn":"sign up for"},{"w":"extracurricular activities","pos":"명사구","ipa":"/ˌekstrəkəˈrɪkjələr ækˈtɪvətiz/","vi":"교과 외 활동","use":"복수형; take part in + extracurricular activities","ex":["Taking part in extracurricular activities helps students build confidence.","Schools with limited budgets often cut funding for extracurricular activities first."],"syn":"after-school activities"},{"w":"rote learning","pos":"명사구","ipa":"/ˌrəʊt ˈlɜːnɪŋ/","vi":"암기식 학습","use":"불가산명사; rely on + rote learning","ex":["Education systems that rely on rote learning rarely encourage creativity.","Rote learning may help students pass exams but not understand concepts."],"syn":"memorisation"},{"w":"well-rounded","pos":"형용사","ipa":"/ˌwel ˈraʊndɪd/","vi":"다방면으로 균형 잡힌","use":"형용사; a well-rounded + education/individual","ex":["Sport and music are vital parts of a well-rounded education.","Universities aim to produce well-rounded graduates, not just good test-takers."],"syn":"all-round"},{"w":"keep up with","pos":"동사구","ipa":"/ˌkiːp ˈʌp wɪð/","vi":"뒤처지지 않고 따라가다","use":"keep up with + N (classmates / workload / changes)","ex":["Some students find it hard to keep up with the heavy workload.","Teachers must keep up with new teaching methods and technologies."],"syn":"stay level with"},{"w":"motivate","pos":"동사","ipa":"/ˈməʊtɪveɪt/","vi":"동기를 부여하다","use":"motivate sb to do sth; 명사: motivation","ex":["Good teachers know how to motivate even the weakest students.","Rewards alone cannot motivate children to learn in the long term."],"syn":"encourage"},{"w":"discipline","pos":"명사","ipa":"/ˈdɪsəplɪn/","vi":"규율","use":"불가산명사; maintain / enforce + discipline","ex":["Strict discipline in classrooms does not always lead to better learning.","Teachers today find it harder to maintain discipline than in the past."],"syn":"order"},{"w":"standardised tests","pos":"명사구","ipa":"/ˌstændədaɪzd ˈtests/","vi":"표준화 시험","use":"가산명사; take / prepare for + standardised tests","ex":["Standardised tests cannot fully measure a student's creativity or teamwork skills.","Many schools spend too much time preparing pupils for standardised tests."],"syn":"national exams"},{"w":"student-centred approach","pos":"명사구","ipa":"/ˌstjuːdnt ˌsentəd əˈprəʊtʃ/","vi":"학습자 중심 접근법","use":"가산명사; adopt / take + a student-centred approach","ex":["A student-centred approach encourages learners to ask questions and explore ideas.","Many Asian schools are slowly adopting a more student-centred approach."],"syn":"learner-focused teaching"},{"w":"fall behind","pos":"동사구","ipa":"/ˌfɔːl bɪˈhaɪnd/","vi":"뒤처지다","use":"fall behind + sb; fall behind in + 과목","ex":["Children who miss school frequently tend to fall behind their classmates.","Without extra support, pupils from poor families may fall behind in maths."],"syn":"lag behind"},{"w":"access to education","pos":"명사구","ipa":"/ˌækses tu ˌedʒuˈkeɪʃn/","vi":"교육 접근성 (교육 기회)","use":"불가산명사; have / provide / limit + access to education","ex":["Every child should have equal access to education, regardless of family income.","In remote villages, access to education is still very limited."],"syn":"educational opportunities"},{"w":"practical skills","pos":"명사구","ipa":"/ˌpræktɪkl ˈskɪlz/","vi":"실무 능력","use":"복수형; develop / gain + practical skills","ex":["Internships allow students to gain practical skills that employers actually need.","Schools should teach practical skills such as cooking and managing money."],"syn":"real-world skills"},{"w":"scholarship","pos":"명사","ipa":"/ˈskɒləʃɪp/","vi":"장학금","use":"가산명사; win / be awarded + a scholarship to do sth","ex":["He won a full scholarship to study engineering in Korea.","Scholarships give talented students from poor backgrounds a real chance."],"syn":"grant"},{"w":"pursue a degree","pos":"동사구","ipa":"/pəˌsjuː ə dɪˈɡriː/","vi":"학위를 따다","use":"pursue a degree in + 전공; pursue + a career/goal","ex":["Many international students come to Korea to pursue a degree in engineering.","Working adults increasingly pursue a degree part-time while keeping their jobs."],"syn":"study for a degree"},{"w":"hands-on","pos":"형용사","ipa":"/ˌhændz ˈɒn/","vi":"직접 해 보는, 실습 중심의","use":"명사 앞에 쓰는 형용사; hands-on + experience/learning","ex":["Laboratory work gives science students valuable hands-on experience.","Young children learn best through hands-on activities rather than lectures."],"syn":"practical"},{"w":"theoretical knowledge","pos":"명사구","ipa":"/ˌθɪəˈretɪkl ˈnɒlɪdʒ/","vi":"이론적 지식","use":"불가산명사; theoretical knowledge + vs practical skills","ex":["University courses often focus on theoretical knowledge rather than practical skills.","Theoretical knowledge alone is not enough to succeed in most careers."],"syn":"academic knowledge"},{"w":"graduate","pos":"동사","ipa":"/ˈɡrædʒueɪt/","vi":"졸업하다","use":"자동사; graduate from + 학교; graduate in + 전공 (※ graduate university ✗: from이 필요해요)","ex":["Thousands of students graduate each year without finding suitable jobs.","After she graduated from university, she worked as a research assistant."],"syn":"finish university"},{"w":"assess","pos":"동사","ipa":"/əˈses/","vi":"평가하다","use":"타동사; assess + students/progress; 명사: assessment","ex":["Teachers should assess students through projects as well as written exams.","It is difficult to assess creativity using a single final test."],"syn":"evaluate"},{"w":"peer pressure","pos":"명사구","ipa":"/ˈpɪə ˌpreʃə/","vi":"또래 압력","use":"불가산명사; give in to / resist + peer pressure","ex":["Teenagers often give in to peer pressure to fit in with friends.","Peer pressure can also have positive effects, such as encouraging hard work."],"syn":"influence from friends"},{"w":"mixed-ability classes","pos":"명사구","ipa":"/ˌmɪkst əˈbɪləti ˈklɑːsɪz/","vi":"수준이 섞인 학급","use":"복수형; teach / study in + mixed-ability classes","ex":["Weaker pupils often benefit from studying in mixed-ability classes.","Teaching mixed-ability classes requires careful planning and a lot of patience."],"syn":"mixed-level classes"},{"w":"cognitive development","pos":"명사구","ipa":"/ˌkɒɡnətɪv dɪˈveləpmənt/","vi":"인지 발달","use":"불가산명사; promote / support + cognitive development","ex":["Puzzles and building games can support a child's cognitive development.","Early exposure to language plays a key role in cognitive development."],"syn":"mental development"},{"w":"foster","pos":"동사","ipa":"/ˈfɒstə/","vi":"기르다, 촉진하다","use":"타동사; foster + creativity/independence","ex":["Group projects foster teamwork and communication among students.","Schools should foster curiosity instead of simply preparing children for exams."],"syn":"promote"},{"w":"bridge the gap","pos":"동사구","ipa":"/ˌbrɪdʒ ðə ˈɡæp/","vi":"격차를 줄이다","use":"bridge the gap between A and B","ex":["Free tutoring programmes help bridge the gap between rich and poor students.","Internships bridge the gap between university study and the workplace."],"syn":"narrow the gap"},{"w":"home-schooling","pos":"명사","ipa":"/ˌhəʊm ˈskuːlɪŋ/","vi":"홈스쿨링","use":"불가산명사; choose / opt for + home-schooling","ex":["Some parents choose home-schooling because they distrust the state system.","Critics argue that home-schooling limits children's social development."],"syn":"home education"},{"w":"brain st clearance"},{"w":"endangered species","pos":"명사구","ipa":"/ɪnˌdeɪndʒəd ˈspiːʃiːz/","vi":"멸종 위기종","use":"species: 단수와 복수가 같은 형태; protect + endangered species (specieses ✗)","ex":["Zoos can play an important role in protecting endangered species.","Tigers and elephants are well-known examples of endangered species."],"syn":"threatened animals"},{"w":"single-use plastics","pos":"명사구","ipa":"/ˌsɪŋɡl juːs ˈplæstɪks/","vi":"일회용 플라스틱","use":"복수형; ban / reduce + single-use plastics","ex":["Several countries have banned single-use plastics such as straws and bags.","Supermarkets should reduce their use of single-use plastics in packaging."],"syn":"disposable plastics"},{"w":"cut down on","pos":"동사구","ipa":"/ˌkʌt ˈdaʊn ɒn/","vi":"줄이다","use":"cut down on + N/V-ing (energy use, meat, driving)","ex":["People can cut down on energy use by switching off unused lights.","Cutting down on meat consumption would reduce agricultural emissions."],"syn":"reduce"},{"w":"sustainable","pos":"형용사","ipa":"/səˈsteɪnəbl/","vi":"지속 가능한","use":"형용사; sustainable + development/growth/practices","ex":["Sustainable development meets present needs without harming future generations.","Farmers are being encouraged to adopt more sustainable methods of production."],"syn":"green"},{"w":"public transport","pos":"명사구","ipa":"/ˌpʌblɪk ˈtrænspɔːt/","vi":"대중교통","use":"불가산명사; use / invest in + public transport","ex":["Cheaper public transport would encourage commuters to leave their cars at home.","Seoul is often praised for its efficient and affordable public transport."],"syn":"mass transit"},{"w":"air quality","pos":"명사구","ipa":"/ˈeə ˌkwɒləti/","vi":"대기질","use":"불가산명사; poor / improve + air quality","ex":["Poor air quality is linked to asthma and heart disease.","Banning old diesel vehicles has noticeably improved air quality in the city."],"syn":"cleanliness of the air"},{"w":"carbon footprint","pos":"명사구","ipa":"/ˌkɑːbən ˈfʊtprɪnt/","vi":"탄소 발자국","use":"가산명사; reduce / measure + your carbon footprint","ex":["Flying less is one of the best ways to reduce your carbon footprint.","Companies are now expected to report the carbon footprint of their products."],"syn":"personal emissions"},{"w":"extreme weather events","pos":"명사구","ipa":"/ɪkˌstriːm ˈweðər ɪˌvents/","vi":"극단적인 기상 현상","use":"복수형; extreme weather events + such as floods/heatwaves","ex":["Extreme weather events such as floods and heatwaves are becoming more frequent.","Farmers in Korea have suffered heavy losses from extreme weather events."],"syn":"natural disasters"},{"w":"rising sea levels","pos":"명사구","ipa":"/ˌraɪzɪŋ ˈsiː ˌlevlz/","vi":"해수면 상승","use":"복수형; threaten / be threatened by + rising sea levels","ex":["Rising sea levels threaten low-lying coastal cities around the world.","Many low-lying coastal cities are among the places most threatened by rising sea levels."],"syn":"higher ocean levels"},{"w":"biodiversity","pos":"명사","ipa":"/ˌbaɪəʊdaɪˈvɜːsəti/","vi":"생물 다양성","use":"불가산명사; protect / a loss of + biodiversity","ex":["Coral reefs support a remarkable level of biodiversity in tropical seas.","Intensive farming has led to a dramatic loss of biodiversity."],"syn":"variety of life"},{"w":"habitat loss","pos":"명사구","ipa":"/ˈhæbɪtæt lɒs/","vi":"서식지 손실","use":"불가산명사; cause / lead to + habitat loss","ex":["Habitat loss is the main reason many animal species are disappearing.","Urban expansion has caused severe habitat loss for local wildlife."],"syn":"destruction of habitats"},{"w":"landfill","pos":"명사","ipa":"/ˈlændfɪl/","vi":"매립지","use":"가산/불가산 모두 가능; end up in / send to + landfill","ex":["Most household waste still ends up in landfill rather than being recycled.","New landfill sites are difficult to find in densely populated countries."],"syn":"rubbish dump"},{"w":"conserve","pos":"동사","ipa":"/kənˈsɜːv/","vi":"보존하다, 절약하다","use":"타동사; conserve + water/energy/wildlife","ex":["Residents were asked to conserve water during the long dry season.","National parks were created to conserve rare plants and wildlife."],"syn":"save"},{"w":"switch to","pos":"동사구","ipa":"/ˈswɪtʃ tə/","vi":"~로 전환하다","use":"switch (from A) to B; switch to + electric cars/solar power","ex":["More drivers are expected to switch to electric cars within a decade.","Factories that switch to solar power can cut their energy bills."],"syn":"change to"},{"w":"environmentally friendly","pos":"형용사구","ipa":"/ɪnˌvaɪrənˌmentəli ˈfrendli/","vi":"환경친화적인","use":"형용사구; environmentally friendly + products/alternatives","ex":["Consumers are increasingly willing to pay more for environmentally friendly products.","Cycling is a cheap and environmentally friendly way to travel."],"syn":"eco-friendly"},{"w":"environmental regulations","pos":"명사구","ipa":"/ɪnˌvaɪrənˌmentl ˌreɡjuˈleɪʃnz/","vi":"환경 규제","use":"복수형; enforce / tighten + environmental regulations","ex":["Stricter environmental regulations would force factories to reduce their waste.","Some companies move production abroad to avoid strict environmental regulations."],"syn":"green laws"},{"w":"phase out","pos":"동사구","ipa":"/ˌfeɪz ˈaʊt/","vi":"단계적으로 없애다","use":"phase out + N / phase + N + out; phase out coal by + 연도","ex":["Many countries plan to phase out coal power by 2040.","Petrol cars will be gradually phased out over the next two decades."],"syn":"gradually remove"},{"w":"irreversible","pos":"형용사","ipa":"/ˌɪrɪˈvɜːsəbl/","vi":"되돌릴 수 없는","use":"형용사; irreversible + damage/effects/harm","ex":["Scientists warn that some climate damage may already be irreversible.","Overfishing can cause irreversible harm to marine life in the region."],"syn":"permanent"},{"w":"ecosystem","pos":"명사","ipa":"/ˈiːkəʊsɪstəm/","vi":"생태계","use":"가산명사; fragile / marine + ecosystem; damage + ecosystems","ex":["Plastic waste is damaging fragile marine ecosystems across the Pacific.","Wetlands are among the most productive ecosystems on the planet."],"syn":"natural environment"},{"w":"drought","pos":"명사","ipa":"/draʊt/","vi":"가뭄","use":"가산/불가산 모두 가능; severe / prolonged + drought","ex":["Prolonged drought has destroyed crops across large parts of Africa.","Water shortages become critical when a severe drought hits the region."],"syn":"dry spell"},{"w":"tackle","pos":"동사","ipa":"/ˈtækl/","vi":"해결하다, 대처하다","use":"타동사; tackle + a problem/issue/climate change","ex":["International cooperation is essential to tackle climate change effectively.","Local councils are introducing new measures to tackle air pollution."],"syn":"deal with"},{"w":"mitigate","pos":"동사","ipa":"/ˈmɪtɪɡeɪt/","vi":"완화하다","use":"타동사; mitigate + the effects/impact of + N","ex":["Planting mangroves can help mitigate the impact of coastal flooding.","Governments must act quickly to mitigate the effects of global heating."],"syn":"lessen"},{"w":"take action","pos":"동사구","ipa":"/ˌteɪk ˈækʃn/","vi":"조치를 취하다","use":"take action on/against + N; take urgent action","ex":["It is time for world leaders to take action on climate change.","Ordinary citizens can also take action by changing their daily habits."],"syn":"act"},{"w":"offset","pos":"동사","ipa":"/ˌɒfˈset/","vi":"상쇄하다","use":"타동사 (offset-offset-offset); offset + emissions","ex":["Some airlines let passengers offset their emissions by funding tree planting.","Planting forests alone cannot offset the damage caused by heavy industry."],"syn":"compensate for"},{"w":"depletion","pos":"명사","ipa":"/dɪˈpliːʃn/","vi":"고갈","use":"불가산명사; ozone / resource + depletion; the depletion of + N","ex":["The rapid depletion of groundwater is a serious problem in many regions.","International agreements have slowed ozone depletion since the late 1980s."],"syn":"running out"},{"w":"raise awareness","pos":"동사구","ipa":"/ˌreɪz əˈweənəs/","vi":"인식을 높이다","use":"raise awareness of/about + N","ex":["Television campaigns can raise awareness of the dangers of plastic waste.","Schools should raise awareness about recycling from an early age."],"syn":"inform the public"},{"w":"carbon neutral","pos":"형용사구","ipa":"/ˌkɑːbən ˈnjuːtrəl/","vi":"탄소 중립","use":"become / go + carbo fluence on public opinion.","Young people's values are shaped partly by the mass media."],"syn":"the press"},{"w":"fake news","pos":"명사구","ipa":"/ˌfeɪk ˈnjuːz/","vi":"가짜 뉴스","use":"불가산명사; spread / recognise + fake news (a fake news ✗, fake news 뒤에 -s ✗)","ex":["Fake news can spread across the internet within a few hours.","Schools should teach students how to recognise fake news."],"syn":"false reports"},{"w":"go viral","pos":"동사구","ipa":"/ˌɡəʊ ˈvaɪrəl/","vi":"입소문을 타고 빠르게 퍼지다","use":"자동사; a video/post + goes viral","ex":["A single funny video can go viral and reach millions overnight.","Companies hope their advertisements will go viral on social platforms."],"syn":"spread quickly"},{"w":"invasion of privacy","pos":"명사구","ipa":"/ɪnˌveɪʒn əv ˈprɪvəsi/","vi":"사생활 침해","use":"가산명사; a serious / an unacceptable + invasion of privacy","ex":["Many people see constant online tracking as an invasion of privacy.","Installing cameras in classrooms could be a serious invasion of privacy."],"syn":"privacy violation"},{"w":"digital divide","pos":"명사구","ipa":"/ˌdɪdʒɪtl dɪˈvaɪd/","vi":"디지털 격차","use":"단수형 (the digital divide); narrow / widen + the digital divide","ex":["The digital divide leaves many elderly people unable to use online services.","Providing free internet in rural areas could narrow the digital divide."],"syn":"technology gap"},{"w":"rely on","pos":"동사구","ipa":"/rɪˈlaɪ ɒn/","vi":"~에 의존하다","use":"rely on + N/sb; rely on sb to do sth","ex":["Many students now rely on search engines rather than printed books.","Modern businesses rely on cloud storage to protect important data."],"syn":"depend on"},{"w":"user-friendly","pos":"형용사","ipa":"/ˌjuːzə ˈfrendli/","vi":"사용하기 쉬운","use":"형용사; a user-friendly + app/interface/website","ex":["The new banking app is user-friendly, even for older customers.","Designers aim to create user-friendly websites that load quickly."],"syn":"easy to use"},{"w":"cyberbullying","pos":"명사","ipa":"/ˈsaɪbəbʊliɪŋ/","vi":"사이버 괴롭힘","use":"불가산명사; be a vic ed to a decline in cinema attendance.","Many families now subscribe to two or three streaming services."],"syn":"online video platforms"},{"w":"regulate","pos":"동사","ipa":"/ˈreɡjuleɪt/","vi":"규제하다, 관리하다","use":"타동사; regulate + tech companies/content","ex":["Governments are struggling to regulate powerful global technology companies.","Clear laws are needed to regulate the use of facial recognition."],"syn":"control"},{"w":"tech-savvy","pos":"형용사","ipa":"/ˈtek ˌsævi/","vi":"기술에 능숙한","use":"형용사; a tech-savvy + generation/user","ex":["Today's tech-savvy generation learns new apps almost instantly.","Older employees may feel left behind by their tech-savvy colleagues."],"syn":"good with technology"},{"w":"double-edged sword","pos":"명사구","ipa":"/ˌdʌbl ˌedʒd ˈsɔːd/","vi":"양날의 검","use":"단수형; be + a double-edged sword (for sb)","ex":["Social media is a double-edged sword for young people.","For many workers, constant connectivity has proved a double-edged sword."],"syn":"mixed blessing"}]},{"id":"v04","en":"Health & Lifestyle","vi":"건강과 생활 방식","desc":"건강, 영양, 운동, 일상 습관과 관련된 어휘예요.","words":[{"w":"healthy lifestyle","pos":"명사구","ipa":"/ˌhelθi ˈlaɪfstaɪl/","vi":"건강한 생활 방식","use":"가산명사; lead / maintain + a healthy lifestyle","ex":["Many young people find it hard to maintain a healthy lifestyle in big cities.","Schools should teach children the basics of a healthy lifestyle from an early age."],"syn":"healthy way of living"},{"w":"balanced diet","pos":"명사구","ipa":"/ˌbælənst ˈdaɪət/","vi":"균형 잡힌 식단","use":"가산명사; eat / follow + a balanced diet","ex":["A balanced diet provides the body with all the nutrients it needs.","Busy office workers often struggle to eat a balanced diet."],"syn":"healthy diet"},{"w":"physical activity","pos":"명사구","ipa":"/ˌfɪzɪkl ækˈtɪvəti/","vi":"신체 활동","use":"불가산명사; do / increase + physical activity","ex":["Children need at least one hour of physical activity every day.","A lack of physical activity is a major cause of weight gain."],"syn":"exercise"},{"w"  shape.","It becomes harder to stay in shape as people get older."],"syn":"keep fit"},{"w":"nutritious","pos":"형용사","ipa":"/njuˈtrɪʃəs/","vi":"영양가 높은","use":"nutritious food / meals; cheap and nutritious","ex":["School lunches should be both cheap and nutritious for every pupil.","Fresh vegetables are far more nutritious than most packaged snacks."],"syn":"healthy"},{"w":"well-being","pos":"명사","ipa":"/ˌwelˈbiːɪŋ/","vi":"건강, 행복 (웰빙)","use":"불가산명사; physical / mental well-being","ex":["Regular contact with nature improves our physical and mental well-being.","A pleasant work environment is essential for the well-being of employees."],"syn":"health and happiness"},{"w":"chronic disease","pos":"명사구","ipa":"/ˌkrɒnɪk dɪˈziːz/","vi":"만성 질환","use":"가산명사; suffer from / prevent + chronic diseases","ex":["Poor diet is closely linked to chronic diseases such as diabetes.","Millions of elderly people live with at least one chronic disease."],"syn":"long-term illness"},{"w":"life expectancy","pos":"명사구","ipa":"/ˈlaɪf ɪkˌspektənsi/","vi":"평균 수명","use":"불가산명사; life expectancy rises / increases","ex":["Life expectancy in Korea has increased dramatically over the past fifty years.","Better healthcare has raised average life expectancy in most countries."],"syn":"average lifespan"},{"w":"give up","pos":"동사구","ipa":"/ˌɡɪv ˈʌp/","vi":"(습관을) 끊다, 포기하다","use":"+ 명사/V-ing; give up smoking / alcohol","ex":["It is never too late to give up smoking and feel the benefits.","Many people who give up sugar report feeling more energetic."],"syn":"quit"},{"w":"sleep deprivation","pos":"명사구","ipa":"/ˈsliːp ˌdeprɪˈveɪʃn/","vi":"수면 부족","use":"불가산명사; suffer from sleep deprivation","ex":["Sleep deprivation reduces concentration and increases the risk of accidents.","Many university students suffer from sleep deprivation during exam periods."],"syn":"lack of sleep"},{"w":"preventable","pos":"형용사","ipa":"/prɪˈventəbl/","vi":"예방할 수 있는","use":"preventable disease / death; largely preventable","ex":["Most cases of type 2 diabetes are largely preventable with lifestyle changes.","Smoking remains the leading cause of preventable death worldwide."],"syn":"avoidable"},{"w":"work out","pos":"동사구","ipa":"/ˌwɜːk ˈaʊt/","vi":"운동하다 (헬스)","use":"자동사; work out at the gym / work out regularly","ex":["I try to work out at the gym three times a week.","Young people who work out often feel more confident about their bodies."],"syn":"exercise"},{"w":"health-conscious","pos":"형용사","ipa":"/ˈhelθ ˌkɒnʃəs/","vi":"건강에 신경 쓰는","use":"명사 앞이나 be 뒤에 씀; health-conscious consumers","ex":["Health-conscious consumers are willing to pay more for organic food.","People have become far more health-conscious since the pandemic began."],"syn":"careful about health"},{"w":"processed food","pos":"명사구","ipa":"/ˌprəʊsest ˈfuːd/","vi":"가공식품","use":"보통 복수형; rely on / cut back on + processed foods","ex":["Busy families increasingly rely on processed food for quick evening meals.","Processed foods often contain high levels of salt, sugar and fat."],"syn":"ready-made food"},{"w":"prone to","pos":"형용사구","ipa":"/ˈprəʊn tə/","vi":"~하기 쉬운, ~하는 경향이 있는","use":"be prone to + N/V-ing; prone to injury / illness","ex":["Office workers are prone to back pain and eye strain.","Children who sleep badly are more prone to catching colds."],"syn":"likely to suffer from"},{"w":"boost the immune system","pos":"동사구","ipa":"/ˌbuːst ði ɪˈmjuːn ˌsɪstəm/","vi":"면역 체계를 강화하다","use":"타동사; boost / strengthen + the immune system","ex":["Regular exercise and good sleep help boost the immune system.","Some people claim that vitamin C can boost the immune system."],"syn":"strengthen the body's defences"},{"w":"moderation","pos":"명사","ipa":"/ˌmɒdəˈreɪʃn/","vi":"절제, 적당함","use":"불가산명사; 주로 in moderation 형태로 써요","ex":["Sweets are not harmful if they are eaten in moderation.","Moderation is the key to enjoying food without damaging your health."],"syn":"not too much"},{"w":"take up","pos":"동사구","ipa":"/ˌteɪk ˈʌp/","vi":"(운동, 취미를) 시작하다","use":"+ N/V-ing; take up a sport / yoga / running","ex":["Many retirees take up swimming as a way to stay active.","Encouraging teenagers to take up a team sport builds discipline."],"syn":"start"},{"w":"pose a risk","pos":"동사구","ipa":"/ˌpəʊz ə ˈrɪsk/","vi":"위험을 초래하다","use":"pose a (serious) risk to + N","ex":["Excessive screen time may pose a risk to children's eyesight.","Air pollution poses a serious risk to people with asthma."],"syn":"be dangerous to"},{"w":"addictive","pos":"형용사","ipa":"/əˈdɪktɪv/","vi":"중독성이 있는","use":"highly addictive; addictive substance / games","ex":["Nicotine is a highly addictive substance found in all cigarettes.","Some mobile games are deliberately designed to be addictive."],"syn":"habit-forming"},{"w":"unhealthy habits","pos":"명사구","ipa":"/ʌnˌhelθi ˈhæbɪts/","vi":"건강하지 않은 습관","use":"복수형; break / develop + unhealthy habits","ex":["It takes time and support to break unhealthy habits completely.","Stress often pushes people into unhealthy habits like overeating."],"syn":"bad habits"},{"w":"recover from","pos":"동사구","ipa":"/rɪˈkʌvə frəm/","vi":"~에서 회복하다","use":"+ N; recover from an illness / injury / surgery","ex":["Most patients recover from the operation within two weeks.","Elderly people usually take longer to recover from serious infections."],"syn":"get over"},{"w":"preventive medicine","pos":"명사구","ipa":"/prɪˌventɪv ˈmedsn/","vi":"예방 의학","use":"불가산명사; invest in / focus on + preventive medicine","ex":["Investing in preventive medicine is cheaper than treating diseases later.","Regular check-ups are an important part of preventive medicine."],"syn":"disease prevention"},{"w":"healthcare system","pos":"명사구","ipa":"/ˈhelθkeə ˌsɪstəm/","vi":"의료 체계","use":"가산명사; put pressure on / reform + the healthcare system","ex":["An ageing population puts enormous pressure on the healthcare system.","Korea has an efficient healthcare system with relatively low costs."],"syn":"health service"},{"w":"promote healthy eating","pos":"동사구","ipa":"/prəˌməʊt ˌhelθi ˈi
