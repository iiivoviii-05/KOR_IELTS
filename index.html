ronoun use","vi":"대명사 사용법","ielts":"대명사(it, this, they, which)를 바르게 써서 단어 반복을 피하면 Task 1과 Task 2 모두에서 Coherence and Cohesion 점수가 올라요.","points":[{"h":"앞에서 말한 명사를 대신하는 it과 they","body":"It은 단수 명사나 불가산명사를 대신하고, they는 복수 명사를 대신해요. 대명사는 대신하는 명사와 수가 일치해야 해요.","ex":["The government introduced a new tax. It was very unpopular.","Many students work part-time because they need money."]},{"h":"this/these + 요약 명사","body":"This/these + 명사(this trend, this problem, these rules)는 앞 문장 전체의 내용을 다시 가리켜서 문장들이 촘촘하게 이어지도록 해요.","ex":["Car use has doubled in ten years. This trend has led to serious air pollution.","Some schools have banned phones. These rules aim to improve concentration."]},{"h":"절 전체를 대신하는 which","body":"쉼표 뒤의 which는 앞 절의 내용 전체를 대신할 수 있어요.","ex":["Many young people move to cities, which puts pressure on housing.","Prices rose by 20%, which surprised many analysts."]},{"h":"one/ones와 that/those","body":"One/ones는 가산명사를 대신해서 반복을 피해요. 수치를 비교할 때는 that of(단수/불가산)와 those of(복수)를 써요.","ex":["Old buildings use more energy than new ones.","The population of Seoul is larger than that of Busan."]},{"h":"가주어 it","body":"영어에는 항상 주어가 필요하므로, 구체적인 주어가 없을 때는 It is + 형용사 + to V / that …을 써요. 한국어는 주어를 자주 생략해서 'Is important to study'처럼 주어가 빠진 문장을 쓰기 쉬워요. 또 주어를 대명사로 반복하지 않아요 (Pollution it is serious ✗).","ex":["It is essential to protect natural habitats.","It is often said that travel broadens the mind."]}],"mistakes":[{"wrong":"Pollution is a serious problem. They affect everyone's health.","right":"Pollution is a serious problem. It affects everyone's health.","why":"Pollution은 불가산명사이므로 it을 써요."},{"wrong":"Is important to learn English for work.","right":"It is important to learn English for work.","why":"영어 문장에는 주어가 필요하므로 가주어 it을 더해야 해요."},{"wrong":"My brother, he works in a hospital.","right":"My brother works in a hospital.","why":"주어를 대명사로 반복하지 않아요."}],"quiz":[{"t":"mcq","q":"The library is very popular because ___ opens 24 hours a day.","o":["they","its","this's","it"],"a":3,"why":"Library는 단수 명사이므로 it을 써요."},{"t":"fill","q":"___ is difficult to find a cheap flat in the city centre.","a":["It","it"],"why":"It is + 형용사 + to V 구조에서는 가주어 It이 필요해요."},{"t":"mcq","q":"Each student must bring ___ own laptop to the class.","o":["their","they're","there","its"],"a":0,"why":"Their는 소유 형용사로, 성별을 모를 때 'each student'에 쓸 수 있어요."},{"t":"fill","q":"Smartphones are useful, but ___ can also be addictive.","a":["they"],"why":"Smartphones는 복수이므로 they를 써요."},{"t":"fill","q":"My old laptop was very slow, so the university gave me a new ___.","a":["one"],"why":"One은 단수 가산명사(laptop)를 대신해서 반복을 피해요."},{"t":"mcq","q":"Unemployment rose sharply in 2009. ___ was mainly caused by the global financial crisis.","o":["These rise","They","This rise","Which"],"a":2,"why":"This + 단수 명사(rise)는 앞 문장의 내용을 요약해요."},{"t":"mcq","q":"The new law was introduced in 2015. Since then, ___ has reduced road accidents by 20%.","o":["they","which","one","it"],"a":3,"why":"It은 'the new law'(단수)를 대신해요."},{"t":"fill","q":"Tuition fees have increased, ___ means that fewer students can afford university.","a":["which"],"why":"쉼표 뒤의 Which는 앞 절 전체를 대신해요."},{"t":"mcq","q":"The salaries of nurses are lower than ___ of doctors.","o":["that","them","ones","those"],"a":3,"why":"Salaries는 복수이므로 those of를 써요."},{"t":"mcq","q":"The climate of Pyeongchang is cooler than ___ of Seoul.","o":["those","it","that","one"],"a":2,"why":"Climate는 단수 명사이므로 that of를 써요."},{"t":"fill","q":"Some cities have introduced congestion charges. ___ (this) measures have reduced traffic significantly.","a":["These","these"],"why":"Measures는 복수이므로 this를 these로 바꿔요."},{"t":"mcq","q":"In the sentence 'The teacher told the student that she had made a mistake', which word is unclear (ambiguous)?","o":["she","teacher","told","mistake"],"a":0,"why":"'She'가 교사를 가리키는지 학생을 가리키는지 알 수 없어서 뜻이 분명하지 않아요."},{"t":"mcq","q":"Many people moved to the suburbs, ___ led to longer commuting times.","o":["this","which","that","it"],"a":1,"why":"쉼표 뒤에서는 which로 앞 내용 전체를 대신해요. that은 쉼표 뒤에 쓰지 않아요."},{"t":"fill","q":"Rents in London are higher than ___ in other UK cities.","a":["those"],"why":"Those는 'rents'(복수)를 대신해서 반복을 피해요."},{"t":"mcq","q":"Choose the best second sentence: 'Online learning offers great flexibility. ___'","o":["Online learning allows online learners to study online at any time.","This flexibility allows students to study at any time.","They allows students to study at any time.","Which allows students to study at any time."],"a":1,"why":"'This flexibility'는 단어를 반복하지 않고 내용을 이어 줘요. 다른 문장은 단어가 반복되거나 문법이 틀렸어요."},{"t":"mcq","q":"The government has promised to build ten new hospitals. ___ plan will cost billions of dollars.","o":["This","These","Those","Which"],"a":0,"why":"Plan은 단수 명사이므로 This + 명사로 앞 문장의 내용을 다시 가리켜요."}]},{"n":17,"en":"Paragraph and text organization","vi":"문단과 글의 구성","ielts":"명확한 문단 구성(주제문, 설명, 예시)은 Writing Task 2의 Coherence and Cohesion 기준에서 핵심 요소예요.","points":[{"h":"주제문 (topic sentence)","body":"본론 문단의 첫 문장은 문단 전체의 중심 내용을 말해요. 독자는 이 문장만 읽어도 문단이 무엇에 관한 것인지 알 수 있어요. 기승전결 구조처럼 결론을 뒤에 두지 않고, 첫 문장에서 바로 말해요.","ex":["One major advantage of working from home is the time it saves.","However, there are also serious drawbacks to relying on private cars."]},{"h":"뒷받침 문장: 설명과 예시","body":"주제문 뒤에는 설명하는 문장(This is because …)이 오고, 그다음에 구체적인 예시(For example …)가 와요. 모든 문장은 중심 내용과 직접 관련되어야 해요.","ex":["This is because employees no longer need to travel to the office.","For example, a worker in Seoul may save two hours a day."]},{"h":"순서와 덧붙임 연결어","body":"Firstly, Secondly, In addition, Moreover, Finally로 내용을 정리하고 덧붙여요. 연결어는 문장 맨 앞에 두고, 뒤에 쉼표를 써요.","ex":["Firstly, public transport reduces traffic congestion.","In addition, it is cheaper than driving."]},{"h":"대조와 결과 연결어","body":"However, On the other hand는 반대되는 내용에, As a result, Therefore, Consequently는 결과에 써요. Although/While은 한 문장 안에서 두 절을 이어요.","ex":["As a result, fewer young people own cars.","On the other hand, some people cannot afford these services."]},{"h":"문단마다 중심 내용 하나, 그리고 마무리 문장","body":"한 문단에서는 중심 내용 하나만 전개해요. 마지막 문장(concluding sentence)은 중심 내용을 다시 말하거나 결과를 제시할 수 있어요.","ex":["Overall, working from home benefits both employees and employers.","Therefore, governments should invest more in cycling infrastructure."]}],"mistakes":[{"wrong":"Cars are convenient. In addition, they cause serious air pollution.","right":"Cars are convenient. However, they cause serious air pollution.","why":"두 번째 내용이 첫 번째와 반대되므로 덧붙임 연결어가 아니라 대조 연결어가 필요해요."},{"wrong":"Because public transport is cheap. Many people use it.","right":"Because public transport is cheap, many people use it.","why":"because로 시작하는 절은 혼자서 문장이 될 수 없어요."},{"wrong":"Although cities are crowded, but many people still want to live there.","right":"Although cities are crowded, many people still want to live there.","why":"although와 but을 한 문장에 같이 쓰지 않아요."}],"quiz":[{"t":"mcq","q":"Which is the best topic sentence for a paragraph about the benefits of learning a foreign language?","o":["I started learning English when I was ten.","Learning a foreign language brings several important benefits.","For example, I can watch films without subtitles.","English has 26 letters."],"a":1,"why":"주제문은 문단 전체의 일반적인 중심 내용을 말해야 해요."},{"t":"fill","q":"Public transport is cheap. ___, it helps to reduce air pollution.","a":["In addition","Moreover","Furthermore","Also","Additionally","What is more"],"why":"두 번째 문장이 장점을 하나 더 덧붙이므로 덧붙임 연결어를 써요."},{"t":"mcq","q":"Fast food is convenient. ___, it is often high in fat and salt.","o":["However","For example","As a result","Firstly"],"a":0,"why":"두 번째 내용은 첫 번째와 반대되는 단점이므로 However를 써요."},{"t":"mcq","q":"Topic sentence: 'Technology has changed the way students learn.' Which sentence is a supporting EXAMPLE?","o":["Technology is very important.","In conclusion, technology is useful.","However, some teachers dislike change.","For instance, many students now attend lectures online."],"a":3,"why":"예시 문장은 구체적인 사례를 제시하며, 보통 For instance/For example로 시작해요."},{"t":"fill","q":"Many factories closed in the region. As a ___, unemployment rose sharply.","a":["result","consequence"],"why":"As a result / As a consequence는 결과를 나타낼 때 써요."},{"t":"mcq","q":"Put the sentences in the best order: (A) For example, in Singapore, drivers pay to enter the city centre. (B) One effective way to reduce traffic is to charge drivers. (C) As a result, traffic there has fallen significantly. (D) This encourages people to use public transport instead.","o":["B-D-A-C","A-B-C-D","C-B-D-A","B-C-A-D"],"a":0,"why":"주제문(B) → 설명(D) → 예시(A) → 예시의 결과(C)."},{"t":"mcq","q":"Which sentence does NOT belong in a paragraph about the health benefits of cycling?","o":["Cycling strengthens the heart and lungs.","Regular cyclists are less likely to be overweight.","Bicycles were invented in the nineteenth century.","Cycling can also reduce stress."],"a":2,"why":"자전거의 역사에 관한 문장은 건강상의 이점과 관련이 없으므로 문단에서 벗어나요."},{"t":"fill","q":"Firstly, cities offer more jobs. ___, they have better hospitals and schools.","a":["Secondly","Second","In addition","Moreover","Furthermore","Also","Additionally"],"why":"Firstly 뒤에는 Secondly나 덧붙임 연결어를 써요."},{"t":"mcq","q":"Which is the best concluding sentence for a paragraph about the advantages of online shopping?","o":["Online shopping started in the 1990s.","For example, I bought a laptop online last week.","Overall, online shopping saves consumers both time and money.","However, some shops are closing."],"a":2,"why":"마무리 문장은 중심 내용을 다시 요약하며, 보통 Overall/In short로 시작해요."},{"t":"mcq","q":"Working from home saves commuting time. ___, employees may feel isolated from their colleagues.","o":["Therefore","On the other hand","For example","In addition"],"a":1,"why":"두 번째 내용이 첫 번째의 다른 면이므로 On the other hand를 써요."},{"t":"mcq","q":"Which linking word introduces a RESULT?","o":["Although","Whereas","Despite","Consequently"],"a":3,"why":"Consequently는 '그 결과'라는 뜻으로 결과를 나타내요. 나머지는 대조를 나타내요."},{"t":"fill","q":"___ some people believe that exams are necessary, others think they cause too much stress.","a":["While","Although","Whereas","Though"],"why":"한 문장 안의 반대되는 두 절은 While/Although/Whereas로 이어요."},{"t":"mcq","q":"Topic sentence: 'Governments should spend more on public transport.' Which is the best next sentence?","o":["Governments are elected by the people.","Many people like cars.","In conclusion, public transport is the answer.","This is because good buses and trains reduce traffic congestion."],"a":3,"why":"다음 문장은 주제문의 이유를 설명해야 해요."},{"t":"mcq","q":"Which paragraph plan is the most logical for a Task 2 body paragraph?","o":["Example → topic sentence → explanation","Topic sentence → explanation → example → concluding sentence","Concluding sentence → example → topic sentence","Explanation → conclusion → topic sentence → example"],"a":1,"why":"표준적인 본론 문단: 주제문 → 설명 → 예시 → 마무리 문장."},{"t":"mcq","q":"Choose the correct sentence.","o":["Although it was expensive, but the course was worth it.","Despite it was expensive, the course was worth it.","Although it was expensive, the course was worth it.","Despite of the cost, the course was worth it."],"a":2,"why":"Although + 절이며, but을 더 쓰지 않아요. despite + 명사이며, 'of'가 없어요."},{"t":"mcq","q":"'Many young people cannot afford housing in big cities.' Which sentence best follows?","o":["Because of this, many continue to live with their parents into their thirties.","For example, housing.","Firstly, young people are young.","In contrast, many continue to live with their parents."],"a":0,"why":"다음 문장이 앞 문장의 결과이므로 Because of this를 써요. 'In contrast'는 의미 관계가 맞지 않아요."}]},{"n":18,"en":"The passive","vi":"수동태","ielts":"수동태는 Writing Task 1에서 과정(process)을 묘사하는 핵심 도구이고, Task 2에서 객관적이고 격식 있는 어조를 만들어 줘요.","points":[{"h":"기본 구조","body":"수동태 = be + V3(과거분사). 행동하는 사람보다 행동이나 대상이 더 중요할 때 써요.","ex":["English is spoken in many countries.","The bridge was built in 1998."]},{"h":"시제별 수동태","body":"be만 시제에 맞게 바꾸면 돼요: is/are done, was/were done, has/have been done, will be done, is/are being done.","ex":["A new hospital is being built in the city centre.","Over 500 trees have been planted since 2020."]},{"h":"과정 묘사 (process)","body":"Task 1의 과정은 보통 현재 단순 수동태로 쓰고, First, Next, After that, Finally 같은 순서 표현을 함께 써요.","ex":["First, the tea leaves are picked by hand.","Next, they are dried and packed into boxes."]},{"h":"by + 행위자와 조동사 수동태","body":"행위자 by + ...는 그 정보가 중요할 때만 덧붙여요. 조동사가 있을 때: can/should/must + be + V3.","ex":["The theory of evolution was developed by Charles Darwin.","Plastic waste should be recycled wherever possible."]},{"h":"학술적인 글의 객관적인 수동태","body":"It is believed/said/thought that … 또는 X is thought to + 동사원형 / to have + V3로 정보를 객관적으로 제시할 수 있어요.","ex":["It is believed that regular exercise improves memory.","Coffee is thought to have originated in Ethiopia."]}],"mistakes":[{"wrong":"The bridge was build in 1998.","right":"The bridge was built in 1998.","why":"수동태에는 V3(built)가 필요해요. 동사원형은 쓰지 않아요."},{"wrong":"This problem can solve by the government.","right":"This problem can be solved by the government.","why":"조동사가 있는 수동태에는 be + V3가 필요해요."},{"wrong":"The accident was happened at night.","right":"The accident happened at night.","why":"Happen은 자동사(목적어가 없음)라서 수동태가 없어요 (was happened ✗)."}],"quiz":[{"t":"mcq","q":"Rice ___ in many parts of Asia.","o":["is grown","grows by","is grow","growing"],"a":0,"why":"현재 단순 수동태: is + V3(grown)."},{"t":"fill","q":"The Eiffel Tower ___ (build) in 1889.","a":["was built"],"why":"과거의 일이고 주어가 단수이므로 was + V3를 써요."},{"t":"mcq","q":"First, the oranges ___ from the trees.","o":["pick","picked","are picking","are picked"],"a":3,"why":"과정은 현재 단순 수동태로 쓰고, 오렌지는 '따진다'는 수동의 뜻이에요."},{"t":"fill","q":"After that, the fruit ___ (wash) in cold water.","a":["is washed"],"why":"Fruit는 불가산명사라서 is + V3를 써요."},{"t":"mcq","q":"The results of the survey ___ next week.","o":["will publish","will published","are publishing","will be published"],"a":3,"why":"미래 수동태: will be + V3."},{"t":"mcq","q":"Since 2010, more than 2,000 new homes ___ in the area.","o":["have built","were built","have been built","has been built"],"a":2,"why":"'Since 2010'에는 현재 완료가 필요해요. homes가 복수라서 have been built를 써요."},{"t":"fill","q":"A new metro line ___ (build) at the moment.","a":["is being built"],"why":"바로 지금 짓고 있는 중이므로 진행 수동태 is being + V3를 써요."},{"t":"mcq","q":"Which sentence is correct?","o":["The meeting was happened yesterday.","The meeting was happen yesterday.","The meeting happened yesterday.","The meeting is happened yesterday."],"a":2,"why":"Happen은 자동사라서 수동태로 쓰지 않아요."},{"t":"mcq","q":"Old newspapers ___ to make new paper products.","o":["can recycle","can be recycled","can recycled","can be recycle"],"a":1,"why":"조동사 수동태: can be + V3."},{"t":"fill","q":"The data ___ (collect) from 500 students last year.","a":["was collected","were collected"],"why":"과거 단순 수동태예요. data는 단수나 복수 어느 쪽으로도 쓸 수 있어요."},{"t":"mcq","q":"The telephone ___ by Alexander Graham Bell.","o":["invented","has invented","is inventing","was invented"],"a":3,"why":"전화기는 과거에 발명되었으므로 was + V3를 써요."},{"t":"mcq","q":"In the final stage, the bottles ___ and sent to shops.","o":["labelled","are labelled","are labelling","label"],"a":1,"why":"과정은 현재 단순 수동태로 써요: are + V3, 'sent'와 병렬 구조예요."},{"t":"fill","q":"It ___ (believe) that the first university was founded in the 9th century.","a":["is believed","was believed"],"why":"객관적인 구조: It is believed that …"},{"t":"mcq","q":"Smoking ___ in all public buildings since 2012.","o":["has been banned","was banned","is banned","has banned"],"a":0,"why":"'Since 2012'에는 현재 완료 수동태가 필요해요: has been + V3."},{"t":"mcq","q":"The pyramids are thought ___ around 4,500 years ago.","o":["to build","to be built","to have been built","being built"],"a":2,"why":"건설이 현재 시점보다 먼저 일어났으므로 to have been + V3를 써요."},{"t":"fill","q":"Stricter laws on plastic packaging ___ (should / introduce) as soon as possible.","a":["should be introduced"],"why":"조동사 수동태: should be + V3."}]},{"n":19,"en":"Relative clauses","vi":"관계절","ielts":"관계절은 생각을 이어서 복문(complex sentences)을 만들 수 있게 해 주므로 Grammatical Range and Accuracy 점수를 높이는 데 도움이 돼요. 한국어는 수식어가 명사 앞에 오지만(내가 산 책), 영어의 관계절은 명사 뒤에 와요(the book that I bought).","points":[{"h":"who, which, that","body":"Who는 사람, which는 사물/사건에 써요. That은 who나 which 대신 쓸 수 있지만, 제한적 관계절(쉼표가 없는 절)에서만 써요.","ex":["Students who study abroad often become more independent.","The app that I use for vocabulary is free."]},{"h":"whose, where, when","body":"Whose는 소유(누구의/무엇의), where는 장소, when은 시간을 나타내요.","ex":["Parents whose children use phones at night should set limits.","This is the city where I was born."]},{"h":"제한적 관계절과 비제한적 관계절","body":"비제한적 관계절(non-defining)은 정보를 덧붙일 뿐이고 쉼표 사이에 넣으며 that을 쓰지 않아요. 제한적 관계절(defining)은 어떤 사람/사물을 말하는지 알려 주고 쉼표가 없어요.","ex":["Seoul, which is the capital of Korea, has over nine million people.","My sister, who is a nurse, works night shifts."]},{"h":"관계대명사 생략","body":"제한적 관계절에서 who/which/that이 뒤에 오는 동사의 목적어(object)이면 생략할 수 있어요.","ex":["The book I bought last week was expensive.","The course she chose was very popular."]},{"h":"관계절 줄이기","body":"V-ing(능동의 뜻) 또는 V3(수동의 뜻)로 줄이면 문장이 더 간결하고 학술적이 돼요.","ex":["People living in rural areas have fewer job opportunities.","The data collected in the survey show a clear trend."]}],"mistakes":[{"wrong":"The man which lives next door is a doctor.","right":"The man who lives next door is a doctor.","why":"사람에게는 which가 아니라 who를 써요."},{"wrong":"Seoul, that is the largest city in Korea, is very busy.","right":"Seoul, which is the largest city in Korea, is very busy.","why":"비제한적 관계절(쉼표가 있는 절)에서는 that을 쓰지 않아요."},{"wrong":"This is the book that I bought it yesterday.","right":"This is the book that I bought yesterday.","why":"That이 이미 'the book'을 대신하므로 목적어 it을 다시 쓰지 않아요."}],"quiz":[{"t":"mcq","q":"A doctor is a person ___ treats sick people.","o":["who","which","whose","where"],"a":0,"why":"Person은 사람이므로 who를 써요."},{"t":"fill","q":"This is the laptop ___ I bought for my studies.","a":["which","that"],"why":"Laptop은 사물이고 제한적 관계절이므로 which나 that을 써요."},{"t":"mcq","q":"The library ___ I study every day is open until midnight.","o":["which","who","whose","where"],"a":3,"why":"장소를 나타내고 뒤의 절이 이미 완전하므로(I study) where를 써요."},{"t":"fill","q":"Students ___ parents are teachers often do well at school.","a":["whose"],"why":"소유(학생의 부모)를 나타내므로 whose를 써요."},{"t":"mcq","q":"My hometown, ___ is in the east of Korea, has beautiful mountains.","o":["that","which","where","who"],"a":1,"why":"장소에 대한 비제한적 관계절이고 'is'의 주어이므로 which를 써요."},{"t":"mcq","q":"The company ___ makes this phone is based in South Korea.","o":["where","what","whose","that"],"a":3,"why":"Company는 조직(사물)이고 제한적 관계절이므로 that(또는 which)을 써요."},{"t":"fill","q":"2020 was the year ___ the pandemic changed the way people work.","a":["when","in which","that"],"why":"시간을 나타내므로 when을 써요."},{"t":"mcq","q":"Which sentence needs commas?","o":["My mother who is 60 still works full-time.","The students who failed the test must take it again.","The book that I borrowed is on the table.","People who exercise live longer."],"a":0,"why":"어머니는 한 분뿐이므로 절이 정보를 덧붙이기만 하고(비제한적) 쉼표가 필요해요."},{"t":"mcq","q":"The report ___ last week shows a rise in unemployment.","o":["publishing","was published","published","which published"],"a":2,"why":"수동태 절(which was published)을 V3로 줄이면 published가 돼요."},{"t":"mcq","q":"Which sentence is correct?","o":["The city where I live it is very crowded.","The city which I live is very crowded.","The city where I live in is very crowded.","The city where I live is very crowded."],"a":3,"why":"Where에는 이미 'in which'의 뜻이 있으므로 in을 더하지 않고, 주어 it도 반복하지 않아요."},{"t":"fill","q":"People ___ (live) near airports often suffer from noise pollution.","a":["living","who live"],"why":"능동태 절을 V-ing로 줄여요: living (= who live)."},{"t":"mcq","q":"The number of tourists rose by 30%, ___ was mainly due to cheaper flights.","o":["which","that","what","who"],"a":0,"why":"쉼표 뒤의 which는 앞 절 전체를 대신해요. that은 쉼표 뒤에 쓰지 않아요."},{"t":"fill","q":"The houses ___ (build) after 2010 are more energy-efficient.","a":["built","which were built","that were built"],"why":"수동의 뜻(집이 지어진)이므로 V3로 줄여요: built."},{"t":"mcq","q":"In which sentence can the relative pronoun be left out?","o":["The woman who called you is my manager.","The course that she chose was very popular.","Jeju, which I visited last year, is beautiful.","The dog that bit him was taken away."],"a":1,"why":"That은 제한적 관계절에서 'chose'의 목적어이므로 생략할 수 있어요."},{"t":"fill","q":"There are many reasons ___ young people leave the countryside.","a":["why","that","for which"],"why":"'reason(s)' 뒤에는 이유를 말할 때 why를 써요."},{"t":"mcq","q":"Over 60% of the students, most of ___ were international, chose online classes.","o":["them","who","whom","which"],"a":2,"why":"사람을 가리키는 전치사(of) 뒤에는 whom을 써야 해요. 'them'을 쓰면 문법이 틀린 두 개의 독립절이 돼요."}]},{"n":20,"en":"Noun phrases","vi":"명사구","ielts":"명사구와 명사화(nominalisation)는 문장을 더 학술적이고 간결하게 만들어서 Lexical Resource와 Grammatical Range 점수를 높여 줘요.","points":[{"h":"명사화 (nominalisation)","body":"동사나 형용사를 명사로 바꾸면(increase → an increase, develop → development, fail → failure) 문장이 더 학술적이 돼요.","ex":["There was a rapid increase in house prices.","The development of technology has changed education."]},{"h":"앞에서 수식하기 (pre-modification)","body":"형용사나 명사가 중심 명사 앞에 올 수 있어요. 앞에 오는 명사는 보통 단수형이에요. 숫자가 있어도 마찬가지예요 (a two-year course, two-years course ✗).","ex":["She completed a two-year course in nursing.","Household energy consumption rises in winter."]},{"h":"뒤에서 수식하기 (post-modification)","body":"전치사구, 관계절, V-ing / V3로 추가 정보를 중심 명사 뒤에 둘 수 있어요.","ex":["The number of students in rural areas has increased.","Students living far from the campus need better transport."]},{"h":"정해진 전치사와 함께 쓰는 명사","body":"많은 명사는 정해진 전치사와 함께 써요: increase/rise/fall in, effect/impact on, reason for, demand for, cause of. 주의: an increase of + 수치 (an increase of 5%).","ex":["There was a sharp rise in unemployment.","Social media has a strong impact on young people."]},{"h":"중심 명사와 주어-동사 일치","body":"주어가 긴 명사구일 때는 동사에 가장 가까운 명사가 아니라 중심 명사(head noun)에 맞춰 동사를 써요.","ex":["The number of cars on the roads is increasing.","The effects of climate change on agriculture are serious."]}],"mistakes":[{"wrong":"There was an increase of unemployment in 2020.","right":"There was an increase in unemployment in 2020.","why":"Increase in + 늘어난 대상이에요. increase of는 수치와만 써요."},{"wrong":"The number of students are increasing.","right":"The number of students is increasing.","why":"중심 명사가 'number'(단수)이므로 is를 써요."},{"wrong":"She did a two-years course in marketing.","right":"She did a two-year course in marketing.","why":"앞에서 수식하는 명사에는 -s를 붙이지 않아요."}],"quiz":[{"t":"mcq","q":"There was a sharp ___ in house prices in 2021.","o":["rise","rose","rising up","risen"],"a":0,"why":"'a sharp' 뒤에는 명사가 필요해요: a rise."},{"t":"fill","q":"The ___ (develop) of new technology has changed the way we work.","a":["development"],"why":"'The' 뒤, 'of' 앞에는 명사가 필요해요: development."},{"t":"mcq","q":"Smoking has a negative effect ___ health.","o":["to","in","for","on"],"a":3,"why":"고정 표현: an effect on."},{"t":"fill","q":"There has been a significant ___ (reduce) in the number of smokers.","a":["reduction"],"why":"reduce의 명사형은 reduction이에요."},{"t":"mcq","q":"The number of international students ___ grown steadily since 2015.","o":["have","are","were","has"],"a":3,"why":"중심 명사가 'number'(단수)이므로 has를 써요."},{"t":"mcq","q":"She works for a ___ company in Seoul.","o":["software","softwares","software's","softwared"],"a":0,"why":"앞에서 수식하는 명사는 단수형을 유지하고 's를 붙이지 않아요."},{"t":"fill","q":"There is a growing demand ___ renewable energy.","a":["for"],"why":"고정 표현: demand for."},{"t":"mcq","q":"Which is the best academic version of 'Unemployment went up a lot in 2009'?","o":["Unemployment goes up very much in 2009.","There was a dramatic increase in unemployment in 2009.","The unemployment was increasing a lot in 2009.","In 2009 unemployment it went up a lot."],"a":1,"why":"명사화(a dramatic increase in)를 쓰면 학술적이고 정확한 문장이 돼요."},{"t":"mcq","q":"The ___ of the new airport took five years.","o":["construct","constructive","construction","constructed"],"a":2,"why":"'The' 뒤, 'of' 앞에는 명사가 필요해요: construction."},{"t":"fill","q":"The government introduced a ___ (ten / year) plan to reduce poverty.","a":["ten-year","ten year"],"why":"숫자 + 명사가 앞에서 수식할 때 명사는 단수를 유지해요: a ten-year plan."},{"t":"mcq","q":"The effects of air pollution on children's health ___ serious.","o":["is","has","being","are"],"a":3,"why":"중심 명사가 'effects'(복수)이므로 are를 써요."},{"t":"mcq","q":"Which noun phrase is correct?","o":["the impact on the environment of tourism","the tourism's impact for the environment","the impact of tourism on the environment","the environment impact tourism"],"a":2,"why":"자연스러운 순서: the impact of X on Y."},{"t":"fill","q":"The ___ (fail) of the project was due to poor planning.","a":["failure"],"why":"fail의 명사형은 failure예요."},{"t":"mcq","q":"Which sentence uses nominalisation?","o":["People consumed more meat.","The consumption of meat increased.","People ate more meat than before.","Meat is eaten more."],"a":1,"why":"동사 consume을 명사 consumption으로 바꿨어요."},{"t":"mcq","q":"The rapid ___ of cities in developing countries has caused housing shortages.","o":["grow","growing up","growth","grown"],"a":2,"why":"형용사 'rapid' 뒤에는 명사가 필요해요: growth."},{"t":"fill","q":"Teenagers ___ (spend) more than five hours a day online are more likely to sleep badly.","a":["spending","who spend"],"why":"V-ing(= who spend)로 명사 teenagers를 뒤에서 수식해요."}]}];
const RTIPS=[{"id":"tfng","en":"True / False / Not Given","vi":"참 / 거짓 / 언급 없음 (True / False / Not Given)","what":"각 진술을 지문의 '정보'와 비교해요. 지문이 같은 내용을 말하면(보통 다른 표현으로) TRUE, 반대로 말하면 FALSE, 확인하거나 부정할 정보가 지문에 없으면 NOT GIVEN이에요.","steps":["진술을 읽고, 찾기 쉬운 키워드(고유명사, 숫자, 연도)와 all, some, only, always, usually 같은 한정어에 밑줄을 쳐요.","지문에서 해당 위치를 찾아요. 정답은 지문 순서대로 나오므로 뒤 문제의 정보는 보통 앞 문제의 정보 뒤에 있어요.","그 위치 주변 2~3문장을 꼼꼼히 읽고, 똑같은 단어가 아니라 동의어/paraphrase를 찾아요.","주체, 행동, 정도, 시간, 비교를 하나씩 맞춰 봐요. 모두 일치하면 TRUE예요.","지문이 정면으로 모순되는 말을 하면(반대 의미, 틀린 수치, some ↔ all 같은 정도의 차이) FALSE예요.","지문에 맞다 틀리다를 결론 내릴 만한 내용이 없으면 NOT GIVEN이에요. 추론하거나 배경지식을 더하지 마세요.","비워 두지 마세요. 못 찾은 문제는 앞뒤 문제의 위치로 범위를 좁힌 뒤 찍어요."],"traps":["FALSE와 NOT GIVEN을 혼동: FALSE = 지문이 '반대로' 말함, NOT GIVEN = 확인할 정보가 지문에 '없음'.","배경지식 사용: 실제로는 맞는 진술이어도 지문에 언급이 없으면 NOT GIVEN이에요.","한정어 간과: 지문에는 'some/usually'인데 진술에는 'all/always/only'라면 보통 FALSE예요.","지문과 겹치는 단어가 많다고 바로 TRUE를 고르지만, 실제로는 한 가지 세부 사항(원인, 비교)만 바뀐 경우예요."],"example":{"text":"Most of the volunteers in the study were university students, although a few office workers also took part.","q":"All of the volunteers in the study were students.","a":"FALSE","why":"지문에 'most'가 있고 'a few office workers'도 있으므로 전부 학생인 것은 아니에요 → 정면 모순. 진술이 'The volunteers were paid'였다면 지문에 언급이 없으므로 → NOT GIVEN."},"time":"문제당 약 1분, 순서대로 풀어요. Reading 전체는 3개 passage에 60분이고, 답안을 옮겨 적을 추가 시간은 없어요."},{"id":"ynng","en":"Yes / No / Not Given","vi":"예 / 아니오 / 언급 없음 (필자의 견해, Yes / No / Not Given)","what":"진술이 '필자'의 견해나 주장과 일치하는지 확인해요. 필자가 동의하면 YES, 필자가 반대로 생각하면 NO, 그 점에 대해 필자가 어떻게 생각하는지 알 수 없으면 NOT GIVEN이에요.","steps":["유형 파악: 문제에 'views/claims of the writer'가 나와요. 지문은 보통 논설문이고 개인 의견이 들어 있어요.","진술에서 키워드와 태도를 나타내는 말에 밑줄을 쳐요: should, a mistake, beneficial, overestimated, too…","지문 순서대로 위치를 찾아요. TFNG 유형처럼 정답도 같은 순서로 나와요.","필자의 의견을 나타내는 문장을 찾아요: I believe, in my view, arguably, unfortunately, it is clear that, however…","필자의 의견과 인용된 다른 사람의 의견(some experts claim…, critics argue…)을 구분해요.","태도가 일치하면 YES, 반대면 NO, 필자가 그 점에 대해 견해를 밝히지 않으면 NOT GIVEN이에요."],"traps":["인용된 연구자의 의견을 필자의 의견으로 착각해요. 필자는 인용한 뒤에 반박할 수도 있어요.","태도의 정도 간과: 필자가 '약간 의심한다'와 '완전히 반대한다'는 달라요.","NO와 NOT GIVEN을 혼동: NO = 필자가 반대로 말함, NOT GIVEN = 필자가 견해를 밝히지 않음.","필자가 아니라 자신의 의견이나 배경지식으로 답해요."],"example":{"text":"Some planners argue that wider roads reduce traffic, but in my view this belief has repeatedly been proven wrong.","q":"The writer agrees that building wider roads reduces traffic.","a":"NO","why":"필자는 'some planners'의 의견을 제시한 뒤 'in my view… proven wrong'으로 반박하므로, 필자의 견해는 진술과 반대예요."},"time":"TFNG와 같아요: 문제당 약 1분, 순서대로 풀어요. but/however가 나오는 곳에서는 태도가 자주 바뀌므로 천천히 읽어요."},{"id":"headings","en":"Matching Headings","vi":"문단 제목 고르기 (Matching Headings)","what":"각 문단의 '중심 내용'에 맞는 제목(i, ii, iii…)을 골라요. 제목 수가 항상 문단 수보다 많으므로 남는 제목이 있어요.","steps":["예시가 있으면 예시에서 쓴 제목을 바로 지우고, 그 예시 문단은 건너뛰세요.","제목 목록을 훑으면서 각 제목의 핵심(causes, effects, a solution, a comparison…)에 밑줄을 쳐요.","문단의 첫 문장과 마지막 문장을 읽고, 가운데 부분은 훑어서 문단 전체의 큰 흐름을 파악해요.","문단을 3~5단어로 직접 요약한 뒤 제목 목록과 비교해요.","문단 전체를 아우르는 제목을 골라요. 두 제목 사이에서 고민되면 둘 다 적어 두고 나중에 다시 돌아와요.","정답은 제목 순서대로 나오지 않아요. 쉬운 문단부터 풀고, 확실히 쓴 제목은 지우세요.","마지막 점검: 각 제목은 한 번만 쓰고, 남은 문단은 남은 제목과 맞아야 해요."],"traps":["문단 전체의 중심 내용이 아니라 문단 속 세부 사항이나 예시 하나에만 맞는 제목을 골라요.","지문과 같은 단어가 보인다는 이유로 골라요. 정답 제목은 보통 paraphrase되어 있고, 단어가 그대로 반복된 제목은 함정인 경우가 많아요.","첫 문장만 읽어요. 중심 내용은 문단 중간의 'However' 뒤나 마지막 문장에 있을 수 있어요.","뜻이 비슷한 두 제목(예: 'causes of…'와 'effects of…')은 꼼꼼히 읽고 방향을 정확히 골라야 해요."],"example":{"text":"Paragraph C: Early cars were expensive and often broke down. However, once mass production began, prices fell sharply and cars became available to ordinary families.","q":"Choose the best heading for Paragraph C: i) The dangers of early cars  ii) How cars became affordable  iii) The first car factories","a":"ii","why":"중심 내용은 'However' 뒤에 있어요: 가격이 떨어져 평범한 가족도 살 수 있게 됨 = 'became affordable'. (i)은 세부 내용 'broke down'에만 맞고, (iii)은 'mass production'이라는 단어가 들어 있지만 중심 내용이 아니에요."},"time":"보통 passage에서 먼저 풀어요. 글의 구조를 이해하는 데 도움이 되기 때문이에요. 문단당 약 1~1.5분이고, 어려운 문단은 표시해 두고 나중에 돌아와요."},{"id":"paragraph","en":"Which paragraph contains… (Matching Information)","vi":"정보가 들어 있는 문단 찾기 (Matching Information)","what":"정보에 대한 설명(a reason, an example, a comparison…)이 주어지면, 그 정보가 들어 있는 문단(A, B, C…)을 찾아요. 문단의 중심 내용이 아니라 '세부 정보'를 찾는 유형이에요.","steps":["지시문을 읽어요. 'NB You may use any letter more than once'가 있으면 한 문단이 여러 문제의 정답이 될 수 있어요.","찾아야 할 정보의 종류(a description, a reference to, an explanation, a date…)와 핵심 내용에 밑줄을 쳐요.","만나게 될 신호를 미리 예상해요: 'a comparison' → unlike, more than; 'an example' → for instance, such as; 수치 → 숫자.","passage의 다른 유형 문제를 먼저 풀고, 각 문단의 내용을 대략 읽고 기억한 뒤에 풀어요.","문단을 하나씩 읽으면서 '모든' 문제와 동시에 대조해요. 문제마다 지문 전체를 다시 읽지 마세요.","고유명사/수치가 있는 문제는 scan으로 먼저 풀고, 추상적인 문제는 나중에 풀어요.","정답은 지문 순서대로 나오지 않아요. 쓰이지 않는 문단도 있으니 정답을 문단마다 고르게 나누려고 하지 마세요."],"traps":["headings 유형처럼 중심 내용을 찾으려고 해요. 하지만 찾는 정보는 보통 문단 속 작은 문장 하나예요.","정보의 종류를 놓쳐요. 'a prediction'을 찾는데 문단이 현재만 설명한다면 정답이 아니에요.","각 문단은 한 번만 쓰인다거나, 모든 문단이 쓰여야 한다고 생각해요.","한 문제 때문에 지문 전체를 뒤지느라 시간을 너무 써요. 표시해 두고 나중에 돌아오세요."],"example":{"text":"Paragraph D: By 2040, engineers expect that most new buildings in the region will generate their own electricity from solar panels.","q":"Which paragraph contains a prediction about future energy use in buildings?","a":"D","why":"'expect that… by 2040… will generate'는 예측(prediction)이고, 'their own electricity'는 'energy use'에 해당해요."},"time":"보통 가장 어렵고 시간이 많이 걸려요. passage에서 가장 마지막에 풀고, 각 문단 내용에 익숙해진 뒤에 풀어요."},{"id":"features","en":"Matching Features","vi":"정보를 인물 / 특징과 연결하기 (Matching Features)","what":"진술이나 정보를 주어진 선택지 목록(보통 연구자 이름, 시기, 장소, 제품 종류 등)과 연결해요.","steps":["지시문을 읽어요. 'NB You may use any letter more than once'가 있을 수 있고, 쓰이지 않는 선택지도 있어요.","지문을 scan하면서 목록에 있는 이름/선택지가 나오는 곳을 '모두' 동그라미 쳐요(성만 나오거나 'the team'으로 나오는 경우도 포함해요).","한 이름이 여러 문단에 나올 수 있어요. 답하기 전에 모든 위치를 표시해 두세요.","진술을 하나씩 읽고 핵심에 밑줄을 쳐서 어떤 발견/의견을 찾아야 하는지 파악해요.","문제는 지문 순서대로 나오지 않아요. 한 이름에 대한 부분을 읽고, 진술 목록 전체와 동시에 대조하세요.","내용이 paraphrase로 일치할 때 고르고, 그 사람이 정말 그렇게 말했거나 발견했는지 다시 확인해요."],"traps":["가장 가까이 있는 이름에 의견을 연결해요. 하지만 그 사람은 다른 사람의 의견을 인용하거나 반박하는 중일 수 있어요.","두 번째 언급을 놓쳐요. 필자가 성, 'he/she', 'the researchers', 'her team'으로 다시 가리킬 수 있어요.","의미가 아니라 겹치는 단어를 보고 골라요. 진술은 정확히 그 사람의 발견/의견이어야 해요.","선택지를 한 번만 쓴다고 생각해서 '이미 썼다'는 이유로 맞는 답을 버려요."],"example":{"text":"Dr Lin found that bees remember flower colours for days, whereas Professor Ortiz claimed that their memory lasts only a few hours.","q":"Which researcher suggested that bees have only a short-term memory for colour? A Dr Lin  B Professor Ortiz","a":"B","why":"'only a few hours' = 단기 기억(short-term)이고, 이것은 Ortiz의 견해예요. Lin은 반대로 말해요('for days')."},"time":"passage의 다른 유형을 순서대로 푼 뒤에 해요. 먼저 1~2분 동안 scan해서 이름에 동그라미를 치고, 그 뒤 문제당 약 1분을 써요."},{"id":"endings","en":"Matching Sentence Endings","vi":"문장의 앞부분과 뒷부분 연결하기 (Matching Sentence Endings)","what":"문장의 앞부분(문제)을 목록(A, B, C…)에서 알맞은 뒷부분과 연결해서, 지문 내용과 맞는 완전한 문장을 만들어요. 뒷부분이 문장 수보다 많아요.","steps":["문장 앞부분을 읽고 키워드에 밑줄을 쳐서 위치를 찾아요. 문장 앞부분은 보통 지문 순서대로 나와요.","모든 뒷부분을 훑어봐요. 이 목록은 섞여 있어서 지문 순서대로가 '아니고' 남는 선택지가 있어요.","앞부분과 문법적으로 맞지 않는 뒷부분은 먼저 제외해요.","지문에서 위치를 찾아 그 부분을 꼼꼼히 읽고, 뒷부분을 자기 말로 먼저 생각해 보세요.","자신이 생각한 내용을 남은 뒷부분과 비교해요. 단어가 달라도 지문과 뜻이 같은 것을 고르세요.","연결한 문장 전체를 다시 읽어요. 문법도 맞고 지문 내용도 맞아야 해요. 이미 쓴 뒷부분은 지우세요."],"traps":["문법적으로 맞고 실생활에서는 그럴듯하게 들리지만 지문은 그렇게 말하지 않는 뒷부분을 골라요.","지문에 맞는 내용이지만 문장 앞부분의 대상이 아니라 다른 대상에 관한 뒷부분이에요.","지문의 단어를 그대로 반복한 뒷부분은 함정인 경우가 많아요. 정답은 보통 paraphrase되어 있어요.","뒷부분도 지문 순서대로라고 생각해요. 순서대로인 것은 앞부분뿐이고, 뒷부분은 섞여 있어요."],"example":{"text":"Because the river flooded every spring, farmers in the valley built their houses on raised wooden platforms.","q":"Farmers in the valley built raised houses… A because wood was cheap.  B to protect their homes from water.  C to keep animals away.","a":"B","why":"'flooded every spring'과 'raised platforms'는 목적이 홍수를 피하는 것임을 보여 줘요 = 'protect their homes from water'. A와 C는 문법상 맞지만 지문에 그런 내용이 없어요."},"time":"문제당 약 1~1.5분이에요. 문장 앞부분의 순서대로 풀고, 문법으로 선택지를 빠르게 제외하세요."},{"id":"mcq","en":"Multiple Choice","vi":"객관식 (Multiple Choice)","what":"질문에 답하거나 문장을 완성하는 정답(A, B, C 또는 D)을 골라요. 더 긴 목록에서 정답 '두 개'(또는 세 개)를 고르는 유형도 있어요.","steps":["지시문을 읽어요. 글자 하나를 고르는지 'Choose TWO letters'인지 확인하세요. 두 개 고르는 유형은 2문제 분량이고, 맞는 글자마다 1점이에요.","질문 부분(stem)을 먼저 읽고 키워드에 밑줄을 쳐요. 선택지는 아직 꼼꼼히 읽지 않아도 돼요.","지문에서 위치를 찾아요. 질문은 지문 순서대로 나와요(글 전체의 중심 내용/목적을 묻는 질문은 보통 마지막에 있어요).","그 부분을 꼼꼼히 읽어 먼저 내용을 이해한 뒤에 선택지 A–D를 하나씩 읽어요.","선택지를 하나씩 제외해요: 정보가 틀렸거나, 언급되지 않았거나, 맞지만 질문에 대한 답이 아닌 것이에요.","지문의 뜻을 paraphrase한 선택지를 고르고, stem과 함께 다시 읽어 맞는지 확인해요."],"traps":["지문과 똑같은 단어가 가장 많은 선택지를 골라요. 이런 선택지는 보통 함정이고, 정답은 다른 단어로 바꿔 쓴 경우가 많아요.","지문과 맞지만 질문에 대한 답이 아닌 선택지예요(원인을 묻는데 선택지는 결과를 말하는 경우).","지문은 'often'이나 'some'만 말하는데 너무 강하거나 지나치게 일반적인(always, all, completely) 선택지예요.","지문에서 위치를 찾기 전에 4개 선택지를 모두 꼼꼼히 읽으면 헷갈리고 시간도 많이 걸려요."],"example":{"text":"The museum moved to a larger building in 1998, mainly because its collection had grown too big for the old site.","q":"Why did the museum move? A The old building was damaged.  B It needed more space for its objects.  C It wanted more visitors.  D The rent increased.","a":"B","why":"'collection had grown too big for the old site' = 전시품을 둘 공간이 더 필요하다는 뜻이에요. A, C, D는 그럴듯하게 들리지만 지문에 그런 내용이 없어요."},"time":"꼼꼼히 읽어야 해서 문제당 약 1.5~2분이에요. 순서대로 풀고, 어려운 문제는 일단 찍어 두고 넘어가세요."},{"id":"summary","en":"Summary Completion","vi":"요약문 완성하기 (Summary Completion)","what":"지문 일부를 요약한 글의 빈칸을 지문에 있는 단어(from the passage)로 채우거나, 주어진 단어 상자의 선택지(from the box, 글자 A, B, C… 표기)로 채워요.","steps":["유형을 확인해요: 'from the passage' → 단어 수 제한에 맞게 지문의 단어를 옮겨 적어요. 'from the box/list' → 상자의 글자를 적어요.","요약문의 제목과 첫 문장을 읽고 지문의 어느 부분(보통 한두 문단)을 요약했는지 파악해요.","각 빈칸마다 앞뒤 단어를 보고 품사(명사/동사/형용사)와 단수/복수를 예상해요.","지문에서 해당 부분을 찾아요. 그 범위 안에서 빈칸은 보통 순서대로 나오지만 완전히 보장되지는 않아요.","단어를 옮겨 적는 유형: 지문에 있는 철자와 단어 형태 그대로 쓰고, 단어 수 제한을 넘지 마세요.","단어 상자 유형: 선택지는 보통 동의어이고 지문의 단어와 같지 않아요. 상자에는 남는 선택지가 많아요.","빈칸을 채운 뒤 요약문 문장 전체를 다시 읽어요. 문법도 맞고 지문의 뜻도 맞아야 해요."],"traps":["단어 상자 유형: 정확한 뜻을 가진 단어가 아니라 지문의 글자와 똑같은 단어를 골라요. 정답은 동의어인 경우가 많아요.","단어 상자 유형: 글자(A, B, C…)를 쓰라고 했는데 단어 전체를 답안지에 써요.","단어를 옮겨 적는 유형: 지문의 단어를 그대로 쓰지 않고 자기 말로 쓰거나 단어 형태를 바꿔요.","문법에만 의존해요. 상자에는 품사가 같은 단어가 2~3개 있는 경우가 많아서, 뜻을 보고 골라야 해요."],"example":{"text":"Unlike most snakes, this species gives birth to live young instead of laying eggs.","q":"Complete the summary using ONE WORD ONLY from the passage: This snake is unusual because it does not produce ______.","a":"eggs","why":"'instead of laying eggs' = 알을 낳지 않는다는 뜻이에요. 'produce' 뒤에는 명사가 필요하고, 지문처럼 복수형 'eggs'를 정확히 옮겨 적어요."},"time":"빈칸당 약 1분이에요. 요약된 지문 부분을 먼저 정확히 찾은 뒤 한 번에 풀어요."},{"id":"sentence","en":"Sentence / Note / Table / Form Completion","vi":"문장 / 메모 / 표 / 양식 완성하기 (Sentence / Note / Table / Form Completion)","what":"문장, 메모, 표, 양식의 빈칸을 지문에서 '그대로' 가져온 단어(또는 숫자)로 채워요. 단어 수 제한을 넘으면 안 돼요.","steps":["단어 수 제한을 꼼꼼히 읽어요: 'ONE WORD ONLY', 'NO MORE THAN TWO WORDS AND/OR A NUMBER'… 넘게 쓰면 문제 전체가 오답이에요.","각 빈칸의 품사(명사/형용사/동사), 단수/복수, 또는 숫자/연도인지 예상해요.","빈칸 주변의 키워드에 밑줄을 쳐요. 표는 행과 열의 제목을 읽어서 어떤 정보가 필요한지 파악해요.","지문에서 위치를 찾아요. 문제는 보통 지문 순서대로 나와요(메모/표는 지문의 한 부분에 집중되는 경우가 많아요).","채워야 할 단어를 정확히 찾아 지문에 있는 그대로 옮겨 적고, 단어 형태를 바꾸지 마세요. 숫자는 아라비아 숫자로 써도 돼요.","점검: 철자가 맞는지, 단수/복수가 맞는지, 문장이 문법적으로 완전한지, 단어 수 제한을 지켰는지 확인해요."],"traps":["허용된 단어 수를 넘게 써요. 예를 들어 ONE WORD만 허용되는데 'the'나 불필요한 형용사를 더해요.","철자가 틀리거나 복수 -s를 빠뜨리거나 더 붙여요. IELTS는 지문과 똑같지 않으면 오답으로 채점해요. 한국어에는 복수 표시가 거의 없어서 복수 -s를 빠뜨리기 쉽고, r/l, b/v, f/p 철자도 자주 틀리니 꼭 확인하세요.","지문의 단어를 그대로 옮기지 않고 자기 말로 바꿔 써요.","문장에 이미 있는 단어를 다시 쓰거나, 빈칸에 문법적으로 맞지 않는 단어를 채워요."],"example":{"text":"The bridge, completed in 1932, was built mainly from local granite rather than imported steel.","q":"Complete the notes using NO MORE THAN TWO WORDS: Main building material: ______","a":"local granite","why":"'built mainly from' = 'main building material'이에요. 'local granite'는 2단어라 제한에 맞아요. 'steel'은 지문에 'rather than'이 있어서 함정이에요."},"time":"점수를 얻기 쉬운 유형이에요. 일찍 풀고, 문제당 약 1분이며, 다음 문제로 넘어가기 전에 바로 철자를 확인하세요."},{"id":"flow","en":"Flow-chart & Diagram Label Completion","vi":"과정 도표 / 그림 라벨 채우기 (Flow-chart & Diagram Label Completion)","what":"과정, 기계, 구조를 설명하는 과정 도표(flow-chart)의 칸이나 그림(diagram)의 라벨을 지문에서 가져온 단어로 채워요.","steps":["단어 수 제한(예: NO MORE THAN TWO WORDS)을 읽고 전체를 살펴봐요: 무슨 과정/물건인지, 어디서 시작해서 어디서 끝나는지 확인하세요.","flow-chart: 화살표를 따라 단계별로 가면서 채울 단어의 품사(보통 명사나 동사)를 예상해요.","diagram: 이미 적혀 있는 라벨을 기준점으로 삼아 지문에서 해당하는 설명을 찾아요.","과정/구조를 설명하는 문단을 찾아요. 정보는 보통 한두 문단에 모여 있어요.","순서와 위치를 나타내는 말을 놓치지 마세요: first, then, after, finally; above, below, inside, attached to.","지문에 있는 단어를 그대로 옮겨 적어요. flow-chart는 보통 지문 순서대로이지만, diagram 라벨은 순서대로가 아닐 수 있어요."],"traps":["화살표나 단계 순서를 무시하고 앞/뒤 단계의 정보를 엉뚱한 칸에 적어요.","그림의 위치(위/아래, 안/밖)를 잘못 읽어서 다른 부분의 라벨을 채워요.","단어 수 제한을 넘기거나 지문과 단어 형태를 바꿔요(예: 지문에는 'heat'인데 'heating'이라고 적음).","정보가 보통 설명 문단 하나에 모여 있는데 지문 전체를 읽으며 찾아요."],"example":{"text":"First, the tea leaves are spread out to dry. They are then rolled by machine, which breaks their cells and releases natural juices.","q":"Complete the flow-chart using ONE WORD ONLY: Leaves are dried → Leaves are ______ by machine → Juices are released","a":"rolled","why":"'then rolled by machine'은 두 번째 단계와 일치해요. 'are' 뒤에는 V3 형태의 동사(수동태)가 필요하니 지문에 있는 대로 'rolled'를 적어요."},"time":"설명 문단을 제대로 찾으면 꽤 쉬워요. 빈칸당 약 1분이고, 지문을 읽기 전에 그림을 자세히 보세요."},{"id":"short","en":"Short-answer Questions","vi":"짧은 답 쓰기 (Short-answer Questions)","what":"지문의 세부 정보에 대한 Wh- 질문(What, Which, Who, When, How many…)에 지문에서 가져온 단어나 숫자로 답해요. 단어 수 제한을 넘으면 안 돼요.","steps":["'NO MORE THAN THREE WORDS AND/OR A NUMBER' 같은 단어 수 제한을 읽어요. 완전한 문장으로 쓸 필요는 없어요.","의문사에 밑줄을 쳐서 답의 종류를 파악해요: When → 시간, How many → 숫자, Who → 사람, Where → 장소.","키워드(고유명사, 숫자, 전문 용어)에 밑줄을 쳐서 위치를 scan해요. 질문은 지문 순서대로 나와요.","정보가 들어 있는 문장을 꼼꼼히 읽어요. 질문은 보통 지문 문장을 paraphrase한 거예요.","지문의 단어를 그대로 옮겨 쓰되, 질문에 직접 답하는 단어만 쓰고 불필요한 단어는 쓰지 마세요.","답안지에 쓰기 전에 철자, 단수/복수, 단어 수를 확인해요."],"traps":["정보의 종류를 잘못 답해요: 'How many'를 물었는데 이름을 쓰거나, 'Which method'를 물었는데 결과를 써요.","단어 수 제한을 넘는 긴 구를 옮겨 적거나, 질문에 이미 있는 단어를 반복해요.","지문에 비슷한 숫자가 여러 개 있어서 질문의 조건에 맞지 않는 숫자를 골라요.","전문 용어를 옮겨 적을 때 철자를 틀려요. 항상 지문과 한 글자씩 비교하세요."],"example":{"text":"The survey, carried out in 2019, asked 450 farmers which crop they found most profitable; most chose rice.","q":"How many farmers took part in the survey? Write NO MORE THAN THREE WORDS AND/OR A NUMBER.","a":"450","why":"'asked 450 farmers' = 설문에 참여한 사람 수예요. 'How many'에는 숫자가 필요하고, '2019'는 연도라서 함정이에요."},"time":"점수를 얻기 쉬운 유형이에요. 문제당 약 1분이고, 순서대로 풀며 고유명사와 숫자로 scan하세요."}];
const SPEAK={"part1":[{"id":"p1-work","topic":"Work or studies","vi":"일 또는 학업","qs":["Do you work or are you a student?","What do you do in your job, or what are you studying?","Why did you choose that field?","What do you find most difficult about your work or studies?","Would you like to change anything about your job in the future?"]},{"id":"p1-hometown","topic":"Hometown","vi":"고향","qs":["Where is your hometown?","What is your hometown best known for?","Has your hometown changed much since you were a child?","Is it a good place for young people to live?","Would you like to go back and live there one day?"]},{"id":"p1-home","topic":"Home & accommodation","vi":"집과 주거","qs":["Do you live in a house or a flat?","Who do you live with?","Which room in your home do you spend the most time in?","What would you like to change about the place where you live?","Do you think you will stay in your current home for a long time?"]},{"id":"p1-routine","topic":"Daily routine","vi":"하루 일과","qs":["What does a typical day look like for you?","Are you a morning person or an evening person?","Is your routine at the weekend different from your weekday routine?","What part of your day do you enjoy the most?","Have you changed your daily routine recently?"]},{"id":"p1-food","topic":"Food & cooking","vi":"음식과 요리","qs":["What kind of food do you like to eat?","Do you often cook for yourself?","Is there any food you didn't like as a child but enjoy now?","Do you prefer eating at home or eating out?","What dish from your country would you recommend to a visitor?"]},{"id":"p1-weather","topic":"Weather & seasons","vi":"날씨와 계절","qs":["What's the weather like where you live at the moment?","Which season do you like best, and why?","Does the weather ever affect your mood?","How is the weather in Korea different from the weather in your home country?","What do you usually do on a rainy day?"]},{"id":"p1-freetime","topic":"Free time & hobbies","vi":"여가 시간과 취미","qs":["What do you like to do in your el changed compared with your parents' generation?","What are the advantages and disadvantages of travelling abroad when you are young?","How do you think people will travel fifty years from now?"]},{"id":"p2-goal","topic":"A goal you want to achieve","vi":"이루고 싶은 목표","card":"Describe a goal that you would like to achieve in the future.","bullets":["what the goal is","when you first had this goal","what you are doing to achieve it"],"last":"and explain why this goal is important to you.","part3":["Do young people in your country have different goals from older people?","Is it better to set small goals or big goals?","Why do some people give up on their goals?","Does society put too much pressure on young people to be successful?"]},{"id":"p2-problem","topic":"A time you solved a problem","vi":"문제를 해결한 경험","card":"Describe a time when you solved a difficult problem.","bullets":["what the problem was","when it happened","how you solved it","whether anyone helped you"],"last":"and explain how you felt after solving it.","part3":["What kinds of problems do people often face at work?","Is it better to solve problems alone or with other people?","Do you think schools teach children enough about problem-solving?","Will artificial intelligence solve most of our problems in the future?"]},{"id":"p2-app","topic":"A website or app you use often","vi":"자주 쓰는 웹사이트나 앱","card":"Describe a website or app that you use often.","bullets":["what it is","how you found out about it","what you use it for"],"last":"and explain why you use it so often.","part3":["What kinds of apps are most popular among people of different ages?","Has the internet made people's lives easier or more complicated?","Should children's use of apps and websites be controlled by their parents?","How might the internet change people's jobs in the future?"]},{"id":"p2-festival","topic":"A festival or celebration","vi":"축제나 기념일","card":"Describe a festival or celebration that is important in your country.","bullets":["what it is called","when it takes place","what people do during it","how you usually celebrate it"],"last":"and explain why it is important to people in your country.","part3":["Why are traditional festivals important for a country?","How have the ways people celebrate festivals changed over time?","Do you think festivals have become too commercial?","Will young people continue to keep traditional festivals alive in the future?"]},{"id":"p2-advice","topic":"A piece of advice you received","vi":"받았던 조언","card":"Describe a useful piece of advice that someone gave you.","bullets":["who gave you the advice","when you received it","what the advice was"],"last":"and explain how this advice helped you.","part3":["Who do young people usually ask for advice?","Is advice from older people always better than advice from friends?","Why do some people find it hard to accept advice?","Is it a good idea to take advice from the internet and social media?"]},{"id":"p2-conversation","topic":"An interesting conversation","vi":"흥미로웠던 대화","card":"Describe an interesting conversation you had with someone.","bullets":["who you talked to","when and where it happened","what you talked about"],"last":"and explain why you found the conversation interesting.","part3":["What topics do people in your country usually talk about with strangers?","Do you think people talk face to face less than they did in the past?","What makes someone a good listener?","How will online communication affect people's social skills in the future?"]},{"id":"p2-team","topic":"A time you worked in a team","vi":"팀으로 일한 경험","card":"Describe a time when you worked with other people as part of a team.","bullets":["what the team had to do","who was in the team","what your role was","what the result was"],"last":"and explain how you felt about working in that team.","part3":["Why do many companies and research groups prefer teamwork?","What problems can happen when people work in teams?","Is a good leader more important than good team members?","Do you think people will work more remotely and less in teams in the future?"]}],"tips":{"p1":["2~4문장 정도로 길게 대답하세요. Yes/No만 말하지 마세요. 하지만 Part 3처럼 너무 길게 말할 필요도 없어요. 한국어에서는 한 마디로 대답해도 자연스럽지만, 영어 Speaking에서는 한 문장만 말하면 Fluency 점수를 잃기 쉬워요.","간단한 공식을 쓰세요: 직접적인 답 + 이유 + 예시나 개인적인 세부 내용.","모범 답안을 외우지 마세요. 채점관은 바로 알아채고 점수를 깎을 수 있어요. 자신의 실제 생활과 학업·일에 대해 이야기하세요.","질문에 맞게 동사의 시제에 주의하세요. 과거에 대한 질문(as a child)에는 과거 시제를, 미래에 대한 질문에는 would/will/be going to를 쓰세요.","주제를 잘 모르면 솔직하게 말하고 이유를 설명하세요. 예: I'm not really into sport, because..."],"p2":["1분의 준비 시간을 활용하세요. 카드의 각 항목마다 완전한 문장이 아니라 키워드만 적으세요.","카드에 있는 항목 순서대로 말하면 발표 구조가 분명해지고 내용을 빠뜨리지 않아요.","시간 틀을 쓰세요: 배경/과거(무슨 일이 있었는지) → 현재(지금은 어떤지) → 감정과 의미(and explain 부분).","마지막 줄 and explain...에 가장 많은 시간을 쓰세요. 어휘력과 설명 능력을 가장 잘 보여 줄 수 있는 부분이에요.","2분을 채워 말하려고 노력하세요. 할 말이 떨어지면 시간, 장소, 사람에 대한 세부 내용을 더하거나 다른 경험과 비교하세요.","학교, 직장, 일상생활처럼 가까운 이야기를 골라 주제에 맞게 조금 조정해도 돼요. 중요한 것은 유창하게 말하는 거예요. 이야기가 완전한 사실일 필요는 없어요."],"p3":["구조에 맞춰 답하세요: 의견 + 이유 + 예시 + 반대 면/비교(However, on the other hand...). 한국어식으로 이유를 먼저 길게 말하고 결론을 마지막에 두기보다, 의견을 먼저 말하세요.","Part 3은 자신이 아니라 사회와 사람들 전반에 대해 묻기 때문에, 자신에 대해서만 말하지 말고 people, young people, many families 같은 주어를 쓰세요.","완곡한 표현을 쓰면 더 자연스럽고 학술적으로 들려요: I would say..., It seems to me that..., It probably depends on...","과거와 현재를 비교하는 질문에는 used to / In the past... whereas nowadays... 구조를 써서 다양한 문법을 보여 주세요.","미래에 대한 질문에는 will probably, might, I expect that...을 쓰고, 왜 그렇게 예상하는지 이유를 말하세요.","질문을 이해하지 못했다면 채점관에게 정중하게 다시 말해 달라고 부탁하세요(Could you rephrase that, please?). 생각할 시간이 필요하면 가만히 있지 말고 That's an interesting question...이라고 말하세요."],"phrases":[{"en":"To be honest, ...","vi":"솔직히 말하면... – 답을 자연스럽게 시작할 때, 특히 의외의 이야기를 할 때 써요.","part":"p1"},{"en":"I'd say that ...","vi":"저는 ~라고 생각해요... – 너무 단정하지 않고 부드럽게 답할 때 써요.","part":"p1"},{"en":"It depends on ...","vi":"~에 따라 달라요... – 답이 늘 같지는 않을 때 써요.","part":"p1"},{"en":"I'm not really into ..., but ...","vi":"저는 ~을 별로 좋아하지 않지만... – 주제가 내 취향이 아닐 때 써요.","part":"p1"},{"en":"Back when I was a child, ...","vi":"제가 어렸을 때는... – 예전의 경험과 지금을 비교할 때 써요.","part":"p1"},{"en":"I'd like to talk about ...","vi":"~에 대해 이야기하고 싶어요... – Part 2 발표를 시작하는 문장이에요.","part":"p2"},{"en":"This happened about two years ago, when ...","vi":"이 일은 약 2년 전에 있었어요, 그때... – 이야기의 시간적 배경을 정할 때 써요.","part":"p2"},{"en":"What I remember most is ...","vi":"가장 기억에 남는 것은... – 이야기에서 중요한 세부 내용을 강조할 때 써요.","part":"p2"},{"en":"Looking back, I realise that ...","vi":"돌이켜 보면, 저는 ~을 깨달았어요... – 감정과 의미(and explain...) 부분으로 넘어갈 때 써요.","part":"p2"},{"en":"The main reason why ... is that ...","vi":"~한 가장 큰 이유는 ~이기 때문이에요... – 카드의 and explain why 줄에 답할 때 써요.","part":"p2"},{"en":"That's an interesting question. Let me think ...","vi":"흥미로운 질문이네요, 잠깐 생각해 볼게요... – 생각할 시간이 필요할 때 침묵을 채우는 표현이에요.","part":"p3"},{"en":"One reason is that ...","vi":"한 가지 이유는 ~이기 때문이에요... – 자신의 의견에 대한 이유를 말할 때 써요.","part":"p3"},{"en":"For instance, in my country, ...","vi":"예를 들어, 우리나라에서는... – 실제 예를 들어 의견을 보여 줄 때 써요.","part":"p3"},{"en":"On the other hand, ...","vi":"반면에... – 반대되는 내용으로 넘어가서 답을 더 균형 있게 만들 때 써요.","part":"p3"},{"en":"In the past, ... whereas nowadays ...","vi":"예전에는... 반면 요즘은... – 과거와 현재를 비교하는 질문에 써요.","part":"p3"},{"en":"I expect that, in the future, ... will probably ...","vi":"앞으로는 ~이 아마 ~일 거라고 생각해요... – 미래를 신중하게 예측할 때 써요.","part":"p3"}]}};

function callRaw0(fn,args,quiet){
  pending++;

  const tries=(fn==="getPack"||fn==="getPacks")?3:1;
  const once=()=>new Promise((res,rej)=>{
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](PIN,...args);
  });
  const run=async n=>{
    try{return await once()}

      if(n<tries&&!/PIN_SAI|CHUA_DAT_PIN|찾을 수 없|올바르지 않|NO_KEY/.test(m)){await new Promise(r=>setTimeout(r,700*n));return run(n+1)}

/* v9: mỗi lượt học gửi kèm mã eid. Máy chủ thấy mã đã có thì không ghi lại, không cộng mét lần nữa.

const newEid=()=>{try{if(window.crypto&&crypto.randomUUID)return "e"+crypto.randomUUID().replace(/-/g,"")}catch(e){}return "e"+Date.now().toString(36)+Math.random().toString(36).slice(2,12)};

    if(!/PIN_SAI|CHUA_DAT_PIN|올바르지 않|찾을 수 없|입력이 없/.test(m)){const ob=outbox().filter(x=>x.p.eid!==payload.eid);ob.push({fn,p:payload,t:Date.now(),pin:PIN});ls.set("ielts-outbox",JSON.stringify(ob.slice(-30)));toast("연결이 끊겼어요. 결과를 이 기기에 보관했다가 웹을 열 때 자동으로 다시 보낼게요.",true)}

async function flushOutbox(){

/* --- tạo câu hỏi --- */
function vocabQuestions(words,pool,n){
  const canL=canSpeak();
  const types=["mean","word","cloze","listen","syn"];
  let list=[];let round=0;
  while(list.length<n){shuffle(words).forEach(w=>{if(list.length<n)list.push({w,t:types[(round+list.length)%types.length]})});round++}
  return shuffle(list).map((x,i)=>makeVQ(x.w,x.t,pool,canL,i));
}
function distract(w,pool,key,k=3){return shuffle(pool.filter(p=>p.w!==w.w&&p[key]&&p[key]!==w[key])).slice(0,k).map(p=>p[key])}
function clozeOf(w,sents){for(const s of sents){const re=new RegExp("\\b("+reEsc(w).replace(/\s+/g,"\\s+")+"(?:s|es|d|ed|ing)?)\\b","i");const m=s.match(re);if(m)return {before:s.slice(0,m.index),after:s.slice(m.index+m[0].length),ans:m[1]}}return null}
function makeVQ(w,t,pool,canL,i){
  const id=w.w;
  if(t==="syn"&&!w.syn)t="word";
  if(t==="listen"&&!canL)t="mean";
  if(t==="cloze"){const c=clozeOf(w.w,shuffle(w.ex||[]));if(c)return {id,ref:w,type:"fill",sent:true,html:`${esc(c.before)}<span class="gap"></span>${esc(c.after)}`,hint:`힌트: ${w.vi}, 첫 글자 "${c.ans[0]}"`,answers:[c.ans,w.w],show:c.ans,why:`"${w.w}"의 뜻은 "${w.vi}".`,time:30};t="word"}
  if(t==="mean"){const o=shuffle([w.vi,...distract(w,pool,"vi")]);return {id,ref:w,type:"mcq",html:`“${esc(w.w)}”의 뜻은 무엇일까요?`,opts:o,ans:o.indexOf(w.vi),why:`"${w.w}"의 뜻은 "${w.vi}". 예문: ${(w.ex||[])[0]||""}`,time:20}}
  if(t==="listen"){const o=shuffle([w.w,...distract(w,pool,"w")]);return {id,ref:w,type:"mcq",listen:w.w,html:`듣고 알맞은 단어 고르기`,opts:o,ans:o.indexOf(w.w),why:`방금 들은 단어: "${w.w}" (${w.vi}).`,time:20}}

function grammarQuestions(u,idx,lv){

function answer(given){

const VI=/[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ가-힣]/i;
const VI_PLAIN=new Set([]);
function parseBulk(text){
  const out=[];
  text.split(/\n/).map(l=>l.replace(/\s+$/,"")).forEach(raw=>{
    const l=raw.trim();if(!l)return;
    if(/^[^가-힣]*[A-Za-zÀ-ỹ][^가-힣]*$/.test(l)&&l===l.toUpperCase())return; // tiêu đề, dòng header
    let w="",m="";
    const seps=["\t"," – "," — "," - ",": "];
    if(VI.test(l)){const parts=l.split(/\s+/);let i=parts.findIndex(p=>VI.test(p));
      while(i>1&&VI_PLAIN.has(parts[i-1].toLowerCase()))i--;
      w=parts.slice(0,i).join(" ").replace(/\s*[-–—:=]+\s*$/,"");m=parts.slice(i).join(" ")}
    else if(seps.some(x=>l.includes(x))){const s=seps.find(x=>l.includes(x)),i=l.indexOf(s);w=l.slice(0,i);m=l.slice(i+s.length)}
    else if(l.includes(" = ")){const i=l.indexOf(" = ");w=l.slice(0,i);m="= "+l.slice(i+3)}
    else if(/\S {2,}\S/.test(l)){const i=l.search(/ {2,}/);w=l.slice(0,i);m=l.slice(i).trim()}
    else w=l;
    w=w.replace(/^[-•*\d.)\s]+/,"").replace(/\s*\((n|v|adj|adv)\)\s*$/i,"").trim();m=m.trim();
    const prev=out[out.length-1];
    if(prev&&!m&&!/[-–—:=\t]/.test(l)&&w.split(" ").length<=3&&/=\s*(\S+\s?){1,4}$/.test(prev.word)){prev.word+=" "+w;return}
    if(w&&w.length<=80)out.push({word:w,meaning:m});
  });
  return out;
}

  $("b-add").disabled=!fresh.length;$("b-add").textContent=fresh.length?`단어 ${fresh.length}개 추가하기`:"단어장에 추가";

function srsQ(v,pool,force){
  const w={w:v.word,vi:v.meaning,ex:v.example?[v.example]:[],syn:"",id:v.id};
  const P=pool.map(p=>({w:p.word,vi:p.meaning}));
  const t=force?force:v.box<=0?"mean":v.box<=1?(Math.random()<.5?"mean":"word"):v.box<=3?["word","cloze","type"][Math.floor(Math.random()*3)]:["cloze","type"][Math.floor(Math.random()*2)];
  let q;
  if(t==="type")q={id:v.id,ref:w,type:"fill",html:`다음 뜻의 영어 단어를 입력하세요: “${esc(v.meaning)}”`,hint:`첫 글자 "${v.word[0]}", ${v.word.length}글자`,answers:[v.word],show:v.word,why:"",time:30};
  else q=makeVQ(w,t,P,false,0);
  q.id=v.id;return q;
}
function startReview(kind){
  if(kind==="grammar"){
    const gw=grammarWrong();if(!gw.length)return;
    const qs=shuffle(gw).slice(0,16).map(({u,i})=>grammarQuestions(u,[i])[0]);
    S={L:{key:"rv-g",kind:"grammar",checkpoint:true},review:"grammar",phase:"quiz",xp:0,qs};
  }else{
    const pool=vocab.filter(v=>v.meaning);if(pool.length<4)return toast("뜻이 입력된 단어가 단어장에 최소 4개 필요해요.",true);
    let list;
    if(kind==="hard"){list=hardWords().slice(0,10);if(!list.length)return toast("어려운 단어가 없어요. 좋아요!")}
    else{const d=dueWords();list=[...shuffle(d.filter(isHard)),...shuffle(d.filter(v=>!isHard(v)))].slice(0,12);if(!list.length)return toast("오늘 복습할 단어가 더 없어요.")}
    // từ khó: hỏi 2 lần, một câu nhận nghĩa và một câu tự gõ/điền từ; sai câu nào cũng tính là chưa nhớ
    const qs=[];list.forEach(v=>{if(isHard(v)){qs.push(srsQ(v,pool,Math.random()<.5?"mean":"word"));qs.push(srsQ(v,pool,v.example&&Math.random()<.5?"cloze":"type"))}else qs.push(srsQ(v,pool))});
    S={L:{key:"rv-v",kind:"vocab",checkpoint:true},review:kind==="hard"?"hard":"vocab",phase:"quiz",xp:0,qs:kind==="hard"?shuffle(qs):qs};
    S.qs=spreadPairs(qs);
  }
  $("study").hidden=false;document.body.style.overflow="hidden";
  S.qi=0;S.answers=[];S.firstOk={};showQ();
}
// tách hai câu của cùng một từ ra xa nhau để không nhìn câu trước đoán câu sau
function spreadPairs(qs){const out=shuffle(qs);for(let i=1;i<out.length;i++)if(out[i].id===out[i-1].id){const j=out.findIndex((q,k)=>k>i&&q.id!==out[i].id&&(k+1>=out.length||out[k+1].id!==out[i].id));if(j>0)[out[i],out[j]]=[out[j],out[i]]}return out}
// v13: nhãn sau khi sai (khớp luật ở Ma.gs): từ đã quen (hộp ≥4) sai lần đầu chỉ tụt xuống hộp 2; sai nữa là từ trọng yếu về hộp 1

    GUNITS.forEach(u=>{const k="g"+u.n,p=progress[k];if(p&&p.wrong&&p.wrong.some(id=>fixed.has(id))){p.wrong=p.wrong.filter(id=>!fixed.has(id));call("saveLessonResult",{key:k,fix:true,wrong:p.wrong}).catch(()=>{})}});

   ${use?usageHTML(use):""}
   <div class="wrongs">${S.answers.filter(a=>!a.q.retry).map(a=>`<div ${isV?'style="grid-template-columns:auto 1fr auto"':""}><span style="color:${a.ok?"var(--ok)":"var(--bad)"}">${a.ok?"✓":"✗"}</span><span><b>${esc(a.q.type==="mcq"?a.q.opts[a.q.ans]:a.q.show)}</b> <span class="muted">${esc(a.q.ref?a.q.ref.vi:a.q.why||"")}</span>${isV&&!a.ok?` <span class="hardchip">${lapseNote(a.q.id)}</span>`:""}</span>${isV?`<button class="edit" data-wedit="${esc(a.q.id)}" aria-label="단어 수정">✎</button>`:""}</div>`).join("")}</div>
   <button class="btn primary" id="rv-done">완료</button>${fricBtn("review")}</div>`);
  FX.ring();if(total&&correct===total)FX.celebrate(.9,`<span class="fl">✅</span>전부 복습했어요`);

/* ================= Viết ================= */
function copiedFrom(prompt,text){
  // các đoạn ≥4 từ liền nhau chép nguyên từ đề
  const tok=s=>(s.toLowerCase().match(/[a-z0-9']+/g)||[]);
  const P=tok(prompt),A=tok(text);if(P.length<4||A.length<4)return {n:0,runs:[]};
  const grams=new Set();for(let i=0;i+4<=P.length;i++)grams.add(P.slice(i,i+4).join(" "));
  const cov=new Array(A.length).fill(false);
  for(let i=0;i+4<=A.length;i++)if(grams.has(A.slice(i,i+4).join(" ")))for(let j=i;j<i+4;j++)cov[j]=true;
  const runs=[];let s=-1;
  for(let i=0;i<=A.length;i++){if(i<A.length&&cov[i]){if(s<0)s=i}else if(s>=0){runs.push(A.slice(s,i).join(" "));s=-1}}
  return {n:cov.filter(Boolean).length,runs:runs.sort((a,b)=>b.length-a.length)};
}
function analyze(text,task,prompt){
  const T=TASKS[task];const t=text.trim();
  const wc=(t.match(/\S+/g)||[]).length;
  const paras=t.split(/\n+/).map(s=>s.trim()).filter(Boolean).length;
  const sents=t.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>/[a-z]/i.test(s));
  const lower=" "+t.toLowerCase().replace(/[^a-z0-9'\s-]/g," ").replace(/\s+/g," ")+" ";
  const has=(w)=>(lower.match(new RegExp("\\b"+reEsc(w)+"\\b","g"))||[]).length;
  const out=[];
  if(!wc)return out;
  const cp=copiedFrom(prompt||"",t), own=wc-cp.n;
  // chép đề
  if(prompt&&prompt.trim().length>20){
    const lim=task==="intro"?6:10;
    out.push(cp.n>=lim||(cp.runs[0]&&cp.runs[0].split(" ").length>=8)?{s:task==="intro"?"bad":"warn",t:`문제에서 그대로 옮긴 단어 ${cp.n}개`,d:`문제에서 그대로 옮긴 부분은 점수에 포함되지 않아요. 내 표현으로 바꿔 쓰세요: "${cp.runs.slice(0,2).join('", "')}"`}:{s:"ok",t:"문제 문구를 그대로 베끼지 않았어요"});
  }
  // số từ
  if(task!=="intro"){
    const lenNote=cp.n>=10?` (문제에서 베낀 ${cp.n}단어 제외: ${own})`:"";
    out.push(own<T.min?{s:"bad",t:`${wc}단어${lenNote}, 최소 단어 수 미달 · 기준: ${T.min}`,d:"최소 단어 수를 채우지 못하면 과제 수행(Task Response)에서 감점돼요. 문제에서 그대로 옮긴 단어는 세지 않아요."}:wc>T.max?{s:"warn",t:`${wc}단어, 필요 이상으로 길어요`,d:task==="task2"?"가장 좋은 분량은 260–300단어예요. 더 길게 써도 점수가 오르지 않고, 오류를 점검할 시간이 줄며 주제에서 벗어나기 쉬워요.":"더 길게 써도 점수는 오르지 않고, 실수할 위험만 커져요."}:{s:"ok",t:`${wc}단어${lenNote}, 분량 충분`});
  }else out.push(wc<25?{s:"warn",t:`${wc}단어, 조금 짧아요`,d:"서론은 2문장이 좋아요: 문제를 패러프레이즈하고 의견이나 답변 방향을 밝히세요."}:{s:"ok",t:`${wc}단어`});
  // gạch đầu dòng
  if(/^\s*([-•*–]|\d+[.)])\s+/m.test(t))out.push({s:"bad",t:"글머리 기호나 번호가 있어요",d:"IELTS 에세이는 이어지는 글이어야 해요. 글머리 기호는 감점돼요."});
  // đoạn
  const [pa,pb]=T.paras;
  out.push(paras>=pa&&paras<=pb?{s:"ok",t:`${paras}문단`}:{s:paras<=1&&pa>1?"bad":"warn",t:`${paras}문단, 권장: ${pa===pb?pa:pa+"–"+pb}`,d:task==="task2"?"서론, 본론 2개(3개도 가능), 결론으로 구성하세요. 문단을 나누지 않으면 일관성과 응집성(Coherence & Cohesion)이 최대 band 5예요.":task==="task1"?"서론, 개요(Overview), 세부 문단 1–2개.":"이 글은 문단이 1개뿐이에요."});
  // câu và độ chính xác
  const lens=sents.map(s=>(s.match(/\S+/g)||[]).length), avg=lens.length?Math.round(wc/lens.length):0, long=lens.filter(n=>n>35).length;
  const sub=sents.filter(s=>/\b(because|although|though|which|who|whom|whose|that|if|when|while|whereas|since|unless|so that)\b/i.test(s)).length;
  out.push(long?{s:"warn",t:`${long}개 문장이 너무 길어요 (35단어 초과)`,d:"긴 문장은 실수하기 쉬워요. 복잡한 문장보다 정확한 문장이 우선이에요. band 7에는 오류 없는 문장이 많이 필요해요."}:
    sub===0&&sents.length>=4?{s:"warn",t:`${sents.length}문장, 복문이 하나도 없어요`,d:"because, although, which, if 정도를 자연스럽게 쓰면 충분해요. 어려운 것보다 정확한 게 더 중요해요."}:
    {s:"ok",t:`${sents.length}문장, 평균 ${avg}단어/문장, ${sub}문장에 종속절 포함`});
  // từ nối
  const found=LINKERS.map(l=>({l,n:has(l)})).filter(x=>x.n);
  const over=found.filter(x=>x.n>=3);
  const starts=sents.filter(s=>LINKERS.some(l=>s.toLowerCase().startsWith(l+" ")||s.toLowerCase().startsWith(l+","))).length;
  if(sents.length>=6&&starts/sents.length>.6)out.push({s:"warn",t:`${starts}/${sents.length}문장이 연결어로 시작`,d:"거의 모든 문장을 연결어로 시작하면 기계적인 연결이 돼서 일관성과 응집성(Coherence & Cohesion)이 band 6에 머물러요. 일부는 빼고 생각이 자연스럽게 이어지게 하세요."});
  else if(over.length)out.push({s:"warn",t:`반복된 연결어: ${over.map(x=>`"${x.l}" ${x.n}회`).join(", ")}`,d:"연결어는 간단한 것만 필요할 때 쓰세요. 바꾸거나 일부 빼세요."});
  else if(found.length<2&&sents.length>=5)out.push({s:"warn",t:"연결어가 거의 없어요",d:"의미가 바뀌는 곳에 간단한 연결어를 넣으세요: however, for example, as a result."});
  else out.push({s:"ok",t:found.length?`적절한 연결어: ${found.slice(0,5).map(x=>x.l).join(", ")}`:"적절한 연결어"});
  // câu mẫu học thuộc, idiom, từ "sang" dễ dùng sai
  const tpl=["this essay will","in this day and age","it is undeniable that","every coin has two sides","double-edged sword","in a nutshell","last but not least","it goes without saying","kill two birds","tip of the iceberg","hotly debated","a hot topic","since time immemorial"].filter(w=>has(w));
  if(tpl.length)out.push({s:"warn",t:`외운 문장이나 관용구: ${tpl.map(x=>`"${x}"`).join(", ")}`,d:"채점관은 외운 문장에 점수를 주지 않고, 관용구(idiom)는 학술적인 글에 어울리지 않아요. 바로 핵심을 쓰세요."});
  const fancy=["elucidate","plethora","paradigm","dichotomy","myriad","ubiquitous","salient","posit","proliferation","quintessential","juxtapose"].filter(w=>has(w)||has(w+"s"));
  if(fancy.length)out.push({s:"warn",t:`고급 단어는 틀리기 쉬워요: ${fancy.join(", ")}`,d:"뜻을 100% 확신할 때만 쓰세요. 쉬운 단어를 정확히 쓰는 게 어려운 단어를 틀리게 쓰는 것보다 점수가 높아요."});
  // lặp từ (bỏ qua từ khóa trong đề)
  const pw=new Set((prompt||"").toLowerCase().match(/[a-z]+/g)||[]);
  const cnt={};(t.toLowerCase().match(/[a-z]+(?:-[a-z]+)*/g)||[]).forEach(w=>{if(w.length>3&&!STOP.has(w)&&!pw.has(w)&&!pw.has(w.replace(/s$/,"")))cnt[w]=(cnt[w]||0)+1});
  const rep=Object.entries(cnt).filter(([,n])=>n>=(task==="paragraph"?4:5)).sort((a,b)=>b[1]-a[1]).slice(0,4);
  if(rep.length)out.push({s:"warn",t:`많이 반복된 단어: ${rep.map(([w,n])=>`${w} (${n})`).join(", ")}`,d:"문제의 핵심어를 반복하는 건 괜찮아요. 100% 확신할 때만 유의어로 바꾸거나 it, this, they를 쓰세요."});
  // văn nói
  const inf=[];
  const ctr=(t.match(/\b\w+(n't|'re|'ve|'ll|'m|'d)\b|\b(it|that|there|what)'s\b/gi)||[]);if(ctr.length)inf.push(`축약형 (${[...new Set(ctr.map(x=>x.toLowerCase()))].slice(0,3).join(", ")})`);
  [["a lot of","many / much / a large number of"],["lots of","many / much"],["kids","children"],["stuff","things"],["gonna","going to"],["etc","빼거나 구체적인 예를 드세요"]].forEach(([w,s])=>{if(has(w))inf.push(`"${w}" → ${s}`)});
  const very=has("very");if(very>=3)inf.push(`"very" ${very}회`);
  out.push(inf.length?{s:"warn",t:"구어체 표현이 있어요",d:inf.join("; ")}:{s:"ok",t:"학술적 문체"});
  // theo dạng bài
  if(task==="task1"){
    if(!/\b(overall|in general|it is clear that|it can be seen that)\b/i.test(t))out.push({s:"bad",t:"개요 문장이 없어요",d:"Overview가 없으면 과제 수행(Task Response)이 최대 band 5예요. 주요 추세를 1–2개 쓰고 Overall로 시작하세요."});
    const nums=(t.match(/\d+(?:[.,]\d+)?\s?%?/g)||[]).length;
    if(nums<4)out.push({s:"bad",t:`수치가 ${nums}개뿐이에요`,d:"Task 1에서는 그래프의 구체적인 수치를 들어 주요 특징을 뒷받침해야 해요."});
    if(/\b(i think|i believe|in my opinion|because of)\b/i.test(t))out.push({s:"warn",t:"수치 외에 의견이나 설명이 들어 있어요",d:"Task 1은 데이터만 묘사하고, 의견을 쓰거나 원인을 추측하지 않아요."});
  }
  if(task==="task2"||task==="intro"){
    if(!/\b(i (strongly |partly |completely |fully )?(believe|think|agree|disagree|would argue|feel)|in my (opinion|view)|from my perspective|i am convinced|this essay (agrees|disagrees|argues))\b/i.test(t))out.push({s:"warn",t:"의견을 밝힌 문장이 없어요",d:"의견이 분명하지 않으면 과제 수행(Task Response)이 최대 band 5예요. 서론에서 바로 밝히고 결론까지 일관되게 유지하세요."});
  }
  if(task==="task2"&&!/\b(in conclusion|to conclude|to sum up|in summary|overall,)\b/i.test(t))out.push({s:"warn",t:"결론이 분명하지 않아요",d:"결론은 In conclusion으로 시작하고 의견을 다시 밝히세요."});
  return out;
}

/* ================= FX: phản hồi tức thì khi đúng/sai, chuỗi đúng liên tiếp, ăn mừng, chuỗi ngày học =================
   Nguyên tắc: phản hồi ngay (<100 ms), ngắn (<0,6 s), không chặn thao tác; âm thanh tự tổng hợp (không tải file);
   tôn trọng "giảm chuyển động" của hệ điều hành; tắt được âm thanh/rung trong cài đặt (bấm vào ô độ cao). */
const FX=(()=>{
  const RM=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
  const on=k=>ls.get("ielts-fx-"+k,"1")==="1";
  let ac=null,combo=0;
  function actx(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(ac.state==="suspended")ac.resume().catch(()=>{});return ac}
  function tone(f,t0,d,type,vol){const a=actx();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03)}
  const SND={
    ok:()=>{tone(880,0,.11);tone(1318.5,.07,.2)},
    soft:()=>tone(1046.5,0,.09,"sine",.05),
    bad:()=>{tone(233,0,.16,"triangle",.13);tone(174.6,.09,.24,"triangle",.11)},
    combo:()=>[0,1,2,3].forEach(i=>tone(784*Math.pow(1.189,i),i*.06,.14,"sine",.08)),
    win:()=>[523.3,659.3,784,1046.5,1318.5].forEach((f,i)=>tone(f,i*.085,.32,"sine",.08))
  };
  const sound=k=>{if(on("sound"))try{SND[k]()}catch(e){}};
  const buzz=p=>{if(on("vibe")&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};
  function anim(el,c){if(!el||RM())return;el.classList.remove(c);void el.offsetWidth;el.classList.add(c);el.addEventListener("animationend",()=>el.classList.remove(c),{once:true})}
  function float(el,text,good){
    if(!el||RM())return;const r=el.getBoundingClientRect();if(!r.width)return;
    const f=document.createElement("div");f.className="fx-float "+(good?"g":"b");f.textContent=text;
    f.style.left=Math.min(innerWidth-40,Math.max(40,r.left+r.width/2))+"px";f.style.top=Math.max(60,r.top)+"px";
    document.body.appendChild(f);setTimeout(()=>f.remove(),1100);
  }
  function banner(html){
    const b=document.createElement("div");b.className="fx-banner";b.innerHTML=html;document.body.appendChild(b);
    setTimeout(()=>b.classList.add("out"),1300);setTimeout(()=>b.remove(),1800);
  }
  const COMBO={3:"3문제 연속 정답",5:"5문제 연속, 리듬을 타고 있어요",8:"8문제 연속!",10:"10문제 연속, 대단해요",15:"15문제 연속 — 아무도 못 막아요",20:"20문제 연속!"};
  function ok(el,xpText){
    combo++;anim(el,"fx-pop");if(xpText)float(el,xpText,true);
    if(COMBO[combo]){sound("combo");buzz([12,40,12]);banner(`<span class="fl">🔥</span>${COMBO[combo]}`)}else{sound("ok");buzz(12)}
  }
  function bad(el,rightEl){combo=0;anim(el,"fx-shake");if(rightEl)anim(rightEl,"fx-glow");sound("bad");buzz([30,50,30])}
  function soft(el){anim(el,"fx-pop");sound("soft");buzz(8)}
  function reset(){combo=0}
  // pháo giấy: canvas tự vẽ, ~1,8 giây, tự dọn
  function confetti(power){
    if(RM())return;power=power||1;
    const c=document.createElement("canvas");c.className="fx-confetti";const dpr=Math.min(2,devicePixelRatio||1);
    c.width=innerWidth*dpr;c.height=innerHeight*dpr;document.body.appendChild(c);const x=c.getContext("2d");x.scale(dpr,dpr);
    const css=getComputedStyle(document.documentElement),cols=["--sun","--ok","--night-2","--bad","--sky"].map(v=>css.getPropertyValue(v).trim()||"#ffaf1f");
    const N=Math.round(110*power),P=[];
    for(let i=0;i<N;i++){const side=i%2;
      P.push({x:side?innerWidth+10:-10,y:innerHeight*(.55+Math.random()*.25),vx:(side?-1:1)*(4+Math.random()*9),vy:-(9+Math.random()*10),r:Math.random()*Math.PI,vr:(Math.random()-.5)*.35,w:6+Math.random()*6,h:8+Math.random()*8,c:cols[i%cols.length]})}
    const t0=performance.now();
    (function step(t){const k=(t-t0)/1800;x.clearRect(0,0,innerWidth,innerHeight);
      P.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.globalAlpha=Math.max(0,1-k*k);x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));x.restore()});
      if(k<1)requestAnimationFrame(step);else c.remove()})(t0);
  }
  function celebrate(power,msg){confetti(power);sound("win");buzz([20,60,20,60,40]);if(msg)banner(msg)}
  // đếm số tăng dần cho điểm/XP
  function countUp(el,to,ms,fmtFn){if(!el)return;fmtFn=fmtFn||(v=>String(Math.round(v)));if(RM()){el.textContent=fmtFn(to);return}
    const t0=performance.now();ms=ms||700;(function step(t){const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=fmtFn(to*e);if(k<1)requestAnimationFrame(step)})(t0)}
  // vòng điểm: vẽ từ 0 lên điểm thật
  function ring(){const c=document.querySelector(".score-ring circle:nth-of-type(2)");if(!c||RM())return;const full=c.getAttribute("stroke-dasharray"),to=c.getAttribute("stroke-dashoffset");if(!full||to==null)return;
    c.style.transition="none";c.style.strokeDashoffset=full;void c.getBoundingClientRect();c.style.transition="stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)";requestAnimationFrame(()=>{c.style.strokeDashoffset=to})}
  return {ok,bad,soft,reset,confetti,celebrate,countUp,ring,float,banner,sound,buzz,on};
})();

    setTimeout(()=>{const mk=document.querySelector(".score .mark b");if(mk)FX.countUp(mk,band,900,v=>(Math.round(v*2)/2).toFixed(1).replace(/\.0$/,""));

function loadPack(id){

function retryList(){
  const lim=addISO(todayISO,-7),out=[];
  Object.entries(rstats.latest||{}).forEach(([rid,v])=>{if(v.wrong&&v.wrong.length&&v.date<=lim)out.push({rid,...v})});

function parseKey(t){const out=[];String(t||"").split(/\n/).forEach(l=>{const m=l.trim().match(/^(?:q(?:uestion)?\s*)?(\d{1,2})\s*[.):\-–]?\s+(.+)$/i);if(m)out.push({n:+m[1],alts:m[2].split(/\s*(?:\/|\bOR\b|;)\s*/i).map(s=>s.trim()).filter(Boolean)})});return out}
const TFMAP={T:"TRUE",F:"FALSE",NG:"NOT GIVEN","NOT-GIVEN":"NOT GIVEN",NOTGIVEN:"NOT GIVEN",Y:"YES",N:"NO"};
function normAns(s){const x=String(s||"").trim().replace(/\s+/g," ").replace(/[’‘]/g,"'").replace(/^[\s"“']+|[\s.,;:!?"”']+$/g,"").toUpperCase();return TFMAP[x]||x}
function ansMatch(given,alts){const g=normAns(given);if(!g)return false;return alts.some(a=>{if(normAns(a)===g)return true;return g===normAns(a.replace(/\([^)]*\)/g," "))||g===normAns(a.replace(/[()]/g,""))})}
function ansType(alts){const A=alts.map(normAns);if(A.every(x=>["TRUE","FALSE","NOT GIVEN"].includes(x)))return "tf";if(A.every(x=>["YES","NO","NOT GIVEN"].includes(x)))return "yn";if(A.every(x=>/^[A-L]$/.test(x)))return "letter";if(A.every(x=>/^[IVX]+$/.test(x)))return "roman";return "text"}
const BAND40=[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[0,2.5]];
const band40=raw=>BAND40.find(([m])=>raw>=m)[1];

function customToPack(r){
  let ai={};try{ai=r.pack?JSON.parse(r.pack):{}}catch(e){}
  if(ai.paras&&ai.groups)return {...ai,id:r.id,title:r.title||ai.title,source:r.source,custom:true,r};
  const raw=r.passage.replace(/\r/g,"");const parts=(raw.split(/\n\s*\n/).length>1?raw.split(/\n\s*\n/):raw.split(/\n/)).map(x=>x.trim()).filter(Boolean);
  const paras=parts.map(p=>{const m=p.match(/^([A-J])[\.\):]?\s+([\s\S]*)$/);return m?{l:m[1],t:m[2].replace(/\s+/g," ")}:{l:"",t:p.replace(/\s+/g," ")}});
  const key=parseKey(r.key),answers={};key.forEach(k=>answers[k.n]=k.alts);
  const ns=key.map(k=>k.n);
  const groups=ns.length?[{type:"custom",from:Math.min(...ns),to:Math.max(...ns),instr:"",stem:"",options:[],items:key.map(k=>({n:k.n,q:""}))}]:[];
  return {id:r.id,title:r.title,source:r.source,custom:true,r,paras,groups,answers,expl:ai.expl||{},vocab:ai.vocab||[],questionsText:r.questions||""};
}

// tô từ: từ đã lưu (vàng) và chỗ mày tự tô (đậm, nền xanh) trong cùng một lượt thay thế
function markAll(html,words,marks){
  const all=[...new Set([...words,...marks])].filter(w=>w.length>1).sort((a,b)=>b.length-a.length);if(!all.length)return html;
  const W=new Set(words.map(w=>w.toLowerCase().replace(/\s+/g," "))),M=new Set(marks.map(w=>w.toLowerCase().replace(/\s+/g," ")));
  const re=new RegExp("("+all.map(w=>reEsc(esc(w)).replace(/\s+/g,"\\s+")).join("|")+")","gi");
  return html.replace(re,m=>{const k=m.toLowerCase().replace(/\s+/g," ").replace(/&amp;/g,"&").replace(/&#39;/g,"'").replace(/&quot;/g,'"');const cls=[W.has(k)?"rw":"",M.has(k)?"uhl":""].filter(Boolean).join(" ")||"rw";return `<mark class="${cls}"${M.has(k)?` data-uhl="${m}"`:""}>${m}</mark>`});
}
function markWords(html,words){if(!words.length)return html;const re=new RegExp("("+words.map(w=>reEsc(esc(w)).replace(/\s+/g,"\\s+")).join("|")+")","gi");return html.replace(re,'<mark class="rw">$1</mark>')}
function locate(t,q){if(!q)return -1;let i=t.indexOf(q);if(i>=0)return i;i=t.toLowerCase().indexOf(q.toLowerCase());if(i>=0)return i;const qq=q.replace(/[“”"]/g,'"').replace(/[‘’]/g,"'");return t.replace(/[“”"]/g,'"').replace(/[‘’]/g,"'").indexOf(qq)}
function passageHTML(){
  const p=RD.p,words=rWordsOf(p.id).map(v=>v.word).filter(w=>w.length>1).sort((a,b)=>b.length-a.length);

  if(RD.result&&(RD.showLoc||RD.hl!=null)){
    const ns=RD.hl!=null?[RD.hl]:rNums();
    ns.forEach(n=>{const e=(p.expl||{})[n];if(!e||!e.quote)return;p.paras.forEach((pa,pi)=>{if(marks[n])return;const i=locate(pa.t,e.quote);if(i>=0)marks[n]={pi,s:i,e:i+e.quote.length}})});
  }
  const vi=RD.vi&&p.vi&&p.vi.length;
  return p.paras.map((pa,pi)=>{
    if(pa.h)return `<h4 class="rh">${esc(pa.t)}</h4>`;
    const ms=Object.entries(marks).filter(([,m])=>m.pi===pi).sort((a,b)=>a[1].s-b[1].s);
    let html="",pos=0;
    const mk=RD.marks||[];
    ms.forEach(([n,m])=>{if(m.s<pos)return;html+=markAll(esc(pa.t.slice(pos,m.s)),words,mk)+`<mark class="qhl ${RD.hl==n?"on":""}" id="qhl-${n}"><sup>${n}</sup>${markAll(esc(pa.t.slice(m.s,m.e)),words,mk)}</mark>`;pos=m.e});
    html+=markAll(esc(pa.t.slice(pos)),words,mk);

    return `<p>${pa.l&&!pa.cont?`<b class="plbl">${pa.l}</b>`:""}${html}</p>${tr?`<p class="vi-tr">${esc(tr.t)}</p>`:""}`;
  }).join("");
}

function stemHTML(g,gi){

  const fx=str=>str.split(/(\[\d+\])/).map(pt=>/^\[\d+\]$/.test(pt)?pt:kwText("s"+gi,pt,kctr)).join("");
  let s=isTbl?'<div class="stbl-w"><table class="stbl">'+trs.map((r,ri)=>"<tr>"+r.split(" | ").map(c=>(ri?"<td>":"<th>")+fx(c.replace(/\//g,"/\u200b"))+(ri?"</td>":"</th>")).join("")+"</tr>").join("")+"</table></div>":fx(String(g.stem));
  return s.replace(/\[(\d+)\]/g,(m,k)=>{const n=+k;if(!nums.has(n))return `<span class="gap off">${n}</span>`;

}
function groupHTML(gi){
  const g=RD.p.groups[gi],nums=new Set(rNums());
  const items=(g.items||[]).filter(it=>nums.has(it.n));
  const stemGaps=g.stem&&/\[\d+\]/.test(g.stem);
  const showOpts=g.options&&g.options.length&&!(g.type==="mcq"&&!g.multi);
  let body="";
  if(g.multi){
    const k=Math.max(g.to-g.from+1,rMultiCorrect(g).length),chosen=RD.multi&&RD.multi[gi]||[];
    body=`<div class="hint">정답 ${k}개를 고르세요 (순서는 상관없어요).</div><span class="mopts">${g.options.map(o=>{const on=chosen.includes(o.k);const okk=RD.result&&rMultiCorrect(g).includes(o.k);return `<button type="button" class="mopt ${on?"on":""} ${RD.result?(okk?"good":on?"badc":""):""}" data-multi="${gi}" data-val="${esc(o.k)}" ${RD.result?"disabled":""}><b>${esc(o.k)}</b><span>${esc(o.t)}</span></button>`}).join("")}</span>
      ${[...Array(k)].map((_,i)=>resultLine(g.from+i)).join("")}`;
  }else{
    body=`${showOpts?`<div class="optlist">${g.options.map(o=>`<div><b>${esc(o.k)}</b><span>${kwText("o"+gi+o.k,o.t)}</span></div>`).join("")}</div>`:""}
      ${stemGaps?`<div class="stem">${stemHTML(g,gi)}</div>${items.length&&items.some(it=>it.q)?"":""}${[...nums].filter(n=>n>=g.from&&n<=g.to).map(n=>RD.result?`<div class="qi"><span class="an">${n}</span><div>${resultLine(n)}</div></div>`:"").join("")}`
       :items.map(it=>`<div class="qi ${RD.result?(RD.result.map[it.n]&&RD.result.map[it.n].ok?"ok":"no"):""}"><span class="an">${it.n}</span><div class="qb">${it.q?`<div class="qt">${kwText("q"+it.n,it.q)}</div>`:""}${itemCtrl(g,it.n,it)}${resultLine(it.n)}</div></div>`).join("")}`;
  }
  return `<section class="qg"><div class="qg-hd"><span class="tchip">${RTYPE_SHORT[g.type]||g.type}</span><b>Questions ${g.from}${g.to>g.from?"–"+g.to:""}</b>${RK[g.type]&&!(RD.exam&&!RD.result)?`<button class="linkbtn" data-rtip="${g.type}">팁</button>`:""}</div>
    ${g.instr?`<div class="instr">${kwText("i"+gi,g.instr)}</div>`:""}${g.stem&&!stemGaps?`<div class="stem">${kwText("s"+gi,g.stem)}</div>`:""}${body}</section>`;
}
function rMultiCorrect(g){const out=[];for(let n=g.from;n<=g.to;n++)(RD.p.answers[n]||[]).forEach(a=>out.push(normAns(a)));return [...new Set(out)]}

const hasExpl=()=>RD&&RD.p.expl&&Object.keys(RD.p.expl).length>0;

/* ---------- chấm ---------- */
function gradeReading(){
  const p=RD.p,nums=rNums(),map={},bytype={};
  RD.gsel.forEach(gi=>{const g=p.groups[gi];
    if(g.multi&&g.to-g.from+1<rMultiCorrect(g).length){const chosen=(RD.multi&&RD.multi[gi]||[]).map(normAns),corr=rMultiCorrect(g),all=chosen.length===corr.length&&corr.every(c=>chosen.includes(c));for(let n=g.from;n<=g.to;n++){if(nums.includes(n))map[n]={ok:all,given:(RD.multi&&RD.multi[gi]||[]).join(",")}}}
    else if(g.multi){const chosen=(RD.multi&&RD.multi[gi]||[]).map(normAns),corr=rMultiCorrect(g),hits=chosen.filter(c=>corr.includes(c));let k=0;
      for(let n=g.from;n<=g.to;n++){if(!nums.includes(n))continue;const ok=k<hits.length;k++;map[n]={ok,given:(RD.multi&&RD.multi[gi]||[]).join(",")};}
    }else for(let n=g.from;n<=g.to;n++){if(!nums.includes(n))continue;const given=RD.answers[n]||"";map[n]={ok:ansMatch(given,p.answers[n]||[]),given}}
    for(let n=g.from;n<=g.to;n++){if(!map[n])continue;const t=g.type==="custom"?"custom":(isL()?"L-":"")+g.type;bytype[t]=bytype[t]||[0,0];bytype[t][1]++;if(map[n].ok)bytype[t][0]++}
  });
  const score=Object.values(map).filter(x=>x.ok).length,total=Object.keys(map).length,pct=Math.round(score/Math.max(1,total)*100);
  const minutes=String(Math.max(1,Math.round((Date.now()-RD.start)/60000)));
  RD.result={map,score,total,pct,bytype};RD.pane="q";
  const wrong=Object.entries(map).filter(([,v])=>!v.ok).map(([n])=>+n);
  // cập nhật ngay trên máy
  Object.entries(bytype).forEach(([t,[c,n]])=>{if(t==="custom"||t.startsWith("L-"))return;const v=rstats.byType[t]||[0,0];rstats.byType[t]=[v[0]+c,v[1]+n]});
  RD.gsel.forEach(gi=>{const g=p.groups[gi];rstats.groupsDone.push(p.id+":"+g.from+"-"+g.to)});
  if(RD.mode==="full")rstats.latest[p.id]={date:todayISO,wrong,score,total};
  if(RD.mode==="retry"&&rstats.latest[p.id])rstats.latest[p.id]={...rstats.latest[p.id],date:todayISO,wrong};
  if(RD.mode==="full"&&!p.custom){const pr=progress["r:"+p.id];progress["r:"+p.id]={status:"tried",best:Math.max(pct,pr?pr.best:0),attempts:(pr?pr.attempts:0)+1,wrong,updated:todayISO}}
  drawReading();$("study").scrollTop=0;const sd=document.querySelector(".rd-side");if(sd)sd.scrollTop=0;
  {const mk=document.querySelector(".rd-res .mark b");if(mk)FX.countUp(mk,score,800,v=>Math.round(v)+"/"+total);
   document.querySelectorAll(".rd-q .ares .chip").forEach((c,i)=>{c.style.animationDelay=Math.min(i*40,1200)+"ms";c.classList.add("fx-in")});
   if(total>=5&&pct>=80)FX.celebrate(pct===100?1.3:1,pct===100?`<span class="fl">💯</span>틀린 문제 없음`:`<span class="fl">🎯</span>${pct}% — 아주 좋아요`);else if(pct>=60)FX.sound("ok");else FX.sound("soft")}
  const detail={mode:RD.mode,exam:!!RD.exam,kind:isL()?"listening":"reading",answers:RD.answers,wrong,bytype,groups:RD.gsel.map(gi=>p.groups[gi].from+"-"+p.groups[gi].to)};
  if(RD.mode==="full"&&typeof planAutoTick==="function")planAutoTick(p.id);
  if(LP&&RD.exam){const A=LP.el.querySelector("audio");if(A)A.pause();LP.el.innerHTML="";lpDraw()} // mở khoá tua sau khi nộp
  const me=RD;
  save("saveReadingAttempt",{eid:RD.eid,rid:p.id,score,total,minutes,detail}).then(r=>{applyR(r);me.attemptId=r.id;me.earn=earnTxt(r);renderShell();if(RD===me)drawReading(true);if(r.earned)FX.float($("rd-time")||document.body,"+"+r.earned+" m",true)}).catch(()=>{me.earn="저장 안 됨, 자동으로 다시 보낼게요";if(RD===me)drawReading(true)});
}
function locateQ(n){
  RD.hl=+n;RD.showLoc=false;
