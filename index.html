ood work-life balance","ex":["Flexible hours help parents achieve a better work-life balance.","Young workers increasingly value work-life balance over high pay."],"syn":"balance between work and personal life"},{"w":"colleague","pos":"명사","ipa":"/ˈkɒliːɡ/","vi":"직장 동료","use":"가산명사; work closely with + colleagues","ex":["I often discuss new ideas with my colleagues over lunch.","Good relationships with colleagues make stressful jobs more bearable."],"syn":"co-worker"},{"w":"apply for","pos":"동사구","ipa":"/əˈplaɪ fə/","vi":"~에 지원하다","use":"+ N; apply for a job / position / scholarship","ex":["Hundreds of graduates apply for every job at large companies.","She applied for a research position in Seoul last year."],"syn":"seek"},{"w":"part-time job","pos":"명사구","ipa":"/ˌpɑːt taɪm ˈdʒɒb/","vi":"시간제 일자리, 아르바이트","use":"가산명사; have / take + a part-time job","ex":["Many university students take a part-time job to cover their living costs.","A part-time job teaches teenagers responsibility and time management."],"syn":"casual work"},{"w":"unemployment","pos":"명사","ipa":"/ˌʌnɪmˈplɔɪmənt/","vi":"실업","use":"불가산명사; youth unemployment, the unemployment rate","ex":["Youth unemployment remains a serious problem in many countries.","Long periods of unemployment can damage a person's self-confidence."],"syn":"joblessness"},{"w":"job security","pos":"명사구","ipa":"/ˈdʒɒb sɪˌkjʊərəti/","vi":"고용 안정성","use":"불가산명사; offer / lack + job security","ex":["Government jobs are popular because they offer greater job security.","Many young people today have little job security and few benefits."],"syn":"job stability"},{"w":"promotion","pos":"명사","ipa":"/prəˈməʊʃn/","vi":"승진","use":"가산명사; get / earn + a promotion","ex":["He worked hard for three years before he finally got a promotion.","Promotion should be based on performance rather than on age."],"syn":"advancement"},{"w":"working conditions","pos":"명사구","ipa":"/ˈwɜːkɪŋ kənˌdɪʃnz/","vi":"근무 환경","use":"복수형; improve / poor + working conditions","ex":["Trade unions campaign to improve working conditions in factories.","Poor working conditions are a major reason why nurses leave the profession."],"syn":"work environment"},{"w":"qualification","pos":"명사","ipa":"/ˌkwɒlɪfɪˈkeɪʃn/","vi":"자격, 학력","use":"가산명사; have / gain + qualifications","ex":["Many jobs now require a university qualification even for basic tasks.","Practical experience is sometimes more valuable than formal qualifications."],"syn":"credential"},{"w":"take on","pos":"동사구","ipa":"/ˌteɪk ˈɒn/","vi":"떠맡다","use":"+ N; take on responsibility / extra work","ex":["Junior staff should be encouraged to take on more responsibility.","She agreed to take on the project despite her heavy workload."],"syn":"accept"},{"w":"employer","pos":"명사","ipa":"/ɪmˈplɔɪə/","vi":"고용주, 채용 담당자","use":"가산명사; employers look for / value + skills","ex":["Employers increasingly look for communication skills as well as knowledge.","A good employer invests in training and staff development."],"syn":"company"},{"w":"work from home","pos":"동사구","ipa":"/ˌwɜːk frəm ˈhəʊm/","vi":"재택근무를 하다","use":"자동사; be allowed to work from home","ex":["Since the pandemic, many companies have allowed staff to work from home.","Working from home saves commuting time but can feel isolating."],"syn":"work remotely"},{"w":"meet a deadline","pos":"동사구","ipa":"/ˌmiːt ə ˈdedlaɪn/","vi":"마감 기한을 지키다","use":"타동사; meet / miss + a deadline","ex":["Researchers often work late at night to meet a deadline.","Failing to meet a deadline can damage a company's reputation."],"syn":"finish on time"},{"w":"flexible working hours","pos":"명사구","ipa":"/ˌfleksəbl ˈwɜːkɪŋ ˌaʊəz/","vi":"유연 근무 시간","use":"복수형; offer / introduce + flexible working hours","ex":["Flexible working hours allow parents to collect their children from school.","More firms now offer flexible working hours to attract talented staff."],"syn":"flexitime"},{"w":"teamwork","pos":"명사","ipa":"/ˈtiːmwɜːk/","vi":"팀워크, 협업","use":"불가산명사; good teamwork, encourage teamwork kers could be laid off if the factory closes.","Older staff are often the first to be laid off during a crisis."],"syn":"be dismissed"},{"w":"productivity","pos":"명사","ipa":"/ˌprɒdʌkˈtɪvəti/","vi":"생산성","use":"불가산명사; increase / boost + productivity","ex":["A comfortable office can significantly increase employee productivity.","Some studies show that shorter working weeks do not reduce productivity."],"syn":"efficiency"},{"w":"step down","pos":"동사구","ipa":"/ˌstep ˈdaʊn/","vi":"사임하다, 물러나다","use":"자동사; step down as / from + 직책","ex":["The director decided to step down after the financial scandal.","Many leaders step down to make room for younger talent."],"syn":"resign"},{"w":"on-the-job training","pos":"명사구","ipa":"/ˌɒn ðə ˌdʒɒb ˈtreɪnɪŋ/","vi":"현장 직무 교육","use":"불가산명사; provide / receive + on-the-job training","ex":["New employees receive three months of on-the-job training.","On-the-job training is often more useful than classroom lessons."],"syn":"workplace training"},{"w":"hands-on experience","pos":"명사구","ipa":"/ˌhændz ɒn ɪkˈspɪəriəns/","vi":"실무 경험","use":"불가산명사; gain / lack + hands-on experience (experiences ✗)","ex":["Internships give students valuable hands-on experience in real workplaces.","Many graduates lack the hands-on experience that employers expect."],"syn":"practical experience"},{"w":"climb the career ladder","pos":"동사구","ipa":"/ˌklaɪm ðə kəˈrɪə ˌlædə/","vi":"직장에서 승진해 올라가다","use":"자동사; climb the career ladder quickly / slowly","ex":["Women still face more obstacles when they try to climb the career ladder.","Some employees climb the career ladder by changing companies every few years."],"syn":"get promoted"},{"w":"self-employed","pos":"형용사","ipa":"/ˌself ɪmˈplɔɪd/","vi":"자영업을 하는","use":"be self-employed; self-employed workers","ex":["Being self-employed gives people freedom but less financial security.","The number of self-employed designers has grown rapidly online."],"syn":"freelance"},{"w":"retirement age","pos":"명사구","ipa":"/rɪˈtaɪəmənt eɪdʒ/","v ":"be noticed among"},{"w":"glass ceiling","pos":"명사구","ipa":"/ˌɡlɑːs ˈsiːlɪŋ/","vi":"유리 천장 (승진을 막는 보이지 않는 장벽)","use":"가산명사; break / hit + the glass ceiling","ex":["Few women have managed to break the glass ceiling in finance.","The glass ceiling still prevents many talented people from reaching top positions."],"syn":"invisible barrier"},{"w":"pursue a career in","pos":"동사구","ipa":"/pəˌsjuː ə kəˈrɪər ɪn/","vi":"~ 분야에서 경력을 쌓다","use":"+ 분야; pursue a career in medicine / science","ex":["I would like to pursue a career in materials engineering.","More young women now pursue a career in science and technology."],"syn":"work in"}]},{"id":"v06","en":"Economy & Business","vi":"경제와 경영","desc":"경제 성장, 시장, 기업, 금융과 관련된 어휘예요.","words":[{"w":"economic growth","pos":"명사구","ipa":"/ˌiːkəˌnɒmɪk ˈɡrəʊθ/","vi":"경제 성장","use":"불가산명사; promote / achieve + economic growth","ex":["Korea has enjoyed rapid economic growth since the 1960s.","Investment in education is a key driver of economic growth."],"syn":"development of the economy"},{"w":"income","pos":"명사","ipa":"/ˈɪnkʌm/","vi":"소득","use":"가산/불가산 모두 가능; low-income families, a source of income","ex":["Low-income families spend a large share of their income on food.","Tourism is the main source of income for many island communities."],"syn":"earnings"},{"w":"cost of living","pos":"명사구","ipa":"/ˌkɒst əv ˈlɪvɪŋ/","vi":"생활비","use":"불가산명사; the rising cost of living","ex":["The rising cost of living is forcing young people to delay marriage.","Seoul has a much higher cost of living than smaller cities."],"syn":"living expenses"},{"w":"consumer","pos":"명사","ipa":"/kənˈsjuːmə/","vi":"소비자","use":"가산명사; consumer demand / consumer spending","ex":["Consumers are becoming more aware of where their products come from.","Lower prices benefit consumers but can hurt local producers."],"syn":"buyer"},{"w":"profit","pos":"명사","ipa":"/ˈprɒfɪt/","vi":"이익, 수익","use":"가산명사; make / earn + a profit","ex":["Most new restaurants fail to make a profit in their first mpany launched an expensive advertising campaign to attract young buyers.","A clever advertising campaign can change how consumers see a brand."],"syn":"marketing campaign"},{"w":"go out of business","pos":"동사구","ipa":"/ˌɡəʊ aʊt əv ˈbɪznəs/","vi":"폐업하다, 망하다","use":"자동사; shops / firms + go out of business","ex":["Many local shops go out of business when large supermarkets open nearby.","Without government support, thousands of firms may go out of business."],"syn":"close down"},{"w":"fierce competition","pos":"명사구","ipa":"/ˌfɪəs ˌkɒmpəˈtɪʃn/","vi":"치열한 경쟁","use":"불가산명사; face fierce competition from + N","ex":["Local manufacturers face fierce competition from cheap foreign imports.","Fierce competition between airlines has made flying much cheaper."],"syn":"strong rivalry"},{"w":"set up","pos":"동사구","ipa":"/ˌset ˈʌp/","vi":"설립하다","use":"+ N; set up a business / company","ex":["It is now easier than ever to set up an online business.","She set up her own consulting firm after ten years in industry."],"syn":"start"},{"w":"entrepreneur","pos":"명사","ipa":"/ˌɒntrəprəˈnɜː/","vi":"창업가","use":"가산명사; young / successful + entrepreneurs","ex":["Young entrepreneurs often struggle to find enough start-up capital.","The government offers tax breaks to encourage new entrepreneurs."],"syn":"business founder"},{"w":"purchasing power","pos":"명사구","ipa":"/ˈpɜːtʃəsɪŋ ˌpaʊə/","vi":"구매력","use":"불가산명사; reduce / increase + purchasing power","ex":["Inflation steadily reduces the purchasing power of ordinary workers.","Rising wages have increased the purchasing power of the middle class."],"syn":"buying power"},{"w":"wealth gap","pos":"명사구","ipa":"/ˈwelθ ɡæp/","vi":"빈부 격차","use":"가산명사; widen / narrow + the wealth gap","ex":["Rapid industrialisation has widened the wealth gap in some countries.","Higher taxes on the rich could help narrow the wealth gap."],"syn":"inequality between rich and poor"},{"w":"multinational company","pos":"명사구","ipa":"/ˌmʌltiˌnæʃnəl ˈkʌmpəni/","vi":"다국적 기업","use":"가산명 əreɪt ˈrevənjuː/","vi":"수익을 창출하다","use":"타동사; generate revenue from / through + N","ex":["Tourism generates significant revenue for the local economy every year.","Most social media platforms generate revenue mainly through advertising."],"syn":"earn income"},{"w":"free trade","pos":"명사구","ipa":"/ˌfriː ˈtreɪd/","vi":"자유 무역","use":"불가산명사; a free trade agreement","ex":["Free trade agreements have boosted exports between Korea and Vietnam.","Supporters claim that free trade lowers prices for consumers."],"syn":"open trade"},{"w":"government funding","pos":"명사구","ipa":"/ˌɡʌvənmənt ˈfʌndɪŋ/","vi":"정부 지원금","use":"불가산명사; receive / cut + government funding","ex":["Many scientific research projects depend entirely on government funding.","Cuts in government funding have forced some universities to raise fees."],"syn":"state funding"},{"w":"economic downturn","pos":"명사구","ipa":"/ˌiːkəˌnɒmɪk ˈdaʊntɜːn/","vi":"경기 침체, 경기 하강","use":"가산명사; during / survive + an economic downturn","ex":["Luxury brands often suffer most during an economic downturn.","Small firms find it hard to survive a prolonged economic downturn."],"syn":"slowdown"},{"w":"subsidy","pos":"명사","ipa":"/ˈsʌbsədi/","vi":"보조금","use":"가산명사; government subsidies for + N","ex":["Farmers in many countries rely on government subsidies to survive.","Subsidies for solar panels have made clean energy more affordable."],"syn":"financial support"},{"w":"materialistic","pos":"형용사","ipa":"/məˌtɪəriəˈlɪstɪk/","vi":"물질주의적인","use":"materialistic society / values; become materialistic","ex":["Some critics believe modern society has become too materialistic.","Constant advertising may encourage children to become more materialistic."],"syn":"focused on possessions"},{"w":"break even","pos":"동사구","ipa":"/ˌbreɪk ˈiːvn/","vi":"손익분기점에 이르다","use":"자동사; expect to break even within + 기간","ex":["Most start-ups do not break even until their third year.","The new factory is expected to break even within five years."],"syn":"cover costs"},{"w":"fluctuate","pos":"동사","ipa":"/ˈflʌktʃueɪt/","vi":"변동하다, 오르내리다","use":"자동사; prices / demand + fluctuate","ex":["Oil prices fluctuate widely depending on global demand.","Exchange rates can fluctuate sharply during periods of political crisis."],"syn":"vary"},{"w":"allocate resources","pos":"동사구","ipa":"/ˌæləkeɪt rɪˈzɔːsɪz/","vi":"자원을 배분하다","use":"타동사; allocate resources to + N","ex":["Governments must allocate resources fairly between cities and rural areas.","Companies that allocate resources to research tend to innovate faster."],"syn":"distribute resources"},{"w":"lucrative","pos":"형용사","ipa":"/ˈluːkrətɪv/","vi":"수익성이 매우 높은","use":"a lucrative business / market / career","ex":["Online education has become a lucrative business across Asia.","Many graduates choose lucrative careers in finance over research."],"syn":"profitable"},{"w":"monopoly","pos":"명사","ipa":"/məˈnɒpəli/","vi":"독점","use":"가산명사; have a monopoly on / over + N","ex":["A single company should not have a monopoly on public transport.","Monopolies can charge high prices because consumers have no alternative."],"syn":"total control of a market"},{"w":"drive up prices","pos":"동사구","ipa":"/ˌdraɪv ʌp ˈpraɪsɪz/","vi":"가격을 끌어올리다","use":"타동사; drive up prices of / in + N","ex":["Foreign investors have driven up prices in the housing market.","Shortages of raw materials drive up prices for manufacturers."],"syn":"push up prices"},{"w":"labour shortage","pos":"명사구","ipa":"/ˈleɪbə ˌʃɔːtɪdʒ/","vi":"노동력 부족","use":"가산명사; face / ease + a labour shortage","ex":["Korea faces a growing labour shortage due to its ageing population.","Hiring foreign workers can help ease the labour shortage in farming."],"syn":"lack of workers"},{"w":"e-commerce","pos":"명사","ipa":"/ˌiː ˈkɒmɜːs/","vi":"전자상거래","use":"불가산명사; the growth of e-commerce, e-commerce platforms","ex":["The rapid growth of e-commerce has hurt traditional shopping malls.","Small sellers can reach global customers through e-commerce platforms."],"syn":"online shopping"},{"w":"outsource","pos":"동사","ipa":"/ˈaʊtsɔːs/","vi":"외주를 주다","use":"타동사; outsource production / jobs to + 장소","ex":["Many tech firms outsource customer service to other countries.","Outsourcing production can lower costs but damage product quality."],"syn":"contract out"}]},{"id":"v07","en":"Cities, Housing & Transport","vi":"도시, 주거, 교통","desc":"도시 생활, 주거, 교통, 도시 계획과 관련된 어휘예요.","words":[{"w":"public transport","pos":"명사구","ipa":"/ˌpʌblɪk ˈtrænspɔːt/","vi":"대중교통","use":"불가산명사; use / rely on / invest in + public transport (a public transport ✗)","ex":["Many young people in Seoul use public transport instead of buying a car.","The government should invest more in public transport to reduce car use."],"syn":"mass transit"},{"w":"traffic congestion","pos":"명사구","ipa":"/ˈtræfɪk kənˌdʒestʃən/","vi":"교통 체증","use":"불가산명사; ease / reduce / tackle + traffic congestion","ex":["Traffic congestion wastes millions of working hours in large cities every year.","Building more roads rarely solves traffic congestion in the long term."],"syn":"traffic jams"},{"w":"urban","pos":"형용사","ipa":"/ˈɜːbən/","vi":"도시의","use":"명사 앞에 씀; urban areas / urban life / urban planning","ex":["Urban areas usually offer better job opportunities than the countryside.","Urban life can be exciting, but it is often stressful and expensive."],"syn":"city"},{"w":"rural","pos":"형용사","ipa":"/ˈrʊərəl/","vi":"농촌의","use":"명사 앞에 씀; rural areas / rural communities","ex":["Young people are leaving rural areas to look for work in cities.","Improving internet access could make rural communities more attractive to families."],"syn":"country"},{"w":"commute","pos":"동사","ipa":"/kəˈmjuːt/","vi":"통근하다","use":"자동사; commute to work / commute by train (※ commute to the work ✗)","ex":["Thousands of workers commute to the capital by train every morning.","People who commute long distances often have less time for their families."],"syn":"travel to work"},{"w":"affordable housing","pos":"명사구","ipa":"/əˌfɔːdəbl ˈhaʊzɪŋ/","vi":"저렴한 주택","use":"불가산명사; build / provide + affordable housing; a lack of + N","ex":["There is a serious lack of affordable housing for young couples in big cities.","Local councils should build more affordable housing near public transport links."],"syn":"low-cost homes"},{"w":"pedestrian","pos":"명사","ipa":"/pəˈdestriən/","vi":"보행자","use":"가산명사; pedestrian safety / pedestrian zone (형용사처럼 쓰임)","ex":["Several streets in the old town are now open only to pedestrians.","Wider pavements would greatly improve pedestrian safety on busy roads."],"syn":"walker"},{"w":"rush hour","pos":"명사구","ipa":"/ˈrʌʃ aʊə/","vi":"출퇴근 혼잡 시간대","use":"불가산명사; during / at + rush hour; rush-hour traffic","ex":["Trains are extremely crowded during rush hour, especially in the morning.","Flexible working hours could help reduce traffic at rush hour."],"syn":"peak time"},{"w":"infrastructure","pos":"명사","ipa":"/ˈɪnfrəstrʌktʃə/","vi":"기반 시설, 인프라","use":"불가산명사; invest in / improve + (transport) infrastructure","ex":["Rapid population growth has put great pressure on the city's infrastructure.","Developing countries need to invest heavily in transport infrastructure."],"syn":"basic facilities"},{"w":"overcrowded","pos":"형용사","ipa":"/ˌəʊvəˈkraʊdɪd/","vi":"지나치게 붐비는","use":"형용사; overcrowded cities / buses / housing","ex":["Many capital cities have become overcrowded, noisy and polluted.","Overcrowded buses make commuting an unpleasant experience for passengers."],"syn":"too crowded"},{"w":"cost of living","pos":"명사구","ipa":"/ˌkɒst əv ˈlɪvɪŋ/","vi":"생활비","use":"보통 the와 함께 씀; the rising / high + cost of living","ex":["The high cost of living in big cities forces many families to move away.","Wages have not kept up with the rising cost of living."],"syn":"living expenses"},{"w":"city dweller","pos":"명사구","ipa":"/ˈsɪti ˌdwelə/","vi":"도시 거주자","use":"가산명사, 주로 복수형; city dwellers + tend to / often + V","ex":["Most city dwellers live in small apartments with little outdoor space.","City dwellers often depend on cafés and parks to meet friends."],"syn":"urban resident"},{"w":"private car","pos":"명사구","ipa":"/ˌpraɪvət ˈkɑː/","vi":"자가용","use":"가산명사; reliance on / own + a private car","ex":["Reliance on the private car leads to traffic jams and air pollution.","Fewer people would own a private car if buses were more reliable."],"syn":"personal vehicle"},{"w":"housing shortage","pos":"명사구","ipa":"/ˈhaʊzɪŋ ˌʃɔːtɪdʒ/","vi":"주택 부족","use":"가산명사; a severe / serious + housing shortage","ex":["A severe housing shortage has pushed rents to record levels.","The housing shortage is worst in areas with many universities and offices."],"syn":"lack of homes"},{"w":"property prices","pos":"명사구","ipa":"/ˈprɒpəti ˌpraɪsɪz/","vi":"부동산 가격","use":"복수형; property prices + rise / soar / fall","ex":["Property prices in the capital have doubled over the past decade.","Rising property prices make it difficult for young people to buy a home."],"syn":"house prices"},{"w":"get around","pos":"동사구","ipa":"/ˌɡet əˈraʊnd/","vi":"이동하다, 돌아다니다","use":"자동사; get around + the city / by bike","ex":["Bicycles are a cheap and healthy way to get around the city.","Elderly residents without cars often find it hard to get around."],"syn":"travel around"},{"w":"cut down on","pos":"동사구","ipa":"/ˌkʌt ˈdaʊn ɒn/","vi":"줄이다","use":"cut down on + N/V-ing; cut down on car journeys / costs","ex":["Cities should encourage residents to cut down on unnecessary car journeys.","Working from home can help employees cut down on travel costs."],"syn":"reduce"},{"w":"rely on","pos":"동사구","ipa":"/rɪˈlaɪ ɒn/","vi":"~에 의존하다","use":"rely on + N; rely on cars / public services","ex":["Many families in the suburbs rely on cars for almost every trip.","Commuters in rural areas cannot rely on infrequent bus services."],"syn":"depend on"},{"w":"residential area","pos":"명사구","ipa":"/ˌrezɪˈdenʃl ˈeəriə/","vi":"주거 지역","use":"가산명사; quiet residential areas; pass through + residential areas","ex":["Heavy lorries should not be allowed to pass through residential areas.","Quiet residential areas with good schools attract many young families."],"syn":"neighbourhood"},{"w":"suburb","pos":"명사","ipa":"/ˈsʌbɜːb/","vi":"교외","use":"가산명사; live in / move to + the suburbs","ex":["More families are moving to the suburbs in search of larger homes.","Living in a suburb usually means a longer journey to work."],"syn":"outskirts"},{"w":"cycle lane","pos":"명사구","ipa":"/ˈsaɪkl leɪn/","vi":"자전거 전용 차로","use":"가산명사; build / add + cycle lanes; protected cycle lanes","ex":["Protected cycle lanes encourage more people to ride bicycles to work.","The council plans to add cycle lanes along all major roads."],"syn":"bike lane"},{"w":"exhaust fumes","pos":"명사구","ipa":"/ɪɡˈzɔːst fjuːmz/","vi":"자동차 배기가스","use":"복수형; exhaust fumes from + vehicles; exposure to + exhaust fumes","ex":["Exhaust fumes from cars and buses are a major cause of breathing problems.","Children walking to school are exposed to high levels of exhaust fumes."],"syn":"vehicle emissions"},{"w":"urbanisation","pos":"명사","ipa":"/ˌɜːbənaɪˈzeɪʃn/","vi":"도시화","use":"불가산명사; rapid urbanisation (미국식: urbanization)","ex":["Rapid urbanisation has created huge challenges for housing and transport.","Urbanisation in Asia has lifted millions of people out of poverty."],"syn":"growth of cities"},{"w":"upgrade","pos":"동사","ipa":"/ˌʌpˈɡreɪd/","vi":"개선하다, 업그레이드하다","use":"타동사; upgrade + roads / the rail network","ex":["The government plans to upgrade the rail network over the next decade.","Upgrading old bus fleets to electric models would cut pollution significantly."],"syn":"improve"},{"w":"accessible","pos":"형용사","ipa":"/əkˈsesəbl/","vi":"접근하기 쉬운","use":"accessible to + 사람; accessible by + 교통수단","ex":["Public buildings should be fully accessible to people in wheelchairs.","New housing estates must be accessible by public transport."],"syn":"easy to reach"},{"w":"relocate","pos":"동사","ipa":"/ˌriːləʊˈkeɪt/","vi":"이전하다, 이주하다","use":"relocate (sth) to / from + 장소; relocate offices / businesses","ex":["Several companies have relocated their offices from the capital to smaller cities.","Encouraging businesses to relocate could reduce pressure on overcrowded cities."],"syn":"move"},{"w":"within walking distance","pos":"전치사구","ipa":"/wɪˌðɪn ˈwɔːkɪŋ ˌdɪstəns/","vi":"걸어서 갈 수 있는 거리에","use":"전치사구; within walking distance of + 장소","ex":["Ideally, shops and schools should be within walking distance of every home.","I prefer to live within walking distance of a subway station."],"syn":"close by"},{"w":"pull down","pos":"동사구","ipa":"/ˌpʊl ˈdaʊn/","vi":"철거하다 (건물)","use":"pull down + 건물 (= demolish); 주로 수동태로 써요","ex":["Many historic buildings were pulled down to make way for shopping centres.","Instead of pulling down old factories, cities can turn them into apartments."],"syn":"demolish"},{"w":"urban sprawl","pos":"명사구","ipa":"/ˌɜːbən ˈsprɔːl/","vi":"도시의 무계획적 확산","use":"불가산명사; limit / control + urban sprawl","ex":["Urban sprawl increases car dependence because homes are far from workplaces.","Strict planning laws can help limit urban sprawl and protect farmland."],"syn":"spread of cities"},{"w":"urban regeneration","pos":"명사구","ipa":"/ˌɜːbən rɪˌdʒenəˈreɪʃn/","vi":"도시 재생","use":"불가산명사; urban regeneration project / scheme","ex":["Urban regeneration has transformed the old port into a lively neighbourhood.","The project combines urban regeneration with new affordable homes for local people."],"syn":"city renewal"},{"w":"gentrification","pos":"명사","ipa":"/ˌdʒentrɪfɪˈkeɪʃn/","vi":"젠트리피케이션 (동네가 고급화되며 집값이 오르는 현상)","use":"불가산명사; gentrification pushes out + residents","ex":["Gentrification often pushes long-term residents out of their own neighbourhoods.","Critics argue that gentrification benefits investors more than local communities."],"syn":"neighbourhood upgrading"},{"w":"drive up","pos":"동사구","ipa":"/ˌdraɪv ˈʌp/","vi":"(가격을) 끌어올리다","use":"drive up + prices / rents / costs","ex":["Foreign investment in property is driving up house prices in the capital.","Short-term holiday rentals drive up rents for local residents."],"syn":"push up"},{"w":"alleviate","pos":"동사","ipa":"/əˈliːvieɪt/","vi":"완화하다","use":"타동사; alleviate + congestion / overcrowding","ex":["Building a new metro line would alleviate congestion in the city centre.","Remote working may help alleviate overcrowding on morning trains."],"syn":"ease"},{"w":"densely populated","pos":"형용사구","ipa":"/ˌdensli ˈpɒpjuleɪtɪd/","vi":"인구 밀도가 높은","use":"형용사구; a densely populated + city / area / country","ex":["Seoul is one of the most densely populated cities in the developed world.","Diseases can spread quickly in densely populated areas with poor sanitation."],"syn":"crowded"},{"w":"impose a congestion charge","pos":"동사구","ipa":"/ɪmˌpəʊz ə kənˈdʒestʃən tʃɑːdʒ/","vi":"혼잡 통행료를 부과하다","use":"impose a congestion charge on + drivers / vehicles","ex":["London decided to impose a congestion charge on drivers entering the centre.","Imposing a congestion charge can reduce traffic and raise money for buses."],"syn":"charge drivers to enter"},{"w":"prioritise","pos":"동사","ipa":"/praɪˈɒrətaɪz/","vi":"우선시하다","use":"prioritise + A over B (미국식: prioritize)","ex":["Planners should prioritise pedestrians and cyclists over private cars.","The new mayor has promised to prioritise housing for low-income families."],"syn":"put first"},{"w":"sustainable transport","pos":"명사구","ipa":"/səˌsteɪnəbl ˈtrænspɔːt/","vi":"지속 가능한 교통","use":"불가산명사; promote / invest in + sustainable transport","ex":["Electric buses and cycling schemes are key forms of sustainable transport.","Governments can promote sustainable transport by making train tickets cheaper."],"syn":"green transport"},{"w":"ease the pressure on","pos":"동사구","ipa":"/ˌiːz ðə ˈpreʃər ɒn/","vi":"~에 대한 부담을 줄이다","use":"ease the pressure on + roads / services / cities","ex":["A second airport would ease the pressure on the existing one.","Building homes in smaller towns could ease the pressure on big cities."],"syn":"relieve"},{"w":"get on the property ladder","pos":"동사구","ipa":"/ɡet ˌɒn ðə ˈprɒpəti ˌlædə/","vi":"첫 내 집을 마련하다","use":"관용 표현; first-time buyers + get on the property ladder","ex":["Many young adults cannot save enough money to get on the property ladder.","Government loans help first-time buyers get on the property ladder."],"syn":"buy a first home"},{"w":"homelessness","pos":"명사","ipa":"/ˈhəʊmləsnəs/","vi":"노숙 (집 없이 지내는 상태)","use":"불가산명사; tackle / reduce + homelessness","ex":["Rising rents are one of the main causes of homelessness in cities.","Charities and local governments must work together to tackle homelessness."],"syn":"sleeping rough"}]},{"id":"v08","en":"Crime, Law & Government","vi":"범죄, 법, 정부","desc":"범죄, 처벌, 법률, 정부의 역할과 관련된 어휘예요.","words":[{"w":"commit a crime","pos":"동사구","ipa":"/kəˌmɪt ə ˈkraɪm/","vi":"범죄를 저지르다","use":"commit a crime / an offence; commit crimes against + N","ex":["Young people who commit a crime should be given a second chance.","Most people who committed a crime as teenagers never offend again."],"syn":"do something illegal"},{"w":"criminal","pos":"명사","ipa":"/ˈkrɪmɪnl/","vi":"범죄자","use":"가산명사; 형용사로도 써요: criminal behaviour / criminal activity","ex":["Some criminals return to prison within a year of being released.","Many people believe that criminals should pay compensation to their victims."],"syn":"lawbreaker"},{"w":"crime rate","pos":"명사구","ipa":"/ˈkraɪm reɪt/","vi":"범죄율","use":"가산명사; the crime rate + rises / falls; a high / low crime rate","ex":["The crime rate in my city has fallen steadily over the past decade.","Higher unemployment is often linked to a rising crime rate."],"syn":"level of crime"},{"w":"victim","pos":"명사","ipa":"/ˈvɪktɪm/","vi":"피해자","use":"가산명사; victims of crime; compensation to + the victim","ex":["Victims of crime often suffer emotional problems for many years.","The court ordered him to pay compensation to the victim."],"syn":"person harmed"},{"w":"punishment","pos":"명사","ipa":"/ˈpʌnɪʃmənt/","vi":"처벌","use":"가산/불가산 모두 가능; harsh / severe + punishment for + 범죄","ex":["Many people believe that punishment alone does not reduce crime.","The punishment should always fit the seriousness of the crime."],"syn":"penalty"},{"w":"prison sentence","pos":"명사구","ipa":"/ˈprɪzn ˌsentəns/","vi":"징역형","use":"가산명사; receive / serve + a (five-year) prison sentence","ex":["He received a five-year prison sentence for armed robbery.","Long prison sentences may not stop people from reoffending."],"syn":"jail term"},{"w":"break the law","pos":"동사구","ipa":"/ˌbreɪk ðə ˈlɔː/","vi":"법을 어기다","use":"고정 표현; break the law (반대말: obey the law)","ex":["Teenagers sometimes break the law simply because their friends do.","Companies that break the law should face heavy fines."],"syn":"act illegally"},{"w":"law-abiding","pos":"형용사","ipa":"/ˈlɔː əˌbaɪdɪŋ/","vi":"법을 잘 지키는","use":"명사 앞에 씀; law-abiding citizens / people","ex":["Most citizens are law-abiding people who simply want to live safely.","Strict surveillance can make even law-abiding citizens feel uncomfortable."],"syn":"honest"},{"w":"offender","pos":"명사","ipa":"/əˈfendə/","vi":"범죄자, 위반자","use":"가산명사; young / first-time / repeat + offenders","ex":["First-time offenders should be given community work rather than prison.","Young offenders need education and support to change their behaviour."],"syn":"wrongdoer"},{"w":"deter","pos":"동사","ipa":"/dɪˈtɜː/","vi":"억제하다, 단념시키다","use":"deter + sb + from V-ing; deter crime / criminals","ex":["Heavy fines may deter drivers from speeding in residential areas.","There is little evidence that the death penalty deters violent crime."],"syn":"discourage"},{"w":"petty crime","pos":"명사구","ipa":"/ˌpeti ˈkraɪm/","vi":"경범죄, 사소한 범죄","use":"불가산명사; petty crime such as + shoplifting / theft","ex":["Petty crime such as shoplifting is common in poorer neighbourhoods.","Police in many cities no longer have time to investigate petty crime."],"syn":"minor offences"},{"w":"violent crime","pos":"명사구","ipa":"/ˌvaɪələnt ˈkraɪm/","vi":"강력 범죄","use":"불가산명사; violent crime + rises / falls","ex":["Violent crime has fallen in most developed countries since the 1990s.","Victims of violent crime need long-term psychological support."],"syn":"crimes of violence"},{"w":"law enforcement","pos":"명사구","ipa":"/ˈlɔː ɪnˌfɔːsmənt/","vi":"법 집행","use":"불가산명사; law enforcement agencies / officers","ex":["Effective law enforcement depends on public trust in the police.","The government has increased spending on law enforcement this year."],"syn":"policing"},{"w":"rehabilitation","pos":"명사","ipa":"/ˌriːəˌbɪlɪˈteɪʃn/","vi":"재활, 갱생","use":"불가산명사; rehabilitation programmes for + prisoners","ex":["Rehabilitation programmes help prisoners find jobs after their release.","I believe prisons should focus on rehabilitation rather than punishment."],"syn":"reform"},{"w":"crack down on","pos":"동사구","ipa":"/ˌkræk ˈdaʊn ɒn/","vi":"강력히 단속하다","use":"crack down on + crime / fraud / drink-driving","ex":["The police are cracking down on drink-driving during the holiday season.","Authorities should crack down on online fraud targeting elderly people."],"syn":"take tough action against"},{"w":"end up in prison","pos":"동사구","ipa":"/ˌend ˌʌp ɪn ˈprɪzn/","vi":"결국 감옥에 가게 되다","use":"end up in prison / in jail (좋지 않은 결과를 나타내요)","ex":["Many young men who leave school early end up in prison.","Without support, former prisoners often end up in prison again."],"syn":"be jailed"},{"w":"authorities","pos":"명사","ipa":"/ɔːˈθɒrətiz/","vi":"당국","use":"보통 'the' + 복수형; the local authorities; report to + the authorities","ex":["The local authorities have installed more street lights to prevent crime.","Citizens should report suspicious activity to the authorities immediately."],"syn":"officials"},{"w":"reoffend","pos":"동사","ipa":"/ˌriːəˈfend/","vi":"재범하다","use":"자동사; be less / more likely to reoffend","ex":["Prisoners who learn a trade are less likely to reoffend.","Around half of released prisoners reoffend within two years."],"syn":"commit another crime"},{"w":"legislation","pos":"명사","ipa":"/ˌledʒɪsˈleɪʃn/","vi":"법률, 입법","use":"불가산명사; introduce / pass + legislation on + N (a legislation ✗, legislations ✗)","ex":["The government introduced new legislation to protect consumers online.","Stricter gun legislation has reduced violent crime in several countries."],"syn":"laws"},{"w":"pass a law","pos":"동사구","ipa":"/ˌpɑːs ə ˈlɔː/","vi":"법을 통과시키다","use":"pass a law + banning / requiring + N","ex":["Parliament passed a law banning smoking in all public places.","Governments should pass a law requiring companies to publish salary data."],"syn":"make a law"},{"w":"taxpayers' money","pos":"명사구","ipa":"/ˈtækspeɪəz ˌmʌni/","vi":"국민의 세금","use":"불가산명사; waste / spend + taxpayers' money on + N","ex":["Keeping prisoners in jail costs a great deal of taxpayers' money.","Politicians must not waste taxpayers' money on unnecessary projects."],"syn":"public money"},{"w":"community service","pos":"명사구","ipa":"/kəˌmjuːnəti ˈsɜːvɪs/","vi":"사회봉사","use":"불가산명사; do / be sentenced to + community service","ex":["Minor offenders could do community service instead of going to prison.","Community service allows offenders to repay society for their crimes."],"syn":"unpaid public work"},{"w":"capital punishment","pos":"명사구","ipa":"/ˌkæpɪtl ˈpʌnɪʃmənt/","vi":"사형","use":"불가산명사; abolish / support + capital punishment","ex":["Capital punishment remains a highly controversial issue in many countries.","Opponents of capital punishment argue that innocent people may be executed."],"syn":"the death penalty"},{"w":"juvenile crime","pos":"명사구","ipa":"/ˌdʒuːvənaɪl ˈkraɪm/","vi":"청소년 범죄","use":"불가산명사; prevent / reduce + juvenile crime","ex":["Juvenile crime is often linked to family problems and poor education.","After-school clubs can play a role in preventing juvenile crime."],"syn":"youth crime"},{"w":"surveillance","pos":"명사","ipa":"/səˈveɪləns/","vi":"감시","use":"불가산명사; under surveillance; surveillance cameras","ex":["Increased surveillance in public places may help police solve crimes faster.","Some people worry that constant surveillance threatens personal privacy."],"syn":"monitoring"},{"w":"corruption","pos":"명사","ipa":"/kəˈrʌpʃn/","vi":"부패","use":"불가산명사; fight / tackle + corruption","ex":["Corruption among officials undermines public trust in the government.","The new president has promised to fight corruption at every level."],"syn":"bribery"},{"w":"enforce","pos":"동사","ipa":"/ɪnˈfɔːs/","vi":"(법을) 집행하다","use":"타동사; enforce + laws / rules / a ban","ex":["Laws are useless if the police do not enforce them properly.","Local councils are responsible for enforcing parking rules."],"syn":"apply"},{"w":"turn to crime","pos":"동사구","ipa":"/ˌtɜːn tə ˈkraɪm/","vi":"범죄의 길로 들어서다","use":"turn to crime (가난, 실업 등으로)","ex":["Some young people turn to crime because they see no other option.","Unemployed teenagers are more likely to turn to crime."],"syn":"start breaking the law"},{"w":"root causes","pos":"명사구","ipa":"/ˌruːt ˈkɔːzɪz/","vi":"근본 원인","use":"복수형; address / tackle + the root causes of + N","ex":["Governments must address the root causes of crime, such as poverty.","Prison does nothing to tackle the root causes of drug addiction."],"syn":"underlying reasons"},{"w":"be held accountable","pos":"동사구","ipa":"/bi ˌheld əˈkaʊntəbl/","vi":"책임을 지다","use":"수동태; be held accountable for + N/V-ing","ex":["Politicians who misuse public money should be held accountable.","Parents must be held accountable for their children's behaviour online."],"syn":"be made responsible"},{"w":"harsh penalties","pos":"명사구","ipa":"/ˌhɑːʃ ˈpenəltiz/","vi":"엄한 처벌","use":"복수형; impose / face + harsh penalties for + N","ex":["Some argue that harsh penalties are the best way to deter crime.","Singapore is known for imposing harsh penalties for minor offences."],"syn":"tough punishments"},{"w":"civil liberties","pos":"명사구","ipa":"/ˌsɪvl ˈlɪbətiz/","vi":"시민의 자유","use":"복수형; protect / threaten + civil liberties","ex":["Strict security measures must not come at the cost of civil liberties.","Human rights groups warn that the new law threatens civil liberties."],"syn":"basic freedoms"},{"w":"transparency","pos":"명사","ipa":"/trænsˈpærənsi/","vi":"투명성","use":"불가산명사; greater transparency in + N","ex":["Greater transparency in government spending would reduce corruption.","Citizens are demanding more transparency about how decisions are made."],"syn":"openness"},{"w":"regulate","pos":"동사","ipa":"/ˈreɡjuleɪt/","vi":"규제하다, 관리하다","use":"타동사; regulate + an industry / companies / prices","ex":["Governments should regulate social media companies more strictly.","It is difficult to regulate online gambling across national borders."],"syn":"control"},{"w":"intervene","pos":"동사","ipa":"/ˌɪntəˈviːn/","vi":"개입하다","use":"자동사; intervene in + N; the state intervenes","ex":["The state should intervene when children are at risk at home.","Some believe the government should not intervene in people's private lives."],"syn":"step in"},{"w":"criminal record","pos":"명사구","ipa":"/ˌkrɪmɪnl ˈrekɔːd/","vi":"전과","use":"가산명사; have / get + a criminal record","ex":["Having a criminal record makes it very hard to find a job.","Employers are allowed to ask whether applicants have a criminal record."],"syn":"past convictions"},{"w":"reintegrate into society","pos":"동사구","ipa":"/ˌriːˈɪntɪɡreɪt ˌɪntə səˈsaɪəti/","vi":"사회에 다시 적응하다","use":"(help sb) reintegrate into society","ex":["Education in prison helps inmates reintegrate into society after release.","Former prisoners often struggle to reintegrate into society without family support."],"syn":"return to normal life"},{"w":"serve a sentence","pos":"동사구","ipa":"/ˌsɜːv ə ˈsentəns/","vi":"형을 살다","use":"serve a sentence for + 범죄; serve a life sentence","ex":["He is currently serving a sentence for fraud.","Offenders who serve a sentence in an open prison can work outside."],"syn":"spend time in prison"},{"w":"lenient","pos":"형용사","ipa":"/ˈliːniənt/","vi":"관대한, 너그러운","use":"lenient with / towards + sb; a lenient sentence","ex":["Many victims feel that the courts are too lenient with young offenders.","A lenient sentence may send the wrong message to potential criminals."],"syn":"soft"},{"w":"rule of law","pos":"명사구","ipa":"/ˌruːl əv ˈlɔː/","vi":"법치","use":"항상 'the'와 함께 씀; uphold / respect + the rule of law","ex":["A fair justice system is essential for maintaining the rule of law.","Foreign investors prefer countries where the rule of law is respected."],"syn":"legal order"}]},{"id":"v09","en":"Family, Society & Ageing","vi":"가족, 사회, 고령화","desc":"가족, 사회적 관계, 인구 고령화 문제와 관련된 어휘예요.","words":[{"w":"nuclear family","pos":"명사구","ipa":"/ˌnjuːkliə ˈfæməli/","vi":"핵가족","use":"가산명사; the nuclear family (부모와 자녀만으로 이루어진 가족)","ex":["The nuclear family has become the most common household type in Korea.","In a nuclear family, grandparents usually live separately from their grandchildren."],"syn":"small family"},{"w":"extended family","pos":"명사구","ipa":"/ɪkˌstendɪd ˈfæməli/","vi":"대가족","use":"가산명사; live with / be supported by + extended family","ex":["In some countries, many people still live with their extended family.","Children who grow up in an extended family receive support from many adults."],"syn":"relatives"},{"w":"elderly","pos":"형용사","ipa":"/ˈeldəli/","vi":"연세가 드신, 고령의","use":"the elderly (집합 명사); elderly people / relatives (※ the elderlys ✗)","ex":["The government must provide better healthcare for the elderly.","Many elderly people live alone after their children move to cities."],"syn":"old"},{"w":"retire","pos":"동사","ipa":"/rɪˈtaɪə/","vi":"은퇴하다","use":"자동사; retire at + 나이; retire from + 직장","ex":["Most people in my country retire at around sixty years old.","After she retired, my mother started volunteering at a local library."],"syn":"stop working"},{"w":"bring up","pos":"동사구","ipa":"/ˌbrɪŋ ˈʌp/","vi":"키우다, 양육하다","use":"bring up + children (= raise); 수동태: be brought up","ex":["Grandparents often help bring up children when both parents work.","Bringing up a child in a big city is extremely expensive."],"syn":"raise"},{"w":"look after","pos":"동사구","ipa":"/ˌlʊk ˈɑːftə/","vi":"돌보다","use":"look after + sb; look after children / elderly parents","ex":["Many adults now look after their ageing parents as well as their children.","Grandparents who look after young children save families a lot of money."],"syn":"take care of"},{"w":"generation gap","pos":"명사구","ipa":"/ˌdʒenəˈreɪʃn ɡæp/","vi":"세대 차이","use":"가산명사; bridge / widen + the generation gap","ex":["Technology has widened the generation gap between parents and teenagers.","Talking openly can help families bridge the generation gap."],"syn":"difference between generations"},{"w":"working parents","pos":"명사구","ipa":"/ˌwɜːkɪŋ ˈpeərənts/","vi":"맞벌이 부모","use":"복수형; childcare for + working parents","ex":["Working parents often struggle to find affordable childcare.","Flexible hours allow working parents to spend more time with their children."],"syn":"employed parents"},{"w":"ageing population","pos":"명사구","ipa":"/ˌeɪdʒɪŋ ˌpɒpjuˈleɪʃn/","vi":"고령화되는 인구","use":"가산명사; an ageing / a rapidly ageing + population","ex":["An ageing population puts enormous pressure on healthcare and pension systems.","Japan and Korea face the challenges of a rapidly ageing population."],"syn":"older population"},{"w":"life expectancy","pos":"명사구","ipa":"/ˈlaɪf ɪkˌspektənsi/","vi":"평균 수명","use":"불가산명사; life expectancy + rises / increases","ex":["Life expectancy has risen sharply thanks to better medicine and nutrition.","Women generally have a higher life expectancy than men."],"syn":"average lifespan"},{"w":"birth rate","pos":"명사구","ipa":"/ˈbɜːθ reɪt/","vi":"출산율","use":"가산명사; a low / falling + birth rate","ex":["South Korea has one of the lowest birth rates in the world.","Housing costs are a major reason for the falling birth rate."],"syn":"fertility rate"},{"w":"pension","pos":"명사","ipa":"/ˈpenʃn/","vi":"연금","use":"가산명사; live on / receive + a (state) pension","ex":["Many older people cannot live comfortably on a state pension alone.","Workers should start saving for their pension as early as possible."],"syn":"retirement income"},{"w":"retirement age","pos":"명사구","ipa":"/rɪˈtaɪəmənt eɪdʒ/","vi":"정년, 퇴직 연령","use":"가산명사; raise / lower + the retirement age","ex":["Several countries have raised the retirement age to sixty-five or older.","Raising the retirement age could reduce pressure on public finances."],"syn":"age of retirement"},{"w":"care home","pos":"명사구","ipa":"/ˈkeə həʊm/","vi":"요양원","use":"가산명사; move (sb) into + a care home","ex":["Some families feel guilty about moving their parents into a care home.","Care homes need more trained staff to look after residents properly."],"syn":"nursing home"},{"w":"get on well with","pos":"동사구","ipa":"/ɡet ˌɒn ˈwel wɪð/","vi":"~와 사이좋게 지내다","use":"get on well with + sb (영국 영어) = get along with","ex":["I get on well with my grandparents because they are very open-minded.","Children who get on well with their siblings tend to be more confident."],"syn":"get along with"},{"w":"single-parent family","pos":"명사구","ipa":"/ˌsɪŋɡl ˌpeərənt ˈfæməli/","vi":"한부모 가정","use":"가산명사; grow up in + a single-parent family","ex":["Children from a single-parent family may need extra financial support.","The number of single-parent families has increased over the last thirty years."],"syn":"one-parent household"},{"w":"role model","pos":"명사구","ipa":"/ˈrəʊl ˌmɒdl/","vi":"롤 모델, 본보기","use":"가산명사; a positive role model for + sb","ex":["Parents are the most important role models for young children.","Celebrities should remember that they are role models for teenagers."],"syn":"good example"},{"w":"household chores","pos":"명사구","ipa":"/ˌhaʊshəʊld ˈtʃɔːz/","vi":"집안일","use":"복수형; do / share / help with + household chores","ex":["In many modern families, men and women share household chores equally.","Children should help with household chores to learn responsibility."],"syn":"housework"},{"w":"financially independent","pos":"형용사구","ipa":"/faɪˌnænʃəli ˌɪndɪˈpendənt/","vi":"경제적으로 자립한","use":"become + financially independent (from + sb)","ex":["Young adults in Western countries usually become financially independent at eighteen.","Part-time jobs help students become financially independent from their parents."],"syn":"self-supporting"},{"w":"loneliness","pos":"명사","ipa":"/ˈləʊnlinəs/","vi":"외로움","use":"불가산명사; reduce / tackle + loneliness among + N","ex":["Loneliness among older people is a growing public health problem.","Regular visits from volunteers can reduce loneliness in care homes."],"syn":"feeling alone"},{"w":"burden","pos":"명사","ipa":"/ˈbɜːdn/","vi":"부담","use":"가산명사; a burden on / to + sb; a financial burden","ex":["Many older people worry about becoming a burden on their children.","Caring for a sick parent can be a heavy financial burden."],"syn":"heavy load"},{"w":"caregiver","pos":"명사","ipa":"/ˈkeəɡɪvə/","vi":"돌봄 제공자","use":"가산명사; family / unpaid + caregivers (영국 영어: carer)","ex":["Family caregivers often give up their jobs to look after relatives.","The government should offer training and payments to unpaid caregivers."],"syn":"carer"},{"w":"upbringing","pos":"명사","ipa":"/ˈʌpbrɪŋɪŋ/","vi":"양육, 성장 환경","use":"보통 단수형; a strict / happy + upbringing","ex":["A strict upbringing does not always produce well-behaved children.","Her upbringing in a large family taught her to share and cooperate."],"syn":"the way someone is raised"},{"w":"pass down","pos":"동사구","ipa":"/ˌpɑːs ˈdaʊn/","vi":"(다음 세대에) 물려주다","use":"pass down + traditions (to + sb); be passed down","ex":["Grandparents pass down family traditions and stories to younger generations.","Traditional skills are disappearing because they are no longer passed down."],"syn":"hand down"},{"w":"move out","pos":"동사구","ipa":"/ˌmuːv ˈaʊt/","vi":"독립해서 나가 살다","use":"자동사; move out (of + 부모님 집)","ex":["In Korea, many young adults do not move out until they marry.","Because of high rents, many graduates cannot afford to move out of their parents' homes."],"syn":"leave home"},{"w":"family values","pos":"명사구","ipa":"/ˌfæməli ˈvæljuːz/","vi":"가족 가치관","use":"복수형; traditional / strong + family values","ex":["Some people believe that traditional family values are disappearing in modern society.","Strong family values encourage children to respect their elders."],"syn":"traditional beliefs"},{"w":"gender roles","pos":"명사구","ipa":"/ˈdʒendə rəʊlz/","vi":"성 역할","use":"복수형; traditional gender roles; challenge + gender roles","ex":["Traditional gender roles expected women to stay at home with children.","Attitudes towards gender roles have changed dramatically in recent decades."],"syn":"roles of men and women"},{"w":"start a family","pos":"동사구","ipa":"/ˌstɑːt ə ˈfæməli/","vi":"가정을 꾸리다, 아이를 갖다","use":"고정 표현; wait / decide + to start a family","ex":["Many couples now wait until their thirties to start a family.","The high cost of housing discourages young people from starting a family."],"syn":"have children"},{"w":"intergenerational","pos":"형용사","ipa":"/ˌɪntədʒenəˈreɪʃənl/","vi":"세대 간의","use":"명사 앞에 씀; intergenerational living / activities","ex":["Intergenerational living can benefit both grandparents and grandchildren.","Community centres can organise intergenerational activities for young and old."],"syn":"involving different age groups"},{"w":"demographic shift","pos":"명사구","ipa":"/ˌdeməˌɡræfɪk ˈʃɪft/","vi":"인구 구조의 변화","use":"가산명사; a demographic shift towards + N","ex":["This demographic shift will leave fewer workers to support each retiree.","Governments must plan for the demographic shift towards an older society."],"syn":"population change"},{"w":"social cohesion","pos":"명사구","ipa":"/ˌsəʊʃl kəʊˈhiːʒn/","vi":"사회적 결속","use":"불가산명사; build / strengthen / weaken + social cohesion","ex":["Shared public spaces help build social cohesion in diverse neighbourhoods.","Growing inequality can weaken social cohesion and trust between groups."],"syn":"unity"},{"w":"put a strain on","pos":"동사구","ipa":"/ˌpʊt ə ˈstreɪn ɒn/","vi":"~에 부담을 주다","use":"put a strain on + services / budgets / relationships","ex":["An ageing population will put a strain on public healthcare services.","Caring for elderly parents can put a strain on a marriage."],"syn":"put pressure on"},{"w":"fend for themselves","pos":"동사구","ipa":"/ˌfend fə ðəmˈselvz/","vi":"스스로 살아가다","use":"fend for oneself; be left to + fend for themselves","ex":["Many older people living alone are left to fend for themselves.","Parents should teach teenagers to fend for themselves before leaving home."],"syn":"cope alone"},{"w":"marginalised","pos":"형용사","ipa":"/ˈmɑːdʒɪnəlaɪzd/","vi":"소외된","use":"marginalised groups / communities (미국식: marginalized)","ex":["Older people without internet access can feel marginalised in a digital society.","Governments should give marginalised groups a stronger voice in decision-making."],"syn":"excluded"},{"w":"put off","pos":"동사구","ipa":"/ˌpʊt ˈɒf/","vi":"미루다","use":"put off + V-ing / N (= delay); put off having children","ex":["Many couples put off having children because of financial insecurity.","Young people are putting off marriage until they have stable jobs."],"syn":"delay"},{"w":"sense of belonging","pos":"명사구","ipa":"/ˌsens əv bɪˈlɒŋɪŋ/","vi":"소속감","use":"불가산명사; a strong sense of belonging (to + 집단)","ex":["Community activities give older people a strong sense of belonging.","A sense of belonging is essential for teenagers' mental well-being."],"syn":"feeling of being accepted"},{"w":"contribute to society","pos":"동사구","ipa":"/kənˌtrɪbjuːt tə səˈsaɪəti/","vi":"사회에 기여하다","use":"contribute to society + through / by + V-ing","ex":["Retired people can still contribute to society through volunteering.","Immigrants contribute to society by filling gaps in the labour market."],"syn":"give back"},{"w":"shrinking workforce","pos":"명사구","ipa":"/ˌʃrɪŋkɪŋ ˈwɜːkfɔːs/","vi":"줄어드는 노동 인구","use":"가산명사; cope with + a shrinking workforce","ex":["A shrinking workforce means that fewer people pay taxes to fund pensions.","Automation may help countries cope with a shrinking workforce."],"syn":"fewer workers"},{"w":"nurture","pos":"동사","ipa":"/ˈnɜːtʃə/","vi":"기르다, 키우다","use":"타동사; nurture + talent / curiosity / a child","ex":["Parents should nurture their children's curiosity rather than pressure them.","Teachers play an important role in nurturing young people's talents."],"syn":"develop"},{"w":"dependent on","pos":"형용사구","ipa":"/dɪˈpendənt ɒn/","vi":"~에 의존하는","use":"be (financially) dependent on + sb / sth","ex":["Many elderly people are financially dependent on their adult children.","Young adults remain dependent on their parents for longer than before."],"syn":"reliant on"}]},{"id":"v10","en":"Culture, Tourism & Globalisation","vi":"문화, 관광, 세계화","desc":"관광, 문화 정체성, 세계화의 영향과 관련된 어휘예요.","words":[{"w":"tourist attraction","pos":"명사구","ipa":"/ˈtʊərɪst əˌtrækʃn/","vi":"관광 명소","use":"가산명사; a major / popular + tourist attraction","ex":["Gyeongbokgung Palace is one of the most popular tourist attractions in Seoul.","The old palace has become a major tourist attraction since it reopened."],"syn":"place of interest"},{"w":"tourism industry","pos":"명사구","ipa":"/ˈtʊərɪzəm ˌɪndəstri/","vi":"관광 산업","use":"명사; the tourism industry + creates jobs / depends on","ex":["The tourism industry creates thousands of jobs in coastal towns.","Many small islands depend almost entirely on the tourism industry."],"syn":"travel sector"},{"w":"local culture","pos":"명사구","ipa":"/ˌləʊkl ˈkʌltʃə/","vi":"지역 문화","use":"불가산명사; experience / respect + local culture","ex":["Staying with a host family lets travellers experience the local culture directly.","Visitors should learn a little about the local culture before they arrive."],"syn":"regional way of life"},{"w":"tradition","pos":"명사","ipa":"/trəˈdɪʃn/","vi":"전통","use":"가산명사; follow / keep + a tradition; a long tradition of + N","ex":["Giving gift money at Seollal is a tradition that children love.","Korea has a long tradition of respecting older family members."],"syn":"custom"},{"w":"destination","pos":"명사","ipa":"/ˌdestɪˈneɪʃn/","vi":"목적지","use":"가산명사; a popular / holiday + destination","ex":["Da Nang has become a popular destination for Korean families.","Cheap flights have turned many small cities into holiday destinations."],"syn":"place to visit"},{"w":"attract visitors","pos":"동사구","ipa":"/əˌtrækt ˈvɪzɪtəz/","vi":"관광객을 끌어들이다","use":"타동사; attract + visitors / tourists + to + 장소","ex":["Music festivals attract visitors from all over the country every summer.","The museum attracted more visitors after it offered free entry on Sundays."],"syn":"draw tourists"},{"w":"souvenir","pos":"명사","ipa":"/ˌsuːvəˈnɪə/","vi":"기념품","use":"가산명사; buy a souvenir; a souvenir shop (※ 한국어 '기념품' 외에 'souvenir'를 'present'로 쓰면 어색해요)","ex":["Most tourists buy a small souvenir to remember their trip.","Many souvenirs sold near famous sites are actually made overseas."],"syn":"keepsake"},{"w":"go sightseeing","pos":"동사구","ipa":"/ɡəʊ ˈsaɪtsiːɪŋ/","vi":"관광하다, 구경하러 다니다","use":"목적어 없는 구동사; go sightseeing + in + 도시 (※ go to sightseeing ✗)","ex":["On my first day in Seoul, I decided to go sightseeing around the old palaces.","Some people prefer to relax on the beach rather than go sightseeing."],"syn":"visit the sights"},{"w":"cultural heritage","pos":"명사구","ipa":"/ˈkʌltʃərəl ˈherɪtɪdʒ/","vi":"문화유산","use":"불가산명사; protect / preserve + cultural heritage","ex":["Old temples and folk songs are an important part of our cultural heritage.","Governments should spend more money to protect their cultural heritage."],"syn":"cultural legacy"},{"w":"preserve","pos":"동사","ipa":"/prɪˈzɜːv/","vi":"보존하다, 지키다","use":"타동사; preserve + traditions / historic buildings","ex":["Local communities work hard to preserve their traditional crafts.","The old quarter has been carefully preserved for future generations."],"syn":"protect"},{"w":"custom","pos":"명사","ipa":"/ˈkʌstəm/","vi":"관습","use":"가산명사; local customs; it is the custom to + V","ex":["Visitors should respect local customs, such as removing shoes indoors.","In Korea, it is a custom to visit relatives during the Lunar New Year."],"syn":"practice"},{"w":"historic site","pos":"명사구","ipa":"/hɪˌstɒrɪk ˈsaɪt/","vi":"사적지, 유적지","use":"가산명사; visit / restore + a historic site","ex":["Gyeongju has many historic sites from the time of the Silla kingdom.","Too many visitors can damage fragile historic sites over time."],"syn":"heritage site"},{"w":"traditional festival","pos":"명사구","ipa":"/trəˌdɪʃənl ˈfestɪvl/","vi":"전통 축제","use":"가산명사; celebrate / hold + a traditional festival","ex":["The Mid-Autumn Festival is a traditional festival loved by children.","Traditional festivals help young people feel connected to their roots."],"syn":"customary celebration"},{"w":"pass down","pos":"동사구","ipa":"/ˌpɑːs ˈdaʊn/","vi":"(다음 세대에) 물려주다","use":"목적어를 사이에 넣을 수 있는 구동사; pass down + skills/stories + to + the next generation","ex":["Grandparents pass down family recipes to their grandchildren.","These folk songs have been passed down from generation to generation."],"syn":"hand down"},{"w":"cultural identity","pos":"명사구","ipa":"/ˈkʌltʃərəl aɪˈdentəti/","vi":"문화적 정체성","use":"명사; lose / maintain + cultural identity; a strong sense of cultural identity","ex":["Language is one of the most important parts of cultural identity.","Some critics fear that small nations may lose their cultural identity."],"syn":"cultural character"},{"w":"ethnic minority","pos":"명사구","ipa":"/ˌeθnɪk maɪˈnɒrəti/","vi":"소수 민족","use":"가산명사; ethnic minority + groups / communities","ex":["Yunnan in southwestern China is home to several ethnic minority groups with their own languages.","Tourism can bring income to ethnic minority communities in remote areas."],"syn":"minority group"},{"w":"authentic","pos":"형용사","ipa":"/ɔːˈθentɪk/","vi":"진정한, 진짜의","use":"형용사; an authentic + experience / dish / atmosphere","ex":["Many travellers want an authentic experience rather than a hotel buffet.","This small restaurant serves authentic food from the Jeolla region."],"syn":"genuine"},{"w":"unique","pos":"형용사","ipa":"/juˈniːk/","vi":"독특한, 유일한","use":"형용사; unique + to + 장소; a unique + culture / style (※ very unique ✗: unique는 정도 부사와 함께 쓰지 않아요)","ex":["Each region has a unique style of cooking and local dress.","This kind of mask dance is unique to Korea."],"syn":"one of a kind"},{"w":"broaden your horizons","pos":"동사구","ipa":"/ˌbrɔːdn jɔː həˈraɪznz/","vi":"시야를 넓히다","use":"관용 표현; travel / study abroad + to broaden your horizons","ex":["Travelling alone can broaden your horizons in ways that textbooks cannot.","Learning a second language is a practical way to broaden your horizons."],"syn":"widen your experience"},{"w":"cultural exchange","pos":"명사구","ipa":"/ˈkʌltʃərəl ɪksˈtʃeɪndʒ/","vi":"문화 교류","use":"명사; promote / encourage + cultural exchange; a cultural exchange programme","ex":["Student exchange programmes are a simple form of cultural exchange.","Cultural exchange between Korea and Vietnam has grown rapidly in recent years."],"syn":"sharing of cultures"},{"w":"globalisation","pos":"명사","ipa":"/ˌɡləʊbəlaɪˈzeɪʃn/","vi":"세계화","use":"불가산명사; the effects / impact + of globalisation","ex":["Globalisation has made foreign products cheaper and easier to buy.","Some people believe globalisation threatens traditional ways of life."],"syn":"global integration"},{"w":"multinational company","pos":"명사구","ipa":"/ˌmʌltiˈnæʃnəl ˈkʌmpəni/","vi":"다국적 기업","use":"가산명사; large multinational companies + invest in / operate in","ex":["Several multinational companies have built factories near Incheon.","A multinational company can move production to wherever labour is cheapest."],"syn":"international corporation"},{"w":"global brand","pos":"명사구","ipa":"/ˌɡləʊbl ˈbrænd/","vi":"글로벌 브랜드","use":"가산명사; global brands + dominate / replace + local shops","ex":["Global brands now dominate the main shopping streets of most big cities.","Young people often see a global brand as a symbol of status."],"syn":"international brand"},{"w":"international trade","pos":"명사구","ipa":"/ˌɪntəˌnæʃnəl ˈtreɪd/","vi":"국제 무역","use":"불가산명사; growth in / barriers to + international trade","ex":["International trade allows countries to buy goods they cannot produce.","Lower shipping costs have encouraged a huge growth in international trade."],"syn":"global commerce"},{"w":"integrate into","pos":"동사구","ipa":"/ˈɪntɪɡreɪt ˈɪntuː/","vi":"~에 융화되다, 통합되다","use":"동사 + into; integrate into + society / the community","ex":["Many migrants find it hard to integrate into a new society at first.","Language classes help foreign workers integrate into the local community."],"syn":"fit into"},{"w":"adapt to","pos":"동사구","ipa":"/əˈdæpt tuː/","vi":"~에 적응하다","use":"adapt to + N/V-ing; adapt to + a new culture / environment","ex":["It took me several months to adapt to life in Korea.","International students must adapt to new teaching styles quickly."],"syn":"adjust to"},{"w":"language barrier","pos":"명사구","ipa":"/ˈlæŋɡwɪdʒ ˌbæriə/","vi":"언어 장벽","use":"가산명사; overcome / break down + the language barrier","ex":["The language barrier is often the biggest problem for new immigrants.","Translation apps have helped tourists overcome the language barrier."],"syn":"communication problem"},{"w":"culture shock","pos":"명사구","ipa":"/ˈkʌltʃə ʃɒk/","vi":"문화 충격","use":"불가산명사; experience / suffer from + culture shock","ex":["Many students experience culture shock during their first year abroad.","Culture shock usually fades once people build a new social network."],"syn":"disorientation abroad"},{"w":"mass tourism","pos":"명사구","ipa":"/ˌmæs ˈtʊərɪzəm/","vi":"대중 관광, 대규모 단체 관광","use":"불가산명사; the negative effects of + mass tourism","ex":["Mass tourism has turned some quiet fishing villages into crowded resorts.","Cities like Venice now limit cruise ships to reduce mass tourism."],"syn":"large-scale tourism"},{"w":"ecotourism","pos":"명사","ipa":"/ˈiːkəʊtʊərɪzəm/","vi":"생태 관광","use":"불가산명사; promote / develop + ecotourism","ex":["Ecotourism can fund the protection of national parks and wildlife.","The province plans to develop ecotourism in its mountain forests."],"syn":"green tourism"},{"w":"boost the local economy","pos":"동사구","ipa":"/ˌbuːst ðə ˌləʊkl ɪˈkɒnəmi/","vi":"지역 경제를 활성화하다","use":"타동사; tourism / investment + boosts the local economy","ex":["Hosting international events can boost the local economy for several years.","Small family hotels boost the local economy more than large foreign chains."],"syn":"help local businesses"},{"w":"generate revenue","pos":"동사구","ipa":"/ˌdʒenəreɪt ˈrevənjuː/","vi":"수익을 창출하다","use":"타동사; generate revenue + for + the government / city","ex":["Entrance fees generate revenue that can be used to repair old buildings.","Tourism generated revenue of over 20 billion dollars for the country last year."],"syn":"earn money"},{"w":"overcrowding","pos":"명사","ipa":"/ˌəʊvəˈkraʊdɪŋ/","vi":"과밀, 혼잡","use":"불가산명사; lead to / cause + overcrowding","ex":["Overcrowding at popular beaches spoils the experience for everyone.","Some cities set daily visitor limits to prevent overcrowding."],"syn":"congestion"},{"w":"commercialise","pos":"동사","ipa":"/kəˈmɜːʃəlaɪz/","vi":"상업화하다","use":"보통 수동태로 씀; become / be + commercialised","ex":["Many traditional festivals have become heavily commercialised in recent decades.","Critics argue that companies commercialise sacred places for quick profit."],"syn":"turn into a business"},{"w":"erode","pos":"동사","ipa":"/ɪˈrəʊd/","vi":"침식시키다, 서서히 사라지게 하다","use":"타동사; erode + traditional values / local identity","ex":["Western media may slowly erode traditional values among teenagers.","Local dialects are being eroded as young people move to big cities."],"syn":"weaken"},{"w":"infrastructure","pos":"명사","ipa":"/ˈɪnfrəstrʌktʃə/","vi":"기반 시설, 인프라","use":"불가산명사; invest in / improve + infrastructure","ex":["Tourism encourages governments to invest in roads, airports and other infrastructure.","Poor infrastructure prevents many remote areas from attracting tourists."],"syn":"public facilities"},{"w":"hospitality sector","pos":"명사구","ipa":"/ˌhɒspɪˈtæləti ˌsektə/","vi":"숙박·외식업 부문","use":"명사; work in / jobs in + the hospitality sector","ex":["Many young people find their first job in the hospitality sector.","The hospitality sector lost millions of jobs during the pandemic."],"syn":"hotel and restaurant industry"},{"w":"put pressure on","pos":"동사구","ipa":"/ˌpʊt ˈpreʃər ɒn/","vi":"~에 부담을 주다","use":"put (enormous) pressure on + resources / services","ex":["Large numbers of tourists put pressure on local water supplies.","Rapid growth has put pressure on public transport in the city centre."],"syn":"strain"},{"w":"distinctive","pos":"형용사","ipa":"/dɪˈstɪŋktɪv/","vi":"특유의, 독특한","use":"형용사; a distinctive + style / character / flavour","ex":["Jeonju Hanok Village is famous for its distinctive traditional houses.","Global chains may cause cities to lose their distinctive character."],"syn":"characteristic"},{"w":"promote mutual understanding","pos":"동사구","ipa":"/prəˌməʊt ˌmjuːtʃuəl ˌʌndəˈstændɪŋ/","vi":"상호 이해를 증진하다","use":"타동사; promote mutual understanding + between + nations","ex":["International travel can promote mutual understanding between different nations.","Exchange programmes promote mutual understanding among young people from many countries."],"syn":"help people understand each other"}]},{"id":"v11","en":"Science, Research & Engineering","vi":"과학, 연구, 공학","desc":"과학 연구, 실험, 재료, 기술 개발과 관련된 어휘예요.","words":[{"w":"conduct experiments","pos":"동사구","ipa":"/kənˌdʌkt ɪkˈsperɪmənts/","vi":"실험을 수행하다","use":"타동사; conduct experiments + on + 시료/대상","ex":["Our team conducts experiments on steel samples at very high temperatures.","Scientists must conduct experiments carefully to get reliable results."],"syn":"carry out tests"},{"w":"scientific research","pos":"명사구","ipa":"/ˌsaɪənˌtɪfɪk rɪˈsɜːtʃ/","vi":"과학 연구","use":"불가산명사; carry out / fund + scientific research (※ researches ✗, a research ✗)","ex":["Scientific research has helped doctors find treatments for many diseases.","The government should spend more on scientific research and education."],"syn":"scientific study"},{"w":"researcher","pos":"명사","ipa":"/rɪˈsɜːtʃə/","vi":"연구자","use":"가산명사; a researcher + at / in + 기관/분야","ex":["I work as a researcher in a materials science laboratory in Korea.","Young researchers often find it difficult to get permanent positions."],"syn":"scientist"},{"w":"laboratory","pos":"명사","ipa":"/ləˈbɒrətri/","vi":"실험실","use":"가산명사; in the laboratory; laboratory + tests / equipment","ex":["The new laboratory has modern equipment for testing metals.","Most of the samples were analysed in the laboratory overnight."],"syn":"lab"},{"w":"discovery","pos":"명사","ipa":"/dɪˈskʌvəri/","vi":"발견","use":"가산명사; make a discovery; a major / scientific discovery","ex":["The discovery of penicillin in 1928 changed modern medicine forever.","Many important discoveries were made by accident in the laboratory."],"syn":"finding"},{"w":"invention","pos":"명사","ipa":"/ɪnˈvenʃn/","vi":"발명","use":"가산명사; the invention of + N; a useful invention","ex":["The invention of the internet transformed the way people work.","In my opinion, the smartphone is the most useful invention of this century."],"syn":"innovation"},{"w":"technological advances","pos":"명사구","ipa":"/ˌteknəˈlɒdʒɪkl ədˈvɑːnsɪz/","vi":"기술 발전","use":"복수형; recent / rapid + technological advances + in + 분야","ex":["Technological advances have made solar panels much cheaper than before.","Rapid technological advances in medicine have increased life expectancy."],"syn":"progress in technology"},{"w":"data","pos":"명사","ipa":"/ˈdeɪtə/","vi":"데이터, 자료","use":"불가산명사 (또는 복수형); collect / analyse + data (※ a data ✗, datas ✗)","ex":["We collected data from more than two hundred published papers.","The data show a clear link between temperature and strength."],"syn":"information"},{"w":"carry out research","pos":"동사구","ipa":"/ˌkæri aʊt rɪˈsɜːtʃ/","vi":"연구를 수행하다","use":"carry out research + into / on + 주제","ex":["Universities carry out research into new energy sources.","She is carrying out research on heat-resistant alloys for power plants."],"syn":"do research"},{"w":"hypothesis","pos":"명사","ipa":"/haɪˈpɒθəsɪs/","vi":"가설","use":"가산명사 (복수: hypotheses); test / support + a hypothesis","ex":["The experiment was designed to test a simple hypothesis about grain size.","The results did not support the original hypothesis."],"syn":"theory"},{"w":"findings","pos":"명사","ipa":"/ˈfaɪndɪŋz/","vi":"연구 결과","use":"복수형; the findings + show / suggest + that","ex":["The findings suggest that small particles make the steel much stronger.","Researchers usually publish their findings in international journals."],"syn":"results"},{"w":"analyse","pos":"동사","ipa":"/ˈænəlaɪz/","vi":"분석하다","use":"타동사; analyse + data / samples / results","ex":["We analyse each sample under an electron microscope.","The results were analysed using simple statistical methods."],"syn":"examine"},{"w":"accurate","pos":"형용사","ipa":"/ˈækjərət/","vi":"정확한","use":"형용사; accurate + measurements / data / results","ex":["Accurate measurements are essential in any engineering project.","Computer models are becoming more accurate every year."],"syn":"precise"},{"w":"reliable","pos":"형용사","ipa":"/rɪˈlaɪəbl/","vi":"믿을 만한","use":"형용사; reliable + results / sources / evidence","ex":["Scientists repeat tests several times to make sure the results are reliable.","Students should use reliable sources rather than random websites."],"syn":"trustworthy"},{"w":"evidence","pos":"명사","ipa":"/ˈevɪdəns/","vi":"증거","use":"불가산명사; strong / clear + evidence + that / of (※ evidences ✗)","ex":["There is strong evidence that air pollution harms children's lungs.","The study provides clear evidence of a link between diet and health."],"syn":"proof"},{"w":"mechanical properties","pos":"명사구","ipa":"/məˌkænɪkl ˈprɒpətiz/","vi":"기계적 성질","use":"복수형; improve / measure + the mechanical properties + of + 재료","ex":["Adding nickel can improve the mechanical properties of steel.","We measured the mechanical properties of each alloy at room temperature."],"syn":"strength characteristics"},{"w":"durable","pos":"형용사","ipa":"/ˈdjʊərəbl/","vi":"내구성이 있는, 오래 가는","use":"형용사; durable + materials / products; more durable than","ex":["Engineers are developing more durable materials for bridges and roads.","Products that are durable create less waste over their lifetime."],"syn":"long-lasting"},{"w":"material","pos":"명사","ipa":"/məˈtɪəriəl/","vi":"재료, 소재","use":"가산명사; new / lightweight / raw + materials","ex":["Lightweight materials such as aluminium help cars use much less fuel.","The company is testing a new material that can survive extreme heat."],"syn":"substance"},{"w":"prototype","pos":"명사","ipa":"/ˈprəʊtətaɪp/","vi":"시제품","use":"가산명사; build / test + a prototype","ex":["The team built a prototype of the engine in only six months.","Several prototypes failed before the final design was approved."],"syn":"early model"},{"w":"design","pos":"동사","ipa":"/dɪˈzaɪn/","vi":"설계하다","use":"타동사; be designed to + V","ex":["Engineers design bridges that can survive strong earthquakes.","This alloy was designed to work at temperatures above 700 degrees."],"syn":"create"},{"w":"develop new technologies","pos":"동사구","ipa":"/dɪˌveləp njuː tekˈnɒlədʒiz/","vi":"새로운 기술을 개발하다","use":"타동사; develop new technologies + to + V","ex":["Companies must develop new technologies to stay competitive.","Governments should help firms develop new technologies that reduce emissions."],"syn":"create new technology"},{"w":"innovation","pos":"명사","ipa":"/ˌɪnəˈveɪʃn/","vi":"혁신","use":"명사; encourage / drive + innovation; technological innovation","ex":["Tax incentives can encourage innovation in small companies.","Korea's economic growth has depended heavily on technological innovation for decades."],"syn":"new ideas"},{"w":"breakthrough","pos":"명사","ipa":"/ˈbreɪkθruː/","vi":"획기적인 발전","use":"가산명사; a major breakthrough + in + 분야","ex":["Scientists have made a major breakthrough in battery technology.","The breakthrough came after ten years of careful experiments."],"syn":"major advance"},{"w":"cutting-edge","pos":"형용사","ipa":"/ˌkʌtɪŋ ˈedʒ/","vi":"최첨단의","use":"명사 앞에 쓰는 형용사; cutting-edge + technology / research","ex":["The institute uses cutting-edge equipment to study new alloys.","Cutting-edge research often requires expensive machines and skilled staff."],"syn":"state-of-the-art"},{"w":"research funding","pos":"명사구","ipa":"/rɪˈsɜːtʃ ˌfʌndɪŋ/","vi":"연구비","use":"불가산명사; apply for / cut / increase + research funding","ex":["Many scientists spend weeks every year applying for research funding.","Cuts in research funding may slow down medical progress."],"syn":"research grants"},{"w":"allocate","pos":"동사","ipa":"/ˈæləkeɪt/","vi":"배분하다","use":"타동사; allocate + money / resources + to + N","ex":["The government allocates a large budget to space exploration.","More money should be allocated to research on renewable energy."],"syn":"assign"},{"w":"peer review","pos":"명사구","ipa":"/ˌpɪə rɪˈvjuː/","vi":"동료 평가 (피어 리뷰)","use":"불가산명사; go through / pass + peer review","ex":["Every paper must go through peer review before it is published.","Peer review helps journals reject studies with weak methods."],"syn":"expert evaluation"},{"w":"publish","pos":"동사","ipa":"/ˈpʌblɪʃ/","vi":"발표하다, 출판하다","use":"타동사; publish + results / a paper + in + a journal","ex":["Our group published three papers in international journals last year.","The results will be published once the review process is complete."],"syn":"release"},{"w":"collaborate with","pos":"동사구","ipa":"/kəˈlæbəreɪt wɪð/","vi":"~와 협력하다","use":"collaborate with + 사람/기관 + on + 프로젝트","ex":["Our lab collaborates with a steel company on new heat-resistant alloys.","Scientists from many countries collaborated with each other during the pandemic."],"syn":"work together with"},{"w":"apply theory to practice","pos":"동사구","ipa":"/əˌplaɪ ˈθɪəri tə ˈpræktɪs/","vi":"이론을 실제에 적용하다","use":"타동사; learn to apply theory to practice","ex":["Engineering students need internships to apply theory to practice.","Good teachers show learners how to apply theory to practice."],"syn":"use knowledge in real life"},{"w":"withstand","pos":"동사","ipa":"/wɪðˈstænd/","vi":"견디다","use":"타동사; withstand + high temperatures / heavy loads","ex":["Turbine blades must withstand extremely high temperatures for many years.","The new building is designed to withstand strong typhoons."],"syn":"resist"},{"w":"heat-resistant","pos":"형용사","ipa":"/ˌhiːt rɪˈzɪstənt/","vi":"내열성의","use":"합성 형용사; heat-resistant + steel / alloys / materials","ex":["Power plants need heat-resistant steel for their pipes and boilers.","Heat-resistant materials are also used in kitchen equipment."],"syn":"able to resist heat"},{"w":"test the performance of","pos":"동사구","ipa":"/ˌtest ðə pəˈfɔːməns əv/","vi":"~의 성능을 시험하다","use":"타동사; test the performance of + 재료/장비","ex":["We test the performance of each alloy at 650 degrees Celsius.","Engineers tested the performance of the battery in freezing conditions."],"syn":"evaluate"},{"w":"trial and error","pos":"명사구","ipa":"/ˌtraɪəl ənd ˈerə/","vi":"시행착오","use":"불가산명사; by / through + trial and error","ex":["Early engineers improved their designs mainly by trial and error.","Machine learning can reduce the trial and error needed to design new alloys."],"syn":"experimentation"},{"w":"breakdown","pos":"명사","ipa":"/ˈbreɪkdaʊn/","vi":"고장, 상세 분석","use":"가산명사; a breakdown + of + N; a mechanical breakdown","ex":["Regular checks can prevent a sudden breakdown of factory machines.","The report gives a detailed breakdown of research spending by sector."],"syn":"failure"},{"w":"variable","pos":"명사","ipa":"/ˈveəriəbl/","vi":"변수","use":"가산명사; control / change + one variable at a time","ex":["In a fair test, scientists change only one variable at a time.","Temperature was the most important variable in our experiment."],"syn":"factor"},{"w":"sample size","pos":"명사구","ipa":"/ˈsɑːmpl saɪz/","vi":"표본 크기","use":"명사; a small / large + sample size","ex":["The study was criticised because its sample size was too small.","A larger sample size usually makes the conclusions more reliable."],"syn":"number of samples"},{"w":"draw conclusions","pos":"동사구","ipa":"/ˌdrɔː kənˈkluːʒnz/","vi":"결론을 도출하다","use":"draw conclusions + from + data/results; draw firm conclusions","ex":["It is too early to draw conclusions from such limited data.","Researchers should only draw conclusions after repeating the test five times."],"syn":"conclude"},{"w":"ethical concerns","pos":"명사구","ipa":"/ˌeθɪkl kənˈsɜːnz/","vi":"윤리적 우려","use":"복수형; raise + ethical concerns + about + N","ex":["Animal testing raises serious ethical concerns for many people.","Genetic engineering has led to ethical concerns about designer babies."],"syn":"moral issues"},{"w":"practical applications","pos":"명사구","ipa":"/ˌpræktɪkl ˌæplɪˈkeɪʃnz/","vi":"실제 응용","use":"복수형; have practical applications + in + 분야","ex":["Some basic research has no obvious practical applications at first.","This new coating has practical applications in the aircraft industry."],"syn":"real-world uses"}]},{"id":"v12","en":"Describing Data (Task 1)","vi":"Task 1 자료 묘사","desc":"Writing Task 1에서 쓰는 추세, 비율, 비교, 과정, 지도 묘사 어휘예요.","words":[{"w":"rise sharply","pos":"동사구","ipa":"/ˌraɪz ˈʃɑːpli/","vi":"급격히 오르다","use":"rise + sharply + to/by + 수치; 명사: a sharp rise in + N (※ rise는 자동사라서 수동태 ✗, 'raise'와 구별하세요)","ex":["The number of car owners began to rise sharply after 2005, reaching 6 million.","Coffee prices are expected to rise sharply by almost 40% between 2025 and 2030."],"syn":"increase dramatically"},{"w":"increase steadily","pos":"동사구","ipa":"/ɪnˌkriːs ˈstedɪli/","vi":"꾸준히 증가하다","use":"increase + steadily + from X to Y; a steady increase in + N","ex":["Internet users increased steadily from 20% in 2000 to 75% in 2020.","Spending on healthcare increased steadily throughout the 15-year period."],"syn":"grow gradually"},{"w":"decline gradually","pos":"동사구","ipa":"/dɪˌklaɪn ˈɡrædʒuəli/","vi":"서서히 감소하다","use":"decline + gradually + to + 수치; a gradual decline in + N","ex":["Coal consumption declined gradually to 15 million tonnes by 2015.","The birth rate in Korea declined gradually over the following thirty years."],"syn":"fall slowly"},{"w":"fluctuate","pos":"동사","ipa":"/ˈflʌktʃueɪt/","vi":"등락을 거듭하다","use":"fluctuate + between X and Y / around + 수치","ex":["Oil prices fluctuated between 60 and 80 dollars a barrel in 2019.","Visitor numbers fluctuated around 2,000 per month before rising in summer."],"syn":"go up and down"},{"w":"remain stable","pos":"동사구","ipa":"/rɪˌmeɪn ˈsteɪbl/","vi":"안정적으로 유지되다","use":"remain stable + at + 수치; remain + stable/unchanged","ex":["The unemployment rate remained stable at about 4% from 2012 to 2016.","Rice production remained stable for a decade, at roughly 40 million tonnes."],"syn":"stay the same"},{"w":"plateau","pos":"동사","ipa":"/ˈplætəʊ/","vi":"정체하다, 횡보하다","use":"plateau + at + 수치; 명사로도 써요: reach a plateau","ex":["Sales of smartphones plateaued at around 1.4 billion units after 2016.","Car exports grew quickly until 2008 and then plateaued at 3 million."],"syn":"level off"},{"w":"reach a peak","pos":"동사구","ipa":"/ˌriːtʃ ə ˈpiːk/","vi":"최고점에 이르다","use":"reach a peak + of + 수치 + in + 연도","ex":["Tourist arrivals reached a peak of 18 million in 2019.","Electricity demand reaches a peak in July, at about 90 gigawatts."],"syn":"hit the highest point"},{"w":"hit a low","pos":"동사구","ipa":"/ˌhɪt ə ˈləʊ/","vi":"최저점을 찍다","use":"hit a low + of + 수치 + in + 연도","ex":["Ticket sales hit a low of 500,000 in 2020 because of the pandemic.","Water levels in the dam hit a low in August before recovering."],"syn":"fall to the lowest point"},{"w":"the majority of","pos":"명사구","ipa":"/ðə məˈdʒɒrəti əv/","vi":"대부분의","use":"the majority of + 복수 가산명사 + 복수 동사; the vast majority of (※ the majority of 뒤의 동사는 복수형: The majority of students are ...)","ex":["The majority of students in 2020 travelled to school by bus.","In 1990, the vast majority of energy came from coal, at 70%."],"syn":"most"},{"w":"a third","pos":"명사구","ipa":"/ə ˈθɜːd/","vi":"3분의 1","use":"a third / two thirds + of + N; 약 33%에 해당해요","ex":["Around a third of all household waste was recycled in 2015.","Two thirds of the budget was spent on staff, compared with a third on equipment."],"syn":"33 per cent"},{"w":"account for","pos":"동사구","ipa":"/əˈkaʊnt fɔː/","vi":"(비율을) 차지하다","use":"주어 + account for + X% + of + N (※ be accounted for ✗: 수동태로 쓰지 않아요)","ex":["Rice accounted for 45% of total farm exports in 2010.","Online shopping now accounts for nearly a quarter of all retail sales."],"syn":"make up"},{"w":"proportion","pos":"명사","ipa":"/prəˈpɔːʃn/","vi":"비율","use":"the proportion of + N + who/that; a large / small proportion","ex":["The proportion of elderly people rose from 8% to 15% between 2000 and 2020.","Only a small proportion of workers, about 5%, cycled to the office."],"syn":"share"},{"w":"percentage","pos":"명사","ipa":"/pəˈsentɪdʒ/","vi":"퍼센트, 백분율","use":"the percentage of + N; a high / low percentage","ex":["The percentage of households with a computer doubled from 30% to 60%.","Japan had the highest percentage of people over 65, at 28%."],"syn":"rate"},{"w":"twice as many as","pos":"형용사구","ipa":"/ˌtwaɪs əz ˈmeni əz/","vi":"두 배의 (수)","use":"가산명사와 함께 씀; twice as many + N + as; 불가산명사일 때는 twice as much","ex":["In 2015, there were 4 million cars, twice as many as in 1995.","Germany exported 30,000 tractors, almost twice as many as France did."],"syn":"double the number of"},{"w":"in contrast","pos":"전치사구","ipa":"/ɪn ˈkɒntrɑːst/","vi":"반대로, 그에 비해","use":"문장 맨 앞 + 쉼표; in contrast to/with + N","ex":["Sales in Asia grew by 20%. In contrast, European sales fell slightly.","In contrast to men, women spent twice as long on housework in 2010."],"syn":"on the other hand"},{"w":"compared with","pos":"전치사구","ipa":"/kəmˈpeəd wɪð/","vi":"~와 비교해서","use":"compared with/to + N; 절의 맨 앞이나 맨 뒤에 놓아요","ex":["Compared with 2000, the number of tourists in 2020 was three times higher.","Seoul received 120 mm of rain in May, compared with only 20 mm in January."],"syn":"in
