 comparison with"},{"w":"slightly higher than","pos":"형용사구","ipa":"/ˌslaɪtli ˈhaɪə ðən/","vi":"~보다 약간 높은","use":"slightly / significantly + higher/lower + than + N","ex":["The figure for women was slightly higher than that for men, at 52%.","In 2020, rents in Busan were slightly higher than those in Daegu."],"syn":"a little above"},{"w":"the largest share","pos":"명사구","ipa":"/ðə ˌlɑːdʒɪst ˈʃeə/","vi":"가장 큰 비중","use":"have / account for + the largest share + of + N","ex":["Transport had the largest share of energy use, at 38% in 2020.","Smartphones accounted for the largest share of electronics sales."],"syn":"the biggest proportion"},{"w":"over the period","pos":"전치사구","ipa":"/ˌəʊvə ðə ˈpɪəriəd/","vi":"해당 기간 동안","use":"over the period + shown / from X to Y; 개요(overview)에서 자주 써요","ex":["Over the period shown, the population of the city almost doubled.","Water use in farming fell by 10% over the period from 1990 to 2010."],"syn":"during the timeframe"},{"w":"overall","pos":"부사","ipa":"/ˌəʊvərˈɔːl/","vi":"전반적으로, 대체로","use":"Overall, + 전체를 요약하는 절 (개요 문단의 맨 앞에 써요)","ex":["Overall, the number of students studying abroad rose between 2005 and 2020.","Overall, wind power grew the fastest, while coal use fell by half."],"syn":"in general"},{"w":"respectively","pos":"부사","ipa":"/rɪˈspektɪvli/","vi":"각각, 차례대로","use":"A and B + V + X and Y, respectively (문장 맨 끝에 놓아요)","ex":["Japan and Korea spent 3% and 4.5% of GDP on research, respectively.","The figures for 2000 and 2020 were 12 million and 19 million respectively."],"syn":"in that order"},{"w":"approximately","pos":"부사","ipa":"/əˈprɒksɪmətli/","vi":"대략, 약","use":"approximately + 수치; about / around / roughly로 바꿔 쓸 수 있어요","ex":["Approximately 60% of the electricity came from gas in 2015.","The project cost approximately 2 billion dollars over five years."],"syn":"about"},{"w":"figure","pos":"명사","ipa":"/ˈfɪɡə/","vi":"수치, 통계 수치","use":"the figure for + N/연도 + was/stood at + 수치","ex":["The figure for Japan stood at 8 million visitors in 2016.","By 2020, the figure had risen to 18 million, more than double."],"syn":"number"},{"w":"double","pos":"동사","ipa":"/ˈdʌbl/","vi":"두 배로 늘다","use":"자동사; double + from X to Y; triple = 세 배로 늘다","ex":["The number of online shoppers doubled from 5 million to 10 million.","Average house prices doubled between 2005 and 2015 in the capital."],"syn":"increase twofold"},{"w":"a dramatic increase","pos":"명사구","ipa":"/ə drəˌmætɪk ˈɪnkriːs/","vi":"급격한 증가","use":"there was a dramatic increase + in + N; see / experience + a dramatic increase","ex":["There was a dramatic increase in solar power, from 2% to 15% by 2020.","The 1990s saw a dramatic increase in the number of mobile phone users."],"syn":"a sharp rise"},{"w":"a slight drop","pos":"명사구","ipa":"/ə ˌslaɪt ˈdrɒp/","vi":"소폭 감소","use":"there was a slight drop + in + N; a slight drop + to + 수치","ex":["There was a slight drop in exports in 2009, to 41 billion dollars.","After a slight drop in 2012, sales recovered and reached 3 million units."],"syn":"a small decrease"},{"w":"by the end of","pos":"전치사구","ipa":"/baɪ ði ˈend əv/","vi":"~말까지는","use":"by the end of + 기간 + 완료 시제 (had + 과거분사)","ex":["By the end of the period, the figure had fallen to just 5%.","By the end of 2020, almost every household had access to the internet."],"syn":"by the close of"},{"w":"the following decade","pos":"명사구","ipa":"/ðə ˌfɒləʊɪŋ ˈdekeɪd/","vi":"그다음 10년","use":"in / over + the following decade / year / five years","ex":["Car ownership remained low until 1990 but tripled in the following decade.","Over the following decade, the share of renewable energy rose to 25%."],"syn":"the next ten years"},{"w":"is heated","pos":"동사구","ipa":"/ɪz ˈhiːtɪd/","vi":"가열된다","use":"현재 수동태; is heated + to + 온도 + in + 장치","ex":["In the next stage, the mixture is heated to 1,500°C in a furnace.","The water is heated by solar panels before it is stored in a tank."],"syn":"is warmed"},{"w":"is transported","pos":"동사구","ipa":"/ɪz trænˈspɔːtɪd/","vi":"운반된다","use":"수동태; is transported + to + 장소 + by + 운송 수단","ex":["The finished glass is transported to shops by lorry.","After drying, the coffee is transported to factories for roasting."],"syn":"is delivered"},{"w":"is collected","pos":"동사구","ipa":"/ɪz kəˈlektɪd/","vi":"수거된다","use":"수동태; is collected + from + 장소 + and then + 과거분사","ex":["Rainwater is collected from roofs and stored in an underground tank.","First, used plastic is collected from households once a week."],"syn":"is gathered"},{"w":"is mixed with","pos":"동사구","ipa":"/ɪz ˈmɪkst wɪð/","vi":"~와 섞인다","use":"수동태; A is mixed with B + to form / to produce + N","ex":["The clay is mixed with water to form a thick paste.","At stage three, the crushed rock is mixed with sand and cement."],"syn":"is combined with"},{"w":"the final stage","pos":"명사구","ipa":"/ðə ˌfaɪnl ˈsteɪdʒ/","vi":"마지막 단계","use":"in the final stage, + 수동태 절; the process consists of + 숫자 + stages","ex":["In the final stage, the bricks are packed and delivered to customers.","The final stage of the 8-step process involves testing each product."],"syn":"the last step"},{"w":"was replaced by","pos":"동사구","ipa":"/wəz rɪˈpleɪst baɪ/","vi":"~로 교체되었다","use":"과거 수동태; A was replaced by B (지도 묘사)","ex":["By 2010, the old market was replaced by a modern shopping centre.","The farmland to the east was replaced by a housing estate in 2005."],"syn":"gave way to"},{"w":"was converted into","pos":"동사구","ipa":"/wəz kənˈvɜːtɪd ˈɪntuː/","vi":"~로 바뀌었다","use":"수동태; A was converted into B (용도가 바뀐 경우)","ex":["The old factory was converted into an art gallery in 2015.","Between 1990 and 2020, the railway line was converted into a cycle path."],"syn":"was turned into"},{"w":"was demolished","pos":"동사구","ipa":"/wəz dɪˈmɒlɪʃt/","vi":"철거되었다","use":"수동태; was demolished + to make way for + N","ex":["The fire station was demolished in 2008 and a car park was built.","An old cinema near the river was demolished in 1998 to build flats."],"syn":"was knocked down"},{"w":"was extended","pos":"동사구","ipa":"/wəz ɪkˈstendɪd/","vi":"확장되었다, 연장되었다","use":"수동태; was extended + to + 장소 / by + 길이","ex":["The main road was extended to the new airport by 2015.","The school was extended to include a sports hall and a library."],"syn":"was enlarged"},{"w":"make way for","pos":"동사구","ipa":"/ˌmeɪk ˈweɪ fɔː/","vi":"~에 자리를 내주다","use":"to make way for + N (주로 was demolished / was cleared 뒤에 써요)","ex":["The forest was cleared in 2000 to make way for a golf course.","Several shops were knocked down to make way for a wider road."],"syn":"clear space for"},{"w":"to the north of","pos":"전치사구","ipa":"/tə ðə ˈnɔːθ əv/","vi":"~의 북쪽에","use":"to the north / south / east / west + of + 장소","ex":["A new hospital was built to the north of the town centre in 2012.","To the north of the lake, the woodland remained unchanged."],"syn":"north of"},{"w":"undergo significant changes","pos":"동사구","ipa":"/ˌʌndəˈɡəʊ sɪɡˌnɪfɪkənt ˈtʃeɪndʒɪz/","vi":"큰 변화를 겪다","use":"주어(장소) + undergo/underwent + significant changes + between","ex":["The village underwent significant changes between 1995 and 2020.","According to the plan, the harbour will undergo significant changes by 2030."],"syn":"change considerably"}]}];
const GUNITS=[{"n":1,"en":"Present tenses","vi":"현재 시제","ielts":"Speaking Part 1에서 습관, 일, 공부를 말할 때, 그리고 Writing Task 2에서 일반적인 사실이나 과거부터 지금까지의 변화를 쓸 때 사용해요.","points":[{"h":"현재 단순: 습관과 사실","body":"현재 단순(present simple)은 습관, 반복되는 일, 일반적인 사실에 써요. 주어가 3인칭 단수(he, she, it, the chart...)이면 동사에 반드시 -s/-es를 붙여야 해요. 한국어에는 이런 주어-동사 일치가 없어서 한국 학습자가 가장 자주 빠뜨리는 부분이에요.","ex":["Most students in my city take the bus to school.","The chart shows the number of visitors to three museums."]},{"h":"현재 진행: 지금 진행 중인 일, 일시적인 일","body":"am/is/are + V-ing는 말하는 시점이나 그 무렵에 진행 중인 일, 그리고 변화하고 있는 추세에 써요.","ex":["I'm preparing for the IELTS exam at the moment.","More and more people are working from home these days."]},{"h":"현재 완료: 과거부터 지금까지","body":"have/has + 과거분사(V3)는 과거에 시작해서 지금과 관련이 있는 행동에 써요. 구체적인 시점은 말하지 않아요. since, for, already, yet, ever, recently와 자주 같이 써요.","ex":["The government has built three new hospitals since 2020.","Have you ever studied abroad?"]},{"h":"현재 완료 진행: 과정 강조","body":"have/has been + V-ing는 지금까지 계속 이어지는 활동(앞으로도 계속될 수 있어요)을 강조할 때 써요.","ex":["I have been learning English for five years.","Air pollution has been getting worse in recent years."]},{"h":"Since와 for","body":"Since + 시작 시점(since 2019, since I was a child); for + 기간(for three years, for a long time). 둘 다 보통 현재 완료와 함께 쓰고, 현재 단순과는 쓰지 않아요. 한국어 '3년째 살고 있어요'를 'I live here for three years'로 옮기기 쉬운데, 'I have lived here for three years'가 맞아요.","ex":["She has worked at the hospital since 2018.","We have lived in this flat for six years."]}],"mistakes":[{"wrong":"She go to work by bus every day.","right":"She goes to work by bus every day.","why":"주어가 3인칭 단수라서 동사에 -es를 붙여야 해요."},{"wrong":"I live in Busan since 2018.","right":"I have lived in Busan since 2018.","why":"Since + 시작 시점은 과거부터 지금까지를 나타내므로 현재 완료를 써야 해요."},{"wrong":"I am study English now.","right":"I am studying English now.","why":"현재 진행 시제에는 be + V-ing가 필요해요. be + 동사원형은 쓸 수 없어요."}],"quiz":[{"t":"mcq","q":"My sister ___ in a bank in Seoul.","o":["work","works","working","is work"],"a":1,"why":"주어 'my sister'는 3인칭 단수이고 평소에 하는 일을 말하므로 'works'를 써요."},{"t":"fill","q":"The sun ___ (rise) in the east.","a":["rises"],"why":"변하지 않는 사실은 현재 단순으로 쓰고, 주어가 단수라서 -s를 붙여요."},{"t":"mcq","q":"Look! The students ___ outside the library.","o":["are protesting","protest","protests","has protested"],"a":0,"why":"'Look!'은 지금 눈앞에서 일어나는 일을 가리키므로 현재 진행을 써요."},{"t":"mcq","q":"How often ___ you use public transport?","o":["are","does","do","have"],"a":2,"why":"주어가 'you'인 현재 단순 의문문에서 습관을 물을 때는 조동사 'do'를 써요."},{"t":"fill","q":"I ___ (not/understand) this question. Can you explain it?","a":["don't understand","do not understand"],"why":"'Understand'는 상태 동사라서 현재 단순 부정형 'don't understand'를 써요."},{"t":"mcq","q":"I ___ in this company for three years, and I still enjoy it.","o":["work","am working","worked","have worked"],"a":3,"why":"'For three years'는 지금까지의 기간이므로 현재 완료 'have worked'를 써요."},{"t":"mcq","q":"Have you ever ___ a presentation in English?","o":["gave","given","give","giving"],"a":1,"why":"현재 완료에서 'have' 뒤에는 과거분사(V3) 'given'을 써요."},{"t":"fill","q":"The number of cars in Busan ___ (increase) dramatically since 2010.","a":["has increased","'s increased","has been increasing"],"why":"'Since 2010'은 과거부터 지금까지의 기간을 나타내므로 현재 완료를 써요. 'the number'는 단수라서 'has'를 써요."},{"t":"mcq","q":"At the moment, my city ___ a new metro line.","o":["builds","has built","build","is building"],"a":3,"why":"'At the moment'는 지금 진행 중인 일을 나타내므로 현재 진행을 써요."},{"t":"mcq","q":"Which sentence is correct?","o":["I know the answer.","I am knowing the answer.","I knowing the answer.","I am know the answer."],"a":0,"why":"'Know'는 상태 동사라서 진행형으로 쓰지 않아요."},{"t":"fill","q":"She looks tired because she ___ (study) since 6 a.m.","a":["has been studying","'s been studying","has studied","'s studied"],"why":"계속 이어진 활동이 지금의 결과(피곤해 보임)로 남아 있으므로 현재 완료 진행을 써요."},{"t":"mcq","q":"The graph ___ the percentage of households with internet access between 2000 and 2020.","o":["showing","show","shows","is show"],"a":2,"why":"그래프를 설명할 때는 현재 단순을 써요. 'the graph'는 단수라서 'shows'를 써요."},{"t":"mcq","q":"Students in Korea usually ___ a national exam at the end of high school.","o":["are taking","takes","have taken","take"],"a":3,"why":"'Usually'는 규칙적으로 반복되는 일을 나타내므로 현재 단순을 써요. 주어가 복수라서 'take'를 써요."},{"t":"fill","q":"How long have you ___ (know) your best friend?","a":["known"],"why":"현재 완료에서 'have' 뒤에는 과거분사(V3)를 써요. 'know'는 상태 동사라서 'been knowing'은 쓰지 않아요."},{"t":"mcq","q":"Unemployment ___ since the new factory opened last year.","o":["falls","is falling","has fallen","fell"],"a":2,"why":"'Since + 시작 시점'에는 현재 완료를 써야 해요."},{"t":"fill","q":"Researchers ___ (work) on this vaccine for over ten years, and they still haven't finished.","a":["have been working","'ve been working","have worked","'ve worked"],"why":"과거에 시작해서 지금까지 이어지고 아직 끝나지 않은 활동이므로 현재 완료를 써요(진행형이 가장 자연스러워요)."}]},{"n":2,"en":"Continuous tenses","vi":"진행 시제","ielts":"Writing Task 2에서 변화하고 있는 추세를 설명할 때, 그리고 Speaking Part 2에서 이야기의 배경을 말할 때 도움이 돼요.","points":[{"h":"기본 구조: be + V-ing","body":"진행 시제(continuous tenses)는 모두 be + V-ing를 써서, 어느 시점에 진행 중이고 아직 끝나지 않은 행동을 나타내요.","ex":["I am writing my essay now.","They were discussing the budget when I arrived."]},{"h":"일시적인 상황과 지속적인 상황","body":"일시적인 상황에는 진행형을 쓰고, 오래 이어지거나 늘 그런 상황에는 단순 시제를 써요.","ex":["I live in Daegu, but I'm staying with my aunt in Seoul this month.","She usually works in the office, but this week she's working from home."]},{"h":"상태 동사 (stative verbs)","body":"know, believe, understand, own, belong, need, prefer, seem, contain처럼 생각, 감정, 소유, 감각을 나타내는 동사는 보통 진행형으로 쓰지 않아요. 한국어 '알고 있다', '믿고 있다'를 그대로 옮겨 'I am knowing'이라고 쓰는 실수가 많아요.","ex":["Many people believe that technology makes life easier.","This report contains important data."]},{"h":"뜻이 두 가지인 동사","body":"think, have, see, taste 같은 동사는 '동작'을 나타낼 때는 진행형이 가능하지만 '상태'를 나타낼 때는 안 돼요 (think = ~라고 생각하다, have = 소유하다).","ex":["I think online learning is useful.","I'm thinking about changing my job."]},{"h":"과거 진행: 이야기의 배경","body":"오래 진행 중이던 행동에는 was/were + V-ing를, 그 사이에 끼어든 짧은 행동에는 과거 단순을 써요 (보통 when/while과 함께 써요).","ex":["While I was studying, my phone rang.","It was raining heavily when we left the office."]}],"mistakes":[{"wrong":"I am knowing many people in this city.","right":"I know many people in this city.","why":"'Know'는 상태 동사라서 진행형으로 쓰지 않아요."},{"wrong":"While I studied, my phone was ringing.","right":"While I was studying, my phone rang.","why":"배경이 되는 긴 행동에는 과거 진행을, 그 사이에 끼어든 짧은 행동에는 과거 단순을 써요."},{"wrong":"Nowadays, the population of big cities grow quickly.","right":"Nowadays, the population of big cities is growing quickly.","why":"지금 변화하고 있는 추세이므로 현재 진행을 써요. 'the population'은 단수예요."}],"quiz":[{"t":"mcq","q":"Please be quiet. The teacher ___ an important announcement.","o":["makes","is making","make","made"],"a":1,"why":"지금 말하는 순간에 진행 중인 일이므로 현재 진행을 써요."},{"t":"fill","q":"Right now, Ji-woo ___ (prepare) for her IELTS speaking test.","a":["is preparing","'s preparing"],"why":"'Right now'는 지금 진행 중인 일을 나타내므로 is + V-ing를 써요."},{"t":"mcq","q":"I ___ what you mean.","o":["understand","am understanding","understanding","am understand"],"a":0,"why":"'Understand'는 상태 동사라서 현재 단순을 써요."},{"t":"mcq","q":"This laptop ___ to my brother, not to me.","o":["is belonging","belong","belonging","belongs"],"a":3,"why":"'Belong'은 소유를 나타내는 상태 동사예요. 주어가 단수라서 'belongs'를 써요."},{"t":"fill","q":"At 8 p.m. yesterday, I ___ (watch) a documentary about climate change.","a":["was watching"],"why":"과거의 특정 시점에 진행 중이던 행동이므로 과거 진행을 써요."},{"t":"mcq","q":"At the moment, I ___ about applying for a master's degree in Australia.","o":["am thinking","think","thinks","have think"],"a":0,"why":"여기서 'Think about'은 의견이 아니라 고민하는 중인 활동이므로 진행형을 써요."},{"t":"mcq","q":"The researchers ___ the data when the computer suddenly crashed.","o":["analysed","analyse","were analysing","have analysed"],"a":2,"why":"진행 중이던 긴 행동이 짧은 행동(컴퓨터 고장)에 끊겼으므로 과거 진행을 써요."},{"t":"fill","q":"My father usually drives to work, but this week he ___ (take) the bus because his car is broken.","a":["is taking","'s taking"],"why":"'This week'은 평소 습관과 다른 일시적인 상황을 나타내므로 현재 진행을 써요."},{"t":"mcq","q":"Which sentence is correct?","o":["We are having a big house near the river.","We having a big house near the river.","We has a big house near the river.","We have a big house near the river."],"a":3,"why":"소유를 뜻하는 'Have'는 상태 동사라서 진행형으로 쓰지 않아요."},{"t":"fill","q":"This soup ___ (taste) delicious. What did you put in it?","a":["tastes"],"why":"여기서 'Taste'는 맛이 어떤지(특징)를 나타내는 상태 동사라서 현재 단순을 써요."},{"t":"mcq","q":"Global temperatures ___ at the moment, and scientists are worried.","o":["rise","rises","are rising","have rise"],"a":2,"why":"'At the moment'와 변화하는 추세를 나타내므로 현재 진행을 써요. 주어가 복수라서 'are'를 써요."},{"t":"mcq","q":"She ___ tired today. Maybe she didn't sleep well.","o":["is seeming","seems","seem","seeming"],"a":1,"why":"'Seem'은 상태 동사라서 현재 단순 'seems'를 써요."},{"t":"fill","q":"I ___ (wait) for the bus for 40 minutes, and it still hasn't come.","a":["have been waiting","'ve been waiting","have waited","'ve waited"],"why":"지금까지 계속 이어지는 행동이고 기간을 강조하므로 현재 완료 진행을 써요."},{"t":"mcq","q":"I ___ home when it started to rain heavily.","o":["was walking","have walked","am walking","walk"],"a":0,"why":"과거에 진행 중이던 긴 행동 중에 비가 끼어들었으므로 과거 진행을 써요."},{"t":"mcq","q":"The company ___ more staff because demand is increasing.","o":["is needing","need","needing","needs"],"a":3,"why":"'Need'는 상태 동사라서 현재 단순을 써요. 주어가 단수라서 'needs'를 써요."},{"t":"fill","q":"The doctor can't see you now; she ___ (have) a meeting with a patient's family.","a":["is having","'s having"],"why":"'Have a meeting'은 소유가 아니라 진행 중인 활동이므로 현재 진행을 써요."}]},{"n":3,"en":"Past tenses","vi":"과거 시제","ielts":"Speaking Part 2에서 과거 이야기를 할 때, 그리고 Writing Task 1에서 지나간 연도의 수치를 설명할 때 매우 중요해요.","points":[{"h":"과거 단순: 끝난 일","body":"과거 단순(past simple)은 과거의 정해진 시점에 끝난 행동에 써요 (yesterday, in 2015, two years ago).","ex":["In 2010, about 30% of households owned a computer.","I graduated from university two years ago."]},{"h":"과거 진행: 배경","body":"was/were + V-ing는 과거에 진행 중이던 행동에 써요. 보통 더 짧은 행동이 중간에 끼어들어요.","ex":["I was living in Gwangju when I first met her.","While I was preparing dinner, the power went off."]},{"h":"과거 완료: 먼저 일어난 일","body":"had + 과거분사(V3)는 과거의 다른 행동이나 시점보다 먼저 일어난 행동에 써요. by the time, before, already와 자주 같이 써요.","ex":["When I got to the station, the train had already left.","By 2015, the city had built two new bridges."]},{"h":"Used to와 would: 예전의 습관","body":"Used to + 동사원형은 과거에는 그랬지만 지금은 그렇지 않은 습관이나 상태를 나타내요. Would + 동사원형도 과거에 반복된 행동에 쓰지만, 상태(be, have, live...)에는 쓰지 않아요.","ex":["I used to walk to school when I was a child.","My grandmother would tell us stories every evening."]},{"h":"과거 단순일까, 현재 완료일까?","body":"이미 끝난 구체적인 시점이 있으면 과거 단순을 쓰고, 시점을 말하지 않거나 지금과 관련이 있으면 현재 완료를 써요. 한국어는 '작년에 갔어요'와 '가 본 적이 있어요'를 모두 과거형으로 말해서, 이 둘을 구별하지 못하는 경우가 많아요.","ex":["I visited Singapore in 2019.","I have visited Singapore twice."]}],"mistakes":[{"wrong":"I have finished university in 2021.","right":"I finished university in 2021.","why":"과거의 구체적인 시점(in 2021)이 있으므로 과거 단순을 써요."},{"wrong":"Yesterday I go to the library to study.","right":"Yesterday I went to the library to study.","why":"'Yesterday'는 과거를 나타내므로 동사를 과거 단순으로 바꿔야 해요."},{"wrong":"I use to play football every weekend when I was young.","right":"I used to play football every weekend when I was young.","why":"긍정문에서는 'used to'처럼 -d를 붙여서 써야 해요."}],"quiz":[{"t":"mcq","q":"Last year, our school ___ a new science lab.","o":["opens","opened","has opened","is opening"],"a":1,"why":"'Last year'는 이미 끝난 시점이므로 과거 단순을 써요."},{"t":"fill","q":"I ___ (buy) my first smartphone in 2015.","a":["bought"],"why":"'In 2015'는 과거의 구체적인 시점이에요. 'buy'는 불규칙 동사로, 과거형은 'bought'예요."},{"t":"mcq","q":"___ you go to the conference last week?","o":["Did","Do","Were","Have"],"a":0,"why":"일반동사의 과거 단순 의문문에는 조동사 'Did'를 써요."},{"t":"fill","q":"We ___ (not/have) internet at home when I was a child.","a":["didn't have","did not have"],"why":"과거 단순의 부정문은 didn't + 동사원형이에요."},{"t":"mcq","q":"I ___ to music when my teacher called me.","o":["listen","am listening","was listening","have listened"],"a":2,"why":"진행 중이던 행동이 전화에 끊겼으므로 과거 진행을 써요."},{"t":"mcq","q":"When we arrived at the cinema, the film ___.","o":["already starts","has already started","had already started","is already starting"],"a":2,"why":"영화는 우리가 도착하기 전에 시작했으므로(둘 다 과거) 과거 완료를 써요."},{"t":"mcq","q":"My grandfather ___ smoke, but he stopped ten years ago.","o":["used to","use to","was used to","would used to"],"a":0,"why":"지금은 하지 않는 과거의 습관에는 'used to + 동사원형'을 써요."},{"t":"fill","q":"In 1990, only 10% of people in the country ___ (own) a car.","a":["owned"],"why":"지나간 연도의 수치에는 과거 단순을 써요."},{"t":"mcq","q":"I ___ my keys, so I couldn't get into the house.","o":["lose","had lost","have lost","was losing"],"a":1,"why":"열쇠를 잃어버린 일이 집에 못 들어간 일(과거)보다 먼저 일어났으므로 과거 완료를 써요."},{"t":"mcq","q":"Which sentence is correct?","o":["I have seen him yesterday.","I see him yesterday.","I had saw him yesterday.","I saw him yesterday."],"a":3,"why":"'Yesterday'는 구체적인 시점이므로 현재 완료가 아니라 과거 단순을 써요."},{"t":"fill","q":"While she ___ (drive) to work, she heard the news on the radio.","a":["was driving"],"why":"'while' 뒤에는 진행 중이던 긴 행동이 오므로 과거 진행을 써요."},{"t":"mcq","q":"Between 2000 and 2010, the price of rice ___ by 40%.","o":["has risen","rises","had rise","rose"],"a":3,"why":"과거에 완전히 끝난 기간이므로 과거 단순을 써요."},{"t":"mcq","q":"When I was a student, I ___ in the library every evening.","o":["would study","would studied","was used to study","use to study"],"a":0,"why":"'Would + 동사원형'은 과거에 반복된 행동을 나타내요."},{"t":"fill","q":"By the time the report was published, the company ___ (close) two of its factories.","a":["had closed","'d closed"],"why":"'By the time' + 과거 시점: 공장이 문을 닫은 일이 먼저 일어났으므로 과거 완료를 써요."},{"t":"mcq","q":"I ___ a lot of time on social media, but now I hardly use it.","o":["am used to spend","have spent","spend","used to spend"],"a":3,"why":"과거의 습관이 지금은 바뀌었으므로 'used to'를 써요."},{"t":"fill","q":"I didn't recognise the city because it ___ (change) so much since my last visit.","a":["had changed","'d changed"],"why":"변화가 과거의 'didn't recognise' 시점보다 먼저 일어났으므로 과거 완료를 써요."}]},{"n":4,"en":"Future 1 (will, be going to, present continuous for future)","vi":"미래 1 (will, be going to, 미래를 나타내는 현재 진행)","ielts":"Speaking Part 1과 3에서 계획이나 예측을 말할 때, 그리고 Writing Task 2에서 미래의 추세를 예측할 때 써요.","points":[{"h":"Will: 즉석에서 내린 결정, 약속","body":"will + 동사원형은 말하는 순간에 내린 결정, 약속, 도움 제안에 써요.","ex":["OK, I'll take the bus then.","I'll help you with your homework after class."]},{"h":"Will: 의견에 따른 예측","body":"will은 개인적인 생각이나 믿음에 바탕을 둔 예측에 써요. I think, probably, I'm sure, perhaps와 자주 같이 써요.","ex":["I think robots will replace many jobs in the future.","Cities will probably become more crowded."]},{"h":"Be going to: 이미 정한 계획","body":"be going to + 동사원형은 말하기 전에 이미 정해 둔 의도나 계획에 써요.","ex":["I'm going to take the IELTS test in December.","The council is going to build a new park."]},{"h":"Be going to: 근거가 있는 예측","body":"be going to는 지금 눈에 보이는 징후를 근거로 예측할 때 써요.","ex":["Look at those dark clouds. It's going to rain.","The company is losing money every month; it's going to close."]},{"h":"미래를 나타내는 현재 진행과 현재 단순","body":"현재 진행은 이미 잡아 둔 개인 약속(시간, 사람, 장소가 정해진 것)에 쓰고, 현재 단순은 기차, 수업 시간표처럼 정해진 일정에 써요. when, if, as soon as, before 뒤에서도 will이 아니라 현재 단순을 써요. 한국어는 '내일 비가 오면'처럼 미래 조건에도 현재형을 쓰지 않아서 'If it will rain tomorrow'라고 쓰기 쉬워요.","ex":["I'm meeting my tutor at 3 p.m. tomorrow.","The train leaves at 7.15 tomorrow morning."]}],"mistakes":[{"wrong":"When I will finish university, I will look for a job.","right":"When I finish university, I will look for a job.","why":"미래를 나타내는 시간 절에서 'when' 뒤에는 현재 단순을 써요."},{"wrong":"I will to study abroad next year.","right":"I will study abroad next year.","why":"'will' 뒤에는 'to' 없는 동사원형을 써요."},{"wrong":"Tomorrow I meet my professor at 10 a.m.","right":"Tomorrow I'm meeting my professor at 10 a.m.","why":"미리 잡아 둔 개인 약속에는 보통 현재 진행을 써요."}],"quiz":[{"t":"mcq","q":"A: The phone is ringing. B: OK, I ___ it.","o":["answer","am answering","answered","'ll answer"],"a":3,"why":"말하는 순간에 내린 결정이므로 'will'을 써요."},{"t":"fill","q":"I promise I ___ (send) you the report tonight.","a":["will send","'ll send"],"why":"약속에는 will + 동사원형을 써요."},{"t":"mcq","q":"I ___ to take the IELTS test next month. I've already registered.","o":["am going","will","go","going"],"a":0,"why":"미리 정해 둔 계획(이미 등록함)이므로 'be going to'를 써요."},{"t":"mcq","q":"Look at that car! It ___ into the wall!","o":["will crash","crashes","is going to crash","crash"],"a":2,"why":"바로 눈앞에 보이는 근거로 예측하므로 'be going to'를 써요."},{"t":"fill","q":"I think electric cars ___ (become) cheaper in the next ten years.","a":["will become","'ll become","are going to become"],"why":"개인적인 의견(I think)에 따른 예측에는 보통 'will'을 써요."},{"t":"mcq","q":"We ___ our manager at 2 p.m. tomorrow — it's in my calendar.","o":["meet","will meeting","met","are meeting"],"a":3,"why":"구체적인 시간이 정해진 약속이므로 현재 진행을 써요."},{"t":"mcq","q":"The next train to Busan ___ at 9.30, so we need to hurry.","o":["leaves","is leave","will leaving","leaving"],"a":0,"why":"기차나 버스 같은 고정된 일정에는 현재 단순을 써요."},{"t":"fill","q":"If the government ___ (invest) in public transport, traffic will improve.","a":["invests"],"why":"미래를 나타내는 'if' 절에는 현재 단순을 써요. 'the government'는 단수라서 -s를 붙여요."},{"t":"mcq","q":"A: I don't have a pen. B: Don't worry. I ___ you mine.","o":["lend","am lending","'ll lend","lent"],"a":2,"why":"말하는 순간에 떠올린 도움 제안에는 'will'을 써요."},{"t":"mcq","q":"Which sentence describes a fixed arrangement?","o":["I'll probably visit my parents.","I think I'll visit my parents.","Maybe I visit my parents.","I'm visiting my parents on Saturday."],"a":3,"why":"구체적인 시간과 함께 쓴 현재 진행은 이미 확정된 계획을 나타내요."},{"t":"fill","q":"She has bought all the materials. She ___ (paint) her room this weekend.","a":["is going to paint","'s going to paint","is painting","'s painting"],"why":"이미 재료를 샀다는 것은 미리 정해 둔 계획이므로 'be going to'(또는 현재 진행)를 써요."},{"t":"mcq","q":"I'll call you as soon as I ___ the results.","o":["will get","get","am going to get","got"],"a":1,"why":"미래를 나타내는 'as soon as' 뒤에는 will이 아니라 현재 단순을 써요."},{"t":"mcq","q":"According to experts, the population of the city ___ 15 million by 2040.","o":["reaches","is reaching","will reach","reached"],"a":2,"why":"전문가의 장기 예측에는 'will'을 써요."},{"t":"fill","q":"Don't worry about the presentation. I'm sure you ___ (do) well.","a":["will do","'ll do"],"why":"'I'm sure' + 개인적인 확신에 따른 예측에는 'will'을 써요."},{"t":"mcq","q":"Unemployment has risen for six months in a row. Experts say it ___ even higher next year.","o":["goes","is going to go","went","has gone"],"a":1,"why":"현재 가지고 있는 수치(근거)를 바탕으로 예측하므로 'be going to'를 써요."},{"t":"fill","q":"The meeting will start after everyone ___ (arrive).","a":["arrives","has arrived"],"why":"미래를 나타내는 시간 절에서 'after' 뒤에는 현재 단순(또는 현재 완료)을 써요. 'everyone'은 단수예요."}]},{"n":5,"en":"Future 2 (future continuous, future perfect, be about to, be due to)","vi":"미래 2 (미래 진행, 미래 완료, be about to, be due to)","ielts":"Writing Task 2에서 정확하게 예측하고, Writing Task 1에서 예측치(projections)를 설명할 때 Grammatical Range 점수를 얻는 데 도움이 돼요.","points":[{"h":"미래 진행: will be + V-ing","body":"미래의 특정 시점에 진행 중일 행동을 나타내요. 다른 사람의 계획을 정중하게 물을 때도 써요.","ex":["This time next year, I will be studying in Melbourne.","At 9 a.m. tomorrow, we'll be taking the exam."]},{"h":"미래 완료: will have + V3","body":"미래의 어떤 시점 전에 끝나 있을 행동을 나타내요. 보통 'by'와 함께 써요 (by 2030, by the end of the year, by the time...).","ex":["By 2030, the city will have built five new metro lines.","By the end of this month, I will have finished my thesis."]},{"h":"미래 완료 진행","body":"Will have been + V-ing는 미래의 어떤 시점까지 이어진 활동의 길이를 강조해요.","ex":["By next June, I will have been working here for ten years.","By 2028, she will have been teaching for two decades."]},{"h":"Be about to: 곧 일어날 일","body":"Be about to + 동사원형은 몇 초, 몇 분 안에 곧 일어날 일을 나타내요. 과거형 'was about to'는 '막 ~하려던 참이었는데...'라는 뜻이에요.","ex":["Hurry up! The lecture is about to start.","I was about to leave when she called."]},{"h":"Be due to: 예정된 일","body":"Be due to + 동사원형은 일정이 잡혔거나 공식적으로 예정된 일을 나타내요. 뉴스나 보고서에서 자주 써요.","ex":["The new airport is due to open in 2027.","The report is due to be published next week."]}],"mistakes":[{"wrong":"By the time you arrive, we will finish dinner.","right":"By the time you arrive, we will have finished dinner.","why":"미래의 어떤 시점 전에 끝나는 행동이므로 will have + V3를 써요."},{"wrong":"The train is about to leaving.","right":"The train is about to leave.","why":"'be about to' 뒤에는 동사원형을 써요."},{"wrong":"This time tomorrow, I will fly to London.","right":"This time tomorrow, I will be flying to London.","why":"미래의 구체적인 시점에 진행 중일 행동이므로 미래 진행을 써요."}],"quiz":[{"t":"mcq","q":"Don't call me at 8 tonight. I ___ my favourite TV show.","o":["will watch","will be watching","watch","will have watched"],"a":1,"why":"정확히 저녁 8시에 진행 중일 일이므로 미래 진행을 써요."},{"t":"fill","q":"Please sit down quickly — the exam is just ___ to begin.","a":["about"],"why":"'Be about to'는 곧바로 일어날 일을 나타내요."},{"t":"mcq","q":"By the end of this year, the company ___ 200 new employees.","o":["will hire","will have hired","hires","will be hiring"],"a":1,"why":"'By the end of this year'는 미래의 기준 시점이고 그 전에 채용이 끝나므로 미래 완료를 써요."},{"t":"mcq","q":"The new bridge is ___ open next spring.","o":["due to","about to","going","due"],"a":0,"why":"공식 일정에는 'be due to + 동사원형'을 써요. 'about to'는 바로 일어날 일에 쓰므로 'next spring'과는 맞지 않아요."},{"t":"fill","q":"This time next week, I ___ (lie) on a beach in Busan.","a":["will be lying","'ll be lying"],"why":"미래의 구체적인 시점에 진행 중일 행동에는 will be + V-ing를 써요."},{"t":"mcq","q":"I was ___ go to bed when I heard a strange noise.","o":["going","about","about to","will"],"a":2,"why":"'Was about to'는 막 무언가를 하려던 순간에 다른 일이 일어났다는 뜻이에요."},{"t":"mcq","q":"By the time we get to the stadium, the match ___.","o":["will start","starts","is starting","will have started"],"a":3,"why":"경기가 우리가 도착하기 전에 시작되므로(미래의 기준 시점) 미래 완료를 써요."},{"t":"fill","q":"By 2035, the government ___ (plant) 10 million trees.","a":["will have planted","'ll have planted"],"why":"'By 2035'는 미래의 기준 시점이고 그 전에 나무 심기가 끝나므로 will have + V3를 써요."},{"t":"mcq","q":"The report is due ___ on Friday.","o":["to publish","to be published","publishing","be published"],"a":1,"why":"보고서가 '발표되는' 것이므로(수동태) 'due to be published'를 써요."},{"t":"mcq","q":"By next month, Minjun ___ for the company for five years.","o":["will work","is working","will have been working","works"],"a":2,"why":"미래의 어떤 시점까지 이어진 시간의 길이를 강조하므로 미래 완료 진행을 써요."},{"t":"fill","q":"Don't phone at 7 p.m.; we ___ (have) dinner then.","a":["will be having","'ll be having"],"why":"정확히 저녁 7시에 진행 중일 일이므로 미래 진행을 써요."},{"t":"mcq","q":"Which sentence is correct?","o":["The flight is due landing at 6 p.m.","The flight is due land at 6 p.m.","The flight due to land at 6 p.m.","The flight is due to land at 6 p.m."],"a":3,"why":"올바른 구조는 'be due to + 동사원형'이에요. 'is'나 'to'를 빠뜨리면 안 돼요."},{"t":"mcq","q":"___ you be using the projector this afternoon? I'd like to borrow it.","o":["Will","Are","Do","Have"],"a":0,"why":"다른 사람의 계획을 정중하게 물을 때는 미래 진행 'Will you be + V-ing'를 써요."},{"t":"fill","q":"By the end of the course, students ___ (learn) over 2,000 new words.","a":["will have learned","will have learnt","'ll have learned","'ll have learnt"],"why":"미래의 'the end of the course' 전에 끝나므로 미래 완료를 써요."},{"t":"mcq","q":"Experts predict that by 2050 the global population ___ nearly 10 billion.","o":["will have reached","has reached","reaches","is reaching"],"a":0,"why":"'By 2050'은 미래의 기준 시점이므로 미래 완료 'will have reached'를 써요."},{"t":"fill","q":"By the time she retires, she ___ (teach) at this school for 35 years.","a":["will have been teaching","will have taught","'ll have been teaching","'ll have taught"],"why":"미래의 은퇴 시점까지 35년이라는 기간이 쌓이므로 미래 완료(진행)를 써요."}]},{"n":6,"en":"Word order & punctuation","vi":"어순과 문장 부호","ielts":"오류 중에서 어순과 쉼표 오류가 채점자 눈에 가장 잘 띄기 때문에, Writing의 Grammatical Range and Accuracy 기준에 직접 영향을 줘요.","points":[{"h":"기본 어순 S – V – O","body":"영어 문장은 주어 – 동사 – 목적어 순서예요. 장소 부사는 보통 시간 부사 앞에 와요. 동사와 목적어 사이에 부사를 끼워 넣지 않아요 (I like very much music ✗ → I like music very much ✓). 한국어는 목적어가 동사 앞에 오고 부사 위치도 자유로워서 어순 실수가 잦아요.","ex":["Many students use smartphones in class every day.","I met my tutor at the library yesterday."]},{"h":"빈도 부사의 위치","body":"Always, usually, often, never... 는 일반동사 앞에 오지만, 'be' 동사 뒤와 조동사 뒤에 와요.","ex":["She always submits her essays on time.","Public transport is often crowded in the morning."]},{"h":"간접 의문문","body":"간접 의문문(Could you tell me..., I don't know..., I wonder...)에서는 의문사 뒤를 평서문 어순으로 써요. 동사를 주어 앞으로 보내지 않아요 (I don't know what is it ✗ → I don't know what it is ✓).","ex":["Could you tell me where the library is?","I don't know why prices have increased so quickly."]},{"h":"형용사 순서","body":"형용사가 여러 개일 때는 의견 – 크기 – 나이 – 색깔 – 출신 – 재료 – 명사 순서로 써요.","ex":["They live in a beautiful old French house.","The city has built a large new concrete bridge."]},{"h":"기본 문장 부호","body":"문장 앞의 연결어(However, ...) 뒤와, 문장 앞에 온 종속절(Although..., ...) 뒤에 쉼표를 써요. 완전한 두 문장을 쉼표만으로 잇지 마세요(comma splice). 마침표, 세미콜론, 접속사를 쓰세요.","ex":["Although the city is crowded, it offers many opportunities.","Prices rose sharply; however, demand remained high."]}],"mistakes":[{"wrong":"I like very much English.","right":"I like English very much.","why":"동사와 목적어 사이에 부사를 두지 않아요."},{"wrong":"Can you tell me where is the station?","right":"Can you tell me where the station is?","why":"간접 의문문은 주어가 동사보다 앞에 오는 어순을 유지해요."},{"wrong":"Pollution is increasing, the government must act.","right":"Pollution is increasing, so the government must act.","why":"두 개의 독립절을 쉼표만으로 잇지 않아요. 접속사를 더하거나 마침표를 쓰세요."}],"quiz":[{"t":"mcq","q":"Choose the correct sentence.","o":["She speaks very well English.","She speaks English very well.","She very well speaks English.","Very well she speaks English."],"a":1,"why":"목적어 'English'는 동사 바로 뒤에 와야 하고, 부사 'very well'은 목적어 뒤에 와요."},{"t":"fill","q":"I ___ (usually/go) to the gym after work.","a":["usually go"],"why":"빈도 부사는 일반동사 앞에 와요."},{"t":"mcq","q":"Which sentence is correct?","o":["He is always late for class.","He always is late for class.","Always he is late for class.","He is late always for class."],"a":0,"why":"빈도 부사는 'be' 동사 뒤에 와요."},{"t":"mcq","q":"Do you know what time ___?","o":["does the lecture start","starts the lecture","the lecture starts","the lecture does start"],"a":2,"why":"간접 의문문은 평서문 어순을 유지해요. 주어 + 동사 순서이고 'does'는 쓰지 않아요."},{"t":"fill","q":"I have ___ (never/see) such a beautiful beach.","a":["never seen"],"why":"부사 'never'는 조동사 'have' 뒤, 과거분사 'seen' 앞에 와요."},{"t":"mcq","q":"Which order is the most natural?","o":["We stayed last summer in Gyeongju.","We in Gyeongju stayed last summer.","Last summer in Gyeongju we stayed.","We stayed in Gyeongju last summer."],"a":3,"why":"자연스러운 순서는 주어 – 동사 – 장소 – 시간이에요."},{"t":"mcq","q":"She bought ___.","o":["a red small Japanese car","a small red Japanese car","a Japanese small red car","a small Japanese red car"],"a":1,"why":"형용사 순서: 크기(small) – 색깔(red) – 출신(Japanese)."},{"t":"fill","q":"Could you tell me where the bus station ___ (be)?","a":["is"],"why":"간접 의문문에서는 동사가 문장 끝의 주어 뒤에 와요."},{"t":"mcq","q":"Which sentence is punctuated correctly?","o":["However, the results were disappointing.","However the results were disappointing.","However; the results were disappointing.","However the results, were disappointing."],"a":0,"why":"문장 앞에 오는 연결어 'However' 바로 뒤에는 쉼표가 필요해요."},{"t":"mcq","q":"Which sentence is punctuated correctly?","o":["Many people moved to the city, they wanted better jobs.","Many people moved to the city because, they wanted better jobs.","Many people moved to the city because they wanted better jobs.","Many people moved to the city. Because they wanted better jobs."],"a":2,"why":"'because'로 두 절을 이을 때 'because' 뒤에는 쉼표를 쓰지 않고, 'because' 절을 따로 떼어 독립된 문장으로 쓰지 않아요."},{"t":"fill","q":"I wonder why the price of petrol ___ (rise) so much recently.","a":["has risen","'s risen","has been rising","rose"],"why":"간접 의문문은 주어 + 동사 어순을 유지해요. 'recently'는 현재 완료와 함께 써요."},{"t":"mcq","q":"Not only ___ the environment, but it also saves money.","o":["recycling protects","does recycling protect","recycling does protect","protects recycling"],"a":1,"why":"'Not only'가 문장 맨 앞에 오면 도치해야 해요: 조동사 + 주어 + 동사."},{"t":"mcq","q":"Choose the correct sentence.","o":["Although the city is crowded it, has many parks.","Although, the city is crowded it has many parks.","Although the city is crowded. It has many parks.","Although the city is crowded, it has many parks."],"a":3,"why":"문장 앞에 온 'Although...' 절은 쉼표로 주절과 구분해요."},{"t":"fill","q":"The project faced many problems; ___, it was completed on time.","a":["however","nevertheless","nonetheless"],"why":"세미콜론 뒤에는 대조를 나타내는 연결 부사를 쓰고, 그 뒤에 쉼표를 써요."},{"t":"mcq","q":"Rarely ___ such a sharp fall in house prices.","o":["have we seen","we have seen","we seen have","have seen we"],"a":0,"why":"부정 부사 'Rarely'가 문장 맨 앞에 오면 도치가 필요해요: 조동사 + 주어."},{"t":"fill","q":"The report, ___ was published last week, shows a rise in obesity.","a":["which"],"why":"비제한적 관계절(쉼표가 있는 절)에는 'that'이 아니라 'which'를 써요."}]},{"n":7,"en":"Subject/verb agreement","vi":"주어와 동사의 일치","ielts":"Writing Task 1(the number of..., the percentage of...)과 Task 2에서 Grammatical Accuracy 점수를 잃는 흔한 오류예요. 한국어에는 주어에 맞춰 동사 형태를 바꾸는 규칙이 없어서 한국 학습자가 특히 자주 틀려요.","points":[{"h":"기본 규칙","body":"단수 주어에는 단수 동사(-s, is, has, was)를, 복수 주어에는 복수 동사(are, have, were)를 써요.","ex":["The student studies hard.","The students study hard."]},{"h":"긴 주어: 중심 명사를 찾기","body":"주어가 긴 구일 때는 동사에 가장 가까운 명사가 아니라, 구의 맨 앞에 있는 중심 명사에 맞춰 동사를 써요.","ex":["The quality of public services is improving.","The houses on this street are very old."]},{"h":"The number of와 A number of","body":"'The number of + 복수 명사'는 단수 동사와 쓰고(수 자체를 말해요), 'A number of + 복수 명사'(= 몇몇의)는 복수 동사와 써요.","ex":["The number of tourists has doubled.","A number of tourists have complained about the hotel."]},{"h":"Each, every, everyone, 불가산명사","body":"Each, every, everyone, nobody, somebody와 불가산명사(information, research, news, traffic)는 단수 동사와 써요.","ex":["Every student has a laptop.","The news is surprising."]},{"h":"주어 자리의 V-ing, there is/are, neither...nor","body":"동명사(V-ing)가 주어이면 단수 동사를 써요. 'there' 뒤에서는 뒤에 오는 명사에 맞춰 동사를 써요. either...or / neither...nor는 가장 가까운 명사에 맞춰 동사를 써요.","ex":["Learning languages takes time.","Neither the teacher nor the students were ready."]}],"mistakes":[{"wrong":"The number of cars have increased.","right":"The number of cars has increased.","why":"'The number of'는 단수 주어라서 'has'를 써요."},{"wrong":"Everyone in my class like music.","right":"Everyone in my class likes music.","why":"'Everyone'은 항상 단수 동사와 써요."},{"wrong":"There is many problems in big cities.","right":"There are many problems in big cities.","why":"'there' 뒤에서는 동사가 복수 명사 'problems'에 맞춰요."}],"quiz":[{"t":"mcq","q":"My brother ___ in a hospital.","o":["work","works","working","are working"],"a":1,"why":"주어 'my brother'가 단수라서 동사에 -s를 붙여요."},{"t":"fill","q":"The students in my class ___ (be) very friendly.","a":["are","were"],"why":"중심 명사가 'students'(복수)이므로 'are'를 써요."},{"t":"mcq","q":"The information you gave me ___ very useful.","o":["were","are","was","have been"],"a":2,"why":"'Information'은 불가산명사라서 단수 동사를 써요."},{"t":"mcq","q":"There ___ a lot of traffic in the city centre today.","o":["is","are","were","have"],"a":0,"why":"'Traffic'은 불가산명사라서 'there is'를 써요."},{"t":"fill","q":"Everyone ___ (want) to live in a safe environment.","a":["wants"],"why":"'Everyone'은 단수 동사와 쓰므로 -s를 붙여요."},{"t":"mcq","q":"The number of international students ___ risen steadily.","o":["have","are","were","has"],"a":3,"why":"'The number of'는 단수 주어라서 'has'를 써요."},{"t":"mcq","q":"A number of employees ___ complained about the new policy.","o":["has","have","is","was"],"a":1,"why":"'A number of'는 '몇몇의'라는 뜻이라서 복수 동사와 써요."},{"t":"fill","q":"Doing regular exercise ___ (help) people reduce stress.","a":["helps"],"why":"동명사(V-ing)가 주어이면 단수 동사를 써요."},{"t":"mcq","q":"The cost of houses in big cities ___ too high for young people.","o":["are","were","is","be"],"a":2,"why":"중심 명사는 'houses'나 'cities'가 아니라 'the cost'(단수)예요."},{"t":"mcq","q":"Neither the manager nor the employees ___ happy with the decision.","o":["was","is","were","has been"],"a":2,"why":"'neither...nor'에서는 동사가 가장 가까운 명사 'employees'(복수)에 맞춰 'were'를 써요."},{"t":"fill","q":"Each of the participants ___ (receive) a certificate at the end of every course.","a":["receives"],"why":"'Each of + 복수 명사'도 단수 동사와 써요."},{"t":"mcq","q":"Mathematics ___ my favourite subject at school.","o":["were","are","have been","was"],"a":3,"why":"'mathematics'처럼 -s로 끝나는 학문 이름도 단수 명사예요."},{"t":"mcq","q":"The majority of the research ___ carried out in Europe.","o":["were","was","are","have been"],"a":1,"why":"'Research'는 불가산명사라서 'the majority of the research'는 단수 동사와 써요."},{"t":"fill","q":"The government's plans for the new airport ___ (be) criticised by local residents.","a":["are","were","have been"],"why":"중심 명사가 'plans'(복수)이므로 동사도 복수형이어야 해요."},{"t":"mcq","q":"One of the main reasons for traffic jams ___ the rapid increase in private cars.","o":["is","are","were","be"],"a":0,"why":"주어는 'reasons'나 'traffic jams'가 아니라 'one'(단수)이에요."},{"t":"fill","q":"Not only the teachers but also the principal ___ (support) the new timetable.","a":["supports","supported"],"why":"'not only...but also'에서는 동사가 가장 가까운 명사 'the principal'(단수)에 맞춰요."}]},{"n":8,"en":"Countable/uncountable nouns","vi":"가산명사와 불가산명사","ielts":"Writing Task 1(the number of / the amount of)과 Task 2에서 information, research, evidence 같은 학술 명사를 쓸 때 중요해요.","points":[{"h":"가산명사와 불가산명사","body":"가산명사는 단수와 복수가 있고 a/an과 함께 쓸 수 있어요. 불가산명사는 복수형이 없고, a/an을 쓰지 않으며, 단수 동사와 써요. 한국어는 명사에 복수형이 거의 없어서 'informations', 'advices', 'researches'처럼 불가산명사에 -s를 붙이는 실수가 많아요.","ex":["She has two books and a laptop.","Water is essential for all living things."]},{"h":"IELTS에서 자주 만나는 불가산명사","body":"Information, advice, research, evidence, equipment, furniture, traffic, accommodation, knowledge, homework, news, transport는 불가산명사예요. -s를 붙이지 않아요.","ex":["The library provides useful information for students.","There is little evidence that the new policy works."]},{"h":"수량 표현","body":"Many, few, a few, fewer + 복수 가산명사; much, little, a little, less + 불가산명사; a lot of, some, any, plenty of는 둘 다 쓸 수 있어요.","ex":["How many hours do you study each day?","We don't have much time before the deadline."]},{"h":"세는 단위","body":"불가산명사를 세려면 단위를 써요: a piece of advice, a piece of equipment, an item of news, a litre of water, a cup of coffee.","ex":["She gave me a useful piece of advice.","The factory uses 500 litres of water every hour."]},{"h":"뜻이 두 가지인 명사","body":"일부 명사는 뜻에 따라 가산명사도 되고 불가산명사도 돼요: experience(경험·경력 – 불가산; 하나의 체험 – 가산), time, paper, work.","ex":["I don't have much work experience.","Studying abroad was an amazing experience."]}],"mistakes":[{"wrong":"I need some informations about the course.","right":"I need some information about the course.","why":"'Information'은 불가산명사라서 -s를 붙이지 않아요."},{"wrong":"There are less cars on the road at night.","right":"There are fewer cars on the road at night.","why":"'Cars'는 복수 가산명사라서 'fewer'를 써요."},{"wrong":"She gave me an advice.","right":"She gave me a piece of advice.","why":"'Advice'는 불가산명사라서 'an'을 쓰지 않아요. 'a piece of'나 'some'을 써요."}],"quiz":[{"t":"mcq","q":"Can you give me some ___ about choosing a university?","o":["advices","advice","an advice","advise"],"a":1,"why":"'Advice'는 불가산명사라서 -s를 붙이지 않아요. 'advise'는 동사예요."},{"t":"fill","q":"How ___ students are there in your class?","a":["many"],"why":"'Students'는 복수 가산명사라서 'how many'를 써요."},{"t":"mcq","q":"We don't have ___ time before the exam.","o":["many","a few","much","few"],"a":2,"why":"'Time'(시간)은 불가산명사라서 부정문에서 'much'를 써요."},{"t":"mcq","q":"The new office has modern ___.","o":["furniture","furnitures","a furniture","furnitures'"],"a":0,"why":"'Furniture'는 불가산명사라서 -s를 붙이지 않고 'a'도 쓰지 않아요."},{"t":"fill","q":"There isn't ___ evidence that this diet works.","a":["much","any","enough"],"why":"'Evidence'는 불가산명사라서 부정문에서 'much'나 'any'를 써요."},{"t":"mcq","q":"I bought ___ new equipment for the lab.","o":["a","an","some","many"],"a":2,"why":"'Equipment'는 불가산명사라서 'some'을 쓰고, 'a/an'이나 'many'는 쓰지 않아요."},{"t":"mcq","q":"There were ___ people at the meeting than we expected.","o":["less","little","much","fewer"],"a":3,"why":"'People'은 복수 가산명사라서 비교 표현에 'fewer'를 써요."},{"t":"fill","q":"She gave me a useful ___ of advice.","a":["piece","bit","word"],"why":"불가산명사 'advice'를 세기 위해 단위 'a piece of'를 써요."},{"t":"mcq","q":"The traffic in Seoul ___ terrible in the rush hour.","o":["are","is","were","have"],"a":1,"why":"'Traffic'은 불가산명사라서 단수 동사 'is'와 써요."},{"t":"mcq","q":"I have ___ friends in Seoul, so I don't feel lonely there.","o":["a few","a little","few","much"],"a":0,"why":"'A few'는 가산명사와 쓰고 긍정적인 뜻(몇 개는 있다)이에요. 'few'는 거의 없다는 뜻이에요."},{"t":"fill","q":"Unfortunately, very ___ research has been done on this topic.","a":["little"],"why":"'Research'는 불가산명사예요. 'very little'은 아주 적다는 뜻으로 'unfortunately'와 어울려요."},{"t":"mcq","q":"I have three years of work ___ in marketing.","o":["experiences","experience","an experience","experienced"],"a":1,"why":"근무 경력이라는 뜻의 'Experience'는 불가산명사예요."},{"t":"mcq","q":"Travelling around Asia was ___ I will never forget.","o":["experience","experiences","the experiences","an experience"],"a":3,"why":"구체적인 하나의 체험이라는 뜻의 'Experience'는 가산명사라서 'an'이 필요해요."},{"t":"fill","q":"How ___ money do students spend on food each month?","a":["much"],"why":"'Money'는 불가산명사라서 'how much'를 써요."},{"t":"mcq","q":"The government has introduced ___ to reduce plastic waste.","o":["a new legislation","new legislations","new legislation","a new legislations"],"a":2,"why":"'Legislation'은 불가산명사라서 'a'를 쓰지 않고 -s도 붙이지 않아요."},{"t":"fill","q":"There has been a sharp rise in the ___ (number / amount) of waste produced by households.","a":["amount"],"why":"'Waste'는 불가산명사라서 'the number of'가 아니라 'the amount of'를 써요."}]},{"n":9,"en":"Articles","vi":"관사 (a, an, the)","ielts":"관사는 거의 모든 문장에 나오기 때문에, 바르게 쓰면 Writing과 Speaking 모두에서 Accuracy 점수가 올라요. 특히 'the number of', 'the graph shows' 같은 표현에서 중요해요.","points":[{"h":"A / an","body":"a/an은 처음 언급하는 단수 가산명사나 직업을 말할 때 써요. 한국어에는 관사가 없어서 관사를 통째로 빠뜨리는 경우가 가장 흔해요. a/an은 철자가 아니라 소리로 정해요: an hour, an MBA, a university, a European country.","ex":["My father is an engineer.","She studies at a university in Seoul."]},{"h":"The: 정해진 대상","body":"'the'는 듣는 사람이 어떤 것인지 아는 경우에 써요. 앞에서 이미 언급했거나, 하나뿐인 것(the sun, the internet), 또는 최상급과 서수 앞에 써요.","ex":["I bought a laptop. The laptop is very fast.","The internet has changed the way we learn."]},{"h":"일반적인 말에는 관사를 쓰지 않아요","body":"복수 명사나 불가산명사를 일반적으로 말할 때는 관사를 쓰지 않아요(무관사, zero article).","ex":["Children need regular exercise.","Technology has improved education in many countries."]},{"h":"수치를 묘사할 때의 관사","body":"Writing Task 1에서 the number of, the proportion of, the percentage of, the amount of와 'the graph/chart/table'에는 항상 'the'를 써요.","ex":["The chart shows the percentage of people who cycle to work.","The number of visitors fell in 2020."]},{"h":"고유명사와 지명","body":"대부분의 나라, 도시, 대륙 이름에는 'the'를 쓰지 않아요. 복수형 국가명이나 Republic/Kingdom/States가 들어간 국가명, 그리고 강, 바다, 대양, 산맥 앞에는 'the'를 써요.","ex":["She moved from Korea to the United Kingdom.","The Han River flows into the Yellow Sea."]}],"mistakes":[{"wrong":"My mother is teacher.","right":"My mother is a teacher.","why":"직업을 말할 때 단수 명사 앞에는 'a/an'을 써야 해요."},{"wrong":"The education is important for everyone.","right":"Education is important for everyone.","why":"불가산명사를 일반적으로 말할 때는 'the'를 쓰지 않아요."},{"wrong":"Number of tourists increased in 2020.","right":"The number of tourists increased in 2020.","why":"'the number of' 표현에는 항상 관사 'the'가 필요해요."}],"quiz":[{"t":"mcq","q":"I'm studying to become ___ engineer.","o":["a","an","the","— (no article)"],"a":1,"why":"직업을 말할 때는 a/an을 써요. 'engineer'는 모음으로 시작하므로 'an'을 써요."},{"t":"fill","q":"It takes about ___ hour to get to work by bus.","a":["an"],"why":"'hour'의 'h'는 소리가 나지 않아서 모음 소리로 시작하므로 'an'을 써요."},{"t":"mcq","q":"___ sun rises in the east.","o":["A","An","The","— (no article)"],"a":2,"why":"태양은 하나뿐이므로 'the'를 써요."},{"t":"mcq","q":"Which phrase is correct?","o":["an useful website","a useful website","an university","a hour"],"a":1,"why":"'Useful'은 /j/ 소리(자음)로 시작하므로 'a'를 써요. 'university'도 'a', 'hour'는 'an'을 써요."},{"t":"fill","q":"I bought a new laptop last week, but ___ battery is already weak.","a":["the","its"],"why":"이미 언급한 노트북의 배터리는 정해진 대상이므로 'the'(또는 'its')를 써요."},{"t":"mcq","q":"___ is one of the biggest problems in modern cities.","o":["The pollution","A pollution","Pollutions","Pollution"],"a":3,"why":"'Pollution'은 불가산명사이고 일반적으로 말하는 것이므로 관사를 쓰지 않아요."},{"t":"mcq","q":"Mount Everest is ___ highest mountain in the world.","o":["the","a","an","— (no article)"],"a":0,"why":"최상급 앞에는 항상 'the'를 써요."},{"t":"fill","q":"The chart shows ___ percentage of households that recycle.","a":["the"],"why":"수치 묘사에서 'the percentage of'에는 항상 'the'를 써요."},{"t":"mcq","q":"My cousin moved to ___ last year.","o":["the United States","United States","a United States","an United States"],"a":0,"why":"'States'가 들어간(복수형) 국가명에는 'the'가 필요해요."},{"t":"mcq","q":"___ smartphones have changed the way people communicate.","o":["The","A","An","— (no article)"],"a":3,"why":"복수 명사를 일반적으로 말할 때는 관사를 쓰지 않아요."},{"t":"fill","q":"She plays ___ piano beautifully.","a":["the"],"why":"영국 영어에서 악기를 연주할 때는 'play the + 악기 이름'을 써요."},{"t":"mcq","q":"In many countries, ___ elderly need more support from the government.","o":["an","— (no article)","the","a"],"a":2,"why":"'The + 형용사'(the elderly, the poor)는 한 무리의 사람 전체를 가리켜요."},{"t":"mcq","q":"___ Danube River flows through ten countries.","o":["The","A","— (no article)","An"],"a":0,"why":"강 이름에는 항상 'the'를 써요."},{"t":"fill","q":"This is ___ most interesting book I have ever read.","a":["the"],"why":"최상급 'most interesting' 앞에는 'the'를 써요."},{"t":"mcq","q":"There has been ___ significant increase in the use of renewable energy.","o":["the","a","an","— (no article)"],"a":1,"why":"'Increase'는 처음 언급하는 단수 가산명사이고, 'significant'는 자음으로 시작하므로 'a'를 써요."},{"t":"fill","q":"___ Philippines is made up of over 7,000 islands.","a":["The","the"],"why":"복수형 국가명(the Philippines)에는 'the'가 필요해요."}]},{"n":10,"en":"Linking & signposting","vi":"연결어와 안내 표현","ielts":"Writing의 Coherence and Cohesion 기준과 Speaking Part 3의 Fluency and Coherence 기준을 좌우해요.","points":[{"h":"내용 덧붙이기","body":"and, also, in addition, moreover, furthermore는 같은 방향의 내용을 덧붙일 때 써요. In addition / Moreover는 보통 문장 맨 앞에 오고 뒤에 쉼표를 써요.","ex":["Cycling is cheap. In addition, it is good for your health.","Public transport reduces traffic; moreover, it cuts pollution."]},{"h":"대조","body":"But, however, although, while, whereas는 절을 이어요. despite / in spite of + 명사 또는 V-ing. although와 but을 한 문장에 같이 쓰지 않아요 (Although ..., but ... ✗: 한국어 '비록 ~지만'에는 연결어가 하나만 필요한데, 영어에서도 하나만 써요).","ex":["Although the course was expensive, it was worth it.","Despite the high cost, many people still buy cars."]},{"h":"원인과 결과","body":"Because / as + 절; because of / due to + 명사; so / therefore / as a result는 결과를 나타내요. 'Because ..., so ...'처럼 원인 접속사와 결과 접속사를 함께 쓰지 않아요.","ex":["Due to heavy rain, the match was cancelled.","Car use increased; as a result, air quality got worse."]},{"h":"예시와 설명","body":"For example / for instance는 문장 앞이나 중간에 와요. such as + 명사는 문장 안에서 바로 예를 나열할 때 써요. in other words는 다시 풀어서 설명할 때 써요.","ex":["Some sports, such as swimming, are good for people with back problems.","Many jobs are now automated. For example, most banks use machines to count money."]},{"h":"글과 말의 흐름 안내","body":"Firstly, Secondly, Finally로 내용을 순서대로 정리해요. On the one hand... On the other hand는 두 측면을 비교할 때, Overall은 Task 1에서 주요 추세를 요약할 때, In conclusion은 Task 2의 결론에 써요.","ex":["Overall, the number of visitors rose over the period.","On the one hand, cities offer more jobs. On the other hand, living costs are high."]}],"mistakes":[{"wrong":"Although it was raining, but we went out.","right":"Although it was raining, we went out.","why":"한 문장에서 'although'와 'but'을 동시에 쓰지 않아요."},{"wrong":"Despite it was expensive, I bought it.","right":"Despite the high price, I bought it.","why":"'Despite'는 명사나 V-ing와 함께 쓰고, 절과는 쓰지 않아요."},{"wrong":"The city is crowded, however it is exciting.","right":"The city is crowded; however, it is exciting.","why":"'However'로 두 절을 이으려면 앞에 세미콜론, 뒤에 쉼표가 필요해요."}],"quiz":[{"t":"mcq","q":"I wanted to go out, ___ I had too much homework.","o":["because","but","so","and"],"a":1,"why":"서로 반대되는 두 내용(놀러 가고 싶다 – 숙제가 많다)이므로 'but'을 써요."},{"t":"fill","q":"I was tired, ___ I went to bed early.","a":["so"],"why":"뒤의 절이 앞 절의 결과이므로 'so'를 써요."},{"t":"mcq","q":"___ the weather was bad, the festival continued.","o":["Although","Despite","However","Because of"],"a":0,"why":"뒤에 절(the weather was bad)과 대조되는 내용이 이어지므로 'Although'를 써요."},{"t":"mcq","q":"Many students work part-time ___ they need money for tuition.","o":["so","because","however","despite"],"a":1,"why":"뒤의 절이 이유이므로 'because'를 써요."},{"t":"fill","q":"The flight was delayed ___ of bad weather.","a":["because"],"why":"'Because of' + 원인을 나타내는 명사를 써요."},{"t":"mcq","q":"___ the high cost, many families send their children to private schools.","o":["Although","Because","However","Despite"],"a":3,"why":"뒤에 명사구(the high cost)와 대조되는 내용이 이어지므로 'Despite'를 써요."},{"t":"mcq","q":"Cycling is good for your health. ___, it does not cause pollution.","o":["In addition","However","For example","In contrast"],"a":0,"why":"다음 문장이 같은 방향의 장점을 덧붙이므로 'In addition'을 써요."},{"t":"fill","q":"Some fruits, ___ as oranges and lemons, contain a lot of vitamin C.","a":["such"],"why":"'Such as'는 문장 안에서 바로 예를 들 때 써요."},{"t":"mcq","q":"Car ownership has risen sharply. ___, traffic congestion has become a serious problem.","o":["Although","Despite","As a result","For instance"],"a":2,"why":"다음 문장이 앞 문장의 결과이므로 'As a result'를 써요."},{"t":"mcq","q":"In IELTS Writing Task 1, which phrase is best to begin the summary of the main trends?","o":["In conclusion","Overall","Firstly","For example"],"a":1,"why":"'Overall'은 Task 1에서 주요 추세를 요약하는 개요를 시작할 때 쓰는 표준 표현이에요."},{"t":"fill","q":"City life is exciting. ___, it can also be very stressful.","a":["However","however","Nevertheless","On the other hand","Nonetheless"],"why":"다음 문장이 대조되는 내용이고, 문장 맨 앞에 와서 뒤에 쉼표가 오므로 'However'를 써요."},{"t":"mcq","q":"Men spend more time on sport, ___ women spend more time on reading.","o":["whereas","despite","because","so that"],"a":0,"why":"'Whereas'는 한 문장 안에서 서로 반대되는 두 가지를 비교할 때 써요."},{"t":"mcq","q":"___ being expensive, the new phone sold very well.","o":["Although","However","In spite of","Even though"],"a":2,"why":"뒤에 V-ing(being)가 오므로 'In spite of'를 써요. 'Although'와 'Even though'는 절이 필요해요."},{"t":"fill","q":"Many people move to cities. ___ example, Sejong's population has grown rapidly.","a":["For","for"],"why":"'For example'은 앞 문장을 보여 주는 예를 들 때 써요."},{"t":"mcq","q":"Which sentence is correct?","o":["Although the plan was good, but it failed.","The plan was good, however it failed.","Despite the plan was good, it failed.","The plan was good; however, it failed."],"a":3,"why":"'However'로 두 절을 이으려면 앞에 세미콜론, 뒤에 쉼표가 필요해요. 나머지 문장들은 구조가 틀렸어요."},{"t":"fill","q":"The factory closed ___ to a lack of funding.","a":["due","owing"],"why":"'Due to' + 원인을 나타내는 명사. 주로 격식 있는 글에서 써요."}]},{"n":11,"en":"Comparatives","vi":"비교","ielts":"비교 문법은 Writing Task 1에서 그래프의 수치를 묘사하고 비교할 때, 그리고 Task 2에서 두 견해나 두 선택지를 비교할 때 도움이 돼요.","points":[{"h":"짧은 형용사와 긴 형용사","body":"짧은 형용사(1음절, 또는 -y로 끝나는 2음절)는 -er + than을 붙여요. 긴 형용사(2~3음절 이상)는 more + 형용사 + than을 써요. 둘을 동시에 쓰면 안 돼요 (more faster ✗).","ex":["Cities are usually noisier than villages.","Online courses are more flexible than traditional classes."]},{"h":"불규칙 형태","body":"일부 형용사는 고유한 형태가 있어요: good → better → best, bad → worse → worst, far → further → furthest, little → less → least, much/many → more → most.","ex":["The exam results this year were better than last year.","Air pollution is worse in winter than in summer."]},{"h":"최상급 (superlatives)","body":"the + -est(짧은 형용사) 또는 the most + 형용사(긴 형용사)를 써요. 보통 in + 장소/집단, 또는 of + 수량과 함께 써요.","ex":["Tokyo is the largest city in the world by population.","Cost was the most important factor for students in the survey."]},{"h":"동등 비교: as … as","body":"as + 형용사 + as는 '~만큼 …한', not as … as는 '~만큼 …하지 않은'이라는 뜻이에요. twice / three times as … as로 '두 배, 세 배'를 나타낼 수 있어요.","ex":["Women's salaries are not as high as men's in many industries.","Car ownership was twice as high in 2020 as in 1990."]},{"h":"수치를 묘사할 때의 비교 정도","body":"비교급 앞에 slightly, a little(약간)이나 much, far, significantly(훨씬)를 붙여요. very는 쓰지 않아요 (very higher ✗). the + 비교급 …, the + 비교급 … 구조는 '~할수록 더 …하다'라는 뜻이에요.","ex":["Spending on health was slightly higher than spending on education.","The more people use public transport, the cleaner the air becomes."]}],"mistakes":[{"wrong":"Living in the city is more easier than living in the countryside.","right":"Living in the city is easier than living in the countryside.","why":"more를 -er 어미와 함께 쓰지 않아요."},{"wrong":"The number of students in 2020 was higher than 2010.","right":"The number of students in 2020 was higher than in 2010.","why":"같은 종류의 두 대상(2020년 수치와 2010년 수치)을 비교해야 하므로 'in'을 더해야 해요."},{"wrong":"My opinion is as same as my teacher's.","right":"My opinion is the same as my teacher's.","why":"올바른 구조는 'the same as'예요. 'as same as'가 아니에요."}],"quiz":[{"t":"mcq","q":"Bicycles are ___ than cars for short journeys in the city.","o":["fast","faster","more fast","fastest"],"a":1,"why":"'Fast'는 짧은 형용사라서 비교급은 'faster'예요."},{"t":"fill","q":"Online shopping is ___ (convenient) than going to a shopping centre.","a":["more convenient"],"why":"'Convenient'는 긴 형용사라서 'more convenient'를 써요."},{"t":"mcq","q":"Health was ___ important issue for voters in the survey.","o":["the most","most","the more","more"],"a":0,"why":"긴 형용사의 최상급에는 'the most'가 필요해요."},{"t":"fill","q":"Air quality in the capital is ___ (bad) now than it was ten years ago.","a":["worse"],"why":"'Bad'는 불규칙이에요: bad → worse → worst."},{"t":"mcq","q":"The new library is not ___ the old one.","o":["as big than","as bigger as","as big as","so big than"],"a":2,"why":"동등 비교는 'as + 형용사 원급 + as'를 써요."},{"t":"mcq","q":"Of all the countries in the chart, Canada had the ___ unemployment rate.","o":["more low","lower","lowest","more lower"],"a":2,"why":"'Of all the countries'는 최상급을 나타내요: the lowest."},{"t":"fill","q":"This year's exam was ___ (difficult) of all the tests I have taken.","a":["the most difficult"],"why":"긴 형용사의 최상급: the most difficult."},{"t":"mcq","q":"My opinion on homework is ___ my teacher's.","o":["as same as","same as","the same with","the same as"],"a":3,"why":"고정 표현은 'the same as'예요."},{"t":"mcq","q":"Spending on transport was ___ higher than spending on clothing, at 30% compared with 10%.","o":["much","very","more","most"],"a":0,"why":"비교급을 강조할 때는 much/far를 써요. 'very higher'는 쓰지 않아요."},{"t":"fill","q":"In 2015, the price of electricity was three times ___ (high) it was in 1995.","a":["as high as"],"why":"'세 배'를 말할 때는 three times as + 형용사 + as를 써요."},{"t":"mcq","q":"The ___ people exercise, the healthier they tend to be.","o":["much","more","most","many"],"a":1,"why":"'~할수록 …하다' 구조: the more …, the + 비교급 …"},{"t":"mcq","q":"The percentage of graduates who found jobs was higher in 2019 than ___ 2009.","o":["at","that","it","in"],"a":3,"why":"같은 종류의 두 시점을 올바르게 비교하려면 'in 2009'가 필요해요."},{"t":"fill","q":"The number of male students was slightly ___ (great) than that of female students.","a":["greater"],"why":"'Great'는 짧은 형용사라서 greater를 써요. 'slightly'는 작은 차이를 나타내요."},{"t":"mcq","q":"Which sentence is correct?","o":["Rents in London are higher than those in Manchester.","Rents in London are higher than Manchester.","Rents in London are higher than that in Manchester.","Rents in London are more high than in Manchester."],"a":0,"why":"'Rents'가 복수이므로 'those'로 대신하면 같은 종류의 두 대상을 올바르게 비교할 수 있어요."},{"t":"mcq","q":"Twice ___ tourists visited the museum in August as in January.","o":["as much","more","as many","many as"],"a":2,"why":"'Tourists'는 복수 가산명사라서 'as many … as'를 써요."},{"t":"fill","q":"The cleaner the energy we use, ___ (little) damage we do to the planet.","a":["the less"],"why":"'the + 비교급 …, the + 비교급 …' 구조예요. little → less."}]},{"n":12,"en":"Modals 1","vi":"조동사 1: 능력, 의무, 충고","ielts":"should, must, have to 같은 조동사(modal verbs)는 Writing Task 2에서 해결책과 충고를 제시할 때, 그리고 Speaking에서 가능성을 말할 때 도움이 돼요.","points":[{"h":"능력 (ability)","body":"can(현재), could(과거의 일반적인 능력), be able to(다른 시제, 예: will be able to)를 써요.","ex":["Many young people can use several apps at the same time.","In the future, robots will be able to do many household jobs."]},{"h":"의무: must와 have to","body":"Must는 보통 화자 자신의 생각으로 꼭 필요하다는 뜻이고, have to는 보통 외부 규칙을 말해요. 둘 다 과거형은 had to예요.","ex":["Students have to wear a uniform at most Korean schools.","Governments must act quickly to reduce pollution."]},{"h":"mustn't와 don't have to","body":"Mustn't는 '금지, 해서는 안 된다'라는 뜻이에요. Don't have to는 '할 필요 없다, 의무가 아니다'라는 뜻이에요. 두 표현은 뜻이 완전히 달라요. 한국어 '~하면 안 돼요'와 '~할 필요 없어요'의 차이와 같아요.","ex":["Drivers mustn't use their phones while driving.","Employees don't have to work at weekends."]},{"h":"충고: should와 ought to","body":"Should / ought to는 충고하거나 해결책을 제안할 때 써요. shouldn't는 하지 말라고 충고할 때 써요. Task 2 해결책 유형에서 매우 유용해요.","ex":["Governments should invest more in public transport.","Parents ought to limit their children's screen time."]},{"h":"공통 문법 규칙","body":"can, could, must, should 뒤에는 항상 'to' 없는 동사원형(bare infinitive)이 오고, 주어에 따라 변하지 않아요 (must to go ✗, can goes ✗). have to와 ought to만 'to'가 있어요.","ex":["The government should invest in education.","Local authorities can provide free sports facilities."]}],"mistakes":[{"wrong":"Students must to study hard to pass the exam.","right":"Students must study hard to pass the exam.","why":"must 뒤에는 'to'를 쓰지 않아요."},{"wrong":"The government should invests in education.","right":"The government should invest in education.","why":"조동사 뒤의 동사는 원형을 유지하고 -s를 붙이지 않아요."},{"wrong":"At university, students mustn't wear a uniform, so they can choose their clothes.","right":"At university, students don't have to wear a uniform, so they can choose their clothes.","why":"Mustn't는 '금지'예요. 여기서는 '의무가 아니다'라는 뜻이므로 don't have to를 써요."}],"quiz":[{"t":"mcq","q":"Many children ___ use a smartphone before they can read.","o":["can","cans","can to","are can"],"a":0,"why":"Can에는 -s를 붙이지 않고 'to'도 쓰지 않아요."},{"t":"fill","q":"Young people ___ (should / not) spend too much time online.","a":["shouldn't","should not"],"why":"부정적인 충고에는 shouldn't + 동사원형을 써요."},{"t":"mcq","q":"In many countries, drivers ___ wear a seat belt. It is the law.","o":["should","have to","don't have to","could"],"a":1,"why":"법으로 정해진 의무에는 have to를 써요."},{"t":"mcq","q":"You ___ bring your own laptop; the university provides computers in the library.","o":["mustn't","can't","don't have to","haven't to"],"a":2,"why":"'가져올 필요가 없다'는 뜻이지 '금지'가 아니므로 don't have to를 써요."},{"t":"fill","q":"Fifty years ago, most people ___ (can / not) afford to travel abroad.","a":["couldn't","could not"],"why":"과거의 일반적인 능력의 부정은 couldn't예요."},{"t":"mcq","q":"Students ___ use their phones during the exam. It is strictly forbidden.","o":["don't have to","needn't","shouldn't to","mustn't"],"a":3,"why":"'Strictly forbidden'은 금지를 뜻하므로 mustn't를 써요."},{"t":"mcq","q":"When my father was young, he ___ walk five kilometres to school every day.","o":["must","has to","had to","musted"],"a":2,"why":"Must에는 과거형이 없어요. 과거의 의무에는 had to를 써요."},{"t":"fill","q":"In the future, people will ___ (able) to work from anywhere.","a":["be able"],"why":"will 뒤에는 can을 쓸 수 없으므로 will be able to를 써요."},{"t":"mcq","q":"If you want to improve your writing, you ___ read more academic articles.","o":["should to","must to","ought","ought to"],"a":3,"why":"Ought는 항상 'to'와 함께 써요. should와 must에는 'to'가 없어요."},{"t":"mcq","q":"Which sentence gives ADVICE, not a rule?","o":["Visitors must show their passports at the entrance.","Passengers have to buy a ticket before boarding.","Smoking is not allowed in the building.","People should drink more water in hot weather."],"a":3,"why":"Should는 충고할 때 써요. 나머지 문장은 규칙이에요."},{"t":"fill","q":"Employees ___ (not / have to) wear a suit on Fridays; casual clothes are fine.","a":["don't have to","do not have to"],"why":"의무가 아닐 때는 don't have to를 써요."},{"t":"mcq","q":"Although the exam was difficult, most students ___ finish it on time.","o":["were able to","are able","can","must"],"a":0,"why":"과거의 특정한 한 번의 상황에서 해냈다고 말할 때는 was/were able to를 써요."},{"t":"fill","q":"Last year, all staff ___ (have) to complete a safety course.","a":["had"],"why":"과거의 의무: had to."},{"t":"mcq","q":"It is a legal requirement: all new buildings ___ meet strict energy standards.","o":["might","can","must","ought"],"a":2,"why":"'Legal requirement'는 반드시 지켜야 하는 의무이므로 must를 써요. ought에는 'to'가 빠졌어요."},{"t":"fill","q":"In the past, women in some countries ___ (not / be able) to vote.","a":["were not able","weren't able"],"why":"be able to의 과거 부정형에서 주어가 복수이면 were not able to예요."},{"t":"mcq","q":"Which sentence is correct?","o":["People shouldn't to drive in city centres.","The government ought to reduce taxes on electric cars.","Students must to pay attention to deadlines.","We should to protect endangered species."],"a":1,"why":"ought만 'to'가 필요해요. shouldn't, must, should에는 'to'가 오지 않아요."}]},{"n":13,"en":"Modals 2","vi":"조동사 2: 추측과 신중한 표현","ielts":"may, might, could로 신중하게 말하면(hedging) Task 2 논증이 더 학술적으로 느껴지고, 지나치게 단정하는 것도 피할 수 있어요.","points":[{"h":"현재에 대한 추측: must와 can't","body":"거의 확실히 맞다고 생각하면 must + 동사원형, 근거를 보고 거의 확실히 틀렸다고 생각하면 can't + 동사원형을 써요.","ex":["She works 60 hours a week, so she must be exhausted.","That figure can't be right because it is higher than the total."]},{"h":"가능성: may, might, could","body":"May / might / could + 동사원형은 일어날 수 있지만 확실하지 않은 일(약 50%)을 나타내요. 부정형은 보통 may not / might not을 써요.","ex":["Higher taxes on fuel may reduce traffic in city centres.","Online learning could become the main form of education."]},{"h":"과거에 대한 추측","body":"must have / might have / may have / can't have + 과거분사(V3)로 이미 일어난 일을 추측해요.","ex":["The fall in sales must have been caused by the new competitor.","Ancient people might have used this tool for hunting."]},{"h":"후회와 비판: should have","body":"Should have + V3는 '했어야 했는데 안 했다', shouldn't have + V3는 '하지 말았어야 했는데 했다'라는 뜻이에요.","ex":["The city should have built more parks before the population grew.","The company shouldn't have ignored the warnings."]},{"h":"학술적인 글의 신중한 표현 (hedging)","body":"may/might 외에 be likely to, tend to, it is possible that도 써서 지나친 일반화를 피할 수 있어요.","ex":["Technology may not always improve people's quality of life.","Children who read regularly are likely to perform better at school."]}],"mistakes":[{"wrong":"The economy might grows next year.","right":"The economy might grow next year.","why":"might 뒤에는 동사원형이 와요."},{"wrong":"He must went home early because his office was dark.","right":"He must have gone home early because his office was dark.","why":"과거에 대한 추측에는 must have + V3를 써요."},{"wrong":"Social media causes depression in all teenagers.","right":"Social media may cause depression in some teenagers.","why":"학술적인 글에서는 may를 쓰고, 'all' 같은 절대적인 표현은 피해서 지나치게 단정하지 않아요."}],"quiz":[{"t":"mcq","q":"Scientists believe the new drug ___ help patients with heart disease, but more tests are needed.","o":["may","must to","mights","is can"],"a":0,"why":"'More tests are needed'는 아직 확실하지 않다는 뜻이므로 may + 동사원형을 써요."},{"t":"fill","q":"The figure ___ (can / not) be correct; it is more than 100%.","a":["can't","cannot"],"why":"거의 확실히 틀렸다고 생각하면 can't + 동사원형을 써요."},{"t":"mcq","q":"Look at all those people with umbrellas. It ___ be raining.","o":["can't","must","should","mustn't"],"a":1,"why":"분명한 근거가 있으므로 확신하는 추측에는 must를 써요."},{"t":"mcq","q":"Robots ___ replace many factory workers in the next twenty years.","o":["must have","should have","can't have","could"],"a":3,"why":"미래의 가능성에는 could + 동사원형을 써요. 나머지 선택지는 과거를 말해요."},{"t":"fill","q":"The museum is closed today, so it ___ (might / be) a public holiday.","a":["might be"],"why":"Might + 동사원형은 하나의 가능성을 나타내요."},{"t":"mcq","q":"The ancient city ___ by an earthquake; archaeologists are still not sure.","o":["must have been destroyed","might have been destroyed","can't have destroyed","should have been destroyed"],"a":1,"why":"'Still not sure'이므로 might have + 수동태(been destroyed)를 써요."},{"t":"mcq","q":"I can't find my report. I ___ it on the train.","o":["must left","should leave","may leave","might have left"],"a":3,"why":"과거에 일어났을 수도 있는 일을 추측할 때: might have + V3."},{"t":"fill","q":"The company lost a lot of money. The managers ___ (should / listen) to the experts' advice.","a":["should have listened"],"why":"했어야 했는데 하지 않았을 때: should have + V3."},{"t":"mcq","q":"Tom got 9.0 in IELTS Reading. He ___ have practised a lot.","o":["can't","shouldn't","needn't","must"],"a":3,"why":"높은 점수는 강한 근거이므로 확신하는 추측을 해요: must have practised."},{"t":"mcq","q":"She ___ have seen the email; she was on holiday with no internet.","o":["must","should","can't","may"],"a":2,"why":"인터넷이 없었으니 그녀가 봤을 리 없다고 거의 확신하므로 can't have + V3를 써요."},{"t":"fill","q":"The bridge collapsed after only five years, so the engineers ___ (must / make) serious mistakes.","a":["must have made"],"why":"과거에 대한 확신하는 추측: must have + V3."},{"t":"mcq","q":"Which sentence is the most suitable for an academic essay?","o":["Video games make all children violent.","Video games definitely destroy children's minds.","Violent video games may increase aggressive behaviour in some children.","Every expert agrees that video games are dangerous."],"a":2,"why":"may와 some을 쓴 문장은 학술적인 글에 어울리는 신중한 표현(hedging)이에요."},{"t":"mcq","q":"The government ___ invested in flood defences earlier; now the damage is enormous.","o":["should have","must have","might","should"],"a":0,"why":"과거에 하지 않은 일을 비판할 때: should have + V3."},{"t":"fill","q":"The sharp fall in bee numbers in 2015 ___ (may / cause) by pesticides.","a":["may have been caused"],"why":"수동태로 과거를 추측할 때: may have been + V3."},{"t":"mcq","q":"The results ___ have been accurate because the sample was very small.","o":["must","should","might not","ought to"],"a":2,"why":"표본이 작아서 결과가 정확하지 않았을 수도 있으므로 might not have been을 써요."},{"t":"fill","q":"Electric cars ___ (likely / become) cheaper than petrol cars in the next decade.","a":["are likely to become","will likely become"],"why":"Be likely to + 동사원형은 미래에 대해 신중하게 말하는 방법이에요."}]},{"n":14,"en":"Conditionals","vi":"조건문","ielts":"조건문은 Writing Task 2에서 결과, 해결책, 가정을 말할 때, 그리고 Speaking Part 3의 가정 질문에 답할 때 도움이 돼요.","points":[{"h":"0형: 일반적인 사실","body":"If + 현재 단순, 현재 단순. 과학적 사실이나 조건이 있으면 늘 일어나는 일에 써요.","ex":["If water reaches 100°C, it boils.","If people do not sleep enough, their concentration drops."]},{"h":"1형: 미래의 실제 가능성","body":"If + 현재 단순, will + 동사원형. if 절에는 will을 쓰지 않아요 (If it will rain ✗).","ex":["If the government raises fuel taxes, fewer people will drive.","If you practise every day, your writing will improve."]},{"h":"2형: 현재/미래의 가정","body":"If + 과거 단순, would + 동사원형. 사실이 아니거나 일어날 가능성이 낮은 상황에 써요. be동사는 격식 있게는 모든 주어에 were를 써요.","ex":["If public transport were free, more people would use it.","If I had more time, I would learn another language."]},{"h":"3형: 과거에 대한 가정","body":"If + had + V3, would have + V3. 과거에 일어나지 않은 일과, 그 일로 인해 상상되는 결과를 말할 때 써요.","ex":["If the city had built more flood defences, the damage would have been smaller.","If I had studied harder, I would have passed the exam."]},{"h":"Unless와 다른 조건 연결어","body":"Unless = if … not(~하지 않으면)이므로 unless 뒤에 not을 또 붙이지 않아요. As long as / provided that은 '~하기만 하면'이라는 뜻이에요.","ex":["Unless we reduce emissions, temperatures will keep rising.","Students can borrow laptops as long as they return them on time."]}],"mistakes":[{"wrong":"If the government will invest more, the economy will grow.","right":"If the government invests more, the economy will grow.","why":"1형 조건문의 if 절에는 will을 쓰지 않아요."},{"wrong":"If I would have more money, I would buy a house.","right":"If I had more money, I would buy a house.","why":"2형의 if 절에는 would가 아니라 과거 단순을 써요."},{"wrong":"Unless people don't recycle, landfills will be full.","right":"Unless people recycle, landfills will be full.","why":"Unless에 이미 부정의 뜻이 있으므로 don't를 더하지 않아요."}],"quiz":[{"t":"mcq","q":"If you heat ice, it ___.","o":["melts","melted","would melt","will melted"],"a":0,"why":"과학적 사실에는 0형 조건문을 써요: 두 절 모두 현재 단순이에요."},{"t":"fill","q":"If it ___ (rain) tomorrow, the outdoor event will be cancelled.","a":["rains"],"why":"1형: if 절은 현재 단순이고, 주어 'it'이 3인칭 단수라서 -s를 붙여요."},{"t":"mcq","q":"If more people cycle to work, there ___ less traffic in the city centre.","o":["is being","would have been","will be","were"],"a":2,"why":"if 절이 현재 단순이므로 주절에는 will + 동사원형을 써요(1형)."},{"t":"fill","q":"If I ___ (be) the Minister of Education, I would make school meals free.","a":["were","was"],"why":"2형은 과거 단순을 써요. 'were'는 격식 있는 형태이고, 'was'는 구어에서 써요."},{"t":"mcq","q":"If governments ___ more in renewable energy, air pollution would fall.","o":["invest","invested","will invest","had invest"],"a":1,"why":"주절에 would가 있으므로 if 절에는 과거 단순을 써요(2형)."},{"t":"mcq","q":"___ students submit their essays on time, they will lose marks.","o":["If","As long as","Provided","Unless"],"a":3,"why":"'제때 제출하지 않으면'이라는 뜻이므로 unless를 써요."},{"t":"fill","q":"If the company ___ (not / reduce) its prices, it will lose customers.","a":["doesn't reduce","does not reduce"],"why":"3인칭 단수 주어의 1형 부정문: doesn't + 동사원형."},{"t":"mcq","q":"If I had known about the scholarship, I ___ for it.","o":["would apply","will apply","would have applied","had applied"],"a":2,"why":"if 절이 had + V3이므로 주절에는 would have + V3를 써요(3형)."},{"t":"mcq","q":"What would happen if robots ___ all the jobs in factories?","o":["take","took","will take","would take"],"a":1,"why":"would를 쓴 가정 질문이므로 if 절에는 과거 단순을 써요."},{"t":"fill","q":"If the factory ___ (follow) safety rules, the accident would not have happened.","a":["had followed"],"why":"과거 사실과 반대되는 가정: if + had + V3."},{"t":"mcq","q":"You can use the library computers ___ you have a student card.","o":["unless","in case of","even","as long as"],"a":3,"why":"'As long as'는 '~하기만 하면'이라는 뜻으로, 학생증이 있다는 조건에 어울려요."},{"t":"mcq","q":"If plastic bags were banned, people ___ to bring their own bags.","o":["would have","will have","would have had","had"],"a":0,"why":"2형: would + 동사원형 (would have to bring)."},{"t":"fill","q":"The river ___ (not / flood) last year if the city had built higher walls.","a":["wouldn't have flooded","would not have flooded"],"why":"3형: would not have + V3."},{"t":"mcq","q":"Which sentence is correct?","o":["If the price of petrol rises, people would drive less.","If the price of petrol rose, people will drive less.","If the price of petrol rises, people will drive less.","If the price of petrol will rise, people drive less."],"a":2,"why":"1형: if + 현재 단순, will + 동사원형."},{"t":"fill","q":"Unless the government ___ (take) action now, the problem will get worse.","a":["takes"],"why":"unless 뒤에는 긍정형 현재 단순을 써요(1형 if 절과 같아요)."},{"t":"mcq","q":"If the internet had not been invented, our lives ___ very different today.","o":["will be","are","would have","would be"],"a":3,"why":"혼합 조건문: 조건은 과거이고 결과는 현재('today')이므로 would + 동사원형을 써요."}]},{"n":15,"en":"Reported speech","vi":"간접 화법","ielts":"claim, argue, suggest 같은 전달 동사는 Task 2에서 다른 사람의 의견을 제시할 때, 그리고 Reading 지문이 연구를 어떻게 설명하는지 이해할 때 도움이 돼요.","points":[{"h":"시제 일치 (backshift)","body":"전달 동사가 과거(said, told)일 때, 전달되는 문장의 동사는 보통 한 시제 앞당겨져요: 현재 → 과거, 현재 완료 → 과거 완료, will → would. 한국어에는 이런 시제 일치가 없어서 'He said that he is tired'처럼 쓰기 쉬워요.","ex":["The manager said that sales were falling.","She said that she had finished the report."]},{"h":"시제를 바꾸지 않아도 될 때","body":"일반적인 사실이나 지금도 맞는 일을 말할 때, 그리고 전달 동사가 현재(says, argue, states)일 때는 시제를 바꾸지 않아도 돼요.","ex":["The teacher said that the Earth goes around the Sun.","Experts say that too much sugar is harmful to health."]},{"h":"학술적인 전달 동사","body":"say만 쓰지 말고 claim, argue, state, believe, point out + that + 절을 쓰세요. 주의: tell은 목적어가 필요하고(tell someone), say는 필요 없어요 (He said me ✗).","ex":["Some people argue that university education should be free.","The report states that unemployment has fallen."]},{"h":"suggest와 recommend","body":"suggest/recommend + V-ing, 또는 suggest/recommend that + 주어 + (should) + 동사원형을 써요. suggest someone to do something은 쓰지 않아요.","ex":["The researchers suggest that schools start later in the morning.","The doctor suggested reducing salt in our diet."]},{"h":"간접 의문문 전달","body":"전달하는 의문문은 평서문 어순(주어 + 동사)을 쓰고, 조동사를 도치하지 않아요. Yes/No 질문은 if 또는 whether를 써요.","ex":["The interviewer asked me why I wanted the job.","Students asked whether the exam would be online."]}],"mistakes":[{"wrong":"He suggested me to apply for the scholarship.","right":"He suggested that I apply for the scholarship.","why":"Suggest는 목적어 + to V 구조로 쓰지 않아요."},{"wrong":"She asked me where did I live.","right":"She asked me where I lived.","why":"전달하는 의문문에서는 조동사를 도치하지 않아요."},{"wrong":"He said me that the meeting was cancelled.","right":"He told me that the meeting was cancelled.","why":"Say는 사람을 나타내는 목적어와 바로 쓰지 않아요. tell + 사람을 써요."}],"quiz":[{"t":"mcq","q":"The teacher ___ us that the test would be on Friday.","o":["said","spoke","told","talked"],"a":2,"why":"동사 바로 뒤에 사람 목적어(us)가 있으므로 told를 써요."},{"t":"fill","q":"'I am tired,' she said. → She said that she ___ (be) tired.","a":["was"],"why":"전달 동사가 과거이므로 am은 was로 바뀌어요."},{"t":"mcq","q":"'We will open a new branch,' the CEO said. → The CEO said that they ___ a new branch.","o":["will open","would open","opened","have opened"],"a":1,"why":"Will은 would로 바뀌어요."},{"t":"fill","q":"'I have finished my essay,' Minjun said. → Minjun said that he ___ (finish) his essay.","a":["had finished"],"why":"현재 완료는 과거 완료로 바뀌어요."},{"t":"mcq","q":"She asked me ___.","o":["where did I study","where do I study","where studied I","where I studied"],"a":3,"why":"전달하는 의문문은 주어 + 동사 어순을 쓰고 도치하지 않아요."},{"t":"mcq","q":"The interviewer asked ___ I had any experience in marketing.","o":["whether","that","what","do"],"a":0,"why":"Yes/No 질문을 전달할 때는 if 또는 whether를 써요."},{"t":"fill","q":"The doctor suggested ___ (reduce) the amount of sugar in our diet.","a":["reducing"],"why":"Suggest + V-ing."},{"t":"mcq","q":"The report ___ that the number of tourists increased by 15% in 2023.","o":["tells","says to","states","speaks"],"a":2,"why":"State + that은 격식 있는 전달 동사로, 보고서에 어울려요."},{"t":"mcq","q":"Many scientists ___ that climate change is caused mainly by human activity.","o":["agree with","tell","suggest to","believe"],"a":3,"why":"Believe + that + 절이에요. tell은 목적어가 필요하고, 'agree with that'과 'suggest to that'은 구조가 틀렸어요."},{"t":"fill","q":"The researchers recommended that the school day ___ (start) later.","a":["start","should start"],"why":"Recommend that + 주어 + (should) + 동사원형이며, -s를 붙이지 않아요."},{"t":"mcq","q":"My tutor suggested ___ more academic articles to improve my vocabulary.","o":["me to read","to read","that I read","me reading"],"a":2,"why":"Suggest that + 주어 + 동사예요. suggest me to do나 suggest to do는 쓰지 않아요."},{"t":"mcq","q":"Some people ___ that social media brings people together, while others disagree.","o":["tell","argue","ask","explain to"],"a":1,"why":"Argue that은 토론에서 하나의 견해를 제시할 때 써요."},{"t":"fill","q":"'Can you send me the data?' my manager asked. → My manager asked if I ___ (can) send him the data.","a":["could"],"why":"Can은 could로 바뀌어요."},{"t":"mcq","q":"The professor said that water ___ at 100°C.","o":["boils","boil","had boiled","was boiled"],"a":0,"why":"과학적 사실은 지금도 맞으므로 현재 단순을 유지해도 돼요."},{"t":"fill","q":"The minister ___ (deny) that the government had wasted public money.","a":["denied"],"why":"과거의 일을 전달하는 문장(had wasted)이므로 denied를 써요. deny that은 부인한다는 뜻이에요."},{"t":"mcq","q":"'Don't use your phone in class,' the teacher said. → The teacher told us ___ our phones in class.","o":["don't use","not use","to not using","not to use"],"a":3,"why":"부정 명령을 전달할 때: tell someone not to + 동사원형."}]},{"n":16,"en":"P
