  drawReading(true);
  const el=$("qhl-"+n);if(el){el.scrollIntoView({behavior:"smooth",block:"center"})}

/* ---------- sự kiện màn làm bài ---------- */
document.addEventListener("click",e=>{
  if(!RD)return;const T=e.target;
  if(T.closest("#rd-quit")){if(!RD.result&&Object.keys(RD.answers).length&&!confirm("나갈까요? 입력 중인 답은 저장되지 않아요."))return;return closeReading()}
  const p=T.closest("[data-rpane]");if(p){RD.pane=p.dataset.rpane;RD.hl=RD.pane==="pass"?RD.hl:null;document.querySelector(".rd").dataset.pane=RD.pane;document.querySelectorAll("[data-rpane]").forEach(b=>b.setAttribute("aria-pressed",b===p));$("study").scrollTop=0;return}
  const a=T.closest("[data-ans]");if(a&&!RD.result){FX.buzz(6);RD.answers[a.dataset.ans]=a.dataset.val;a.parentElement.querySelectorAll(".aopt,.mopt").forEach(b=>b.classList.toggle("on",b===a));return}
  const m=T.closest("[data-multi]");if(m&&!RD.result){const gi=+m.dataset.multi,g=RD.p.groups[gi],k=Math.max(g.to-g.from+1,rMultiCorrect(g).length);RD.multi=RD.multi||{};let c=RD.multi[gi]||[];const v=m.dataset.val;
    c=c.includes(v)?c.filter(x=>x!==v):[...c,v];if(c.length>k)c=c.slice(c.length-k);RD.multi[gi]=c;
    m.parentElement.querySelectorAll(".mopt").forEach(b=>b.classList.toggle("on",c.includes(b.dataset.val)));return}
  if(T.closest("#rd-submit")&&!Object.keys(RD.p.answers||{}).length)return toast("이 문제에는 정답이 없어서 채점할 수 없어요.",true);
  if(T.closest("#rd-submit")){const nums=rNums();const miss=nums.filter(n=>{const g=gOf(n);if(g&&g.multi)return false;return !String(RD.answers[n]||"").trim()}).length;if(miss&&!confirm(`비워 둔 문제 ${miss}개가 있어요. 실제 시험에서는 틀려도 감점이 없으니 전부 채우세요. 그래도 제출할까요?`))return;return gradeReading()}
  const x=T.closest("[data-rexp]");if(x){const n=x.dataset.rexp;RD.open[n]=!RD.open[n];return drawReading(true)}
  const l=T.closest("[data-rloc]");if(l)return locateQ(l.dataset.rloc);
  const bq=T.closest("[data-rbackq]");if(bq){const n=bq.dataset.rbackq;RD.pane="q";RD.hl=null;drawReading();const el=document.querySelector(`[data-rexp="${n}"]`);if(el)el.scrollIntoView({block:"center"});return}
  if(T.closest("[data-rshowloc]")){RD.showLoc=!RD.showLoc;RD.hl=null;if(innerWidth<980&&RD.showLoc)RD.pane="pass";return drawReading(true)}

/* ---------- v9.4: in đậm từ khóa trong câu hỏi ----------
   Chạm một từ (hoặc kéo chọn một cụm) ở chế độ Bold để in đậm; chế độ Tẩy để bỏ; "Xóa hết" bỏ toàn bộ.
   Lưu theo từng bài (cùng bảng highlights, khóa "kw:<mã bài>") nên mở lại bài vẫn còn. */
let kwMode=ls.get("ielts-kwmode","");
const kwKey=()=>"kw:"+RD.p.id;
function kwSet(){if(!RD.kw)RD.kw=new Set((hlMap[kwKey()]||[]).filter(x=>typeof x==="string"));return RD.kw}
function kwText(key,text,ctr){
  ctr=ctr||{i:0};const set=kwSet();
  return String(text==null?"":text).split(/(\s+)/).map(t=>{if(!t)return "";if(/^\s+$/.test(t))return t;if(!/[\p{L}\p{N}]/u.test(t))return esc(t);const id=key+":"+(ctr.i++);
    return `<span class="kww${set.has(id)?" kw":""}" data-kw="${id}">${esc(t)}</span>`}).join("");
}
function kwBar(){
  const n=kwSet().size,tip=kwMode==="bold"?"단어를 터치하거나 드래그해서 굵게 표시":kwMode==="erase"?"터치하거나 드래그해서 굵게 표시 해제":"굵게 모드를 켠 뒤 단어를 터치하세요";
  return `<div class="kwbar" id="kwbar"><button type="button" class="btn" data-kwmode="bold" aria-pressed="${kwMode==="bold"}"><b>B</b>&nbsp;굵게</button><button type="button" class="btn" data-kwmode="erase" aria-pressed="${kwMode==="erase"}">⌫&nbsp;지우개</button><button type="button" class="btn" data-kwclear ${n?"":"disabled"}>삭제${n?" ("+n+")":""}</button><span class="kwtip">${tip}</span></div>`;
}
let kwT=null;
function kwApply(ids,on){
  const set=kwSet(),nx=new Set(set);ids.forEach(i=>on?nx.add(i):nx.delete(i));
  if(nx.size===set.size&&[...nx].every(x=>set.has(x)))return;
  if(nx.size>200)return toast("지문당 키워드는 최대 200개예요.",true);
  RD.kw=nx;const rid=kwKey(),list=[...nx];
  if(list.length)hlMap[rid]=list.slice();else delete hlMap[rid];
  clearTimeout(kwT);kwT=setTimeout(()=>call("saveHighlights",rid,list).catch(()=>{}),800);
  drawReading(true);
}
document.addEventListener("click",e=>{
  if(!RD)return;
  const mb=e.target.closest("[data-kwmode]");if(mb){const m=mb.dataset.kwmode;kwMode=kwMode===m?"":m;ls.set("ielts-kwmode",kwMode);drawReading(true);return}
  if(e.target.closest("[data-kwclear]")){const n=kwSet().size;if(!n)return;if(confirm(`이 지문의 키워드 ${n}개를 모두 삭제할까요?`))kwApply([...kwSet()],false);return}
  const w=e.target.closest(".kww");
  if(w&&kwMode&&!String(window.getSelection()||"").trim()){const id=w.dataset.kw;kwApply([id],kwMode==="bold"?!kwSet().has(id):false)}
});
let kwSelT=null;
document.addEventListener("selectionchange",()=>{
  if(!RD||!kwMode)return;
  clearTimeout(kwSelT);
  kwSelT=setTimeout(()=>{
    const sel=window.getSelection();if(!sel||sel.isCollapsed||!sel.rangeCount)return;
    const host=document.querySelector(".rd-q"),r=sel.getRangeAt(0);
    if(!host||!host.contains(r.commonAncestorContainer))return;
    const ids=[...host.querySelectorAll(".kww")].filter(x=>{try{return r.intersectsNode(x)}catch(err){return false}}).map(x=>x.dataset.kw);
    if(!ids.length)return;
    try{sel.removeAllRanges()}catch(err){}
    const set=kwSet();kwApply(ids,kwMode==="bold"?!ids.every(i=>set.has(i)):false);
  },450);
});

/* ---------- trình phát: tải audio từ Drive theo từng mảnh, giữ trong IndexedDB để lần sau mở ngay ---------- */
const AUD={};   // fileId -> {url, pct, err, loading}
let LP=null;    // {p, i (audio đang chọn), el}
function audDB(){return new Promise((res,rej)=>{try{const r=indexedDB.open("climb-audio",1);r.onupgradeneeded=()=>r.result.createObjectStore("a");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function audGet(id){return audDB().then(db=>new Promise(res=>{try{const q=db.transaction("a").objectStore("a").get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})).catch(()=>null)}
function audPut(id,blob){return audDB().then(db=>{try{db.transaction("a","readwrite").objectStore("a").put(blob,id)}catch(e){}}).catch(()=>{})}
function b64ToBytes(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function loadAudio(a){
  const st=AUD[a.id]||(AUD[a.id]={pct:0});
  if(st.url||st.loading)return;
  st.loading=true;st.err=null;lpDraw();
  audGet(a.id).then(blob=>{
    if(blob){st.url=URL.createObjectURL(blob);st.loading=false;st.pct=100;return lpDraw()}
    return call("getAudioInfo",a.id).then(info=>{
      const parts=new Array(info.parts);let next=0,done=0;
      const worker=()=>{if(next>=info.parts)return Promise.resolve();const k=next++;
        const get=(tries)=>call("getAudioPart",a.id,k).catch(e=>{if(tries>0)return get(tries-1);throw e});
        return get(2).then(b=>{parts[k]=b64ToBytes(b);done++;st.pct=Math.round(done/info.parts*100);lpProgress(a.id)}).then(worker)};
      return Promise.all([worker(),worker(),worker()]).then(()=>{
        const blob=new Blob(parts,{type:a.mime||info.mime||"audio/mpeg"});
        st.url=URL.createObjectURL(blob);st.loading=false;audPut(a.id,blob);lpDraw();
      });
    });
  }).catch(e=>{st.loading=false;st.err=String(e&&e.message||e);lpDraw()});
}
function lPlayerMount(p){
  lPlayerUnmount();
  if(!(p.audio||[]).length)return;
  document.body.classList.add("lmode");
  const el=document.createElement("div");el.id="lplayer";el.className="lplayer";document.body.appendChild(el);
  LP={p,i:0,el,rate:+ls.get("ielts-lrate","1")||1};
  lpDraw();
}
const examLock=()=>!!(RD&&RD.exam&&!RD.result&&isL());
function lPlayerUnmount(){const el=$("lplayer");if(el){const au=el.querySelector("audio");if(au)au.pause();el.remove()}LP=null;document.body.classList.remove("lmode")}
function lpProgress(id){const b=document.querySelector(`#lplayer [data-lpbar="${id}"]`);if(b)b.style.width=(AUD[id]||{}).pct+"%";const t=document.querySelector(`#lplayer [data-lppct="${id}"]`);if(t)t.textContent=(AUD[id]||{}).pct+"%"}
function lpDraw(){
  if(!LP||!$("lplayer"))return;
  const a=LP.p.audio[LP.i],st=AUD[a.id]||{},au=LP.el.querySelector("audio"),keep=au&&au.dataset.id===a.id;
  const sel=LP.p.audio.length>1?`<select class="lp-sel" data-lpsel aria-label="오디오 구간 선택">${LP.p.audio.map((x,i)=>`<option value="${i}" ${i===LP.i?"selected":""}>${esc(x.label||"Audio "+(i+1))}</option>`).join("")}</select>`:`<span class="lp-lbl">${esc(a.label||"Audio")}</span>`;
  if(keep){const s=LP.el.querySelector(".lp-sel");if(s)s.value=LP.i;return}
  let body;
  const lock=examLock();
  if(st.url&&lock)body=`<audio data-id="${a.id}" src="${st.url}" preload="auto"></audio>
     <button class="lp-play" data-lpplay aria-label="재생 / 정지">▶</button><span class="lp-time num" id="lp-time">0:00</span><span class="tiny muted">시험 모드: 되감기 없음, 속도 1×</span>`;
  else if(st.url)body=`<audio data-id="${a.id}" src="${st.url}" preload="auto"></audio>
     <button class="lp-btn" data-lpback aria-label="5초 뒤로">−5s</button><button class="lp-play" data-lpplay aria-label="재생 / 정지">▶</button><button class="lp-btn" data-lpfwd aria-label="5초 앞으로">+5s</button>

function dictAnalysis(){
  let fn=0,ct=0,near=0,extra=0;const missed=[],seen=new Set();
  DT.p.lines.forEach((x,i)=>{const r=DT.res[i];if(!r)return;const ref=words_(x.t),got=words_(DT.given[i]||"");let nearL=0;
    ref.forEach((w,k)=>{if(r.hit[k])return;
      const close=got.some(g=>g!==w&&w.length>=4&&lev(g,w)<=Math.max(1,Math.floor(w.length/4)));
      if(close){near++;nearL++}else if(STOP.has(w))fn++;else{ct++;if(!seen.has(w)){seen.add(w);missed.push({w,i,sent:x.t})}}});
    extra+=Math.max(0,got.length-r.hit.filter(Boolean).length-nearL)});
  return {fn,ct,near,extra,missed};
}

function dictFromPack(p){
  const lines=[];
  p.paras.forEach(pa=>{if(pa.h)return;let t=pa.t.trim(),s="";const m=t.match(/^([A-Z][A-Z .'’-]{1,24}):\s*/);if(m){s=m[1];t=t.slice(m[0].length)}
    const sents=t.match(/[^.!?]+[.!?]+["”’)]*|[^.!?]+$/g)||[t];let buf="";
    sents.forEach(x=>{x=x.trim();if(!x)return;const nb=(buf?buf+" ":"")+x;if(words_(nb).length>24&&buf){lines.push({s:s||(pa.l||""),t:buf});buf=x}else buf=nb});
    if(buf)lines.push({s:s||(pa.l||""),t:buf})});
  return {v:1,kind:"dictation",id:p.id+"-d",title:p.title,audio:p.audio,lines,note:"이 문제는 "+lines.length+"개 문장이 있어요. 한 번에 다 할 필요는 없어요. 몇 문장만 하고 다음에 이어서 하세요."};
}

function p3Prompt(c){
  return `You are a strict but friendly IELTS Speaking examiner. Run Part 3 with me on the topic "${c.topic}" (Part 2 cue card: ${c.card}).
Rules:
- Ask ONE question at a time, under 25 words, then wait for my answer.
- After each answer, ask a follow-up that pushes me, rotating these moves: (1) "Why do you think so?" / explain the reason, (2) ask for a concrete example, (3) give the opposite view and ask me to respond, (4) compare past, present and future, (5) ask who should be responsible or what should change.
- If my answer is under 3 sentences, ask me to develop it before moving on.
- Do not correct me during the conversation.
Start with these questions and invent natural follow-ups: ${(c.part3||[]).join(" | ")}
After 8 questions, stop and give feedback in Vietnamese: the 3 biggest problems (fluency & coherence, vocabulary, grammar), 3 of my sentences rewritten at band 6.5–7 keeping my ideas, and an ESTIMATED band for FC, LR, GRA (say clearly it is an estimate; pronunciation cannot be judged reliably from a transcript).`;
}

  const done=ok=>dlg(`<div class="dlg-hd"><div class="grow"><div class="tiny muted" style="font-weight:700">Part 3 압박 질문 · ${esc(c.topic)}</div><div class="h2">${ok?"지시문을 복사했어요":"이 지시문 복사"}</div></div><button class="x" data-close aria-label="닫기">✕</button></div>

document.addEventListener("click",e=>{const b=e.target.closest("[data-spk]");if(b)startSpeaking(b.dataset.spk)});
function startSpeaking(mode,opt){
  opt=opt||{};
  let t1=SPEAK.part1.find(t=>t.id===($("sp-p1")||{}).value)||pick(SPEAK.part1);
  let c2=SPEAK.part2.find(t=>t.id===($("sp-p2")||{}).value)||pick(SPEAK.part2);
  if(opt.topic){const T=opt.topic;
    if(T.cue){c2={id:T.id,topic:T.title,card:T.cue.card,bullets:T.cue.bullets||[],last:T.cue.last||"",part3:(T.p3&&T.p3.length?T.p3:T.qs||[]).slice(0,4)};mode="p2"}
    else{t1={id:T.id,topic:T.title,qs:(T.qs||[]).slice()};mode=T.part==="p3"?"p3":"p1"}}
  const steps=[];
  if(mode==="p1"||mode==="full"){const n=mode==="p1"?5:4;t1.qs.slice(0,n).forEach(q=>steps.push({part:1,q,topic:t1.topic}))}
  if(mode==="p3")t1.qs.slice(0,5).forEach(q=>steps.push({part:3,q,topic:t1.topic}));
  if(mode==="p2"||mode==="full"){steps.push({part:2,card:c2,topic:c2.topic});c2.part3.slice(0,4).forEach(q=>steps.push({part:3,q,topic:c2.topic}))}
  SP={mode,steps,i:0,history:[],answers:[],coach:mode==="full"?false:coach,t1,c2,start:Date.now(),aiFails:0,target:(opt.topic&&opt.topic.vocab||[]).map(v=>v.w).slice(0,12)};
  if(mode==="full"&&coach)SP.coach=confirm("모의고사: 실제 시험처럼 문제마다 나오는 힌트를 끌까요? 힌트를 유지하려면 취소를 누르세요.")?false:true;
  $("study").hidden=false;document.body.style.overflow="hidden";
  spNext(true);
}
const spPartLabel=p=>`Part ${p}`;
function spFrame(body){
  const parts=[...new Set(SP.steps.map(s=>s.part))],cur=SP.steps[Math.min(SP.i,SP.steps.length-1)].part;
  $("study").innerHTML=`<div class="study-top"><div class="in wide-r"><button class="quit" id="sp-quit">${I.x.replace('viewBox','width="14" height="14" viewBox')} 나가기</button>
   <div class="stepper">${parts.map((p,i)=>`${i?`<div class="ln ${p<=cur?"on":""}"></div>`:""}<div class="st ${p===cur?"on":p<cur?"done":""}"><i>${p<cur?"✓":p}</i>${spPartLabel(p)}</div>`).join("")}</div>
   <button class="btn sm" id="sp-end">종료</button></div></div><div class="study-body">${body}</div>`;
  const log=$("sp-log");if(log)log.scrollTop=log.scrollHeight;
}
function bubbles(){return SP.history.map(t=>t.who==="ex"?`<div class="bub ex"><span class="who">시험관</span><span>${esc(t.text)}</span><button class="say-mini" data-say="${esc(t.text)}" aria-label="다시 듣기">${I.sound.replace('viewBox','width="15" height="15" viewBox')}</button></div>`
  :t.who==="me"?`<div class="bub me"><span class="who">나 · ${t.words}단어${t.wpm?` · ${t.wpm}단어/분`:""}</span><span>${esc(t.text)}</span>${t.audio?`<audio controls src="${t.audio}" preload="none"></audio>`:""}</div>`
  :`<div class="bub tip"><span class="who">힌트</span><span>${esc(t.text)}</span>${t.better?`<span class="better"><b>모범 문장:</b> ${esc(t.better)} <button class="say-mini" data-say="${esc(t.better)}" aria-label="모범 문장 듣기">${I.sound.replace('viewBox','width="14" height="14" viewBox')}</button> <button class="linkbtn" data-bsave="${esc(t.q||"")}" data-btext="${esc(t.better)}">보관함에 저장</button></span>`:""}</div>`).join("")}
function composer(target){
  return `<div class="composer card"><textarea id="sp-ans" rows="4" placeholder="여기를 터치하고 키보드의 마이크를 눌러 말하세요…" autocapitalize="sentences"></textarea>
   <div class="comp-ft"><span class="tiny muted num" id="sp-stat">0 단어 · 0:00${target?" / "+mmss(target):""}</span>
   <span style="display:flex;gap:8px">${recOK===false?"":`<button class="btn sm" id="sp-rec">● 녹음</button>`}<button class="btn sm primary" id="sp-send" disabled>답변 보내기</button></span></div></div>`;
}
function spNext(first){
  const st=SP.steps[SP.i];
  if(!st)return spSummary();
  if(st.part===2&&!SP.cardShown)return spCard();
  let q=st.q;
  const ask=text=>{SP.history.push({who:"ex",text});spFrame(`<div class="sp-log" id="sp-log">${bubbles()}</div>${composer(st.part===2?120:0)}`);speak(text);SP.turnStart=null;bindComposer(st.part===2?120:0)};
  if(st.part===2){SP.history.push({who:"ex",text:"Now please start talking. You have up to two minutes."});spFrame(`<div class="card cue">${cueHTML(st.card)}</div><div class="sp-log" id="sp-log">${bubbles()}</div>${composer(120)}`);speak("Now please start talking.");SP.turnStart=null;bindComposer(120);return}
  if(first||!aiEnabled||SP.aiFails>1)return ask(q);
  // giám khảo AI hỏi tiếp dựa trên câu trả lời trước (vẫn bám chủ đề, dùng câu chuẩn bị làm gợi ý)
  spFrame(`<div class="sp-log" id="sp-log">${bubbles()}<div class="bub ex typing"><span class="who">시험관</span><span>…</span></div></div>`);
  call("speakTurn",{part:st.part,topic:st.topic,history:SP.history.slice(-8),prepared:q,coach:false}).then(r=>ask((r&&r.say)||q)).catch(()=>{SP.aiFails++;ask(q)});
}
function cueHTML(c){return `<div class="tiny" style="font-weight:700;color:var(--bad)">Part 2 · 큐카드</div><div class="h2" style="margin:4px 0 8px">${esc(c.card)}</div><div class="hint">You should say:</div><ul class="steps">${c.bullets.map(b=>`<li>${esc(b)}</li>`).join("")}</ul><div><b>${esc(c.last)}</b></div>`}
function spCard(){
  SP.cardShown=true;const st=SP.steps[SP.i];
  SP.history.push({who:"ex",text:"Now I'm going to give you a topic, and I'd like you to talk about it for one to two minutes. You have one minute to prepare. "+st.card.card});
  let left=60;
  spFrame(`<div class="card cue">${cueHTML(st.card)}</div>
   <div class="card"><div class="hd"><b>준비</b><span class="timer num" id="sp-prep">1:00</span></div>
   <textarea class="inp" id="sp-notes" rows="4" style="margin-top:8px" placeholder="항목마다 키워드 몇 개만 적으세요 (긴 문장은 쓰지 마세요)"></textarea>
   <p class="hint" style="margin-top:6px">팁: ${esc(SPEAK.tips.p2[0]||"")}</p>
   <button class="btn primary wide" id="sp-go" style="margin-top:10px">말하기 시작</button></div>`);
  speak("You have one minute to prepare. "+st.card.card);
  clearInterval(SP.prepT);SP.prepT=setInterval(()=>{left--;const el=$("sp-prep");if(el)el.textContent=mmss(Math.max(0,left));if(left<=0){clearInterval(SP.prepT);goTalk()}},1000);
}
function goTalk(){clearInterval(SP.prepT);SP.notes=($("sp-notes")||{}).value||"";spNext()}
function bindComposer(target){
  const ta=$("sp-ans");if(!ta)return;
  const upd=()=>{const w=(ta.value.trim().match(/\S+/g)||[]).length;if(w&&!SP.turnStart)SP.turnStart=Date.now();const s=SP.turnStart?Math.floor((Date.now()-SP.turnStart)/1000):0;$("sp-stat").textContent=`${w} 단어 · ${mmss(s)}${target?" / "+mmss(target):""}`;$("sp-send").disabled=!w};
  ta.addEventListener("input",upd);clearInterval(SP.statT);SP.statT=setInterval(upd,1000);
  setTimeout(()=>ta.focus(),300);
}
async function toggleRec(){
  const b=$("sp-rec");
  if(SP.rec&&SP.rec.state==="recording"){SP.rec.stop();b.textContent="● 녹음";return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const rec=new MediaRecorder(stream),chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());SP.audio=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||"audio/mp4"}));toast("녹음했어요. 답변을 보내면 대화에 저장돼요.")};
    rec.start();SP.rec=rec;recOK=true;b.textContent="■ 녹음 중지";
  }catch(err){recOK=false;b.remove();toast("이 화면에서는 브라우저가 녹음을 허용하지 않아요. 키보드 마이크로 말하면 채점은 그대로 작동해요.",true)}
}
function localTip(text,part){
  const w=(text.match(/\S+/g)||[]).length,tips=[];
  const need=part===2?150:part===3?50:25;
  if(w<need)tips.push(part===2?`겨우 ${w}단어예요. Part 2는 2분을 꽉 채워 180–250단어 정도 말하는 게 좋아요. 항목마다 세부 내용을 더 이야기하세요.`:`답변이 조금 짧아요 (${w}단어). 이유(because…)와 구체적인 예(for example…)를 덧붙이세요.`);
  if(!/\b(because|since|so|that's why|the reason)\b/i.test(text))tips.push("이유가 없어요. \"because…\"나 \"The main reason is…\"를 덧붙이세요.");
  if(part===3&&!/\b(for example|for instance|such as|like when)\b/i.test(text))tips.push("Part 3에는 예시가 있으면 좋아요: \"For example, in Korea…\".");
  if(/\b(yes|no)\b\.?$/i.test(text.trim())&&w<6)tips.push("Yes/No로만 끝내지 말고 이유까지 이어서 말하세요.");
  return tips.length?tips.join(" "):"좋아요: 핵심이 있고 내용도 발전시켰어요. 덜 흔한 표현을 하나 더 넣어 어휘 점수를 올려 보세요.";
}
function sendAnswer(){
  const ta=$("sp-ans"),text=ta.value.trim();if(!text)return;
  const st=SP.steps[SP.i],w=(text.match(/\S+/g)||[]).length,sec=SP.turnStart?(Date.now()-SP.turnStart)/1000:0;
  const wpm=sec>=8?Math.round(w/sec*60):null;
  if(SP.rec&&SP.rec.state==="recording")SP.rec.stop();
  SP.history.push({who:"me",text,words:w,wpm,audio:SP.audio||null});SP.audio=null;
  SP.answers.push({part:st.part,q:SP.history.filter(h=>h.who==="ex").slice(-1)[0].text,a:text,words:w,wpm});
  clearInterval(SP.statT);SP.i++;
  if(!SP.coach)return spNext();
  if(aiEnabled&&SP.aiFails<2){
    spFrame(`<div class="sp-log" id="sp-log">${bubbles()}<div class="bub tip typing"><span class="who">힌트</span><span>답변을 확인하는 중…</span></div></div>`);
    call("speakTurn",{part:st.part,topic:st.topic,history:SP.history.slice(-6),coach:true}).then(r=>{SP.history.push({who:"tip",text:(r&&r.tip)||localTip(text,st.part),better:(r&&r.better)||"",q:(SP.answers[SP.answers.length-1]||{}).q||""});spAfterTip()}).catch(()=>{SP.aiFails++;SP.history.push({who:"tip",text:localTip(text,st.part)});spAfterTip()});
  }else{SP.history.push({who:"tip",text:localTip(text,st.part)});spAfterTip()}
}
function spAfterTip(){spFrame(`<div class="sp-log" id="sp-log">${bubbles()}</div><div style="display:flex;justify-content:flex-end"><button class="btn primary" id="sp-next">${SP.steps[SP.i]?"다음 문제 →":"요약 보기 →"}</button></div>`);$("sp-next").focus()}
function spTranscript(){return SP.history.filter(h=>h.who!=="tip").map(h=>(h.who==="ex"?"Examiner: ":"Candidate: ")+h.text).join("\n")}
function spSummary(){
  clearInterval(SP.statT);
  const ans=SP.answers,words=ans.reduce((s,a)=>s+a.words,0),w2=ans.filter(a=>a.wpm),wpm=w2.length?Math.round(w2.reduce((s,a)=>s+a.wpm,0)/w2.length):null;
  const avg=ans.length?Math.round(words/ans.length):0;
  SP.done=true;
  spFrame(`<div class="result"><span class="tiny" style="font-weight:700;color:var(--ok)">연습 완료</span><div class="h1">${ans.length}개 답변 · ${words} 단어</div>

/* ---------- Nhại theo bài mẫu (shadowing) ---------- */
let SH=null;
const words_=s=>String(s||"").toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g," ").split(/\s+/).filter(Boolean);
function lcsHits(ref,got){
  const a=words_(ref),b=words_(got),n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){hit[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  return {pct:n?Math.round(dp[0][0]/n*100):0,hit};
}
function refMarkHTML(ref,hit){let k=0;return String(ref).split(/(\s+)/).map(tok=>{if(/^\s+$/.test(tok))return tok;const ws=words_(tok);if(!ws.length)return esc(tok);const ok=ws.every(()=>hit[k++]);return `<span class="${ok?"sh-ok":"sh-miss"}">${esc(tok)}</span>`}).join("")}
function startShadow(t,si){
  const s=t.samples[si];if(!s)return;
  const sents=String(s.text).replace(/\s+/g," ").split(/(?<=[.!?])\s+(?=[A-Z“"])/).map(x=>x.trim()).filter(x=>x.split(" ").length>=3);
  SH={t,s,sents,i:0,scores:[],res:null};
  $("study").hidden=false;document.body.style.overflow="hidden";drawShadow();
}
function drawShadow(){
  const x=SH.sents[SH.i],res=SH.res;
  $("study").innerHTML=`<div class="study-top"><div class="in wide-r"><button class="quit" id="sh-quit">${I.x.replace('viewBox','width="14" height="14" viewBox')} 나가기</button>
    <div style="text-align:center;min-width:0"><div class="tiny muted" style="font-weight:700">모범 답안 따라 말하기 (쉐도잉)</div><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(SH.t.title)}</b></div><span class="tiny muted num">${SH.i+1}/${SH.sents.length}</span></div></div>
   <div class="study-body">
    <div class="card shcard"><div class="hint">모범 문장을 1–2번 듣고, 키보드의 마이크를 눌러 똑같이 따라 말하세요. 웹이 기계가 알아들은 글자를 원문과 비교해요. 빨간 글자는 기계가 알아듣지 못한 부분으로, 대개 발음이 불분명하거나 소리를 삼켰기 때문이에요. 한국어 화자는 끝자음 뒤에 모음을 붙이거나 r/l을 헷갈리면 빨간 글자가 생기기 쉬워요. %는 기계가 알아들은 정도이지 발음 점수가 아니에요.</div>
     <div class="shtext ${res?"":"blurred"}" id="sh-text">${res?res.html:esc(x)}</div>
     <div class="row" style="gap:8px"><button class="btn primary" data-say="${esc(x)}">${I.sound} 듣기</button><button class="btn" id="sh-slow">천천히 듣기</button>${res?"":`<button class="btn ghost" id="sh-peek">문장 보기</button>`}</div>
     <textarea id="sh-in" rows="3" placeholder="키보드의 마이크를 눌러 문장을 다시 말하세요…" ${res?"disabled":""}>${esc(res?res.got:"")}</textarea>
     ${res?`<div class="shscore"><b class="num">${res.pct}%</b><span>기계가 알아들음. ${res.pct>=90?"기계가 거의 다 알아들었어요.":res.pct>=70?"빨간 글자를 보세요: 기계가 알아듣지 못한 부분이에요.":"많이 놓쳤어요: 천천히, 끝소리까지 또렷하게 말하세요."} 참고용 신호이며 발음 점수가 아니에요.</span></div>
       <div class="row" style="gap:8px"><button class="btn" id="sh-retry">이 문장 다시 말하기</button><button class="btn primary" id="sh-next">${SH.i+1<SH.sents.length?"다음 문장 →":"요약 보기 →"}</button></div>`
      :`<button class="btn primary wide" id="sh-check">확인</button>`}
    </div></div>`;
  if(!res)setTimeout(()=>speak(x),300);
}
document.addEventListener("click",e=>{
  if(!SH)return;const T=e.target;
  if(T.closest("#sh-quit")){SH=null;$("study").hidden=true;$("study").innerHTML="";document.body.style.overflow="";return render()}
  if(T.closest("#sh-slow")){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(SH.sents[SH.i]);u.lang="en-GB";u.rate=.7;if(enVoice)u.voice=enVoice;speechSynthesis.speak(u)}catch(err){}return}
  if(T.closest("#sh-peek")){$("sh-text").classList.remove("blurred");return}
  if(T.closest("#sh-check")){const got=$("sh-in").value.trim();if(!got)return toast("먼저 문장을 말하거나 입력하세요.",true);const ref=SH.sents[SH.i],r=lcsHits(ref,got);SH.res={pct:r.pct,got,html:refMarkHTML(ref,r.hit)};SH.scores[SH.i]=r.pct;return drawShadow()}
  if(T.closest("#sh-retry")){SH.res=null;return drawShadow()}
  if(T.closest("#sh-next")){SH.res=null;if(SH.i+1<SH.sents.length){SH.i++;return drawShadow()}
    const sc=SH.scores.filter(x=>x!=null),avg=sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):0;
    ls.set("ielts-shadow-day",todayISO);save("saveLesson",{kind:"shadow",results:[],avg,correct:0,answered:0}).then(r=>{applyR(r);showEarned(r)}).catch(earnFail);
    $("study").querySelector(".study-body").innerHTML=`<div class="result"><div class="h1">${avg}% 기계가 알아들음</div><p class="lead">${sc.length}개 문장 · ${earnedHTML()} · 고도(m)는 하루 첫 번째 따라 말하기만 반영돼요</p><p class="hint">휴대폰 음성 인식이 알아들은 글자의 비율이며, 시험관의 발음 점수가 아니에요.</p><div class="wrongs">${SH.sents.map((s,i)=>`<div><span class="num" style="color:${(SH.scores[i]||0)>=80?"var(--ok)":"var(--bad)"}">${SH.scores[i]==null?"–":SH.scores[i]+"%"}</span><span>${esc(s)}</span></div>`).join("")}</div><button class="btn primary" id="sh-quit">완료</button>${fricBtn("shadow")}</div>`;}
});

function mcq(id,html,opts,a,why,time,extra){const o=shuffle(opts.slice());return Object.assign({id,type:"mcq",sent:true,html,opts:o,ans:o.indexOf(a),why,time},extra||{})}
function wlItems(mode){
  const m=WL_MODES.find(x=>x.k===mode);
  if(mode==="nb")return (WL.nb||[]).filter(n=>n.card&&n.card.q&&n.card.q.s).map(n=>({id:"n:"+n.id,mk:()=>{const q=n.card.q;return mcq("n:"+n.id,gapHTML(q.s),q.opts,q.a,`${q.why||""} · ${n.w}: ${n.vi}`,25)}}));
  const P=WL.pk[m.pk];if(!P)return [];
  if(mode==="rt")return P.items.flatMap(x=>rtItems(x));
  if(mode==="mat")return P.items.map(x=>{const id="m:"+x.id,t=m.t;let mk;
    if(x.k==="def")mk=()=>mcq(id,`<span class="tiny muted">이 정의에 맞는 전문 용어는?</span><br><i>${esc(x.d)}</i>`,x.opts,x.a,x.why,t);
    else if(x.k==="para")mk=()=>mcq(id,`<span class="tiny muted">과학 논문에서 다음 내용은 보통 어떤 표현으로 쓰일까요?</span><br><b>“${esc(x.q)}”</b>`,x.opts,x.a,`“${x.q}” ≈ “${x.a}”${x.why?" · "+x.why:""}`,t);
    else if(x.k==="con")mk=()=>{const o=["TRUE","FALSE","NOT GIVEN"];return {id,type:"mcq",sent:true,html:`<div class="wl-pass"><span class="tiny">지문</span>${esc(x.p)}</div><div class="wl-st"><span class="tiny">문제</span>${esc(x.st)}</div>`,opts:o,ans:o.indexOf(x.a),why:x.why,time:45}};
    else mk=()=>mcq(id,gapHTML(x.s),x.opts,x.a,x.why,t);
    return {id,k:x.k,mk}});
  if(mode==="fam")return P.items.flatMap(x=>x.q.map((q,k)=>({id:`f:${x.id}:${k}`,mk:()=>mcq(`f:${x.id}:${k}`,gapHTML(q.s),q.opts,q.a,q.why+(x.trap?" ⚠ "+x.trap:""),m.t)})));
  if(mode==="col")return P.items.map(x=>({id:"c:"+x.id,mk:()=>mcq("c:"+x.id,gapHTML(x.s),x.opts,x.a,`${x.why} ✓ ${x.right}${x.wrong?" · ✗ "+x.wrong:""}`,m.t)}));
  if(mode==="up")return P.items.map(x=>({id:"u:"+x.id,mk:()=>mcq("u:"+x.id,`<span class="tiny muted">이 문장을 더 좋게, 하지만 자연스럽게 쓰거나 말해 보세요:</span><br>${esc(x.s)}`,x.opts,x.a,x.why+(x.warn?" ⚠ "+x.warn:""),m.t)}));
  if(mode==="con")return P.items.map(x=>({id:"t:"+x.id,mk:()=>{const o=["TRUE","FALSE","NOT GIVEN"];return {id:"t:"+x.id,type:"mcq",sent:true,html:`<div class="wl-pass"><span class="tiny">지문</span>${esc(x.p)}</div><div class="wl-st"><span class="tiny">문제</span>${esc(x.st)}</div>`,opts:o,ans:o.indexOf(x.a),why:x.why,time:m.t}}}));
  if(mode==="para"){const all=P.items;return all.map((x,i)=>({id:"p:"+x.id,mk:()=>{

function wlPick(items,n){
  const L=WL.lab||{},due=[],fresh=[],rest=[];
  items.forEach(it=>{const r=L[it.id];if(!r)fresh.push(it);else if(r.due<=todayISO)due.push(it);else if(r.box<5)rest.push(it)});
  let out=[...shuffle(due),...shuffle(fresh)].slice(0,n);
  if(out.length<n)out=out.concat(shuffle(rest).slice(0,n-out.length));
  return out;
}

}

  wlNeed(mode).then(()=>{const items=wlPick(wlItems(mode),n||10);startWL(items.map(it=>it.mk()),WL_MODES.find(x=>x.k===mode).n,mode)}).catch(()=>toast("연습 문제를 불러오지 못했어요. 네트워크를 확인하고 다시 시도하세요.",true));

// lượt trộn mỗi ngày: 3 dạng từ, 3 kết hợp từ, 2 nâng cấp, 2 paraphrase, 2 T/F/NG + từ trong sổ đến hạn
function practiceMix(){
  Promise.all(WL_MODES.filter(m=>m.pk&&m.k!=="mat").map(m=>loadWLPack(m.pk))).then(()=>{
    const plan={rt:3,fam:3,col:2,up:2,para:2,con:2,nb:3};
    const qs=shuffle(Object.keys(plan).flatMap(k=>wlPick(wlItems(k),plan[k]).map(it=>it.mk())));
    startWL(qs,"오늘의 믹스 연습");
  }).catch(()=>toast("연습 문제를 불러오지 못했어요. 네트워크를 확인하고 다시 시도하세요.",true));
}
function finishWL(correct,total){
  const results=Object.keys(S.firstOk).map(id=>({id,ok:S.firstOk[id]}));
  const L=WL.lab||(WL.lab={});results.forEach(r=>{const p=L[r.id]||{box:0,ok:0,bad:0};const box=r.ok?Math.min(6,p.box+1):1;L[r.id]={box,ok:p.ok+(r.ok?1:0),bad:p.bad+(r.ok?0:1),due:addISO(todayISO,[0,1,3,7,14,30,60][box]||1)}});
  return save("saveWordLab",{results,correct,answered:total});
}

/* ================= Gắn sách lộ trình (Collins Listening / Reading) vào lịch học =================
   Ca học có "Listening U3" → mở lcol-03; "Reading U3: chiến lược và bài 1" → bài kỹ năng rcolp-03; "Reading U3: bài 2" → exam practice rcol-03.
   Làm xong (nộp cả bài) thì tự tick đúng ca đó: hôm nay nếu trùng, nếu không thì ngày còn nợ sớm nhất có cùng nhiệm vụ. */
function planPackFor(task){
  const t=String(task||"");const cb=t.match(/^Cambridge (\d+) Test (\d): (Listening, 40문항 전체 풀기|Reading Passage (\d))/);
  if(cb)return cb[4]?`cam${cb[1]}-${pad(3*(+cb[2]-1)+(+cb[4]))}`:`lcam${cb[1]}-${pad(+cb[2])}`;
  let m=t.match(/Listening U(\d+)/);
  if(m)return "lcol-"+pad(+m[1]);
  m=t.match(/Reading U(\d+)/);if(!m)return null;const n=+m[1];
  if(n===12)return /2번 지문/.test(t)?"rcol-13":"rcol-12";
  return /2번 지문/.test(t)?"rcol-"+pad(n):"rcolp-"+pad(n);
}
function planPackBtn(task){
  const id=planPackFor(task);if(!id)return "";
  const L=/^l/.test(id);
  if(L){if(!LIDX)loadLIndex();if(!lItem(id))return ""}
  else{if(!RIDX)loadRIndex();if(!rItem(id))return ""}
  const done=(rstats.latest||{})[id];
  return `<button class="btn sm ${done?"":"primary"} plan-open" ${L?`data-lopen="${id}"`:`data-ropen="${id}"`}>${done?"다시 하기":"서론"}</button>`;
}
function planAutoTick(packId){
  try{
    const match=d=>["am","pm"].filter(sl=>planPackFor(d[sl]&&d[sl].task)===packId&&!dayRec(d.k)[sl]);
    let day=ALLDAYS.find(d=>d.k===todayISO&&!d.opt&&match(d).length);
    if(!day)day=ALLDAYS.find(d=>d.k<todayISO&&!d.opt&&!d.hol&&match(d).length);
    if(!day)return;
    const sl=match(day)[0];state.days[day.k]={...dayRec(day.k),[sl]:true};const r=dayRec(day.k);
    call("saveDay",day.k,!!r.am,!!r.pm,r.note||"").catch(()=>{});
    toast(`자동 체크한 세션 ${sl==="am"?"오전":"저녁"} ${dm(day.k)}: ${day[sl].task}`);
  }catch(e){}
}

function weekStats(from,to){
  const ev=evLog.filter(e=>e.d>=from&&e.d<=to&&e.k!=="flag"&&e.k!=="better");
  const days=new Set(ev.map(e=>e.d)).size,min=ev.reduce((s,e)=>s+(+(e.data&&e.data.min)||0),0);
  let mo=0,mt=0;ev.filter(e=>e.k==="review").forEach(e=>{const m=(e.data||{}).m||[0,0];mo+=+m[0]||0;mt+=+m[1]||0});
  const mastered=ev.filter(e=>e.k==="err").reduce((s,e)=>s+(+(e.data||{}).m||0),0),fixedOk=ev.filter(e=>e.k==="err").reduce((s,e)=>s+(+(e.data||{}).ok||0),0);
  const usage=ev.filter(e=>e.k==="usage").length,rw=ev.filter(e=>e.k==="rewrite").length;
  const ex=ev.filter(e=>e.k==="read"&&e.data&&e.data.x&&e.data.t);
  return {days,min,n:ev.length,ret:mt>=8?Math.round(mo/mt*100):null,mt,mastered,fixedOk,usage,rw,exPct:ex.length?Math.round(ex.reduce((s,e)=>s+e.data.s/e.data.t,0)/ex.length*100):null,exN:ex.length,xp:ev.reduce((s,e)=>s+e.x,0)};
}

function figHTML(f){

  }

  const W=640,H=400,L=84,R=24,T=28,B=f.type==="hbar"?52:76,pw=W-L-R,ph=H-T-B;
  const y=f.y||{},ymin=y.min!=null?y.min:0,ymax=y.max!=null?y.max:Math.max(...f.series.flatMap(s=>s.v.map(p=>Array.isArray(p)?p[1]:p))),step=y.step||(ymax-ymin)/5;

    f.cats.forEach((c,i)=>{const v=f.series[0].v[i],x0=sx(Math.min(0,v)),x1=sx(Math.max(0,v)),yy=T+i*bh+bh*.18;
      svg+=`<text x="${L+72}" y="${yy+bh*.42}" class="mt" text-anchor="end">${esc(c)}</text><rect x="${x0}" y="${yy}" width="${Math.max(1,x1-x0)}" height="${bh*.64}" rx="3" fill="${MATC[0]}"/><text x="${x0+6}" y="${yy+bh*.42}" class="mv mvi">${fnum(v)}</text>`});
    svg+=`<text x="${L+80+(pw-80)/2}" y="${H-4}" class="ml" text-anchor="middle">${esc(y.label||"")}</text>`;

  for(let v=ymin;v<=ymax+1e-9;v+=step){const yy=sy(v);svg+=`<line x1="${L}" y1="${yy}" x2="${L+pw}" y2="${yy}" class="mg"/><text x="${L-8}" y="${yy+7}" class="mt" text-anchor="end">${fnum(v)}</text>`}
  svg+=`<text x="20" y="${T+ph/2}" class="ml" text-anchor="middle" transform="rotate(-90 20 ${T+ph/2})">${esc(y.label||"")}</text>`;

}

function puPool(){
  const seen=new Set(),out=[];
  const add=w=>{if(!w||!w.w||!w.vi)return;const k=String(w.w).toLowerCase();if(seen.has(k))return;seen.add(k);out.push({w:String(w.w),vi:String(w.vi),pos:w.pos||"",ex:(w.ex||[]).filter(Boolean)})};
  TOPICS.forEach(t=>topicLessons(t).filter(l=>!l.checkpoint&&passed(l.key)).forEach(l=>(l.words||[]).forEach(add)));
  (vocab||[]).forEach(v=>add({w:v.word,vi:String(v.meaning||"").replace(/\s*\([^)]*\)\s*$/,""),ex:v.example?[v.example]:[]}));
  if(out.length<5)TOPICS[0].words.forEach(add);
  return out;
}
const puId=w=>"pw:"+w.w.toLowerCase();
const puTok=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[^\p{L}\p{N}'\s-]/gu," ").split(/\s+/).filter(Boolean);
function puLcs(a,b){
  const m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);
  const hits=Array(m).fill(false);let i=m,j=n;
  while(i>0&&j>0){if(a[i-1]===b[j-1]){hits[i-1]=true;i--;j--}else if(d[i-1][j]>=d[i][j-1])i--;else j--}
  return hits;
}
function puUsed(word,text){
  const t=String(text).toLowerCase();
  return word.toLowerCase().split(/\s+/).every(tok=>{const c=tok.replace(/[^a-z'-]/g,"");if(!c)return true;const st=c.length>=6?c.slice(0,-2):c.length>=4?c.slice(0,-1):c;return new RegExp("\\b"+reEsc(st)+"[a-z']*").test(t)});
}

function puStart(n,theme,fresh,extra){
  fresh=fresh||[];extra=extra||[];
  const items=(theme&&theme.length?theme:puPool()).map(w=>({id:puId(w),w}));
  const fk=new Set(fresh.map(x=>x.w));
  const words=[...fresh,...wlPick(items.filter(x=>!fk.has(x.w.w)),Math.max(0,n-fresh.length)).map(x=>x.w)];
  if(words.length<3)return toast("연습할 단어가 부족해요. 먼저 단어 레슨을 몇 개 학습하세요.",true);
  FX.reset();
  const info=words.map(w=>({w,c:clozeOf(w.w,w.ex),sent:w.ex.find(x=>puTok(x).length>=4)||""}));
  const tasks=[];
  info.filter(x=>fk.has(x.w.w)).forEach(x=>tasks.push({k:"see",x}));
  info.forEach(x=>tasks.push({k:"type",x}));
  info.forEach(x=>{if(x.c)tasks.push({k:"cloze",x})});
  /* nhiệm vụ tuần (có chủ đề) không có phần nghe: thay bằng từ nối và paraphrase */
  info.forEach((x,i)=>tasks.push({k:!(theme&&theme.length)&&x.sent&&i%2===0&&canSpeak()?"dict":"own",x}));
  extra.forEach(q=>tasks.push({k:"mc",q}));
  S={L:{key:"pu",kind:"vocab",checkpoint:true},review:"pu",pu:true,mres:{},pute:!!(theme&&theme.length),mission:fresh.length>0,pud:theme&&theme.length?Math.max(...theme.map(x=>x.li)):NaN,phase:"pu",xp:0,tasks,ti:0,res:{},answered:false,nWords:words.length};
  $("study").hidden=false;document.body.style.overflow="hidden";puShow();
}

function puCheck(){
  if(!S||!S.pu||S.answered)return;
  const t=S.tasks[S.ti],w=t.x.w,inp=$("pu-in"),val=inp.value.trim();if(!val)return;
  S.answered=true;inp.disabled=true;$("pu-sub").disabled=true;
  let ok=false,msg="",extra="";
  if(t.k==="type"||t.k==="cloze"){
    const alts=(t.k==="cloze"?[t.x.c.ans,w.w]:[w.w,w.w.replace(/^to\s+/i,"")]),g=norm(val);let near=false;
    ok=alts.some(a=>norm(a)===g);
    if(!ok&&alts.some(a=>norm(a).length>=6&&lev(norm(a),g)<=1)){ok=true;near=true}
    msg=ok?(near?"거의 맞았어요. 철자를 확인하세요: "+alts[0]:"정답이에요."):"틀렸어요. 정답: "+alts[0];
    extra=`<span>${esc(w.w)} = ${esc(w.vi)}${w.ex[0]?" · "+esc(w.ex[0]):""}</span>`;
  }else if(t.k==="dict"){
    const ref=puTok(t.x.sent),hits=puLcs(ref,puTok(val)),ratio=hits.filter(Boolean).length/ref.length;
    ok=ratio>=.85;msg=ok?"정확히 받아썼어요"+(ratio<1?" (사소한 오류).":"."):`완전히 맞지는 않아요 (${Math.round(ratio*100)}%).`;
    extra=`<span>${ref.map((x,i)=>hits[i]?esc(x):`<mark>${esc(x)}</mark>`).join(" ")}</span><span class="muted">원문: ${esc(t.x.sent)}</span>`;
  }else{
    const used=puUsed(w.w,val),len=puTok(val).length;ok=used&&len>=4;
    msg=!used?`문장에 “${w.w}” (또는 그 변형)이 쓰이지 않았어요.`:len<4?"문장이 조금 짧아요. 4단어 이상으로 쓰세요.":"단어를 사용했어요. 모범 문장과 비교해 보세요.";
    extra=t.x.sent||w.ex[0]?`<span><b>모범 문장:</b> ${esc(t.x.sent||w.ex[0])}</span>`:"";
  }

  $("pu-fb").innerHTML=`<div class="fbk ${ok?"good":"bad"}"><span class="ic">${ok?I.check:I.x}</span><div><b>${msg}</b>${extra}${exFb({ref:w},ok)}</div><button class="btn primary" id="pu-next">${S.ti+1<S.tasks.length?"다음 →":"결과 보기 →"}</button></div>`;
  const nb=$("pu-next");if(nb)nb.focus();
}

function mgMatchTerms(){

  if(MG.ch!=="all")L=L.filter(x=>x.ch.id===MG.ch);
  if(!q)return L;
  const sc=x=>{const w=x._w;return w===q?0:w.startsWith(q)?1:(x._a&&x._a.split(/[\s\/,]+/).includes(q))?2:w.includes(q)?3:x._a&&x._a.includes(q)?3:x._v.includes(q)?4:x._n.includes(q)?5:9};
  return L.map(x=>[sc(x),x]).filter(a=>a[0]<9).sort((a,b)=>a[0]-b[0]).map(a=>a[1]);
}
function mgMatchRef(sec){
  const R=MG.ref;if(!R)return [];const q=mgNorm(MG.q).trim();

}

/* ================= Đánh dấu bài đã làm: màu riêng + điểm lần trước (chỉ hiển thị, vẫn làm lại bình thường) ================= */
function rFmtD(iso){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||""));return m?m[3]+"/"+m[2]:""}
function rMark(id,best){
  const L=(rstats.latest||{})[id],hasL=!!(L&&L.total);
  if(best==null&&!hasL)return {cls:"",score:`<span class="chip sun">미완료</span>`};
  const last=hasL?Math.round(L.score/L.total*100):null,b=best!=null?best:last;
  const good=b>=70,col=good?"var(--ok)":b>=50?"var(--ink)":"var(--bad)";
  const dt=L&&L.date?rFmtD(L.date):"";
  const sub=hasL?`${last!==b?"최고 · ":""}최근 ${L.score}/${L.total}${last!==b?` (${last}%)`:""}${dt?" · "+dt:""}`:(dt?"푼 날짜 "+dt:"");
  return {cls:"done "+(good?"d-ok":"d-mid"),score:`<span class="rdone"><span class="rdchip ${good?"ok":"mid"}">✓ 완료</span><b class="num" style="color:${col}">${b}%</b>${sub?`<span class="tiny muted">${sub}</span>`:""}</span>`};
}

/* ================= confirm() bị chặn trong iframe (Apps Script / PWA) =================
   Trong iframe không có quyền allow-modals, confirm() trả về false ngay lập tức mà không hiện hộp thoại,
   nên các nút phải qua bước xác nhận (Nộp bài khi còn câu trống, Thoát, Xóa nợ…) trông như "không phản ứng".
   Người thật bấm Hủy luôn mất > 40 ms; trả về false quá nhanh = bị chặn → coi như đồng ý (trừ thao tác xóa). */
(function(){
  const nat=window.confirm.bind(window);
  window.confirm=function(msg){
    const t0=performance.now();let r=false;
    try{r=nat(msg)}catch(e){r=false}
    if(r)return true;
    if(performance.now()-t0<40&&!/삭제|Xóa|Xoá/.test(String(msg))){window.__confirmBlocked=true;return true}
    return false;
  };
})();

    <div class="vm">${esc(w.vi)}</div>${w.use?`<div class="mg-note">${esc(w.use)}</div>`:""}${w.ex&&w.ex[0]?`<div class="vx">${hiWord(w.ex[0],w.w.split(/\s*[\/(]/)[0])}</div>`:""}
    ${have.has(w.w.toLowerCase())?`<span class="chip ok vbtn">복습 중</span>`:`<button class="btn sm vbtn" data-mgadd="${idx}">+ 학습</button>`}
    ${has?`<div class="ex-wrap"><button class="btn sm ex-btn" data-exopen="${esc(w.w)}" aria-expanded="${op}">${op?"해설 숨기기":"설명 + 배경 지식"}</button></div>${op?exCard(w,false):""}`:""}</div>`}).join("")}</div>${more>0?`<button class="btn" style="margin-top:8px" data-mgmore="1">더 보기 ${Math.min(more,30)} (남은 ${more})</button>`:""}`;
};
/* ---- tab “Giải thích”: đọc lần lượt theo lộ trình chương ---- */
MG_SECS.splice(1,0,["exp","해설"]);
(function(){
  const _c=mgCount;mgCount=function(s){return s==="exp"?null:_c(s)};
  const _b=mgBody;
  mgBody=function(){return MG.sec==="exp"?mgExp():_b()};
})();
function exQueue(){
  if(!MG.all)return [];
  const out=[];
  matgUnits().forEach(u=>{
    const d=EX.data[u.id];if(!d)return;
    const words=MG.all.filter(x=>x.ch.id===u.id),by={};words.forEach(x=>by[exKey(x.w)]=x);
    const ord=(d.order&&d.order.length?d.order:words.map(x=>x.w));
    const seen=new Set();
    ord.forEach(n=>{const x=by[exKey(n)];if(x&&exHas(x.w)&&!seen.has(exKey(n))){seen.add(exKey(n));out.push(x)}});
    words.forEach(x=>{if(!seen.has(exKey(x.w))&&exHas(x.w))out.push(x)});
  });
  return out;
}
function mgExp(){
  exLoad();
  if(!MG.all)return skelHTML();
  const Q=exQueue();
  if(!Q.length)return EX.idx===null&&!EX.idxFail?skelHTML():`<div class="card"><p class="hint">이 설명 파일은 <b>아직</b> 준비되지 않았어요. <b>잠시 후</b> 다시 열어 보세요.</p><button class="btn sm" data-matreload>다시 시도</button></div>`;
  const R=exRead(),done=Q.filter(x=>R[exKey(x.w)]===1).length;
  if(EX.cur>=Q.length)EX.cur=0;
  const first=Q.findIndex(x=>R[exKey(x.w)]==null);
  if(EX.start==null&&first>=0){EX.cur=first}EX.start=1;
  const w=Q[EX.cur],uns=Q.filter(x=>R[exKey(x.w)]===2).length;
  const chip=(x,i)=>`<button class="ex-dot ${R[exKey(x.w)]===1?"ok":R[exKey(x.w)]===2?"bad":""} ${i===EX.cur?"cur":""}" data-excur="${i}" title="${esc(x.w)}" aria-label="${esc(x.w)}"></button>`;
  return `<div class="mg-bar"><span class="hint">챕터 순서대로 읽으세요: 기초 단어를 먼저, 뒤 단어는 앞 단어를 바탕으로 해요. ${done}/${Q.length}개 이해함${uns?` · ${uns}개 이해 못함`:""}.</span>${uns?`<button class="btn sm" data-exunsure="1">이해 못한 단어 보기</button>`:""}</div>
   <div class="ex-dots">${Q.map(chip).join("")}</div>
   <div class="ex-hd"><div><span class="tiny muted">${esc(w.ch.vi||w.ch.en)} · 출처: ${EX.cur+1}/${Q.length}</span><h3 class="ex-t">${esc(w.w)} ${mgSay(w.w)}</h3><div class="ex-vi">${esc(w.vi)}${w.ipa&&w.ipa!=="//"?` · <span class="mg-ipa">${esc(w.ipa)}</span>`:""}</div></div></div>
   ${exCard(w,true)}
   <div class="ex-nav"><button class="btn sm" data-excur="${Math.max(0,EX.cur-1)}" ${EX.cur?"":"disabled"}>← 이전 단어</button><button class="btn sm" data-excur="${Math.min(Q.length-1,EX.cur+1)}" ${EX.cur<Q.length-1?"":"disabled"}>다음 단어 →</button></div>`;
}
function exRefresh(){const b=$("mg-body");if(b)b.innerHTML=mgBody();const c=$("mg-secs");if(c)c.innerHTML=mgSecsHTML()}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-exopen],[data-exgo],[data-exq],[data-exmark],[data-exnext],[data-excur],[data-exunsure]");if(!t)return;
  const d=t.dataset;
  if(d.exopen!=null){const k=exKey(d.exopen);EX.open.has(k)?EX.open.delete(k):EX.open.add(k);const keep=t.closest(".vrow");exRefresh();if(keep&&keep.id){const n=$(keep.id);if(n)n.scrollIntoView({block:"nearest"})}return}
  if(d.exgo!=null){
    const w=d.exgo;EX.open.add(exKey(w));
    if(MG.sec==="exp"){const Q=exQueue(),i=Q.findIndex(x=>exKey(x.w)===exKey(w));if(i>=0){EX.cur=i;exRefresh();window.scrollTo({top:($("mg-body")||document.body).offsetTop-60,behavior:"smooth"});return}}
    MG.sec="term";MG.ch="all";MG.q=w;MG.show=30;const q=$("mg-q");if(q)q.value=w;exRefresh();return}
  if(d.exq!=null){const [id,i,w]=d.exq.split("|"),en=exGet(w);if(!en)return;EX.ans[id]=+i;
    if(+i!==en.q.a){const r=exRead();r[exKey(w)]=2;exSave(r)}
    exRefresh();return}
  if(d.exmark!=null){const [v,w]=d.exmark.split("|"),r=exRead(),k=exKey(w);r[k]=r[k]===+v?undefined:+v;if(r[k]==null)delete r[k];exSave(r);exRefresh();return}
  if(d.exnext!=null){const Q=exQueue();EX.cur=Math.min(Q.length-1,EX.cur+1);exRefresh();window.scrollTo({top:($("mg-secs")||document.body).offsetTop-10,behavior:"smooth"});return}
  if(d.excur!=null){EX.cur=+d.excur;exRefresh();return}
  if(d.exunsure!=null){const Q=exQueue(),R=exRead(),i=Q.findIndex(x=>R[exKey(x.w)]===2);if(i>=0)EX.cur=i;exRefresh();return}
});

/* khung “Kiến thức nền” trong phần phản hồi của quiz: tự mở khi trả lời sai */
function exFb(q,ok){
  try{
    const r=q&&q.ref,w=r&&(r.w||r.word);if(!w)return "";
    exLoad();const e=exGet(w);if(!e)return "";
    return `<details class="ex-fold"${ok?"":" open"}><summary>배경 지식: ${esc(w)}</summary>${exCard({w:w},false,true)}</details>`;
  }catch(x){return ""}
}
setTimeout(()=>{try{exLoad()}catch(e){}},4000);
/* ===== v13: bài kiểm tra tuần, bỏ từ, tự dừng từ mới khi tồn đọng ===== */
const WK_MIN=50,WK_MAXHI=48,WK_MIX=12,WK_PAUSE=40;
// thứ Hai của tuần chứa hôm nay (khoá "đã làm bài tuần này")
const weekKey=()=>{const dow=(fromISO(todayISO).getDay()+6)%7;return addISO(todayISO,-dow)};
const wkDone=()=>ls.get("ielts-wk-"+weekKey(),"")==="1";
// từ vào bài: mọi từ ở mốc 4 trở lên sắp đến hạn trong 6 ngày (bài thi thay phần ôn của chúng) + vài từ mốc 1–3 xen kẽ
function wkWords(){
  const usable=vocab.filter(v=>v.meaning&&!isRet(v)),lim=addISO(todayISO,6);
  const hi=usable.filter(v=>v.box>=4&&v.due<=lim).sort((a,b)=>a.due.localeCompare(b.due)||(b.lapses||0)-(a.lapses||0)).slice(0,WK_MAXHI);
  const ids=new Set(hi.map(v=>v.id));
  const mix=shuffle(usable.filter(v=>v.box>=1&&v.box<=3&&!ids.has(v.id))).slice(0,WK_MIX);
  return {hi,mix,all:[...hi,...mix]};
}
// các bài đọc của tuần mới nhất (bộ "wk"): những bài cùng nhãn "test" với bài cuối bộ
function wkReadings(){
  if(typeof rSets!=="function")return [];const s=rSets().find(x=>x.id==="wk");if(!s||!s.items.length)return [];
  const last=s.items[s.items.length-1].test;return s.items.filter(x=>x.test===last)}
function wkReadingDone(it){const l=(rstats.latest||{})[it.id];return !!(l&&l.date>=weekKey())}
function startWeekTest(){
  const W=wkWords(),pool=vocab.filter(v=>v.meaning);
  if(pool.length<4)return toast("복습 노트에 단어가 최소 4개 있어야 해요.",true);
  if(W.all.length<8)return toast("이번 주에는 테스트할 단어가 부족해요 (복습 예정이 가까운 4단계 이상 단어가 최소 8개 필요하거나, 1–3단계 단어가 필요해요).",true);
  const qs=[];
  W.all.forEach(v=>{qs.push(srsQ(v,pool,"mean"));qs.push(srsQ(v,pool,"word"))});
  S={L:{key:"rv-wk",kind:"vocab",checkpoint:true},review:"wk",phase:"quiz",xp:0,qs:spreadPairs(qs),wkStart:Date.now()};
  $("study").hidden=false;document.body.style.overflow="hidden";S.qi=0;S.answers=[];S.firstOk={};
  clearInterval(window.__wkT);
  window.__wkT=setInterval(()=>{const el=$("wk-timer");
    if(!S||S.review!=="wk"||S.phase==="result"||$("study").hidden){if(!el)clearInterval(window.__wkT);return}
    if(!el)return;const sec=Math.max(0,WK_MIN*60-Math.round((Date.now()-S.wkStart)/1000));
    el.textContent="⏱ "+String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")+"개 남음";el.style.color=sec===0?"var(--bad)":""},1000);
  showQ();
}
function wkCardHTML(){
  const W=wkWords(),rds=wkReadings(),ok=W.all.length>=8;
  return `<div class="card cont"><div class="kicker">주간 테스트${wkDone()?" · 이번 주 완료":""}</div><div class="ttl num" style="font-size:44px">${W.all.length}</div>
   <p class="hint">${W.hi.length}개: 복습 예정이 가까운 4단계 이상 단어 (이 테스트가 해당 단어의 복습을 대신해요) + ${W.mix.length}개: 1–3단계 단어를 섞어 출제해요. 단어마다 2방향 객관식(단어 → 뜻, 뜻 → 단어)으로 묻고, 둘 다 맞혀야 기억한 것으로 쳐요. 약 ${WK_MIN}분이에요.</p>
   <button class="btn primary" data-wktest="1" ${ok?"":"disabled"}>${ok?"주간 테스트 풀기":"단어 부족"} ${I.arrow}</button>
   ${rds.map(rd=>`<button class="btn ghost" style="margin-top:8px" data-ropen="${esc(rd.id)}">${wkReadingDone(rd)?"✓ ":""}이번 주 지문: ${esc(rd.title)}</button>`).join("")}</div>`;
}
// bỏ ôn / cho ôn lại một từ
function retireToggle(id){
  const v=vocab.find(x=>x.id===id);if(!v)return;const on=!isRet(v);
  if(on&&!confirm(`복습 제외: "${v.word}"? 단어는 복습 노트에 남지만 더 이상 복습 예정에 나오지 않아요.`))return;
  vocab=vocab.map(x=>x.id===id?{...x,box:on?7:4,due:on?"2099-12-31":addISO(todayISO,3)}:x);render();
  call("retireWord",id,on).then(l=>{vocab=l;render();toast(on?"이 단어를 복습에서 제외했어요.":"이 단어가 복습 일정에 다시 들어왔어요 (3일 뒤).")}).catch(()=>toast("저장하지 못했어요. 잠시 후 다시 시도하세요.",true));
}
document.addEventListener("click",e=>{
  const w=e.target.closest("[data-wktest]");if(w){startWeekTest();return}
  const r=e.target.closest("[data-retire]");if(r)retireToggle(r.dataset.retire);
});
</script>
